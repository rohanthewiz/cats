# Release: on a v* tag, build the shipped binaries (catway, cathost,
# catctl — ghostty-tagged, static libghostty-vt linked in) per platform and
# attach the tarballs to the GitHub release. CGO rules out cross-compiling
# from one runner, so each platform builds its own.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        # One runner per shipped GOOS/GOARCH. macos-latest is Apple Silicon, so
        # Intel Macs need their own entry or they get no tarball at all.
        # macos-13 was the last free Intel image and has since been retired;
        # macos-15-intel replaces it and is still a standard runner, which means
        # free and unlimited here because this repository is public. It is also
        # deliberately a version behind macos-latest: the binaries link against
        # the SDK of whatever built them, and building on the older macOS keeps
        # the deployment floor lower for the people actually running Intel Macs.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libghostty-vt.sh', 'third_party/libghostty-vt/build.zig.zon') }}
      - run: make vt
      - run: make test-ghostty
      - run: make dist
      # An annotated tag's message does not become the release body — the API
      # takes the two from different places, so releases cut before this went
      # out with an empty body while the changelog sat in the tag object where
      # only `git show` would find it. Asking GitHub to generate notes from the
      # commits since the previous tag makes the release self-describing on its
      # own, and a hand-written changelog can still be layered on afterwards
      # with `gh release edit --notes-file`.
      #
      # Safe against the matrix: all three jobs run this step for the same tag,
      # so whichever finishes first creates the release and generates the notes,
      # and the other two take the update path. That path preserves the existing
      # body when the step passes no `body` input (the action resolves
      # `body = workflowBody || existingReleaseBody`), so the later two jobs
      # attach their tarballs without blanking what the first one wrote.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
