# Release: on a v* tag, create the GitHub release once, then build the
# shipped binaries (catway, cathost, catctl — ghostty-tagged, static
# libghostty-vt linked in) per platform and attach the tarballs to it. CGO
# rules out cross-compiling from one runner, so each platform builds its own.
#
#   tag push ──▶ release (1 job: create, write the body once)
#                   │
#                   ├──▶ dist ubuntu-latest     ─┐
#                   ├──▶ dist ubuntu-24.04-arm  ─┤  upload tarballs only;
#                   ├──▶ dist macos-latest      ─┤  never touch the body
#                   └──▶ dist macos-15-intel    ─┘
#
# The body is written by exactly one job. It used to be written by every
# matrix job (generate_release_notes on each): v0.2.3 went out with the
# generated notes four times over, because the action's update path appends
# freshly generated notes to the existing body rather than keeping it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous tag, for the compare link
      # checkout can leave a tag push's own tag as a lightweight ref, which
      # drops its message. Re-fetch the tag object itself so
      # release-notes.sh sees the annotation.
      - run: git fetch --force origin "+${GITHUB_REF}:${GITHUB_REF}"
      # The body is the annotated tag's message (scripts/release-notes.sh).
      # The tag message is the changelog someone wrote; generated notes here
      # only list the PRs, which is two in this repo's whole history. A tag
      # with no message falls back to generated notes, so a quick tag still
      # gets a body.
      - id: notes
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
          if [ -s release-notes.md ]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}

  dist:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # One runner per shipped GOOS/GOARCH. macos-latest is Apple Silicon, so
        # Intel Macs need their own entry or they get no tarball at all.
        # macos-13 was the last free Intel image and has since been retired;
        # macos-15-intel replaces it and is still a standard runner, which means
        # free and unlimited here because this repository is public. It is also
        # deliberately a version behind macos-latest: the binaries link against
        # the SDK of whatever built them, and building on the older macOS keeps
        # the deployment floor lower for the people actually running Intel Macs.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libghostty-vt.sh', 'third_party/libghostty-vt/build.zig.zon') }}
      - run: make vt
      - run: make test-ghostty
      - run: make dist
      # Upload only. The release job has already created the release and
      # written its body, so this step takes the action's update path. It
      # passes no body and no generate_release_notes, so nothing is appended
      # (the append is what duplicated v0.2.3's notes) and nothing races:
      # every matrix job finds the release already there.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
