# CI: untagged quick checks, then the real (ghostty-tagged, CGO) build+tests
# on Linux and macOS against the vendored libghostty-vt (third_party/),
# compiled by scripts/build-libghostty-vt.sh with pinned Zig 0.15.2. Plus a
# docs job, which needs no Go at all and runs alongside them.
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # tag builds are release.yml's job
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format, vet, build, and test the untagged tree (no CGO — the pure-Go
  # domain packages and stubs). Fast first signal.
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make vet
      - run: make build
      - run: make test
      # The front-end suite. ubuntu-latest ships node, so this is a real run
      # rather than the skip the target falls back to locally.
      - run: make jstest

  # The real terminal path: build the vendored VT engine, then vet + race-test
  # everything with -tags ghostty.
  ghostty:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel mirrors the release matrix so the Intel build gets
        # signal on every push. Without it the only thing exercising that
        # platform is a tag push, and a release is a bad place to discover a
        # platform-specific failure — that is exactly how v0.2.0 shipped with
        # no macOS tarball at all.
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The pinned Zig toolchain download and the Zig package cache (the few
      # lazy deps fetched from deps.files.ghostty.org on a cold build).
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libghostty-vt.sh', 'third_party/libghostty-vt/build.zig.zon') }}
      # The built VT lib + Zig incremental cache, keyed on the vendored source.
      # zig-out bakes the checkout's absolute path into its pkgconfig, which is
      # stable for a given runner/repo, so caching it across runs is safe.
      - uses: actions/cache@v4
        with:
          path: |
            third_party/libghostty-vt/zig-out
            third_party/libghostty-vt/.zig-cache
          key: vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/libghostty-vt/**', '!third_party/libghostty-vt/zig-out/**', '!third_party/libghostty-vt/.zig-cache/**', 'scripts/build-libghostty-vt.sh') }}
      - run: make vt
      - run: make vet-ghostty
      - run: make race-ghostty

  # The docs site. It is served by gkdocs, but mkdocs.yml invites `mkdocs build`
  # and both must keep working, so this job checks what the two renderers share:
  # the content. Cheap (~30s, no Go, no Zig) and it runs unconditionally rather
  # than behind a paths filter — a docs page can break from a link in a page
  # that did not change.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # --strict promotes warnings to errors; mkdocs.yml's validation block is
      # what makes broken relative links and #anchors warnings in the first
      # place. Neither half catches link rot alone.
      - run: mkdocs build --strict
      # gkdocs — the renderer that actually serves the site — does not implement
      # python-markdown admonitions, so a `!!! note` reaches the page as literal
      # text. mkdocs renders them happily, which is precisely why the strict
      # build above cannot catch this and a grep has to.
      - name: No '!!!' admonitions (gkdocs renders them literally)
        run: |
          if grep -rn '^!!!' docs; then
            echo "::error::gkdocs cannot render '!!!' admonitions — use a '> **Note — ...**' blockquote instead."
            exit 1
          fi
