# cats catway configuration (YAML).
#
# Copy to ~/.config/cats/config.yaml (or point at it with `catway --config
# <path>` / the CATS_CONFIG env var). Every field is optional — omit anything
# you don't want to change and the built-in default is used. For the server
# settings a command-line flag still wins over this file, which wins over the
# default (flag > config > default). The theme and keybindings have no flags and
# come from this file alone.
#
# Edit-and-reload: after changing theme or keybindings, run `catctl reload`
# (server.reload_config) to re-render the served page — no restart needed. The
# server.* settings below are fixed for the process's lifetime; changing them
# needs a restart.

server:
  addr: ":8421"                        # listen address (host:port or :port)
  cathost_socket: "/tmp/cats-cathost.sock"
  control_socket: ""                   # "" ⇒ CATS_CONTROL_SOCKET or /tmp/cats-control.sock
  hook_socket: "/tmp/cats-hooks.sock" # agent hook-report API ("none" disables)
  auth: "password"                     # "password" (login + cookie) or "none"
  session_ttl: "24h"                   # login cookie lifetime (Go duration)
  # Extra WebSocket Origins accepted beyond same-origin — needed when a reverse
  # proxy or relay serves the UI under a different host. Full origins or bare
  # host[:port] authorities. Empty ⇒ strict same-origin only.
  # allowed_origins: ["https://home.relay.herdr.dev"]
  # The shared secret is NOT read from this file — set CATS_PASSWORD or pass
  # --password so it never lands in a committed config.
  tls:
    enabled: false                     # true ⇒ HTTPS (auto self-signed unless cert/key given)
    cert: ""                           # operator PEM (cert + key must be set together)
    key: ""

# Hosts: the cathosts this catway attaches to. Panes carry a host, so a roster
# with more than one entry means panes on different machines side by side in the
# same workspace — the sidebar grows a HOSTS section and every pane header a host
# badge. Omit this block entirely (the default) and there is exactly one host,
# "local", on server.cathost_socket above: no roster, no badges, nothing changes.
#
# The "local" entry is always synthesized unless you list one with that id, so a
# hosts: block only ever names the EXTRA machines.
#
# This block is live: `catctl attach-host <id> <addr>` / `catctl detach-host <id>`
# edit the running roster AND rewrite this section, and `catctl reload` applies a
# hand-edit here without a restart. Detaching a host that still holds panes is
# refused unless forced — those terminals are on the other machine and cannot
# follow, so forcing it respawns them as new shells on the default host.
#
# addr is scheme://target:
#   unix://path       a socket on this machine — including one forwarded from a
#                     remote box: `ssh -L /tmp/devbox.sock:/tmp/cats-cathost.sock
#                     devbox` makes a real remote host with no extra setup
#   tcp://host:port   cleartext — refused unless the target is loopback
#   tls://host:port   cathost's own remote transport: the daemon runs with
#                     `-listen tls://… -token-file …` and prints its certificate
#                     fingerprint; pinning it is what makes self-signed safe
#
# hosts:
#   - id: devbox                          # letters/digits/._- ; how panes name it
#     label: "devbox (ssh)"               # display name; defaults to the id
#     addr: "unix:///tmp/devbox-cathost.sock"
#     # default: true                     # new panes land here instead of local
#   - id: box                             # the same machine, without the ssh
#     addr: "tls://box.lan:8422"
#     token_file: "~/.config/cats/box.token"   # matches the daemon's -token-file
#     fingerprint: "dd7d9b31…"            # from cathost's startup log
#     # control_relay: true               # let in-pane catctl on that box drive
#                                         # this session. OFF by default, and a
#                                         # trust decision rather than a
#                                         # connection detail: it grants that
#                                         # machine every command, on every host
#                                         # — including panes it cannot see.
#                                         # Without it, panes there get
#                                         # CATS_CONTROL_SOCKET=- and catctl
#                                         # says why.

# Session persistence & restore: the workspace/tab/pane model survives a
# catway restart, and scrollback seeds survive a cathost daemon loss.
persistence:
  enabled: true
  state_dir: ""                        # "" ⇒ $XDG_STATE_HOME/cats (~/.local/state/cats)
  history_lines: 2000                  # scrollback lines captured per pane (0 = whole buffer)
  resume_agents: true                  # relaunch supported AI-agent panes into their
                                       # native conversation sessions on a cold restore

# Git worktrees (workspace > new worktree): where new checkouts are created.
worktrees:
  directory: "~/.cats/worktrees"

# Push notifications: when an agent needs attention (or finishes), also POST to
# a webhook so a phone with its screen off gets a real system push — not just a
# toast in a browser nobody is looking at. Any ntfy-shaped endpoint works; the
# quickest setup is to pick an unguessable ntfy.sh topic, subscribe to it in the
# ntfy app, and point this at it.
#
# This is an ordinary outbound request from the machine catway runs on, so it
# needs no inbound reachability and keeps working when no client is connected.
push:
  enabled: false
  # url: "https://ntfy.sh/cats-CHANGE-ME-TO-SOMETHING-UNGUESSABLE"
  # The topic path is itself a capability — anyone who learns it can read your
  # notifications — so treat it like a secret. If your endpoint also wants a
  # bearer credential, set CATS_PUSH_TOKEN; like CATS_PASSWORD it is deliberately
  # NOT read from this file (the settings modal rewrites this file, and would
  # otherwise copy your token into it).
  kinds: ["attention"]                 # any of "attention", "finished", "info".
                                       # Default is attention only: every agent
                                       # completion is how you learn to ignore the
                                       # channel, and "info" is whatever a plugin
                                       # or a script raised with `catctl notify`.
  priority:                            # ntfy priority per kind. Deliberately not
    attention: "high"                  # "urgent" — that bypasses Do Not Disturb,
    finished: "low"                    # and a blocked agent is not an emergency.
  actions: false                       # render tappable buttons on an "attention"
                                       # push: catway reads the blocked agent's
                                       # own menu off its screen and each button
                                       # answers the prompt. This is the ONLY
                                       # inbound surface in this file — a request
                                       # from the internet, carrying a token your
                                       # notification server has also seen, can
                                       # type into a terminal. Off by default.
  action_url: ""                       # where a PHONE reaches this catway
                                       # (scheme + host, no path). Required with
                                       # actions: catway knows what it bound, not
                                       # what a phone elsewhere would dial.
  min_interval: "60s"                  # debounce per (pane, kind), so an agent
                                       # flapping working↔blocked buzzes once
  # click_url: "cats://pane/"          # deep-link base; the pane handle ("w1:p3")
                                       # is appended for tap-to-open

# Front-end appearance: a named theme plus optional per-color overrides.
# Built-ins: cats-green (default), darcula, tokyo-night, solarized-dark,
# solarized-light, super-warm, cool-blue, dark-game, dark-city, corporate.
# Custom themes live in ~/.config/cats/themes/*.yaml, and plugins can ship
# themes too; `catctl themes` lists everything, `catctl theme <name>` switches
# live. Colors are the page's :root CSS custom properties (without the leading
# --); only the ones you list here are overridden on top of the theme.
theme: {}
#  name: tokyo-night
#  colors:
#    accent: "#ff9e64"
#  font: 'ui-monospace, "SF Mono", Menlo, Consolas, monospace'

# Keyboard bindings. Keys are DOM KeyboardEvent.key values ("ArrowLeft", "h",
# "Escape", "0", "$", "Enter", …). Only the actions you list are rebound; the
# rest keep their defaults.
keybindings:
  copy_mode:
    move-left:  ["ArrowLeft", "h"]
    move-right: ["ArrowRight", "l"]
    move-up:    ["ArrowUp", "k"]
    move-down:  ["ArrowDown", "j"]
    line-start: ["0", "Home"]
    line-end:   ["$", "End"]
    top:        ["g"]
    bottom:     ["G"]
    select:     ["v"]
    rect:       ["r"]
    yank:       ["y", "Enter"]
    exit:       ["Escape", "q"]

# --- Editor -------------------------------------------------------------------
# What cats knows about editors, which is deliberately almost nothing.
# pane.open_file ("click a path, it opens") finds the editor pane and emits an
# event the editor is already subscribed to from inside its own pane — so cats
# never runs an editor CLI, and an editor on another host works by construction.
editor:
  agents: ["ced"]                      # a pane reporting one of these agent
                                       # labels IS an editor. The label is the
                                       # editor's own name for itself (hook API),
                                       # not a cats-side registry.
  command: ["ced"]                     # how to start one when none is running;
                                       # the path is appended to this argv.
  spawn: true                          # false makes pane.open_file a
                                       # "reveal it if the editor is open"
                                       # command instead.

# --- Command ledger -----------------------------------------------------------
# One durable record per command a shell ran in any pane, on any host: what ran,
# where, how long it took, what it exited with, and whether a human or an agent
# issued it (`catctl history`). It needs the shell integration installed —
# `catctl integration install shell` — since the records come from the OSC 133
# marks a shell prints around each command.
ledger:
  enabled: true                        # whether cats ASKS its cathosts to scan.
                                       # A shell with no integration produces no
                                       # marks, so this costs nothing until one
                                       # is installed.
  retention: 20000                     # records kept; the oldest go first. A
                                       # count rather than an age, because it is
                                       # what keeps a query's scan bounded.
