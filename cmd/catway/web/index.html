3.52,354.00 C154.19,348.12 152.46,339.67 153.76,332.00 C155.27,323.12 162.78,311.43 163.17,304.00 C163.42,299.21 161.94,294.75 160.50,292.00 C159.56,290.22 158.42,289.03 157.00,288.24 C155.59,287.46 154.18,286.93 152.00,287.26 C147.17,288.00 135.15,297.87 130.00,299.23 C127.48,299.90 126.17,299.67 124.00,299.35 C121.27,298.96 118.31,297.20 115.00,296.48 C111.10,295.63 107.07,294.80 102.00,294.93 C94.81,295.12 83.89,300.76 76.00,299.43 C68.66,298.18 61.08,290.02 56.00,288.34 C53.18,287.40 50.26,287.17 49.00,287.40 C48.49,287.49 48.42,287.60 48.00,287.94 Z M67.00,337.32 L66.79,339.00 C67.75,339.33 68.81,339.26 69.68,340.00 C70.99,341.11 71.49,344.59 73.00,346.11 C74.39,347.52 76.22,348.30 78.19,349.00 C80.47,349.81 83.40,349.94 86.00,350.41 L88.00,356.34 C88.44,355.89 89.07,355.66 89.32,355.00 C89.73,353.92 89.51,351.81 89.04,350.00 C88.41,347.59 87.07,344.02 85.18,342.00 C83.35,340.06 80.56,338.81 78.00,337.97 C75.43,337.14 71.05,337.09 69.77,337.00 C69.38,336.97 69.31,336.96 69.00,336.98 C68.49,337.02 67.67,337.21 67.00,337.32 Z M115.24,354.00 L117.00,356.35 L118.94,350.00 C122.63,349.11 127.30,349.22 130.00,347.32 C132.37,345.66 133.20,341.26 134.85,340.00 C135.84,339.24 136.86,339.33 137.86,339.00 L137.00,337.20 C134.00,337.37 129.50,337.57 128.00,337.71 C127.50,337.75 127.46,337.71 127.00,337.84 C125.83,338.17 122.61,339.39 121.00,340.53 C119.63,341.51 118.62,342.40 117.74,344.00 C116.45,346.36 116.07,350.67 115.24,354.00 Z M73.00,339.62 C73.52,341.08 73.59,342.88 74.55,344.00 C75.55,345.16 77.36,345.81 79.00,346.37 C80.81,346.99 83.00,347.07 85.00,347.41 C84.71,346.61 84.69,345.79 84.13,345.00 C83.32,343.86 81.60,342.47 80.00,341.63 C78.26,340.72 75.16,340.24 74.00,339.90 C73.53,339.77 73.33,339.71 73.00,339.62 Z M119.51,346.00 L120.00,347.48 C122.67,346.80 126.01,346.84 128.00,345.45 C129.78,344.21 130.48,341.82 131.72,340.00 C131.48,339.90 131.37,339.71 131.00,339.70 C129.77,339.65 125.01,341.09 123.00,342.36 C121.45,343.34 120.68,344.79 119.51,346.00 Z"/></svg>Cats Mux<!--
      Folds the column away; the reveal handle in the gutter brings it back.
      tabindex="-1" is deliberate — see the CSS note beside #sb-fold. The build
      badge is appended into #brand after this at runtime, which is why the
      button being out of flow matters: DOM order stops deciding what shows up
      where, so the badge still lands right after the wordmark.
    --><button id="sb-fold" type="button" tabindex="-1"
        title="hide the sidebar (⌘B)" aria-label="Hide the sidebar">&#x2039;</button></div>
    <!--
      Every section carries an id so its heading's fold arrow has something to
      hang the .folded class on (initSectionFold), and Agents grows an .hctl of
      its own — it has no groups to fold, but the arrow that hides the whole
      section rides the same right-edge berth in all four headings.
    --><section id="sec-usage"><h2>Usage<span class="hctl" id="usage-hctl"></span></h2><ul id="usage-list"><li class="empty">…</li></ul></section>
    <!--
      Hosts sits above Workspaces because it is the outer coordinate: a machine
      holds workspaces, which hold tabs, which hold panes, and the sidebar reads
      down that chain. It starts hidden and stays hidden for as long as the
      session has one host (see renderHosts) — which, with no hosts: block in the
      config, is forever.
    --><section id="sec-hosts" hidden><h2>Hosts<span class="hctl" id="host-hctl"></span></h2><ul id="host-list"></ul></section>
    <section id="sec-workspaces"><h2>Workspaces<span id="ws-global-todo"></span><span class="hctl" id="ws-hctl"><span class="hcount" id="ws-count"></span></span></h2><ul id="ws-list"></ul></section>
    <section id="sec-panes"><h2>Panes<span class="hctl" id="pane-hctl"></span></h2><ul id="pane-list"></ul></section>
    <section id="sec-agents"><h2>Agents<span class="hctl" id="agent-hctl"></span></h2><ul id="agent-list"><li class="empty">none</li></ul></section>
    <!--
      History sits last because it is the only section that looks BACKWARD: every
      other one describes the session as it is now. It is hidden until the
      command ledger has something in it, so a session whose shells have no
      OSC 133 integration installed sees exactly the sidebar it always had.
    --><section id="sec-history" hidden><h2>History<span class="hctl" id="hist-hctl"></span></h2><ul id="hist-list"></ul></section>
  </aside>
  <div id="splitter" title="drag to resize the sidebar (double-click to reset)"></div>
  <div id="main">
    <div id="topbar">
      <div id="tabbar"></div>
      <div id="statusbar">
        <span class="tbtn" id="palhint" title="command palette (⌘K / Ctrl+Alt+K)"><span class="tmk">⌘K</span>palette</span>
        <span class="tbtn" id="pluginsbtn" title="plugins — install, run, update"><span class="tmk">⧉</span>plugins</span>
        <span class="tbtn" id="chatbtn" title="chat — AI agent side panel"><span class="tmk">✦</span>chat</span>
        <span class="tbtn" id="gear" title="menu"><span class="g">⚙</span></span>
      </div>
    </div>
    <div id="panes"></div>
  </div>
  <aside id="chat">
    <div id="chat-head"><span id="chat-title">Chat</span><span id="chat-status"></span></div>
    <div id="chat-log"></div>
    <div id="chat-compose">
      <textarea id="chat-input" rows="2" placeholder="Ask… (Enter sends, Shift+Enter for a new line)"></textarea>
      <div id="chat-ctl">
        <button class="cbtn" id="chat-stop" title="stop the current turn" disabled>⏹</button>
        <button class="cbtn" id="chat-clear" title="clear the conversation">⌫</button>
      </div>
    </div>
  </aside>
</div>
<div id="banner"></div>
<div id="toasts"></div>
<script>
(() => {
  const PV = 1, LINE = 1.25;
  // Terminal type size. ⌘+/⌘-/⌘0 rescale it (see setFontSize); it is a per-
  // browser display preference, so it lives in localStorage rather than in the
  // session the server persists.
  const FONT_DEFAULT = 14, FONT_MIN = 9, FONT_MAX = 32, FONT_KEY = "cats.font_px";
  let FONT_PX = FONT_DEFAULT;
  try {
    const stored = parseInt(localStorage.getItem(FONT_KEY), 10);
    if (stored >= FONT_MIN && stored <= FONT_MAX) FONT_PX = stored;
  } catch (e) { /* storage disabled (private mode / file://) — keep the default */ }

  const panesEl = document.getElementById("panes");
  const wsListEl = document.getElementById("ws-list");
  const wsGlobalTodoEl = document.getElementById("ws-global-todo");
  const wsCountEl = document.getElementById("ws-count");
  const paneListEl = document.getElementById("pane-list");
  const agentListEl = document.getElementById("agent-list");
  const usageListEl = document.getElementById("usage-list");
  const hostSecEl = document.getElementById("sec-hosts");
  const hostListEl = document.getElementById("host-list");
  const histSecEl = document.getElementById("sec-history");
  const histListEl = document.getElementById("hist-list");
  const tabbarEl = document.getElementById("tabbar");
  const toastsEl = document.getElementById("toasts");
  const palHintEl = document.getElementById("palhint");
  const pluginsBtnEl = document.getElementById("pluginsbtn");
  const gearEl = document.getElementById("gear");
  const bannerEl = document.getElementById("banner");
  const splitterEl = document.getElementById("splitter");
  const chatEl = document.getElementById("chat");
  const chatLogEl = document.getElementById("chat-log");
  const chatTitleEl = document.getElementById("chat-title");
  const chatStatusEl = document.getElementById("chat-status");
  const chatInputEl = document.getElementById("chat-input");
  const chatBtnEl = document.getElementById("chatbtn");
  const chatStopEl = document.getElementById("chat-stop");
  const chatClearEl = document.getElementById("chat-clear");
  const dpr = window.devicePixelRatio || 1;
  const measureCtx = document.createElement("canvas").getContext("2d");

  // Canvas colors, read from the theme's CSS custom properties so they follow
  // a theme switch (readThemeVars re-reads them; the literals here are the
  // last-resort fallbacks matching the default theme).
  // THEME_FG/BG: defaults used when a packed cell color is 0 (frame defaults
  // unknown). SEL_FILL: browser-local drag-selection wash (non-mouse panes,
  // §7 read). CM_CURSOR: keyboard copy-mode cursor outline, distinct from the
  // wash. SCROLL_THUMB(_IDLE): the scrollback scrollbar's two thumb states.
  let THEME_FG = 0xd6ddd6, THEME_BG = 0x1f2420;
  let SEL_FILL = "rgba(88,204,140,0.30)";
  let CM_CURSOR = "rgba(122,220,170,0.95)";
  let SCROLL_THUMB = "rgba(122,220,170,0.6)", SCROLL_THUMB_IDLE = "rgba(255,255,255,0.25)";

  // readThemeVars pulls the canvas-side colors out of the effective CSS custom
  // properties. Called at startup and whenever a theme lands (the injected
  // page style, a live "theme" push, the settings modal's preview).
  function readThemeVars() {
    const cs = getComputedStyle(document.documentElement);
    const v = (name) => cs.getPropertyValue(name).trim();
    const packed = (name) => {
      const m = /^#([0-9a-fA-F]{6})$/.exec(v(name));
      return m ? parseInt(m[1], 16) : null;
    };
    THEME_FG = packed("--term-fg") ?? THEME_FG;
    THEME_BG = packed("--term-bg") ?? THEME_BG;
    SEL_FILL = v("--sel-fill") || SEL_FILL;
    CM_CURSOR = v("--cm-cursor") || CM_CURSOR;
    SCROLL_THUMB = v("--scroll-thumb") || SCROLL_THUMB;
    SCROLL_THUMB_IDLE = v("--scroll-thumb-idle") || SCROLL_THUMB_IDLE;
  }
  readThemeVars();

  // applyThemeInline paints a full resolved palette (and optionally a font)
  // as inline :root custom properties — the live-theme path shared by the
  // server's "theme" push and the settings modal's preview. Inline properties
  // sit above the page's baked <style> in the cascade, so the last theme
  // applied always wins, and the canvases re-read their colors and repaint.
  function applyThemeInline(colors, font) {
    const root = document.documentElement;
    for (const k in colors) root.style.setProperty("--" + k, colors[k]);
    if (font) { root.style.fontFamily = font; document.body.style.fontFamily = font; }
    readThemeVars();
    for (const p of panes.values()) scheduleDraw(p);
  }

  // ratatui Modifier bits (cell.m).
  const M_BOLD = 0x1, M_DIM = 0x2, M_ITALIC = 0x4, M_UNDERLINED = 0x8, M_REVERSED = 0x40, M_HIDDEN = 0x80;

  let ws = null, cellW = 9, cellH = 19, cols = 0, rows = 0;
  let layoutMsg = null;          // last layout message
  let tabZoomed = false;         // active tab zoomed (applyLayout; header ZOOM chip)
  const panes = new Map();       // pane id -> pane state
  let winFocused = document.hasFocus(); // window in OS foreground (see onWinFocus)
  let copyModePane = null;       // the pane in keyboard copy-mode, or null
  let agentItems = [];           // last agents rollup (drives sidebar + workspace summaries)
  // Last pane.list snapshot: every pane in the session, across all workspaces and
  // tabs (the Panes sidebar section, see renderPaneList). The layout message can't
  // serve it — it carries the active tab's panes alone — so this is a query result
  // held between refreshes. busy/again/wait coalesce refresh requests so a chatty
  // pane can't queue one round trip per title change (refreshPaneList).
  let paneInv = [], paneInvBusy = false, paneInvAgain = false, paneInvWait = null;
  const SVGNS = "http://www.w3.org/2000/svg"; // createElementNS: SVG isn't HTML
  // Workspace ids whose pane group is folded shut in the sidebar, and the ids the
  // last render actually drew (what collapse-all/expand-all act on). Which groups
  // you keep open is a per-browser display preference like the font size, so it
  // persists in localStorage rather than in the session the server owns.
  const PGRP_KEY = "cats.panes.collapsed";
  let paneCollapsed = new Set(), paneGroupIDs = [];
  try {
    const raw = JSON.parse(localStorage.getItem(PGRP_KEY));
    if (Array.isArray(raw)) paneCollapsed = new Set(raw);
  } catch (e) { /* storage disabled or corrupt — start with everything expanded */ }
  function savePaneCollapsed() {
    try { localStorage.setItem(PGRP_KEY, JSON.stringify([...paneCollapsed])); } catch (e) { /* not persisted */ }
  }
  // Is the "more workspaces…" shelf at the foot of the Panes section open? That
  // shelf holds the workspaces with nothing running in them (renderPaneList), and
  // it is a flag rather than another id in the set above for one reason: it
  // defaults the other way. A set of collapsed ids says "everything is open until
  // you fold it", which is right for a group you chose to fold and wrong here —
  // the whole point of the shelf is that a session's idle workspaces are out of
  // the way before anyone touches anything. Stored as its own key so that default
  // survives a browser that has never seen the section.
  const PMORE_KEY = "cats.panes.moreopen";
  let paneMoreOpen = false;
  try { paneMoreOpen = localStorage.getItem(PMORE_KEY) === "1"; } catch (e) { /* storage disabled — shelf starts shut */ }
  function savePaneMoreOpen() {
    try { localStorage.setItem(PMORE_KEY, paneMoreOpen ? "1" : "0"); } catch (e) { /* not persisted */ }
  }
  // The same arrangement for the Usage section's provider groups, kept separate
  // from the pane groups rather than merged into one map: the two sections'
  // group ids come from different namespaces (workspace ids vs. provider ids),
  // and folding CLAUDE has nothing to do with folding a workspace of panes.
  const UGRP_KEY = "cats.usage.collapsed";
  let usageCollapsed = new Set(), usageGroupIDs = [];
  try {
    const raw = JSON.parse(localStorage.getItem(UGRP_KEY));
    if (Array.isArray(raw)) usageCollapsed = new Set(raw);
  } catch (e) { /* storage disabled or corrupt — start with everything expanded */ }
  function saveUsageCollapsed() {
    try { localStorage.setItem(UGRP_KEY, JSON.stringify([...usageCollapsed])); } catch (e) { /* not persisted */ }
  }
  // And once more for the Workspaces section, whose groups are the two states a
  // workspace can be in rather than a list of ids: WS_OPEN and WS_LOCKED. Its own
  // key for the same reason as above — the namespaces don't overlap, and a folded
  // "locked" shelf says nothing about which provider or which workspace of panes
  // you last folded.
  const WGRP_KEY = "cats.workspaces.collapsed";
  const WS_OPEN = "open", WS_LOCKED = "locked";
  // The third id is not a shelf. With nothing locked there is only one shelf and
  // no header is drawn for it (renderWorkspaces), so the fold pair would have
  // nothing to act on — WS_ALL is what it acts on instead: the section's own list,
  // folded behind the count that then appears on the Workspaces heading. It shares
  // the set above because it is the same question ("what is folded in this
  // section?") and because collapse-all rewrites the whole set from the ids the
  // last render drew, which keeps the two spellings from ever both being present.
  const WS_ALL = "all";
  let wsCollapsed = new Set(), wsGroupIDs = [];
  try {
    const raw = JSON.parse(localStorage.getItem(WGRP_KEY));
    if (Array.isArray(raw)) wsCollapsed = new Set(raw);
  } catch (e) { /* storage disabled or corrupt — start with everything expanded */ }
  function saveWsCollapsed() {
    try { localStorage.setItem(WGRP_KEY, JSON.stringify([...wsCollapsed])); } catch (e) { /* not persisted */ }
  }
  // And, one tier up from all three: which whole sidebar *sections* are folded
  // shut, by section element id. This one set covers all four sections rather
  // than splitting per section like the group sets above, because here the ids
  // do share a namespace — they are the sections themselves — and nothing ever
  // folds them in bulk, so there is no collapse-all to keep the spellings apart.
  // Same localStorage reasoning as the rest: which parts of the sidebar you keep
  // open is a per-browser display preference, not session state the server owns.
  const SECT_KEY = "cats.sections.collapsed";
  let sectCollapsed = new Set();
  try {
    const raw = JSON.parse(localStorage.getItem(SECT_KEY));
    if (Array.isArray(raw)) sectCollapsed = new Set(raw);
  } catch (e) { /* storage disabled or corrupt — start with every section open */ }
  function saveSectCollapsed() {
    try { localStorage.setItem(SECT_KEY, JSON.stringify([...sectCollapsed])); } catch (e) { /* not persisted */ }
  }

  function measure() {
    measureCtx.font = `${FONT_PX}px ui-monospace, Menlo, monospace`;
    cellW = Math.max(1, Math.round(measureCtx.measureText("M").width * 100) / 100);
    cellH = Math.ceil(FONT_PX * LINE);
  }

  // The grid is the size of the #panes container (chrome is real HTML around
  // it), so the server's layout rects map straight onto it.
  function gridSize() {
    const w = panesEl.clientWidth || window.innerWidth;
    const h = panesEl.clientHeight || window.innerHeight;
    cols = Math.max(20, Math.floor(w / cellW));
    rows = Math.max(6, Math.floor(h / cellH));
  }

  // setFontSize rescales the terminal type. cellW/cellH are read live by both
  // the layout math and draw(), so re-measuring, re-deriving the grid, and
  // telling the server the new cols/rows is the whole job: the last layout is
  // re-applied against the new cell size to keep the frame correct until the
  // server's relayout lands (a bigger font means fewer cells, so its rects
  // change too). Cell pixel metrics reported at init aren't resent — β only
  // consumes them when a pane is created.
  function setFontSize(px) {
    px = Math.min(FONT_MAX, Math.max(FONT_MIN, Math.round(px)));
    if (px === FONT_PX) return;
    FONT_PX = px;
    try { localStorage.setItem(FONT_KEY, String(px)); } catch (e) { /* not persisted */ }
    measure();
    gridSize();
    sendMsg({ t: "resize", cols, rows });
    if (layoutMsg) applyLayout(layoutMsg);
    toast(`font ${px}px`);
  }

  // Hook for the mac app's View menu. In a WKWebView, Cocoa resolves ⌘+/⌘-/⌘0
  // as menu key equivalents before the page's keydown handler runs, so the
  // native menu items call back into Go, which Evals this. delta of 0 resets.
  window.catsAdjustFont = (delta) => setFontSize(delta ? FONT_PX + delta : FONT_DEFAULT);

  // ---- Packed u32 colors (D2): 0x02_RR_GG_BB → CSS ----
  function rgbOf(v) { return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; }
  function css(v) { const [r, g, b] = rgbOf(v); return `rgb(${r},${g},${b})`; }
  function blend(a, b, t) { // mix packed a toward packed b
    const pa = rgbOf(a), pb = rgbOf(b);
    return `rgb(${Math.round(pa[0] + (pb[0] - pa[0]) * t)},${Math.round(pa[1] + (pb[1] - pa[1]) * t)},${Math.round(pa[2] + (pb[2] - pa[2]) * t)})`;
  }

  function newPane(id) {
    const el = document.createElement("div");
    el.className = "pane";
    const chrome = document.createElement("div");
    chrome.className = "chrome";
    const info = document.createElement("div");
    info.className = "info";
    const ctl = document.createElement("div");
    ctl.className = "ctl";
    // Glyphs mirror the resulting layout: ◫ = vertical divider (side by side),
    // ⊟ = horizontal divider (stacked).
    ctl.appendChild(mkBtn("◫", "split left/right", "", () => sendCmd("pane.split", { pane: id, direction: "h" })));
    ctl.appendChild(mkBtn("⊟", "split top/bottom", "", () => sendCmd("pane.split", { pane: id, direction: "v" })));
    ctl.appendChild(mkBtn("⤢", "toggle zoom", "", () => sendCmd("pane.zoom", { pane: id })));
    ctl.appendChild(mkBtn("⬚", "copy mode (keyboard select)", "", () => enterCopyMode(id)));
    ctl.appendChild(mkBtn("⧉", "copy scrollback to clipboard", "", () => copyScrollback(id)));
    ctl.appendChild(mkBtn("✎", "rename pane", "", () => renamePane(id)));
    ctl.appendChild(mkBtn("✕", "close pane", "close", () => sendCmd("pane.close", { pane: id })));
    chrome.appendChild(info); chrome.appendChild(ctl);
    const canvas = document.createElement("canvas");
    el.appendChild(chrome); el.appendChild(canvas);
    panesEl.appendChild(el);
    const p = { id, el, chrome, chromeInfo: info, canvas, ctx: canvas.getContext("2d", { alpha: false }),
      pub: "", info: null, W: 0, H: 0, cells: [], links: [], cur: null,
      gs: 1, ox: 0, oy: 0,   // grid inset: scale + centring offsets (setInset)
      defFg: THEME_FG, defBg: THEME_BG, modes: { mouse: false, alt: false, kitty: 0 },
      title: "", cwd: "", branch: "", agent: "", agentState: "", agentModel: "", exited: null,
      pressed: -1, lastCell: "", dirty: false, scroll: null, sel: null, cm: null };
    // Clicking the header (not its buttons) focuses the pane; double-click
    // renames, right-click opens the pane menu (chrome or canvas); holding
    // and moving drags the pane onto another to swap slots. The sidebar pane
    // rows keep the same affordances — the header is also the escape hatch on
    // mouse-capturing apps, where right-clicking the canvas goes to the app.
    chrome.addEventListener("mousedown", (e) => {
      if (p.info && !p.info.focused) sendCmd("pane.focus", { pane: id });
      beginPaneSwapDrag(e, id);
    });
    chrome.addEventListener("dblclick", () => renamePane(id));
    chrome.addEventListener("contextmenu", (e) => { e.preventDefault(); openCtx(e.clientX, e.clientY, paneMenuItems(id)); });
    attachMouse(p);
    attachDrop(p);
    panes.set(id, p);
    return p;
  }

  function mkBtn(label, title, cls, fn) {
    const b = document.createElement("button");
    b.textContent = label; b.title = title; if (cls) b.className = cls;
    b.addEventListener("mousedown", (e) => e.stopPropagation());
    b.addEventListener("click", (e) => { e.stopPropagation(); e.preventDefault(); fn(); });
    return b;
  }

  // initSectionFold hangs the section-level fold arrow on one sidebar heading:
  // the third control, outboard of whatever pair that section already carries,
  // which hides the section's entire list instead of one group within it.
  //
  //   PANES                    ⊞ ⊟ ▼      open: the section's own controls, then
  //     ws-a          3 panes              the arrow hard against the right edge
  //     α  vim
  //   PANES                        ▶      folded: the arrow, alone
  //
  // Called last in each heading's setup so the arrow is appended after that
  // section's other buttons — DOM order is the visual order inside .hctl.
  //
  // The arrow glyphs are the ones the group headers already fold with (▼ open,
  // ▶ shut), so one mark means one thing everywhere in the sidebar; only its
  // scope changes with where it sits. Hiding is CSS (see #sidebar section.folded)
  // rather than a render-time skip: the lists keep rebuilding behind the fold,
  // which costs a hidden section's rows but means unfolding is instant and every
  // renderer stays free of a "am I visible?" branch it would otherwise need in
  // each of its own draw paths.
  function initSectionFold(secID, hctlID, noun) {
    const sec = document.getElementById(secID);
    const btn = mkBtn("", "", "secfold", () => {
      if (sectCollapsed.has(secID)) sectCollapsed.delete(secID); else sectCollapsed.add(secID);
      saveSectCollapsed(); apply();
    });
    function apply() {
      const folded = sectCollapsed.has(secID);
      sec.classList.toggle("folded", folded);
      btn.textContent = folded ? "▶" : "▼";
      btn.title = (folded ? "show " : "hide all ") + noun;
      btn.setAttribute("aria-expanded", folded ? "false" : "true");
    }
    document.getElementById(hctlID).appendChild(btn);
    apply(); // adopt whatever the last session left folded
  }

  function pane(id) { return panes.get(id) || newPane(id); }

  // ---- Layout (D3): position pane DOM from computed rects + render chrome ----
  // placePane writes one pane's pixel geometry from a rect/inner pair in cells.
  // Split out of applyLayout because refitLayout below drives the same writes
  // from rects the server has not sent yet, and the two must not drift.
  function placePane(p, rect, inner) {
    const [rx, ry, rw, rh] = rect, [ix, iy, iw, ih] = inner;
    p.el.style.left = (rx * cellW) + "px";
    p.el.style.top = (ry * cellH) + "px";
    p.el.style.width = (rw * cellW) + "px";
    p.el.style.height = (rh * cellH) + "px";
    p.chrome.style.height = ((iy - ry) * cellH) + "px";
    p.canvas.style.left = ((ix - rx) * cellW) + "px";
    p.canvas.style.top = ((iy - ry) * cellH) + "px";
    p.canvas.style.width = (iw * cellW) + "px";
    p.canvas.style.height = (ih * cellH) + "px";
    p.canvas.width = Math.floor(iw * cellW * dpr);
    p.canvas.height = Math.floor(ih * cellH * dpr);
    // Sizing the canvas resets its context (transform included), so the
    // padded transform is (re)installed per frame in draw() — see setInset.
    setInset(p, iw * cellW, ih * cellH);
  }

  // refitLayout re-hangs the panes on the grid we just derived, without waiting
  // for the server to send a layout for it.
  //
  // Why it has to exist: pane geometry is authored by the server in cells and
  // arrives over the socket, so between "the terminal area just changed size"
  // and "the new layout landed" the panes are still wearing the old area's
  // pixels. Folding the sidebar away leaves a bare strip where the panes have
  // not grown into the space yet; bringing it back is the ugly direction, since
  // the panes are now wider than #panes and the right-hand one is cut off by its
  // overflow:hidden — measured at 276px of a 904px area on a 1200px window. It
  // is one round trip and it corrects itself, but it is a visible lurch every
  // time the column moves, and on a slow or reconnecting socket it is not brief.
  //
  // What it does: scales the last layout's rects from the grid they were
  // authored for onto the current one. Edges are scaled and rounded, then widths
  // taken as the difference between neighbouring edges, so panes stay exactly
  // adjacent — rounding each width independently would open one-cell seams or
  // overlaps between them. Chrome and border insets are carried across in cells
  // rather than scaled, because they are fixed furniture: a header is one row
  // whatever the grid does.
  //
  // This is provisional. layoutMsg is never written back to, so the estimate is
  // always taken from the server's own last word rather than compounding on a
  // previous estimate, and the real layout overwrites all of it on arrival.
  function refitLayout() {
    if (!layoutMsg || !layoutMsg.panes || !layoutMsg.panes.length) return;
    // The grid the current rects were authored for is the extent they tile.
    let oldCols = 0, oldRows = 0;
    for (const pr of layoutMsg.panes) {
      oldCols = Math.max(oldCols, pr.rect[0] + pr.rect[2]);
      oldRows = Math.max(oldRows, pr.rect[1] + pr.rect[3]);
    }
    if (oldCols < 1 || oldRows < 1) return;
    if (oldCols === cols && oldRows === rows) return;   // nothing moved
    const sx = cols / oldCols, sy = rows / oldRows;
    for (const pr of layoutMsg.panes) {
      const p = panes.get(pr.pane);
      if (!p) continue;
      const [rx, ry, rw, rh] = pr.rect, [ix, iy, iw, ih] = pr.inner;
      const nx = Math.round(rx * sx), ny = Math.round(ry * sy);
      const nw = Math.max(1, Math.round((rx + rw) * sx) - nx);
      const nh = Math.max(1, Math.round((ry + rh) * sy) - ny);
      // Insets are held in cells: left/top gaps stay put, and the right/bottom
      // gaps are taken off the new size so the inner box never outgrows its pane.
      const niw = Math.max(1, nw - (rw - iw)), nih = Math.max(1, nh - (rh - ih));
      placePane(p, [nx, ny, nw, nh], [nx + (ix - rx), ny + (iy - ry), niw, nih]);
      // The canvas was just resized, which clears it; repaint from the cells we
      // already hold rather than leaving a blank pane until the server speaks.
      scheduleDraw(p);
    }
  }

  function applyLayout(msg) {
    layoutMsg = msg;
    syncWindowURL(msg);
    // Zoom is tab state but renders as pane state: a zoomed tab sends only its
    // focused pane, whose header carries the ZOOM chip (see renderChrome).
    tabZoomed = msg.tabs.some((t) => t.active && t.zoomed);
    const seen = new Set();
    for (const pr of msg.panes) {
      const p = pane(pr.pane);
      seen.add(pr.pane);
      p.pub = pr.pub; p.info = pr;
      placePane(p, pr.rect, pr.inner);
      p.el.classList.toggle("focused", !!pr.focused);
      renderChrome(p);
      scheduleDraw(p);
    }
    for (const [id, p] of panes) {
      if (!seen.has(id)) {
        if (p === copyModePane) exitCopyMode();
        p.el.remove(); panes.delete(id);
      }
    }
    // Structure changed: re-render the inventory-fed sections (Workspaces rows
    // included), then re-query the inventory behind them.
    refreshPaneList();
    markFocusedAgent();
    markLockedAgents(); // a lock flip rebroadcasts the layout, not the rollup
    renderTabbar(msg);
    renderBorders(msg);
  }

  // ---- Pane text inset ------------------------------------------------------
  //
  // Panes tile the cell grid exactly (the server's rects leave no gutter), so a
  // pane's canvas is precisely inner-cols × inner-rows of glyph boxes and text
  // lands flush against the pane edge. Rather than shrink the canvas — which
  // would clip the last column/row — the canvas keeps the full inner rect and
  // the *grid inside it* is drawn a hair smaller and centred, turning the
  // leftover pixels into a margin on all four sides:
  //
  //   ┌─ canvas = iw*cellW × ih*cellH ─────────┐
  //   │  ox                                    │   ox = boxW*(1-s)/2 ≥ PAD_X
  //   │ ┌─ grid, uniformly scaled by s ──────┐ │   oy = boxH*(1-s)/2 ≥ PAD_Y
  //   │ │ $ text no longer touches the edge  │ │
  //   │ └────────────────────────────────────┘ │
  //   └────────────────────────────────────────┘
  //
  // The scale is uniform so glyph aspect ratio — and, critically, the way
  // box-drawing characters butt against their neighbours — is preserved; cells
  // stay contiguous because every coordinate scales together. s lands near 0.98
  // for ordinary panes (a sub-pixel type-size change) and is floored so a very
  // small pane loses padding rather than legibility. Drawing happens at full
  // device resolution, so nothing is resampled: only the glyph em size changes.
  const PAD_X = 6, PAD_Y = 4; // px of breathing room per side, best effort
  const MIN_INSET_SCALE = 0.92;
  function setInset(p, boxW, boxH) {
    const s = Math.max(MIN_INSET_SCALE,
      Math.min(1, boxW > 0 ? 1 - (2 * PAD_X) / boxW : 1, boxH > 0 ? 1 - (2 * PAD_Y) / boxH : 1));
    p.gs = s;
    p.ox = (boxW * (1 - s)) / 2;
    p.oy = (boxH * (1 - s)) / 2;
  }

  // Canvas CSS px → grid user-space px (the coordinate system draw() renders
  // in). Every hit test goes through these so the inset stays invisible to the
  // rest of the code.
  function userX(p, clientX) { return (clientX - p.canvas.getBoundingClientRect().left - (p.ox || 0)) / (p.gs || 1); }
  function userY(p, clientY) { return (clientY - p.canvas.getBoundingClientRect().top - (p.oy || 0)) / (p.gs || 1); }

  // ---- Split resize handles (WS8): draggable borders → pane.resize_border ----
  // Each border div covers a thin halo around the split line; dragging maps the
  // pointer back to the split's first-child ratio. The server rebroadcasts the
  // layout on every resize, recreating these divs — the drag survives because
  // its listeners live on window and the border's id/area are stable.
  function renderBorders(msg) {
    for (const el of panesEl.querySelectorAll(".split")) el.remove();
    const HIT = 5; // px grab halo each side of the line
    for (const b of (msg.borders || [])) {
      const el = document.createElement("div");
      el.className = "split " + (b.dir === 0 ? "h" : "v");
      const [ax, ay, aw, ah] = b.area;
      if (b.dir === 0) { // horizontal split: vertical divider at x = pos
        el.style.left = (b.pos * cellW - HIT) + "px";
        el.style.top = (ay * cellH) + "px";
        el.style.width = (2 * HIT) + "px";
        el.style.height = (ah * cellH) + "px";
      } else {           // vertical split: horizontal divider at y = pos
        el.style.top = (b.pos * cellH - HIT) + "px";
        el.style.left = (ax * cellW) + "px";
        el.style.height = (2 * HIT) + "px";
        el.style.width = (aw * cellW) + "px";
      }
      el.addEventListener("mousedown", (e) => beginBorderDrag(e, b, el));
      panesEl.appendChild(el);
    }
  }

  function beginBorderDrag(e, b, el) {
    if (e.button !== 0) return;
    e.preventDefault();
    el.classList.add("dragging");
    let sent = b.ratio;
    const move = (ev) => {
      const r = panesEl.getBoundingClientRect();
      let ratio;
      if (b.dir === 0) ratio = ((ev.clientX - r.left) / cellW - b.area[0]) / b.area[2];
      else ratio = ((ev.clientY - r.top) / cellH - b.area[1]) / b.area[3];
      ratio = Math.min(0.9, Math.max(0.1, ratio));
      if (Math.abs(ratio - sent) < 0.01) return; // ~one resize per cell of travel
      sent = ratio;
      sendCmd("pane.resize_border", { border: b.id, ratio });
    };
    const up = () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      for (const d of panesEl.querySelectorAll(".split.dragging")) d.classList.remove("dragging");
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  }

  // modelLabel condenses a pane's resolved model (agentmodel.go builds it —
  // "claude-opus-5 · high", "claude-sonnet-4-5-20250929[1m]") down to the family
  // word and its version, which is what the pane header and the sidebar rows
  // name: "opus 5", "sonnet 4.5 [1M]", "gpt 5.4 mini".
  //
  // The version rides along because a family word alone stops distinguishing
  // rows the moment two generations of it are in play — "opus" beside "opus"
  // says nothing about which pane is on the newer one, and a model switch that
  // only moved the generation would leave the label unchanged.
  //
  // The 1M-context marker survives the trim because it changes how much the
  // pane can hold; the effort suffix does not, since the hover card still shows
  // the whole string untouched. The family is the first alphabetic token that
  // isn't the "claude" vendor prefix, which finds it in both id orderings
  // ("claude-opus-4-8" and the older "claude-3-5-sonnet-20241022"). "" when
  // nothing qualifies, so callers fall back to the agent's own name rather than
  // printing a mangled id.
  //
  // A size qualifier is kept alongside the family ("gpt-5.4-mini" -> "gpt 5.4
  // mini") because for the OpenAI-shaped ids a copilot pane reports it is the
  // whole distinction: the family alone collapses gpt-5.4 and gpt-5.4-mini onto
  // the same word, in a list whose entire job is telling rows apart. Anthropic
  // ids are unaffected — their family token already carries the tier.
  const MODEL_SIZES = ["mini", "nano", "micro", "flash", "lite"];
  // A version token is one or two digits per component ("5", "4", "5.4"). The
  // bound is what keeps the trailing release date out — "20250929" is a token of
  // the same shape and sits exactly where a version component would.
  const MODEL_VER = /^\d{1,3}(\.\d{1,3})*$/;
  // modelVersion reads the run of version tokens adjacent to the family at
  // toks[i], joined with dots: "claude-opus-5" -> "5", "claude-sonnet-4-5-…" ->
  // "4.5". Forward first, since every current id puts the version after the
  // family; the backward walk covers the older ordering, where the digits lead
  // ("claude-3-5-sonnet-20241022" -> "3.5"). Both walks stop at the first token
  // that isn't a version, so the date and the "claude" prefix bound them.
  function modelVersion(toks, i) {
    const fwd = [];
    for (let j = i + 1; j < toks.length && MODEL_VER.test(toks[j]); j++) fwd.push(toks[j]);
    if (fwd.length) return fwd.join(".");
    const back = [];
    for (let j = i - 1; j >= 0 && MODEL_VER.test(toks[j]); j--) back.unshift(toks[j]);
    return back.join(".");
  }
  function modelLabel(model) {
    if (!model) return "";
    let id = model.split("·")[0].trim().toLowerCase();
    let wide = "";
    if (id.endsWith("[1m]")) { wide = " [1M]"; id = id.slice(0, -4); }
    const toks = id.split("-");
    for (let i = 0; i < toks.length; i++) {
      const tok = toks[i];
      if (tok === "claude" || !/^[a-z]+$/.test(tok)) continue;
      // Look past the family for a qualifier, but never back at it: the scan
      // starts after the family so a family that is itself in the list (were one
      // ever added) cannot be appended to itself.
      const size = toks.slice(i + 1).find((t) => MODEL_SIZES.includes(t));
      const ver = modelVersion(toks, i);
      return tok + (ver ? " " + ver : "") + (size ? " " + size : "") + wide;
    }
    return "";
  }

  // agentLabel is what every place that names a pane's agent prints: the agent's
  // own name, then the model it is running — "claude opus 5", "copilot gpt 5.4
  // mini", "codex" for an agent whose model can't be read.
  //
  // The agent name leads even though it repeats down a list of claude panes,
  // because the lists are no longer single-agent: with copilot and claude panes
  // interleaved, the model word alone leaves "sonnet 4.5" ambiguous between a
  // claude pane and a copilot pane running an Anthropic model through its own
  // harness — a distinction that decides which tool you are about to talk to.
  //
  // Either half may be missing: no model until the agent's first answer (or for
  // an agent with no resolver), and no agent on a plain shell pane, which is why
  // callers can hand this both and let it print whichever it has.
  function agentLabel(agent, model) {
    const m = modelLabel(model);
    if (!agent) return m;
    return m ? agent + " " + m : agent;
  }

  // AGENT_HUE assigns each known agent one of the six --agent-N identity slots
  // (see the :root block). Six slots, ~18 known labels, so the map is a seating
  // chart rather than a lookup: the first six entries are the agents most likely
  // to share a sidebar, and they take the six slots outright. Everything after
  // wraps, so a collision only happens between agents further down the list.
  //
  // The labels are detect.IdentifyAgent's canonical vocabulary
  // (internal/detect/detect.go) plus ced and dbc, which reach the rollup
  // through the hook path as custom sources rather than through binary
  // detection. That is the normal case, not the exception: any tool can report
  // any label it likes, which is why the fallback below matters more than this
  // table does.
  const AGENT_HUE = {
    claude: 1, ced: 2, codex: 3, copilot: 4, cursor: 5, gemini: 6,
    droid: 1, amp: 2, pi: 3, kimi: 4, opencode: 5, hermes: 6,
    kilo: 1, kiro: 2, agy: 3, cline: 4, grok: 5, qodercli: 6,
    // The house tools are seated in the order they arrived — claude, ced,
    // dbc, gonotes — because they are the ones that actually share this
    // sidebar. dbc is listed rather than left to the hash for that reason
    // alone: the hash would have put it on 5, beside cursor, and the point of
    // the seating chart is to choose the neighbours rather than accept them.
    dbc: 3,
    // gonotes had the worse draw: the hash puts it on 1, which is claude's —
    // and a note-taking pane sits beside a claude pane more often than beside
    // anything else, since capturing that pane's output is what it is for.
    gonotes: 4,
  };

  // hueClass answers for labels the map has never seen — the ced case before
  // anyone edits AGENT_HUE, and every tool that ships after this build. Hashing
  // the label is what makes an unknown agent *consistent* rather than merely
  // coloured: the same tool lands on the same hue in every row, every render and
  // every restart, which is the whole property the colour is being read for. The
  // alternative (falling back to plain --fg-strong) would have left exactly the
  // agents the user is still learning to recognise as the undifferentiated ones.
  //
  // FNV-1a, 32-bit, kept in integer range by Math.imul — any stable hash does,
  // and this one is short enough to read.
  function hueClass(agent) {
    if (!agent) return "";
    const slot = AGENT_HUE[agent];
    if (slot) return "ah" + slot;
    let h = 0x811c9dc5;
    for (let i = 0; i < agent.length; i++) {
      h = Math.imul(h ^ agent.charCodeAt(i), 0x01000193);
    }
    return "ah" + ((h >>> 0) % 6 + 1);
  }

  // HOME is the server's home directory, baked into the page at render time
  // (page.go's homeScript). "" — no home, or an old page — simply turns the
  // abbreviation off and paths draw in full.
  const HOME = (typeof window.__catsHome === "string" ? window.__catsHome : "").replace(/\/+$/, "");
  // shortPath renders an absolute path the way a shell prompt does. Display
  // only: p.cwd keeps the absolute path it arrived as, because that same value
  // is handed back to the server as a new tab's spawn directory (see
  // focusedPaneCwd), and "~" is not a directory anything can spawn in.
  function shortPath(path) {
    if (!path || !HOME) return path;
    if (path === HOME) return "~";
    if (path.startsWith(HOME + "/")) return "~" + path.slice(HOME.length);
    return path;
  }

  // ---- Chrome: per-pane header (styled HTML, WS8) ----
  // The identity line — pane id · title · path · branch · agent · agent state —
  // followed by the flexible gap the CSS opens, and then the pane toolbar at the
  // right edge. Every field is its own span with its own class, so the row can
  // colour them apart and decide which ones give up width (see the .info rules).
  //
  // Plus the pane-scoped mode chips: keyboard copy-mode replaces the identity
  // while active — its hints need the room, and the mode is what you need to
  // know about the pane just then — and a zoomed pane carries a clickable ZOOM
  // chip.
  function renderChrome(p) {
    p.chromeInfo.innerHTML = "";
    p.el.classList.toggle("dead", p.exited !== null && p.exited !== undefined);
    const add = (cls, text) => {
      const s = document.createElement("span");
      if (cls) s.className = cls;
      s.textContent = text;
      p.chromeInfo.appendChild(s);
      return s;
    };
    // seg() owns the separators so no field has to know its own position: the
    // dot is emitted between two fields that are actually present, which is what
    // keeps a pane with no title (or no repo, or no agent) from showing a run of
    // orphaned dots. Empty text drops the field and its separator together.
    let placed = 0;
    const seg = (cls, text) => {
      if (!text) return null;
      if (placed++) add("sep", "·");
      return add(cls, text);
    };
    seg("pub", paneRef(p.pub, p.id));
    if (p.cm) {
      seg("mode", "COPY");
      seg("hint", "hjkl/arrows move · v select · r rect · y copy · Esc exit");
    } else {
      // Which machine, before what is on it: the host is the outermost
      // coordinate of the identity, and the path below is only meaningful once
      // you know whose filesystem it names. Drawn only in a multi-host session,
      // and turned red while its host is disconnected — that is the header's
      // whole explanation for a pane that has stopped moving. Copy mode's branch
      // above deliberately omits it: the hints need that room, and the machine
      // is not what you are deciding about while selecting text.
      if (multiHost() && p.info && p.info.host) {
        const hs = seg("host", "@" + hostLabel(p.info.host));
        if (hs && !hostUp(p.info.host)) {
          hs.classList.add("off");
          hs.title = hostLabel(p.info.host) + " is not connected";
        }
      }
      seg("ttl", p.title);
      // Path then branch, reading outside-in: the path says which tree, the
      // branch says where in it — the same order a prompt puts them in, and the
      // order that keeps the two panes-in-sibling-worktrees case legible, since
      // the differing path segment and the branch end up side by side.
      seg("cwd", shortPath(p.cwd));
      // "@a1b2c3d" is gitBranch's spelling for a detached HEAD (see the server's
      // gitbranch.go); the leading @ is the only thing that can't be a branch
      // name's first character in what it sends, so it doubles as the flag.
      const br = seg("branch", p.branch);
      if (br && p.branch[0] === "@") br.classList.add("detached");
      // Agent and state are separate fields now rather than "claude opus 5:idle":
      // the state is the half that changes minute to minute, and as its own span
      // it can carry the same colour the sidebar gives that state. Both hang off
      // the agent — a model without an agent to run it is a leftover, not a
      // fact about the pane.
      if (p.agent) {
        seg("agent", agentLabel(p.agent, p.agentModel));
        seg("astate " + stClass(p.agentState), p.agentState);
      }
      if (p.exited !== null) seg("exited", "exited (" + p.exited + ")");
    }
    const zoom = p.chrome.querySelector(".zoom");
    if (tabZoomed && p.info && p.info.focused) {
      if (!zoom) {
        const z = document.createElement("span");
        z.className = "zoom"; z.textContent = "ZOOM ⤢"; z.title = "zoomed — click to unzoom";
        z.addEventListener("mousedown", (e) => e.stopPropagation());
        z.addEventListener("click", (e) => { e.stopPropagation(); sendCmd("pane.zoom", { pane: p.id }); });
        p.chrome.insertBefore(z, p.chrome.querySelector(".ctl"));
      }
    } else if (zoom) {
      zoom.remove();
    }
  }

  // ---- Sidebar (WS8) ----
  function stClass(state) {
    return state === "working" ? "st-working" : state === "blocked" ? "st-blocked"
      : state === "done" ? "st-done" : state === "idle" ? "st-idle" : "st-unknown";
  }

  // markerState folds a rollup item's seen flag into the display state:
  // idle+unseen renders as the "done" attention tier (cats's teal dot).
  function markerState(it) { return it.state === "idle" && !it.seen ? "done" : it.state; }

  // paneRef renders a server handle ("w1:p3") for display, swapping the opaque
  // workspace id for the workspace's name ("cats:p3"). Every pane reference the
  // user sees goes through here — the pane header, tooltip, dialog title, agents
  // rollup, palette, copy-mode bar and the sidebar PANES rows — so one form is
  // worth learning. Before the first layout arrives there is no name to resolve;
  // the id stands in, and applyLayout re-renders each header once it does.
  function paneRef(pub, paneID) {
    if (!pub) return "#" + paneID;
    const i = pub.indexOf(":");
    if (i < 0) return pub;
    return wsName(pub.slice(0, i)) + pub.slice(i);
  }

  // The workspace's display name, falling back to its id until a layout arrives.
  function wsName(id) {
    const w = layoutMsg && layoutMsg.workspaces.find((x) => x.id === id);
    return (w && w.name) || id;
  }

  // Is this workspace closed to plugins and agents? The lock lives on the layout,
  // while the agents rollup is its own message keyed by workspace id, so a row in
  // AGENTS has to look the flag up rather than carry it. Unknown workspace (no
  // layout yet) reads as unlocked — the layout that answers the question also
  // re-marks the rows, so the honest "don't know" costs nothing.
  function wsLocked(id) {
    const w = layoutMsg && layoutMsg.workspaces.find((x) => x.id === id);
    return !!(w && w.locked);
  }

  // attentionRank orders marker states for aggregation (cats's
  // workspace_attention_priority): blocked > done(unseen) > working > idle.
  function attentionRank(st) {
    return st === "blocked" ? 4 : st === "done" ? 3 : st === "working" ? 2 : st === "idle" ? 1 : 0;
  }

  // workspaceRollups buckets both of the lists a workspace row reads — the
  // agents rollup and the pane inventory — by workspace, in one pass each.
  // Asking per row instead cost O(workspaces × agents + workspaces × panes) on
  // every render, and these lists are already grouped by workspace.
  function workspaceRollups() {
    const states = new Map(), todos = new Map();
    let globalTodos = 0;
    for (const it of agentItems) {
      let c = states.get(it.workspace);
      if (!c) states.set(it.workspace, c = { blocked: 0, done: 0, working: 0, idle: 0 });
      const st = markerState(it);
      if (c[st] !== undefined) c[st]++;
    }
    for (const pi of paneInv) {
      if (!pi.handle) continue;
      const n = todoOpenCount(pi.title);
      if (!n) continue;
      // A manager counting the global backlog is counting the same list from
      // every workspace, so its count belongs to no workspace row. Crediting
      // it to the pane's host made the work migrate when the pane moved, and
      // two global managers in different workspaces wore the same items twice.
      // Max rather than sum for the same reason: every such pane advertises
      // one list, so two of them agreeing is not twice the work.
      if (isGlobalTodoTitle(pi.title)) {
        globalTodos = Math.max(globalTodos, n);
        continue;
      }
      const i = pi.handle.indexOf(":"); // "w1:p3" → "w1"
      const ws = i < 0 ? pi.handle : pi.handle.slice(0, i);
      todos.set(ws, (todos.get(ws) || 0) + n);
    }
    return { states, todos, globalTodos };
  }

  // workspaceSummary compresses a workspace's detected-agent states into a
  // compact badge ("●1 ●2" colored by state), computed client-side from the
  // agents rollup — the server's per-item workspace field keys the grouping.
  function workspaceSummary(counts) {
    if (!counts) return null;
    const frag = document.createDocumentFragment();
    for (const st of ["blocked", "done", "working", "idle"]) {
      if (!counts[st]) continue;
      const s = document.createElement("span");
      s.className = stClass(st);
      s.textContent = "●" + counts[st];
      s.title = counts[st] + " " + (st === "done" ? "done (unseen)" : st);
      frag.appendChild(s);
    }
    return frag.childNodes.length ? frag : null;
  }

  // todoOpenCount reads the unfinished-item count a cats-todo manager advertises
  // in its terminal title — "todo: cats (3)", "todo: global (1)", or bare "todo
  // (2)" (the plugin's model.paneTitle). A manager whose backlog is empty or all
  // done drops the suffix, so it answers 0 exactly as a pane that is not a
  // manager at all does; only the presence of work is being counted here.
  //
  // The title is the one channel every launch carries. The plugin host's
  // CATS_PLUGIN_ID reaches the process but not the pane record, a manager started
  // by hand from a shell has no plugin id to begin with, and neither would say
  // how much is left in the backlog — which is the whole question.
  function todoOpenCount(t) {
    const m = /^todo(?:: .+?)? \((\d+)\)$/.exec(t || "");
    return m ? Number(m[1]) : 0;
  }

  // isGlobalTodoTitle says whether a manager's advertised count is the global
  // backlog rather than a project's. "todo: global (N)" is a --global launch;
  // bare "todo (N)" is a launch that resolved no project, whose count falls
  // back to the global store (cats-todo's model.openCount) — the project name
  // in the title is the only thing that marks a count as project-scoped.
  function isGlobalTodoTitle(t) {
    return /^todo(?:: global)? \(/.test(t || "");
  }

  // todoMark: a cat's paw print, worn by a workspace whose cats-todo backlog
  // still has unfinished items in it — the cat has left its mark on work not
  // yet done — carrying the count of what is left as a superscript. A manager
  // sitting open on a cleared backlog earns nothing: a mark every workspace
  // wears all day is decoration.
  //
  // Counts come from the pane inventory rather than the agents rollup, which
  // never sees a todo pane (the manager is a TUI, not an agent), and from its raw
  // title rather than the pane's live one — the live title is the *effective*
  // title, so a pane.rename would otherwise blank the count.
  function todoMark(n) {
    if (!n) return null;
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("class", "todo");
    svg.setAttribute("viewBox", "0 0 16 16");
    // Filled rather than stroked (unlike most sidebar marks): the paw's toe
    // pads are ~3px across at render size, where a stroked outline collapses
    // into a smudge — solid shapes are what keep a paw print readable.
    svg.setAttribute("fill", "currentColor");
    // Four toe pads fanned over the main pad — inner pair high, outer pair
    // low and spread — which is the whole silhouette of a paw print; claws
    // or pad lobes would dissolve at 16px.
    for (const [cx, cy, r] of [[3.0, 6.8, 1.5], [6.2, 4.6, 1.6],
                               [9.8, 4.6, 1.6], [13.0, 6.8, 1.5]]) {
      const c = document.createElementNS(SVGNS, "circle");
      c.setAttribute("cx", cx);
      c.setAttribute("cy", cy);
      c.setAttribute("r", r);
      svg.appendChild(c);
    }
    // The main pad: an oval broadened at the base, so it reads as a pad
    // rather than a fifth toe.
    const pad = document.createElementNS(SVGNS, "path");
    pad.setAttribute("d", "M8 7.8c1.4 0 2.9.9 3.6 2.2.8 1.5.3 3.2-1.2 3.8" +
      "-.8.3-1.6.5-2.4.5s-1.6-.2-2.4-.5c-1.5-.6-2-2.3-1.2-3.8C5.1 8.7 6.6 7.8 8 7.8z");
    svg.appendChild(pad);
    const wrap = document.createElement("span");
    wrap.className = "todo-mark";
    wrap.title = n === 1 ? "1 unfinished todo" : n + " unfinished todos";
    wrap.appendChild(svg);
    const sup = document.createElement("sup");
    sup.className = "todo-n";
    sup.textContent = String(n);
    wrap.appendChild(sup);
    return wrap;
  }

  // lockMark: the padlock a workspace wears while it is closed to plugins and
  // agents (workspace.lock). Two strokes — the shackle above, the body below —
  // which is all a padlock is at 12px; the body is filled so the mark still
  // reads as *shut* in a row that is otherwise dimmed out.
  function lockMark() {
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("class", "lock");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.6");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    const shackle = document.createElementNS(SVGNS, "path");
    shackle.setAttribute("d", "M5 7V4.8a3 3 0 0 1 6 0V7");
    svg.appendChild(shackle);
    const body = document.createElementNS(SVGNS, "rect");
    body.setAttribute("x", "3.2"); body.setAttribute("y", "7");
    body.setAttribute("width", "9.6"); body.setAttribute("height", "6.4");
    body.setAttribute("rx", "1.4");
    body.setAttribute("fill", "currentColor");
    svg.appendChild(body);
    const wrap = document.createElement("span");
    wrap.className = "lock-mark";
    wrap.title = "locked — no plugins or agents here, and clicking will not switch to it";
    wrap.appendChild(svg);
    return wrap;
  }

  // tabMarker: the highest-attention agent state among a tab's panes, as a
  // colored dot on the tab (cats's bell/activity markers; the rollup's tab
  // field keys the grouping — tab bar rows are the active workspace's tabs).
  //
  // tabAttention does the grouping once for the whole bar, for the same reason
  // workspaceRollups exists: per-tab scanning is O(tabs × agents) per render.
  function tabAttention() {
    const best = new Map();
    const aw = activeWorkspace();
    if (!aw) return best;
    for (const it of agentItems) {
      if (it.workspace !== aw.id) continue;
      const st = markerState(it);
      const cur = best.get(it.tab);
      if (cur === undefined || attentionRank(st) > attentionRank(cur)) best.set(it.tab, st);
    }
    return best;
  }
  function tabMarker(best) {
    if (!best || best === "idle" || best === "unknown") return null;
    const s = document.createElement("span");
    s.className = "tmark " + stClass(best);
    s.textContent = "●";
    s.title = best === "done" ? "agent done (unseen)" : "agent " + best;
    return s;
  }

  function renderWorkspaces(msg) {
    wsListEl.innerHTML = "";
    const { states, todos, globalTodos } = workspaceRollups();
    // The global backlog's mark sits on the section heading — the one element
    // scoped to everything, which is what the global list is. Same mark as the
    // rows below so it reads as the same kind of reminder; only the tooltip
    // says whose.
    wsGlobalTodoEl.innerHTML = "";
    const gmark = todoMark(globalTodos);
    if (gmark) {
      gmark.title = globalTodos === 1 ? "1 unfinished global todo" : globalTodos + " unfinished global todos";
      wsGlobalTodoEl.appendChild(gmark);
    }
    // Two shelves, in the order attention runs: the workspaces still in play,
    // then the ones set aside. "Locked" is already the strongest statement a
    // workspace row makes — nothing may be launched into it, and a click won't
    // even switch to it — so it is the one split worth spending a group header
    // on, and the one set of rows worth being able to fold out of the way once a
    // session has collected a few. The active workspace keeps its accent inside
    // the open shelf rather than being lifted into a shelf of its own: it is
    // always exactly one row, and a header over a single row is noise.
    //
    // Each row remembers its index in the session's order, because grouping
    // reorders the list on screen while workspace.move still speaks in gaps in
    // the session's order — see wsDropIndex for the translation back.
    const groups = [
      { id: WS_OPEN, label: "open", rows: [] },
      { id: WS_LOCKED, label: "locked", rows: [] },
    ];
    msg.workspaces.forEach((w, i) => groups[w.locked ? 1 : 0].rows.push({ w, idx: i }));
    // Headers are drawn only when the split is real. With nothing locked (the
    // common case) one shelf holds everything, and a header reading "open" over
    // the whole list is a row that says nothing — the section stays the flat list
    // it has always been.
    //
    // That used to leave the heading's ⊞/⊟ with nothing to act on, so ⊟ was a
    // no-op exactly when the list was most likely to be long. A fold does not
    // actually need a header to fold *into*; it needs somewhere to put the one
    // thing the fold still has to say. So when the split is absent the pair acts
    // on WS_ALL — the whole list at once — and the count that a shelf header
    // would have carried rides the section heading instead:
    //
    //   split          WORKSPACES        ⊞ ⊟      ⊟ folds each shelf behind its
    //                    open   2 workspaces      own header, which is on screen
    //                    locked 5 workspaces      to unfold it again
    //
    //   flat, folded   WORKSPACES            7 ⊞ ⊟    the heading IS the header
    //
    // The count only appears while it is standing in for hidden rows: expanded,
    // the rows are right there to be counted, and a permanent tally on a heading
    // that already carries the global todo mark and the fold pair is clutter.
    const drawn = groups.filter((g) => g.rows.length);
    const split = drawn.length > 1;
    wsGroupIDs = split ? drawn.map((g) => g.id) : [WS_ALL];
    const flatFolded = !split && wsCollapsed.has(WS_ALL);
    // The number alone, where a shelf header spells out "3 workspaces": the noun
    // is already the heading this rides, and the sidebar goes down to 150px wide,
    // where the spelled-out form wraps the heading onto two lines. The tooltip
    // carries the words for anyone the bare digit doesn't reach.
    const n = msg.workspaces.length;
    wsCountEl.textContent = flatFolded ? String(n) : "";
    wsCountEl.title = flatFolded ? n + (n === 1 ? " workspace" : " workspaces") + " — click to show them" : "";

    wsRenderOrder = [];
    wsRenderTotal = msg.workspaces.length;
    drawn.forEach((g, gi) => {
      if (split) wsListEl.appendChild(wsGroupEl(g, gi > 0));
      if (split ? wsCollapsed.has(g.id) : flatFolded) return;
      for (const ent of g.rows) {
        const w = ent.w;
        wsRenderOrder.push(ent.idx);
        const li = document.createElement("li");
        li.className = "ws" + (w.active ? " active" : "") + (w.locked ? " locked" : "");
        const name = document.createElement("span");
        name.textContent = (w.active ? "● " : "○ ") + w.name;
        li.appendChild(name);
        // The lock rides closest to the name, ahead of the todo mark: it qualifies
        // the workspace itself — what may be started in it — where the todo mark
        // reports on the project inside.
        if (w.locked) li.appendChild(lockMark());
        // A workspace's host is where its NEW panes land — a property of the
        // workspace itself, like the lock, so it rides beside the name rather
        // than out at the right edge with the agent rollup. Multi-host only, for
        // the same reason the pane headers' badge is.
        if (multiHost() && w.host) {
          const hb = document.createElement("span"); hb.className = "wshost";
          hb.textContent = "@" + hostLabel(w.host);
          hb.title = "new panes in this workspace run on " + hostLabel(w.host);
          li.appendChild(hb);
        }
        // "Also open in another window" rides here for the same reason the host
        // badge does: it is a fact about the workspace, not about a pane.
        const win = otherWindowMark(windowsOnWorkspace(w.id));
        if (win) li.appendChild(win);
        // The todo mark sits with the name — it says something about the project,
        // not about a pane — while the agent counts stay pinned to the right edge.
        const todo = todoMark(todos.get(w.id) || 0);
        if (todo) li.appendChild(todo);
        const sum = workspaceSummary(states.get(w.id));
        if (sum) {
          const s = document.createElement("span"); s.className = "sum"; s.appendChild(sum);
          li.appendChild(s);
        }
        // A locked workspace does not take a click-to-switch: the lock says "leave
        // this one alone", and the sidebar is the one place a switch happens by
        // accident (a click meant for the row's name or its lock). The toast is not
        // optional — a click that silently does nothing reads as a broken row — and
        // it names the way out, since the row's own context menu holds the unlock.
        // Deliberate ways in are left alone: the context menu, the palette and the
        // keyboard still switch, so this narrows the accident, not the workspace.
        li.addEventListener("dblclick", () => renameWorkspace(w));
        li.addEventListener("contextmenu", (e) => { e.preventDefault(); openCtx(e.clientX, e.clientY, wsMenuItems(w)); });
        // The switch rides the drag helper's own mouseup rather than a "click"
        // listener on the row: this list is rebuilt on every agents rollup, and a
        // row replaced between press and release never sees its click (see
        // beginReorderDrag). Press-and-release on a row is a switch; DRAG_SLOP of
        // travel makes it a reorder instead.
        //
        // itemSel picks li.ws, so the group headers between the shelves are not
        // counted as drop positions — the gap the helper reports is an index into
        // the drawn workspace rows alone, which is exactly what wsDropIndex maps.
        li.addEventListener("mousedown", (e) => beginReorderDrag(e, {
          el: li, container: wsListEl, itemSel: "li.ws", horizontal: false,
          onDrop: (gap) => sendCmd("workspace.move", { id: w.id, index: wsDropIndex(gap) }),
          onClick: () => {
            if (w.active) return;
            if (w.locked) { toast((w.name || w.id) + " is locked — unlock it to switch"); return; }
            sendCmd("workspace.focus", { id: w.id });
          },
        }));
        wsListEl.appendChild(li);
      }
    });
    // The add row goes with the list. Folding a shelf leaves it — the section is
    // still a list of workspaces, one shelf of it just isn't showing — but folding
    // the whole list means the section is meant to be one line, and a fold that
    // leaves a row behind hasn't folded. The way in is still the context menu and
    // the palette, both of which reach newWorkspace without this row.
    if (!flatFolded) {
      const add = document.createElement("li");
      add.className = "add"; add.textContent = "+ workspace"; add.title = "new workspace";
      pressActivate(add, () => newWorkspace()); // rebuilt with the rows above it
      wsListEl.appendChild(add);
    }
  }

  // Where the last render put each drawn workspace row in the session's order,
  // and how many workspaces the session holds. Module-level rather than captured
  // per render because a mid-drag rebuild replaces every row: the drop then has
  // to be read against the list on screen at release, not the one that armed the
  // drag (beginReorderDrag re-queries for the same reason).
  let wsRenderOrder = [], wsRenderTotal = 0;

  // wsDropIndex turns a drop position in the drawn list into the gap
  // workspace.move wants. The list is grouped and a shelf can be folded shut, so
  // the Nth row on screen is not the Nth workspace in the session. For a session
  // of w0..w3 where w1 and w2 are locked:
  //
  //   drawn rows   [open]  w0    w3   [locked]  w1    w2
  //   drop gap           0    1     2         2    3     4  (beginReorderDrag)
  //   wsRenderOrder      0    3     1         1    2     —  (indices of the rows)
  //   sent as            0    3     1         1    2     4  (gap 4 = past the end)
  //
  // A gap means "insert ahead of the row drawn there", so the answer is that
  // row's own session index; past the last drawn row it means the end of the
  // list. Ungrouped and fully expanded, wsRenderOrder is [0,1,2,…] and this is
  // the identity mapping the list used before it had shelves.
  //
  // Dropping at the foot of one shelf and at the head of the next are the same
  // gap, and land the row wherever that next row sits in the session order —
  // the shelves are a view, not a second ordering, so a drag cannot lock or
  // unlock a workspace by dropping it across the divider.
  function wsDropIndex(gap) {
    return gap < wsRenderOrder.length ? wsRenderOrder[gap] : wsRenderTotal;
  }

  // wsGroupEl builds one shelf's header: what it holds, how many, and the caret
  // that folds it. The count rides the header in both states for the reason
  // paneGroupEl's rollup does — folded it stands in for the rows it hides, open
  // it saves counting them by eye.
  function wsGroupEl(g, sep) {
    const collapsed = wsCollapsed.has(g.id);
    const li = document.createElement("li");
    li.className = "wsgrp" + (sep ? " sep" : "");
    const name = document.createElement("span");
    name.textContent = g.label;
    li.appendChild(name);
    const s = document.createElement("span");
    s.className = "gsum";
    s.textContent = g.rows.length + (g.rows.length === 1 ? " workspace" : " workspaces");
    li.appendChild(s);
    const car = document.createElement("span");
    car.className = "car"; car.textContent = collapsed ? "▶" : "▼";
    li.appendChild(car);
    li.title = (collapsed ? "expand " : "collapse ") + g.label + " workspaces";
    // On the press, like the rows it folds: this list is rebuilt on every agents
    // rollup and every layout push, and a header replaced between press and
    // release never sees its click.
    pressActivate(li, () => {
      if (collapsed) wsCollapsed.delete(g.id); else wsCollapsed.add(g.id);
      saveWsCollapsed();
      if (layoutMsg) renderWorkspaces(layoutMsg);
    });
    return li;
  }

  // The Workspaces heading's controls: the same pair, in the same right-edge
  // position, that Usage and Panes carry. They act on whatever the last render
  // said was foldable — the shelves when the list is split, the list itself as
  // WS_ALL when it isn't — so ⊟ always folds something and ⊞ always has it back.
  //
  // Rewriting the whole set from wsGroupIDs is what keeps the two spellings apart:
  // ⊟ over a flat list drops any stale open/locked ids, and ⊟ over a split one
  // drops WS_ALL, so a set left over from the other shape can never fold rows
  // behind something that isn't drawn.
  //
  // The count itself is the third control, and the only one that appears exactly
  // when it does something: it is the header for a shelf that was never drawn, so
  // it unfolds on a press the way wsGroupEl's headers do. Bound once here rather
  // than per render — the span outlives every redraw, and pressActivate leaves a
  // mousedown listener behind that a redraw would stack.
  (function initWsHeadingCtl() {
    const el = document.getElementById("ws-hctl");
    pressActivate(wsCountEl, () => {
      if (!wsCollapsed.has(WS_ALL)) return; // empty chip: nothing folded to open
      wsCollapsed.delete(WS_ALL); saveWsCollapsed();
      if (layoutMsg) renderWorkspaces(layoutMsg);
    });
    el.appendChild(mkBtn("⊞", "show all workspaces", "", () => {
      wsCollapsed.clear(); saveWsCollapsed();
      if (layoutMsg) renderWorkspaces(layoutMsg);
    }));
    el.appendChild(mkBtn("⊟", "hide all workspaces", "", () => {
      wsCollapsed = new Set(wsGroupIDs); saveWsCollapsed();
      if (layoutMsg) renderWorkspaces(layoutMsg);
    }));
    initSectionFold("sec-workspaces", "ws-hctl", "workspaces");
  })();

  // The Panes section is the session's whole pane inventory — every workspace and
  // tab, matching the global Agents rollup below it — so its rows come from the
  // cached pane.list snapshot rather than from the layout message, which only ever
  // carries the active tab's panes.
  //
  // Per row, two sources are merged. Viewport state (visible / focused) comes from
  // the layout: it is pushed, so a focus move lands without waiting on a query,
  // and it is what actually decides what is on screen (a zoomed tab hides its
  // other panes). Title/cwd/agent come from local pane state for on-screen panes,
  // where live pushes keep them fresher than any snapshot, and from the snapshot
  // for the rest — pane_title/pane_cwd are broadcast for visible panes only, so
  // off-screen titles exist nowhere else in the browser. The agents rollup wins on
  // agent state when it knows the pane: it carries the seen flag, which is what
  // renders a run that finished off-screen as "done".
  //
  // Rows are gathered per workspace before any DOM is built: the inventory already
  // arrives grouped by workspace then tab (Session.ListPanes), so a run of rows
  // sharing a handle prefix is exactly one group. Each group gets a header row that
  // folds it — a collapsed group's rows are never built, and its header carries the
  // rollup they would have shown.
  function renderPaneList() {
    paneListEl.innerHTML = "";
    const vis = new Map((layoutMsg ? layoutMsg.panes : []).map((pr) => [pr.pane, pr]));
    // Until the first snapshot lands (page load) the layout's own panes stand in,
    // so the section is never briefly blank.
    const inv = paneInv.length ? paneInv
      : Array.from(vis.values()).map((pr) => ({ pane: pr.pane, handle: pr.pub, focused: pr.focused }));
    const byPane = new Map(agentItems.map((a) => [a.pane, a]));
    const groups = [];
    for (const pi of inv) {
      const pr = vis.get(pi.pane), p = panes.get(pi.pane);
      const live = !!(pr && p); // on screen: prefer local state over the snapshot
      const row = {
        pane: pi.pane, pub: pi.handle || (pr && pr.pub) || "",
        visible: !!pr, focused: pr ? !!pr.focused : !!pi.focused,
      };
      if (live) {
        row.title = p.title; row.cwd = p.cwd;
        row.agent = p.agent; row.state = p.agentState; row.model = p.agentModel;
      } else {
        // A custom name overrides the terminal title, as effectiveTitle does
        // server-side for the panes whose titles are pushed.
        row.title = pi.name || pi.title || ""; row.cwd = pi.cwd || "";
        row.agent = pi.agent || ""; row.state = pi.agent_state || ""; row.model = pi.agent_model || "";
      }
      const a = byPane.get(pi.pane);
      if (a) { row.agent = a.agent; row.state = markerState(a); }

      const wsID = row.pub.split(":")[0];
      if (!groups.length || groups[groups.length - 1].ws !== wsID) groups.push({ ws: wsID, rows: [] });
      groups[groups.length - 1].rows.push(row);
    }

    // Two shelves, by whether the workspace is doing anything: the ones with work
    // in them stay up top, and the rest fold behind a single "more workspaces…"
    // row at the foot of the section. The inventory arrives in the session's
    // workspace order, which is the order the *Workspaces* section wants — a list
    // you reorder by hand and then read positionally — but Panes is read by
    // attention, and a session that has collected a dozen workspaces buries the
    // two you are actually running behind ten headers you never open.
    //
    // Active means "at least one pane here has a detected agent", in any state.
    // Not "an agent that wants something" (blocked/done/working): a workspace
    // would then drop through the floor the moment its agent went idle, which is
    // exactly when you are about to type into it. The test is deliberately about
    // the workspace as a whole rather than the pane — one row per workspace moves,
    // so the group you were reading does not reshuffle its own rows underneath
    // you as states change.
    //
    // The current workspace is pinned first whatever it holds. Its panes are the
    // ones on screen, so the group naming them is not something the user should
    // have to go looking for, and a shell-only workspace you are sitting in is
    // still the workspace you are sitting in.
    const aw = activeWorkspace();
    const curWS = aw ? aw.id : "";
    const hot = [], cold = [];
    for (const g of groups) ((g.ws === curWS || g.rows.some((r) => r.agent)) ? hot : cold).push(g);
    // Stable sort (ES2019+), so this pins the current workspace to the head and
    // leaves every other pair reading 0 — i.e. in the session's own order.
    hot.sort((a, b) => (b.ws === curWS) - (a.ws === curWS));

    // Collapse-all/expand-all act on every group, folded shelf or not: the pair
    // means "the whole section", and a set that quietly skipped the shelf would
    // leave groups half-folded the next time it was opened.
    paneGroupIDs = hot.concat(cold).map((g) => g.ws);
    const emit = (g, sep) => {
      paneListEl.appendChild(paneGroupEl(g, sep, g.ws === curWS));
      if (!paneCollapsed.has(g.ws)) for (const row of g.rows) paneListEl.appendChild(paneRowEl(row));
    };
    hot.forEach((g, i) => emit(g, i > 0));
    if (cold.length) {
      // The shelf row draws the hairline that separates it from the live
      // workspaces above, so the first group it reveals must not draw a second
      // one directly beneath it.
      paneListEl.appendChild(paneMoreEl(cold, hot.length > 0));
      if (paneMoreOpen) cold.forEach((g, i) => emit(g, i > 0));
    }
  }

  // Count with its noun, singular or plural — "1 agent", "3 panes". Shared by the
  // group headers and the shelf row below them so the two read as one register.
  function nOf(c, w) { return c + " " + w + (c === 1 ? "" : "s"); }

  // paneGroupEl builds one workspace's header row: how many of the group's panes
  // are running an agent, out of how many panes. The rollup rides the header in
  // both states — collapsed it stands in for the rows it hides, and expanded it
  // saves counting them by eye, since the agent count is a property of the group
  // that no single row reports.
  //
  // cur marks the workspace whose panes are the ones on screen. It earns a mark
  // because the section is no longer in session order: the current workspace is
  // pinned to the top (renderPaneList) and can sit above workspaces that are
  // busier than it is, so the first row has to say why it is first. Same ●/accent
  // the Workspaces section marks the same workspace with, since it is the same
  // fact being reported twice.
  function paneGroupEl(g, sep, cur) {
    const collapsed = paneCollapsed.has(g.ws);
    const li = document.createElement("li");
    li.className = "wsgrp" + (sep ? " sep" : "") + (cur ? " cur" : "");
    const name = document.createElement("span");
    name.textContent = (cur ? "● " : "") + (wsName(g.ws) || "—");
    li.appendChild(name);
    const agents = g.rows.filter((r) => r.agent).length;
    const s = document.createElement("span");
    s.className = "gsum";
    s.textContent = nOf(agents, "agent") + " / " + nOf(g.rows.length, "pane");
    li.appendChild(s);
    const car = document.createElement("span");
    car.className = "car"; car.textContent = collapsed ? "▶" : "▼";
    li.appendChild(car);
    li.title = (collapsed ? "expand " : "collapse ") + (wsName(g.ws) || "workspace");
    // On the press, like the rows it folds: the header is rebuilt on the same
    // pushes they are, and a fold that has to be clicked twice because a rollup
    // landed mid-press reads as a stuck group.
    pressActivate(li, () => {
      if (collapsed) paneCollapsed.delete(g.ws); else paneCollapsed.add(g.ws);
      savePaneCollapsed();
      renderPaneList();
    });
    return li;
  }

  // paneMoreEl builds the one row the idle workspaces fold into: a shelf, not a
  // group. It is built as a .wsgrp because it does a group header's job at the
  // tier above — it names what is behind it, counts it, and folds it with the
  // same caret — and it is set in italics so a list of workspace names is never
  // mistaken for holding one called "more workspaces".
  //
  //   PANES              ⊞ ⊟ ▼
  //     ● cats   2 agents / 4 panes     the current workspace, pinned
  //       cats:p2  build   claude
  //     api      1 agent / 3 panes      still working
  //   ─────────────────────────────
  //     more workspaces…  3 workspaces / 7 panes  ▶
  //
  // The tally is the bare number of workspaces behind the row. Not agents: every
  // workspace here is here precisely because it has none, so that column would be
  // zeroes. Not "2 workspaces / 3 panes" either — the noun is already in the
  // label this rides, and spelled out twice the row outgrows a sidebar that goes
  // down to 150px wide, which is the same trade the Workspaces heading makes with
  // its own folded count. The words are in the tooltip for anyone the digit
  // doesn't reach. It rides both states for the reason the group rollups do —
  // shut, it stands in for what is hidden; open, it saves counting headers.
  function paneMoreEl(cold, sep) {
    const li = document.createElement("li");
    li.className = "wsgrp more" + (sep ? " sep" : "");
    const name = document.createElement("span");
    name.textContent = "more workspaces…";
    li.appendChild(name);
    const panesN = cold.reduce((t, g) => t + g.rows.length, 0);
    const s = document.createElement("span");
    s.className = "gsum";
    s.textContent = String(cold.length);
    li.appendChild(s);
    const car = document.createElement("span");
    car.className = "car"; car.textContent = paneMoreOpen ? "▼" : "▶";
    li.appendChild(car);
    li.title = (paneMoreOpen ? "hide " : "show ") + nOf(cold.length, "workspace")
      + " with no agent running (" + nOf(panesN, "pane") + ")";
    // On the press, for the same reason every other fold in this list is: the row
    // is rebuilt on every rollup and title push, and a press that a rebuild
    // interrupts never becomes a click.
    pressActivate(li, () => {
      paneMoreOpen = !paneMoreOpen;
      savePaneMoreOpen();
      renderPaneList();
    });
    return li;
  }

  function paneRowEl(row) {
    const li = document.createElement("li");
    li.className = "pn" + (row.visible && row.focused ? " focused" : "") + (row.visible ? "" : " off");
