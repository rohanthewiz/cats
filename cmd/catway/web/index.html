<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Cats Mux</title>
<style>
  :root {
    /* GoNotes-style dark green theme: warm gray-green surfaces, green accent.
       --chrome/--chrome-focus paint the pane header strip and double as the
       hover/selection surfaces (pane list, ctx menu, palette rows). */
    --bg:#1f2420; --fg:#d6ddd6; --accent:#4db380; --panel:#242a25; --panel2:#2b322c;
    /* --muted carries every secondary label (sidebar headings, status bar,
       hints); kept near 7:1 on the panel surface so 10–12px labels stay legible. */
    --line:#38403a; --muted:#9db0a2; --chrome:#2b322c; --chrome-focus:#3a4a3f;
    /* Sidebar section titles pull out of --muted into a medium green so the
       three groups read as dividers rather than as more secondary label text. */
    --heading:#6cbf8d;
    /* The workspace group headers inside PANES: a tier below --heading, in a
       greenish brown so they read as group dividers without competing with the
       green section titles. Themes that don't set it get plain --muted. */
    --ws-heading:#a09a62;
    /* The git branch in a pane header. Same warm tan as the workspace headers
       (and derived from it for themes that author neither): it has to read as a
       distinct field beside the green handle and the yellow agent without
       adding a fourth hue to a 19px strip. */
    --branch:#a09a62;
    /* The todo reminder mark keeps the old warm yellow: it has to stay clear of
       the green agent-state dots so it reads as a reminder, not as a state. */
    --todo:#f0dfa0;
    --ok:#6ac47a; --warn:#e0b64e; --err:#e57373; --done:#00ccf5;
    /* Agent identity hues. AGENTS hands each tool name one of these six slots
       (AGENT_HUE below), so claude and ced in the same list are told apart
       without reading. Six fixed slots rather than a colour per agent: the
       label space is open-ended, so agents share slots and the map decides who
       collides. Kept clear of the state colours directly above — those mean
       "working / blocked / finished" in the same row, one span over. */
    --agent-1:#6cbf8d; --agent-2:#7fb3ff; --agent-3:#c99bf0;
    --agent-4:#e6a0c4; --agent-5:#e0955e; --agent-6:#79cfc4;
    /* Accent desaturated most of the way to gray: the focused pane's outline
       sits right next to terminal text all day, so it reads as a gray-green
       hairline just above --line rather than a green marker. */
    --accent-dim:#3d4a43;
    /* Text emphasis ladder (formerly hardcoded hexes, var-ified so light
       themes can invert them): strong = active/selected labels, soft = hover
       lift on secondary text, bright = the loudest hover state. */
    --fg-strong:#e8e8e8; --fg-soft:#ddd; --fg-bright:#fff;
    /* Focused pane-header text + its (dimmer) buttons. */
    --chrome-fg:#e6efe7; --chrome-fg-dim:#cfe0d3;
    /* Text on an accent-colored surface (primary buttons). */
    --accent-fg:#0e1a13;
    /* The link-error banner's own surface — red-tinted, unlike --err text. */
    --err-bg:#2a1c1c; --err-fg:#ffd7d7;
    /* Translucent washes. hover flashes icon buttons; the rest paint the
       canvas overlays (drag selection, copy-mode cursor, scrollbar thumb),
       read from JS via getComputedStyle so themes reach the canvas too. */
    --hover:rgba(255,255,255,.16);
    --sel-fill:rgba(88,204,140,0.30); --cm-cursor:rgba(122,220,170,0.95);
    --scroll-thumb:rgba(122,220,170,0.6); --scroll-thumb-idle:rgba(255,255,255,0.25);
    /* Terminal canvas defaults, used when a pane's frame doesn't name its own
       colors. Split out from --bg/--fg so a theme can tint the chrome without
       recoloring terminal content. */
    --term-fg:#d6ddd6; --term-bg:#1f2420;
    /* --sb-scale sizes the whole left column as one unit: the column width and
       every type size inside it are expressed against it, so the sidebar grows
       or shrinks without any of its parts drifting out of proportion. */
    --sb-scale:1.15;
    /* Sidebar column width. Anything else that has to clear the sidebar (the
       banner) reads it from here so the two can't drift apart. */
    --sidebar-w:calc(253px * var(--sb-scale));
    /* Chat column width. 0 keeps the grid math identical to the pre-chat
       layout when the panel is closed; body.chat-open widens it. */
    --chat-w:0px;
    /* Splitter column width. Its own variable because the folded sidebar widens
       it (body.sb-hidden) to carry a visible reveal handle, and #banner has to
       clear both tracks to sit flush against the terminals. */
    --gutter-w:5px;
  }
  body.chat-open { --chat-w:340px; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow:hidden; }
  #app { position:fixed; inset:0; display:grid; grid-template-columns:var(--sidebar-w) var(--gutter-w) 1fr var(--chat-w); }
  /* Each column is nailed to its child by hand rather than left to auto-placement.
     Auto-placement fills tracks in DOM order from the grid items that exist, so a
     child that goes display:none (body.sb-hidden #sidebar) does not leave a hole —
     it drops out of the sequence and every later child slides one track left. That
     put the splitter in the 0px sidebar track (nothing left to click to reveal) and
     #main in the 5px gutter track (the terminals squeezed to a sliver), which is
     unrecoverable without the keyboard. Explicit placement is immune: a hidden
     child's track simply stays empty. */
  #sidebar  { grid-column:1; }
  #splitter { grid-column:2; }
  #main     { grid-column:3; }
  #chat     { grid-column:4; }

  /* ---- Splitter ----
     A five-pixel gutter between the sidebar and the terminals. It sits in its
     own grid column rather than straddling the border, so dragging it never
     lands on a pane's edge, and it keeps the sidebar's own hairline as the
     visible seam until you actually reach for it.

     Laid out as a centering flex box purely so the folded state's reveal handle
     (#splitter::after) can sit at the vertical middle without measuring anything;
     unfolded, the pseudo-element has no content and this costs nothing. */
  #splitter { cursor:col-resize; background:transparent; display:flex; align-items:center; }
  #splitter:hover, #splitter.drag { background:var(--accent-dim); }
  /* While dragging, the pointer is captured but the panes below still hand out
     text cursors and selections; this shuts both off for the duration. */
  body.splitting { cursor:col-resize; user-select:none; }

  /* ---- Folded sidebar ----
     The column goes to nothing rather than merely narrow: --sidebar-w is
     re-declared on <body>, which beats the inline value setSidebarWidth writes
     on :root for everything inside it (the #app grid track, and #banner's left
     edge, both of which read the same variable) while leaving that stored width
     untouched for the reveal. #sidebar itself leaves the flow so its content
     cannot paint through a zero-width track.

     The reveal handle rides in the splitter's own grid column, which is the one
     place in the window that can carry a visible control for *zero* vertical
     cost: it is already a full-height strip, so a tab drawn in it steals no
     terminal row. A handle along the top of #main would have taken one row from
     every pane, permanently, for a control used twice a day; a floating overlay
     would have sat on top of terminal text and swallowed clicks and selections
     near the left edge. This does neither — it is in the layout, and the layout
     already had room for it in the one axis that was free.

     Folded, the gutter widens from 5px to 14px. That is the whole price, it is
     horizontal, and it is paid only while folded — the sidebar it replaces was
     ~290px, so the terminals still gain nearly all of the column back. */
  body.sb-hidden { --sidebar-w:0px; --gutter-w:14px; }
  body.sb-hidden #sidebar { display:none; }
  /* The strip itself stays unpainted so the handle reads as one distinct object
     rather than as a lit-up edge of the window; the full 14px column remains the
     click target regardless of where in it the pointer lands. */
  body.sb-hidden #splitter { background:transparent; cursor:pointer; }
  /* The handle: a tab flush with the window's left edge, rounded on the side it
     opens toward, with a chevron pointing the way the column will come back.
     46px tall is enough to read as a grab handle at a glance and to hit without
     aiming, and it is centered, so it never collides with the banner (which
     overlaps the top of this column when it is up). */
  body.sb-hidden #splitter::after {
    content:"\203A"; width:100%; height:46px; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel2); color:var(--fg-soft);
    border:1px solid var(--line); border-left:none; border-radius:0 5px 5px 0;
    font-size:14px; line-height:1; }
  /* Folded, the handle is also the only surface an agent's state can reach, so
     it carries the strongest one waiting (paintSplitterAttention). This covers
     the one case the auto-reveal cannot: the column was folded again *while* an
     agent was already blocked or already done, so no state change is coming to
     re-open it. The state colors the tab's border and chevron rather than
     flooding the strip — a 14px full-height bar of --err is a fire alarm for
     what is a "someone is waiting on you" hint, and coloring the object the eye
     already goes to says the same thing without repainting the window's edge. */
  body.sb-hidden #splitter.attn-done::after {
    border-color:var(--done); color:var(--done); }
  body.sb-hidden #splitter.attn-blocked::after {
    border-color:var(--err); color:var(--err); }
  /* Last, so pointing at the handle still answers under either attention state. */
  body.sb-hidden #splitter:hover::after, body.sb-hidden #splitter.drag::after {
    background:var(--accent-dim); border-color:var(--accent); color:var(--fg-bright); }

  /* ---- Sidebar ---- */
  #sidebar { background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; overflow-y:auto; min-height:0; }
  #brand { font-size:calc(13px * var(--sb-scale)); font-weight:600; letter-spacing:.5px; color:var(--fg-strong);
    padding:12px 14px; border-bottom:1px solid var(--line);
    /* A line break is allowed either side of the inline mark, so a sidebar
       dragged to its 150px floor (or a large --sb-scale) could otherwise drop
       the cat onto its own line above the word. Held on one line, the build
       badge is the thing that gives way, which is the right thing to lose. */
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    /* Both halves of this are load-bearing on a short window, and the reason is
       the line above: a flex item's automatic minimum size is only its content
       height while overflow is `visible`. The `overflow:hidden` we need for the
       ellipsis drops that floor to zero, so when the sidebar's sections overflow
       a short viewport the brand is the one child that CAN give way — it gets
       squeezed to a sliver and clips its own logo, instead of #sidebar's
       overflow-y:auto scrolling. flex:0 0 auto puts the floor back explicitly,
       which is what we wanted from `auto` anyway. Every other #sidebar child
       leaves overflow visible, so they keep the automatic floor for free. */
    flex:0 0 auto;
    /* Anchor for the fold button below, plus the gutter it sits in. The right
       pad is reserved rather than left to chance: the wordmark and its build
       badge are a nowrap run that ellipsises, and without the reservation a
       narrow column would run that text under the button instead of clipping
       short of it. The two lengths are coupled — see #sb-fold. */
    position:relative; padding-right:calc(10px + 18px * var(--sb-scale)); }
  #brand small { color:var(--muted); font-weight:400; margin-left:6px; }
  /* The fold button: the pointer's way to put the column away, paired with the
     reveal handle that takes its place (body.sb-hidden #splitter::after). It is
     the mirrored glyph of that handle — '‹' here, '›' there — so the pair reads
     as one control that moves with the column rather than as two unrelated
     buttons.

     Absolutely positioned rather than laid out. #brand is a nowrap inline run
     (mark, wordmark, build badge) and the note above it explains why that has
     to stay inline; a flex row would have re-spaced the badge. Taking the
     button out of flow leaves that run exactly as it was and costs the column
     no height — it sits in the padding the rule above reserves for it.

     No tab stop. The window-level keydown handler routes the keyboard to the
     focused pane and preventDefaults nearly everything, so a focused button
     could never be activated by Enter or Space — leaving it tab-focusable would
     build a stop that swallows focus and does nothing. ⌘B is the keyboard path,
     and the title says so. */
  #sb-fold { position:absolute; top:50%; right:8px; transform:translateY(-50%);
    width:calc(18px * var(--sb-scale)); height:calc(20px * var(--sb-scale));
    display:flex; align-items:center; justify-content:center; padding:0;
    background:none; border:1px solid transparent; border-radius:4px;
    color:var(--muted); font-family:inherit; font-size:calc(14px * var(--sb-scale));
    line-height:1; cursor:pointer; }
  /* Lit the same way the reveal handle lights on hover, for the same reason:
     the two are one control, so they answer the pointer identically. */
  #sb-fold:hover { background:var(--accent-dim); border-color:var(--accent); color:var(--fg-bright); }
  /* The mark sits inline and rides the text baseline rather than turning
     #brand into a flex row: the build badge appended below is a sibling of the
     wordmark, and a flex context would have re-spaced it. The nudge scales
     with --sb-scale along with the box so the pairing holds at every zoom.
     Accent-colored so the logo reads as mark + wordmark, not one run of text.

     The box is 19 WIDE by 16 TALL, which is not the artwork's aspect — the
     squash is deliberate, and the svg carries preserveAspectRatio="none" to
     perform it (see the note on the tag). A wider-than-tall mark sits better
     beside a single line of type than the square one did, and it buys back
     ~6px of header height, since the mark is the tallest thing on that line
     and therefore what sets the row's height.

     The nudge is derived from the artwork's crop rather than guessed, and the
     squash changes the derivation, so here it is in full. gen-trace crops the
     viewBox with ~2 units of pad around the ink; measured against the compact
     path that actually ships, the pad under the chin is 1.32 units of the
     133.93-unit box (the simplification pulls the extreme point in a little,
     which is why it is not a clean 2). With preserveAspectRatio="none" the
     viewBox maps straight onto the box, so that pad lands as 1.32/133.93 x 16
     = 0.16px under the chin — and the 3.6-unit stroke the tag adds spends 1.8
     of those units growing the chin downward, which is 0.48 units MORE than
     there was room for. The chin therefore ends up 0.48/133.93 x 16 = 0.06px
     below the box rather than inside it, so the geometric nudge is +0.06px:
     under a tenth of a pixel, and the wrong way round from the optical drop
     below, which is why it is recorded and not applied. It is spelled out
     rather than deleted because the number is derived, not absent — re-crop
     the artwork, change the height, or change the stroke, and it has to be
     re-derived. (Rasterised, the overhang measures 0.51 units rather than the
     arithmetic's 0.48: the round cap on the chin's own segment ends adds the
     difference.)

     What ships is 1.5px *below* that zero, and the difference is optical, not
     geometric. Sitting the chin exactly on the baseline aligns the mark with
     where the letters end, but the wordmark is set in caps and figures whose
     mass fills the whole cap height, while the mark's mass — the eyes and the
     brow — clusters in its upper half. Matched at the baseline the mark reads
     as riding high against that block of type. Dropping it a hair re-centers
     the two masses against each other. The chin then hangs 1.5px under the
     baseline, which is what overflow:visible above already permits.

     The gap to the wordmark is 9px rather than the 6px it was. The mark is an
     open outline, so its right edge is a thin curve with air behind it, and it
     needs more clearance than a solid glyph would to keep from reading as a
     letter of the word it precedes. Both lengths scale with --sb-scale, like
     the box itself, so the pairing survives zoom.

     overflow:visible is what makes both of those legal. 1.32 units of pad means
     any stroke past ~2.6 units puts the chin outside the viewBox, and an
     outermost svg clips to its viewport by default — the chin would flatten
     silently. The stroke IS past that now, so this is load-bearing rather than
     precautionary: without it the 3.6-unit weight would cut the bottom of the
     chin off flat. Letting it paint outside costs nothing (the mark is inline
     with 9px of margin and the row has 12px of padding), and it is also what
     makes the optical nudge above free: the 1.5px the chin drops is overhang
     the box no longer clips.

     The lowest ink is the chin: mark 06 is a head with no ground line under it,
     so the chin is what sits on the text baseline. (Mark 10, which this
     replaced, ended in a cursor bar below the chin and aligned THAT instead —
     if a mark with a bar ever comes back, align the bar, or it hangs below the
     wordmark like a descender.) */
  #brand .mark { width:calc(19px * var(--sb-scale)); height:calc(16px * var(--sb-scale));
    vertical-align:calc(-1.5px * var(--sb-scale)); overflow:visible;
    margin-right:calc(9px * var(--sb-scale)); color:var(--accent); }
  /* Build badge: the short git hash this catway was built from (trailing '*' =
     built from a modified tree). Its hover card carries the commit subject —
     see initBuildBadge in JS. Mostly it answers "is this install stale?".

     It is a build fingerprint, not a label anyone reads on purpose, so it sits
     below the wordmark's weight: an explicit 9px (rather than <small>'s inherited
     ~0.83em of the 13px brand) scaled with --sb-scale like every other sidebar
     length, plus an opacity knock-down on top of --muted — the same recipe the
     usage-list footnotes use. Hover restores full opacity along with the accent
     so the thing you're about to read a tooltip from doesn't stay faded. */
  #brand small.hash { cursor:help; font-size:calc(9px * var(--sb-scale)); opacity:.7; }
  #brand small.hash:hover { color:var(--accent); opacity:1; }
  #sidebar section { padding:10px 6px 8px; }
  /* Splitter between Workspaces / Panes / Agents — the headings alone read as
     one long list once a workspace has more than a couple of panes. */
  #sidebar section + section { border-top:1px solid var(--line); }
  /* The section headings sit at the top of the sidebar's three-tier scale:
     section title (12px) > group subtitle (11px) > row (12px, but lower-case,
     regular weight and un-tracked). A heading used to be set two steps *below*
     its own rows, which inverted the hierarchy — the rows read as the loudest
     thing in the section and the label above them as a footnote. Matching the
     row's pixel size is enough to win it back: uppercase, 700 weight and the
     tracking do the rest, so the title dominates without shouting. */
  #sidebar h2 { font-size:calc(12px * var(--sb-scale)); text-transform:uppercase; letter-spacing:.8px; color:var(--heading);
    font-weight:700; margin:0 0 6px; padding:0 8px; display:flex; align-items:baseline; }
  /* Section-level controls, pinned to the heading's right edge. Muted until
     hovered so the heading still reads as a label, not a toolbar. */
  #sidebar h2 .hctl { margin-left:auto; display:flex; gap:1px; }
  #sidebar h2 .hctl button { background:none; border:0; padding:0 3px; cursor:pointer;
    font:inherit; font-size:calc(11px * var(--sb-scale)); line-height:1; color:var(--muted); }
  #sidebar h2 .hctl button:hover { color:var(--accent); }
  /* The section fold — the arrow outboard of everything else in the heading,
     which hides the section's whole list rather than one group inside it. It
     takes the same clearance the usage refresh does, and for the same reason:
     glyph buttons at this size touching read as one smudged mark. */
  #sidebar h2 .hctl button.secfold { margin-left:4px; }
  /* Folded, a section is its title and that arrow and nothing else. No count, no
     age stamp, no per-group fold pair, no backlog mark — a bar whose only job is
     to say "this section is here, closed" has nothing to summarize, and a
     summary there is a second thing to read on the way past it.
     Two rules cover the lot because the title is the heading's only text node:
     everything else in an h2 is an element, so :not() reaches all of it. */
  #sidebar section.folded > ul { display:none; }
  #sidebar section.folded h2 { margin-bottom:0; }
  #sidebar section.folded h2 > :not(.hctl) { display:none; }
  #sidebar section.folded h2 .hctl > :not(.secfold) { display:none; }
  #sidebar ul { list-style:none; margin:0; padding:0; }
  /* Rows sit one step under their section title and level with the group
     subtitles — a subtitle separates itself by case, weight and colour rather
     than by size, which keeps the whole sidebar inside a two-size scale. */
  #sidebar li { font-size:calc(11px * var(--sb-scale)); padding:4px 8px; border-radius:4px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; cursor:default; display:flex; align-items:baseline; gap:6px; }
  /* Usage rows stack a label line over a meter, so the row is two lines tall
     rather than the one line every other sidebar row is. */
  #usage-list li { display:block; padding:3px 8px 5px; cursor:default; }
  #usage-list li:hover { background:none; }
  #usage-list li.empty { color:var(--muted); font-style:italic; }
  /* A heading over the rows it covers — one per provider, plus the host — in
     the same register #pane-list's workspace headers use, and with the same job:
     it names the group and folds it. Flex like .wsgrp so the summary and caret
     can be pushed to the right edge; the padding stays its own — the rows'
     3px/5px is tuned around a meter this has not got. */
  #usage-list li.ugrp { color:var(--ws-heading); font-size:calc(11px * var(--sb-scale));
    text-transform:uppercase; letter-spacing:.5px; font-weight:600; padding:2px 8px 1px;
    display:flex; align-items:baseline; gap:6px; cursor:pointer; }
  #usage-list li.ugrp.sep { border-top:1px solid var(--line); margin-top:5px; padding-top:7px; }
  /* Overrides #usage-list li:hover's background:none — these rows ARE clickable,
     so they take the same hover the pane group headers do. */
  #usage-list li.ugrp:hover { background:var(--panel2); color:var(--fg-soft); }
  /* Summary then caret, both pinned right, exactly as in #pane-list. */
  #usage-list li.ugrp .gsum, #usage-list li.ugrp .car { margin-left:auto; }
  #usage-list li.ugrp .gsum + .car { margin-left:0; }
  /* The stand-in reading a folded group shows: the secondary half of the header,
     so it drops the label's case, tracking and weight, and it takes the warning
     colors its hidden meter would have taken. */
  #usage-list li.ugrp .gsum { text-transform:none; letter-spacing:0; font-weight:400;
    color:var(--muted); font-variant-numeric:tabular-nums; }
  #usage-list li.ugrp.high .gsum { color:var(--warn); }
  #usage-list li.ugrp.crit .gsum { color:var(--err); }
  /* The time left in the quoted window, parenthesised after the reading. It keeps
     the muted color through .high and .crit — the color in this header means "how
     much is spent", and a clock that turned red would read as a second alarm for
     something that is only the window doing what windows do. Sized like .ureset,
     which is the same fact one line down when the group is unfolded. */
  #usage-list li.ugrp .gsum .gleft { color:var(--muted);
    font-size:calc(9px * var(--sb-scale)); opacity:.8; }
  /* ...with one exception, a window near its rollover — half an hour out on the
     5-hour, two on a week, each row carrying its own horizon (see usageSoonMs).
     That is the one time the clock stops being background: whatever is left in
     the window has to be spent, or planned around, before it rolls. Amber and
     not red, and only ever amber — this axis is "how long", the .high/.crit
     axis beside it is "how much", and two things shouting the same color would
     make it impossible to tell which one is speaking. Specificity carries it
     over the muted rule above and over .high/.crit, both of which paint .gsum
     rather than this span. */
  #usage-list li.ugrp .gsum .gleft.soon { color:var(--warn); opacity:1; }
  #usage-list li.ugrp .car { font-size:calc(10px * var(--sb-scale)); }
  #usage-list .urow { display:flex; align-items:baseline; gap:6px; }
  /* Body weight and body color: with a genuinely bold heading now above them,
     a row's label is no longer the most important thing in its line, and
     lifting it to --fg-strong made every key read as emphasised. */
  #usage-list .uname { color:var(--fg); }
  /* The reading sits hard right against the window name, and is the one thing
     in the row worth reading at a glance when the bar is only a hint. */
  #usage-list .uval { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
  #usage-list li.high .uval { color:var(--warn); }
  #usage-list li.crit .uval { color:var(--err); }
  #usage-list .ureset { color:var(--muted); font-size:calc(9px * var(--sb-scale)); opacity:.8; }
  /* The unfolded half of the same warning: a countdown inside its row's horizon
     lifts out of the muted register. It sits left of .uval, which carries
     the spent-color, so a row can legitimately show an amber clock beside a
     calm percentage — that pairing ("barely used, nearly over") is exactly the
     one the color exists to catch. */
  #usage-list .ureset.soon { color:var(--warn); opacity:1; }
  #usage-list .umeter { margin-top:3px; height:4px; border-radius:2px; background:var(--panel2);
                        overflow:hidden; }
  #usage-list .umeter > i { display:block; height:100%; width:0; background:var(--accent);
                            border-radius:2px; transition:width .4s ease; }
  #usage-list li.high .umeter > i { background:var(--warn); }
  #usage-list li.crit .umeter > i { background:var(--err); }
  /* A local estimate has a token count but no allowance to measure it against,
     so there is no bar to fill — the track is dropped rather than drawn empty,
     which would read as "0% used". */
  #usage-list li.unknown .umeter { display:none; }
  /* The history strip under a row that has one (host CPU). Full width and
     stretched by the SVG's own preserveAspectRatio, so nothing in the script has
     to know the sidebar's width — see usageSpark. It takes the row's warning
     colors exactly as the meter above it does, so a row that has gone red is red
     in both of its halves rather than half-warning. */
  #usage-list .uspark { display:block; width:100%; height:calc(20px * var(--sb-scale));
                        margin-top:3px; }
  #usage-list .uspark .sfill { fill:var(--accent); opacity:.16; }
  #usage-list .uspark .sline { fill:none; stroke:var(--accent); opacity:.85; }
  #usage-list li.high .uspark .sfill { fill:var(--warn); }
  #usage-list li.high .uspark .sline { stroke:var(--warn); }
  #usage-list li.crit .uspark .sfill { fill:var(--err); }
  #usage-list li.crit .uspark .sline { stroke:var(--err); }
  #usage-list .unote { color:var(--muted); font-size:calc(9px * var(--sb-scale));
                       font-style:italic; padding:1px 8px 3px; }
  /* How old the numbers below are, in the heading beside the control that
     refreshes them. It rides .hctl's right edge but opts out of the heading's
     uppercase and tracking: it is a reading, not a label. It also pins its own
     size rather than inheriting the heading's — the title grew to lead the
     section, and an age stamp that grew with it would compete with the label
     it is meant to annotate. */
  #sidebar h2 .hage { color:var(--muted); font-weight:400; text-transform:none;
    letter-spacing:0; font-size:calc(10px * var(--sb-scale));
    font-variant-numeric:tabular-nums; margin-right:3px; }
  /* The stand-in a folded *section* shows, when the section had no group headers
     to carry one (see renderWorkspaces). Same register as .hage for the same
     reason — it is a reading, not a label — and the same right-edge berth just
     inboard of the fold pair, which is where .gsum sits in the group headers this
     is standing in for. It carries no box when empty, so the pointer only meets
     it while there is something folded to unfold. */
  #sidebar h2 .hcount { color:var(--muted); font-weight:400; text-transform:none;
    letter-spacing:0; font-size:calc(10px * var(--sb-scale));
    font-variant-numeric:tabular-nums; margin-right:5px; cursor:pointer;
    white-space:nowrap; }
  #sidebar h2 .hcount:hover { color:var(--fg-soft); }
  /* The refresh control carries a drawn mark (see refreshMark), so it is sized
     in pixels and centered on the heading's text rather than stretching to it. */
  #usage-hctl { align-items:center; }
  #usage-hctl .refresh { display:block; width:calc(12px * var(--sb-scale));
    height:calc(12px * var(--sb-scale)); }
  /* The fold pair now sits outboard of the refresh (far right of the heading), so
     the drawn mark needs clearance it did not need when it was the last control:
     .hctl's 1px gap is tuned for two glyph buttons touching, and a drawn arc
     abutting a ⊞ reads as one smudged mark at 12px. */
  #usage-hctl button.uref { margin-right:5px; }
  /* The mark turns while a reading is in flight. The server acks the ask
     immediately and pushes the numbers only when the read lands, so the spin is
     the only thing saying the click was heard. */
  #usage-hctl button.busy { color:var(--accent); }
  #usage-hctl button.busy .refresh { animation:uspin .9s linear infinite; }
  @keyframes uspin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #usage-list .umeter > i { transition:none; }
    /* The color alone carries "busy" for anyone who asked not to be spun. */
    #usage-hctl button.busy .refresh { animation:none; }
  }
  #ws-list { position:relative; }
  #ws-list li.ws { cursor:pointer; }
  #ws-list li.ws:hover { background:var(--panel2); }
  /* The focused workspace takes the theme's accent rather than the white-ish
     --fg-strong the active tab uses: the tab already has an accent underline to
     mark it, but a list row has no such edge, so the color itself has to carry
     the "you are here" signal — and every theme's accent is its saturated hue. */
  #ws-list li.active { color:var(--accent); }
  #ws-list li .sum { color:var(--muted); font-size:calc(10px * var(--sb-scale)); margin-left:auto; }
  #ws-list li .sum span { margin-left:4px; }
  /* The paw print a workspace row — or the Workspaces heading, for the global
     backlog — wears while its cats-todo backlog has unfinished items in it,
     with how many are left set as a superscript beside it — the paw says the
     cat left something behind, the number says how much. The two are one mark,
     so they share a wrapper and skip the row's 6px gap; the wrapper aligns its
     children at the top, which is what puts the count up at the toes.
     It rides the text baseline like the glyphs around it, and takes --todo so
     it reads as a reminder rather than as another agent-state dot. */
  .todo-mark { flex:0 0 auto; align-self:center; color:var(--todo);
    display:inline-flex; align-items:flex-start; }
  .todo-mark .todo { width:calc(14px * var(--sb-scale)); height:calc(14px * var(--sb-scale));
    margin-left:-2px; }
  .todo-mark .todo-n { font-size:calc(8px * var(--sb-scale)); line-height:1; font-weight:600;
    margin-left:-1px; }
  /* The global backlog's mark rides the Workspaces heading itself — the one
     element that spans every workspace, which is exactly the mark's scope. It
     opts back out of the heading's uppercase tracking: the superscript is a
     count, not part of the label. */
  #ws-global-todo { display:inline-flex; margin-left:7px; letter-spacing:0; }
  /* A locked workspace — one no plugin or agent may be launched into — reads as
     set aside: the row steps back, and a padlock next to the name says why it
     did. The lock itself is exempt from the dimming, being the one thing in the
     row that just became more true; it stays at --muted, the same gray the
     chrome uses for "present, not the point". */
  #ws-list li.ws.locked > :not(.lock-mark) { opacity:.5; }
  /* No switch-on-click here, so the row drops the pointer — but not to
     "not-allowed": the row still renames, reorders and opens its menu, and only
     the one gesture is off. The plain arrow says "not a button", which is true. */
  #ws-list li.ws.locked { cursor:default; }
  #ws-list li .lock-mark { flex:0 0 auto; align-self:center; color:var(--muted);
    display:inline-flex; margin-left:-1px; }
  #ws-list li .lock { width:calc(12px * var(--sb-scale)); height:calc(12px * var(--sb-scale)); }
  #ws-list li.add { color:var(--muted); font-style:italic; cursor:pointer; }
  #ws-list li.add:hover { color:var(--accent); background:none; }
  /* HOSTS: one row per cathost this catway attached to — a state dot, the
     label, and how many panes live there. The whole section is hidden while
     there is only one host (renderHosts sets [hidden]), so a session that never
     configured a second machine sees exactly the sidebar it always had.
     Rows are not clickable yet — attach/detach is a later phase — hence the
     default cursor and the suppressed hover, matching #usage-list's rows. */
  #host-list li { display:flex; align-items:baseline; gap:6px; cursor:default; }
  #host-list li:hover { background:none; }
  #host-list .hdot { font-size:calc(10px * var(--sb-scale)); }
  #host-list li.up .hdot { color:var(--ok); }
  #host-list li.down .hdot { color:var(--err); }
  #host-list .hname { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  /* A host that is down keeps its row at full strength — it still owns panes,
     and fading it would read as "not important" when it is the opposite. Only
     the label steps back a little; the red dot and the reason carry the news. */
  #host-list li.down .hname { opacity:.75; }
  #host-list .hdef { color:var(--muted); font-size:calc(9px * var(--sb-scale)); }
  #host-list .hmeta { margin-left:auto; flex:none; color:var(--muted);
    font-size:calc(10px * var(--sb-scale)); font-variant-numeric:tabular-nums; }
  #host-list li.down .hmeta { color:var(--err); }
  /* Round-trip time to that cathost. It sits BEFORE the pane count (which keeps
     margin-left:auto and so stays pinned to the right edge) because the pane
     count is the stable number and latency is the moving one: a figure that
     changes should not shift a figure that does not. Dimmer than .hmeta — it is
     a diagnostic, read when something feels slow, not on every glance. */
  #host-list .hlat { flex:none; margin-left:auto; color:var(--muted); opacity:.7;
    font-size:calc(9px * var(--sb-scale)); font-variant-numeric:tabular-nums; }
  #host-list .hlat + .hmeta { margin-left:0; }
  /* HISTORY: one row per recorded command — its exit marker, the command, and
     how long it took. Rows ARE clickable (a click jumps the pane's viewport to
     that command's output), which is why these get the hover treatment the
     host rows deliberately do not. */
  #hist-list li { display:flex; align-items:baseline; gap:6px; cursor:pointer; }
  #hist-list .cdot { flex:none; font-size:calc(9px * var(--sb-scale)); color:var(--ok); }
  #hist-list li.failed .cdot { color:var(--err); }
  /* An unknown status is neither: the shell never said, and colouring it green
     would claim a success nobody reported. */
  #hist-list li.unknown .cdot { color:var(--muted); opacity:.6; }
  #hist-list .ccmd { min-width:0; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; font-family:var(--mono, monospace); }
  /* An agent's commands are marked, because "what did claude actually run" is
     the question this section can answer and a shell history cannot. */
  #hist-list .corigin { flex:none; color:var(--accent); opacity:.75;
    font-size:calc(9px * var(--sb-scale)); }
  #hist-list .cdur { flex:none; margin-left:auto; color:var(--muted);
    font-size:calc(9px * var(--sb-scale)); font-variant-numeric:tabular-nums; }
  /* A row whose block is gone — its output has scrolled out of the pane — still
     lists (it is history), but says so by not offering a click. */
  #hist-list li.gone { cursor:default; opacity:.6; }
  #hist-list li.gone:hover { background:none; }

  /* The same badge as the pane header's, on the workspace rows: a workspace's
     host is where its NEW panes land, which is worth seeing beside its name once
     the two can differ. Pinned before the agent rollup at the right edge. */
  #ws-list li.ws .wshost { color:var(--muted); font-size:calc(10px * var(--sb-scale));
    flex:none; margin-left:4px; }
  /* "Also open in another window": the same muted weight as the host badge —
     it reports, it does not warn. */
  #ws-list li.ws .wswin { color:var(--muted); font-size:calc(10px * var(--sb-scale));
    flex:none; margin-left:4px; }
  #pane-list li, #agent-list li { cursor:pointer; }
  #pane-list li:hover, #agent-list li:hover { background:var(--panel2); }
  #pane-list li.focused { background:var(--chrome-focus); color:var(--fg-strong); }
  /* The list spans every workspace now, so it carries its own scroll — otherwise
     a session with a few tabs of panes pushes Agents off the sidebar. */
  #pane-list { max-height:34vh; overflow-y:auto; }
  /* Panes outside the current viewport (another tab or workspace): real, but
     elsewhere — muted handle, and a click reveals rather than focuses. */
  #pane-list li.off .pub { color:var(--muted); }
  #pane-list li.off .ttl { opacity:.65; }
  /* Each workspace's panes sit under their own header row, which doubles as the
     collapse toggle. It replaces the plain hairline the list used to draw at the
     boundary: the same visual break, but it now names the group and can fold it.
     Groups after the first keep the hairline above them, on the header row rather
     than on the first pane, so a focused pane never paints across the divider. */
  /* Bold, so the header reads as a heading over its rows rather than as one more
     muted row among them — at this size weight separates the two tiers better than
     the colour alone did.
     The Workspaces list above splits open from locked with the same kind of header
     (see renderWorkspaces), so both lists share the style rather than each growing
     its own copy: a fold header is a fold header wherever it appears. */
  #pane-list li.wsgrp, #ws-list li.wsgrp { color:var(--ws-heading); font-size:calc(11px * var(--sb-scale)); text-transform:uppercase;
    letter-spacing:.5px; cursor:pointer; font-weight:600; }
  #pane-list li.wsgrp.sep, #ws-list li.wsgrp.sep { border-top:1px solid var(--line); margin-top:5px; padding-top:7px; }
  #pane-list li.wsgrp:hover, #ws-list li.wsgrp:hover { background:var(--panel2); color:var(--fg-soft); }
  /* The rollup sits ahead of the caret and the pair is pushed to the right edge. */
  #pane-list li.wsgrp .gsum, #pane-list li.wsgrp .car,
  #ws-list li.wsgrp .gsum, #ws-list li.wsgrp .car { margin-left:auto; }
  #pane-list li.wsgrp .gsum + .car, #ws-list li.wsgrp .gsum + .car { margin-left:0; }
  /* The count is the header's secondary half, so it stays at normal weight — only
     the workspace name carries the bold. */
  #pane-list li.wsgrp .gsum, #ws-list li.wsgrp .gsum { text-transform:none; letter-spacing:0; font-weight:400; }
  /* The caret tracks its header's size — a step under it, as before, so the
     fold marker stays subordinate to the name it folds. */
  #pane-list li.wsgrp .car, #ws-list li.wsgrp .car { font-size:calc(10px * var(--sb-scale)); }
  /* The workspace whose panes are the ones on screen, marked the way the
     Workspaces list marks the same workspace: ● and the accent. The Panes
     section pins it to the top regardless of what is running in it, so the mark
     is what stops the top row reading as "busiest". */
  #pane-list li.wsgrp.cur { color:var(--accent); }
  /* The shelf the quiet workspaces fold into, at the foot of the list. Muted and
     italic — the two marks this sidebar already uses for a row that is a
     stand-in rather than a thing (#ws-list li.add, #agent-list li.empty) — so a
     column of workspace names never reads as containing one called "more
     workspaces". It borrows .wsgrp's caret and hairline because it folds like a
     header, but drops the uppercase, the tracking and the weight that say "this
     names a group": it names an absence, and the shouted form of a phrase that
     long is the loudest thing in the section for the least reason. */
  #pane-list li.wsgrp.more { color:var(--muted); font-style:italic;
    text-transform:none; letter-spacing:0; font-weight:400; }
  #pane-list li.wsgrp.more:hover { color:var(--fg-soft); }
  /* Narrow sidebar: the label gives way first. The count and the caret are the
     row's whole function — how much is hidden, and the way to see it — so they
     hold their width and the phrase ellipses into whatever is left. */
  #pane-list li.wsgrp.more > span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  #pane-list li.wsgrp.more .gsum, #pane-list li.wsgrp.more .car { flex:0 0 auto; }
  #pane-list .pub { color:var(--accent); }
  #pane-list .ttl { color:var(--muted); overflow:hidden; text-overflow:ellipsis; }
  #pane-list .ag, #agent-list .aname { margin-left:auto; }
  .ag, .adot, .aname { font-size:calc(11px * var(--sb-scale)); }
  .st-working { color:var(--warn); } .st-blocked { color:var(--err); }
  .st-idle { color:var(--ok); } .st-unknown { color:var(--muted); }
  .st-done { color:var(--done); } /* finished off-screen, not yet seen */
  /* A working agent's dot breathes: the one state that is mid-change, so it is
     the one marker that moves. Only the dots pulse — the agent-name text in a
     pane row shares .st-working and would be hard to read blinking. */
  .adot.st-working, .tmark.st-working, #ws-list .st-working { animation:dotpulse 1.5s ease-in-out infinite; }
  @keyframes dotpulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  @media (prefers-reduced-motion:reduce) {
    .adot.st-working, .tmark.st-working, #ws-list .st-working { animation:none; }
  }
  #agent-list li { gap:6px; }
  /* The agent sitting in the focused pane, highlighted the same way its pane row
     is — the two sections then read as one selection, not two. */
  #agent-list li.focused { background:var(--chrome-focus); color:var(--fg-strong); }
  #agent-list .aname { color:var(--fg-strong); margin-left:0; }
  /* The tool name carries its identity hue; the model beside it stays neutral,
     one step under the name. Both live inside .aname so the row's flex gap
     still sees a single item — the pair reads as one field ("ced main"), and
     splitting them for colour must not split them for layout.

     Colour only, no bold: the row is 11px monospace, the focused row already
     claims weight and a background, and the age can go bold when it turns
     stale. A fourth emphasis channel here would be competing with three that
     already mean something. */
  #agent-list .amodel { color:var(--fg-soft); }
  .ah1 { color:var(--agent-1); } .ah2 { color:var(--agent-2); }
  .ah3 { color:var(--agent-3); } .ah4 { color:var(--agent-4); }
  .ah5 { color:var(--agent-5); } .ah6 { color:var(--agent-6); }
  #agent-list .ameta { color:var(--muted); font-size:calc(10px * var(--sb-scale)); margin-left:auto; }
  /* Time since the last state change, dimmer than the state it precedes: the
     state is the fact, the age only qualifies how stale that fact is. */
  #agent-list .aage { opacity:.75; }
  /* ...until the fact the age qualifies is itself the news. An agent's prompt
     cache lives about an hour, so a settled state that has sat for 45 minutes is
     one whose next turn is about to be re-read from scratch. Past that mark the
     age stops being a footnote: full opacity, and the figure alone in bold — the
     trailing "ago" is grammar, not a number, and bolding it only blurs which
     part is the reading. The two settled states get different colors because the
     user's move differs: idle is still warm and can be answered (caution), while
     done-unseen already finished unattended (maroon — the loss, not the warning).
     Both derive from theme colors so a light or high-contrast theme keeps them:
     the maroon is the theme's red pulled down toward a dark oxblood, with a
     literal fallback for engines without color-mix. */
  #agent-list .aage.stale { opacity:1; }
  #agent-list .aage.stale .anum { font-weight:700; }
  #agent-list .aage.stale-idle { color:var(--warn); }
  #agent-list .aage.stale-done { color:#b04a4a; }
  #agent-list .aage.stale-done { color:color-mix(in srgb, var(--err) 65%, #6b0f10); }
  /* An agent whose workspace is locked steps back the same way its workspace row
     does, and by the same amount: the two sections then agree at a glance about
     which work is set aside. Clicking it reveals nothing either — the row loses
     the pointer for the same reason the workspace row does, since revealing a
     pane *is* a workspace switch. */
  #agent-list li.agent.wslocked { opacity:.5; cursor:default; }
  /* Hovering restores it: whatever the row is dimmed for, the user is reading it
     now, and the state text is the smallest type in the sidebar. */
  #agent-list li.agent.wslocked:hover { opacity:1; }
  #agent-list li.empty { color:var(--muted); font-style:italic; cursor:default; }
  #agent-list li.empty:hover { background:none; }

  /* ---- Main area ---- */
  #main { display:grid; grid-template-rows:30px 1fr; min-width:0; min-height:0; }
  /* Top chrome is one row: tabs scroll on the left, the status affordances sit
     pinned at the right edge. The panes grid takes everything below it. */
  #topbar { display:flex; align-items:stretch; min-width:0; background:var(--panel);
    border-bottom:1px solid var(--line); }
  #tabbar { display:flex; align-items:stretch; gap:2px; padding:0 6px;
    flex:1 1 auto; min-width:0; overflow-x:auto; position:relative; }
  #tabbar .tab { font-size:12px; color:var(--muted); padding:0 10px; display:flex; align-items:center; gap:6px;
    border-bottom:2px solid transparent; white-space:nowrap; cursor:pointer; }
  #tabbar .tab:hover { color:var(--fg-soft); }
  /* Very short names ("1", "12") would otherwise render a sliver of a tab, so the
     label carries a centered floor width. Longer names outgrow it and are unaffected. */
  #tabbar .tab .tname { min-width:2em; text-align:center; }
  #tabbar .tab.active { color:var(--fg-strong); border-bottom-color:var(--accent); }
  /* 11px keeps the ✕ a step below the 12px label so it still reads as secondary,
     but 10px was a speck. The target is grown independently of the glyph: stretching to the
     row's full height and paying the horizontal padding back as negative margin
     gives a click area of the whole 30px column without moving the tab's width or
     the 6px gap ahead of it. */
  #tabbar .tab .x { color:var(--muted); font-size:11px; align-self:stretch;
    display:flex; align-items:center; padding:0 3px; margin:0 -3px; }
  #tabbar .tab .x:hover { color:var(--err); }
  #tabbar .tab .tmark { font-size:8px; }
  #tabbar .tab.add { color:var(--muted); font-weight:600; padding:0 12px; }
  #tabbar .tab.add:hover { color:var(--accent); }

  #panes { position:relative; overflow:hidden; }
  .pane { position:absolute; box-sizing:border-box; }
  .pane.dragging { opacity:.5; }
  .pane.droptarget { outline:2px solid var(--accent); outline-offset:-2px; }
  /* A file dragged in from the desktop. Distinct from .droptarget (an in-app
     pane swap) because it means something different — bytes are about to be
     written to that pane's machine — so it gets a wash as well as an edge. */
  .pane.filedrop { outline:2px dashed var(--accent); outline-offset:-2px; }
  .pane.filedrop::after { content:""; position:absolute; inset:0; pointer-events:none;
                          background:var(--accent); opacity:.10; }
  /* Pane chrome = the per-pane header strip (restored; it left in the green-
     theme facelift and its absence hurt more than the row it costs). Exactly
     one terminal row tall (the server reserves chromeRows in each pane's inner
     rect), so the icon buttons buy glyph size by giving up vertical padding:
     17px symbols with line-height 1 and no top/bottom padding stay clear of
     the strip's overflow:hidden clip at a ~19px row, while synthetic bold
     thickens the hairline box-drawing symbols (⊟ ⊞ ⤢ ⬚ ⧉) that were the
     hardest to read. */
  .pane .chrome { position:absolute; left:0; top:0; right:0; overflow:hidden; display:flex;
    align-items:center; gap:0; font-size:12px; color:var(--muted); background:var(--chrome);
    padding:0 5px 0 9px; box-sizing:border-box; }
  .pane.focused .chrome { color:var(--chrome-fg); background:var(--chrome-focus); }
  /* The identity line reads left to right as one sentence about the pane —
     pane id · title · path · branch · agent · state — and then hands the rest
     of the row to the toolbar.
       ┌────────────────────────────────────────────────────────┬───────────┐
       │ w1:p3 · vim · ~/projs/go/cats · main · claude · working │  toolbar  │
       └────────────────────────────────────────────────────────┴───────────┘
     Laying it out as a flex row, rather than as one run of text ellipsized as a
     whole, is what lets the row give up the *right* field when it runs out of
     width: the title and path shrink and ellipsize, while the short fields —
     each of which answers a question you would otherwise have to click into the
     pane to ask — stay whole. Ellipsizing the line as a whole truncated from the
     right, which dropped the agent and its state first. */
  .pane .chrome .info { flex:1; min-width:0; display:flex; align-items:center;
    overflow:hidden; white-space:nowrap; }
  /* Fields hold their width by default; only the two free-text ones give way,
     the title twice as readily as the path (a shell's title is usually the
     command you can also see running, while the path may be the only thing
     telling two panes apart). */
  .pane .chrome .info > span { flex:none; }
  .pane .chrome .info .ttl { flex:0 2 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .pane .chrome .info .cwd { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  /* The separator belongs to no field: it is emitted between two present ones,
     so an absent field leaves no orphan dot behind. */
  .pane .chrome .info .sep { padding:0 6px; opacity:.45; }
  /* A pane whose child has exited keeps its header readable but stops competing
     with the live ones: the identity text drops to --muted at normal weight,
     leaving the red "exited (N)" as the only emphasised run in the row. The
     per-span rules below follow this one so they win the specificity tie and
     the handle keeps its accent. */
  .pane.dead .chrome .info { color:var(--muted); font-weight:400; }
  .pane .chrome .info .pub { color:var(--accent); }
  /* The branch carries its own hue because it is the field a glance is looking
     for when several panes sit in worktrees of the same repository — where the
     paths differ by one segment and the branch is the whole distinction. Capped
     rather than shrinkable: a generated worktree slug can run to 60 characters,
     and past ~24 it stops being an identifier you read and starts eating the
     row.
       Bold on top of the hue, at the same 600 the row gives its other emphasised
     runs ("exited", the mode badge): colour alone separates the branch from its
     neighbours, but weight is what makes it the field the eye lands on first
     when it sweeps a wall of near-identical headers. It survives .pane.dead's
     font-weight:400 for the same reason the hue does — this rule follows it and
     wins the specificity tie — so a dead pane still says which branch died on.
  */
  .pane .chrome .info .branch { color:var(--branch); font-weight:600;
    max-width:24ch; overflow:hidden; text-overflow:ellipsis; }
  /* A detached HEAD ("@a1b2c3d") is drawn as the warning it is: a commit made
     there belongs to no branch, and the header is the only place that says so. */
  .pane .chrome .info .branch.detached { color:var(--warn); }
  /* The host badge: which machine this pane's terminal is actually running on.
     Drawn only while the session spans more than one cathost (renderChrome asks
     the roster first), because with one the answer is the same for every pane in
     every workspace and would be a word of pure noise on every header. It sits
     right after the handle — before the title and the path — because it is the
     outermost coordinate of the pair "which box, then where on it", and because
     a path only means something once you know whose filesystem it is on.
     Muted, not hued: it qualifies the identity rather than competing with it,
     and it goes red the moment its host drops, which is the one time a header
     needs to explain why the pane stopped moving. */
  .pane .chrome .info .host { color:var(--muted); max-width:16ch;
    overflow:hidden; text-overflow:ellipsis; }
  .pane .chrome .info .host.off { color:var(--err); }
  .pane .chrome .info .agent { color:var(--warn); }
  .pane .chrome .info .exited { color:var(--err); font-weight:600; }
  /* Pane-scoped mode chips (copy mode, zoom) ride the header of the pane they
     describe — the tab-row status area only keeps the app-global affordances. */
  .pane .chrome .info .mode { color:var(--warn); font-weight:600; }
  /* Copy mode's key hints are the one long run that is neither a name nor a
     path: in a narrow pane it gives way from the right, since the bindings are
     listed in decreasing order of how often they're needed. */
  .pane .chrome .info .hint { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .pane .chrome .zoom { flex:none; color:var(--accent); cursor:pointer; padding:0 6px; }
  .pane .chrome .ctl { display:flex; gap:1px; flex:none; }
  .pane .chrome .ctl button { background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:17px; font-weight:600; line-height:1; padding:0 6px; border-radius:3px;
    font-family:inherit; }
  .pane .chrome .ctl button:hover { background:var(--hover); color:var(--fg-bright); }
  .pane.focused .chrome .ctl button { color:var(--chrome-fg-dim); }
  .pane .chrome .ctl button.close:hover { background:var(--err); color:var(--fg-bright); }
  .pane canvas { position:absolute; display:block; }
  .pane.focused canvas { outline:1px solid var(--accent-dim); outline-offset:-1px; }

  /* ---- Workspace toolbar ----
     The app-global affordances — palette, plugins, and the ⚙ menu — pinned at
     the right end of the tab row so the panes keep the full height below the
     tabs. The pane-scoped indicators that used to share the row (ZOOM chip,
     copy-mode bar) ride the header of the pane they describe instead: a global
     bar naming one pane's mode read as the app's.

     Every item is the same full-height hit target divided from its neighbour by
     a hairline rule, so the row reads as a row of controls rather than one run
     of small grey text. The gear keeps the far-right slot it has always had. */
  #statusbar { flex:none; display:flex; align-items:stretch;
    font-size:12px; color:var(--muted); border-left:1px solid var(--line); }
  #statusbar .tbtn { display:flex; align-items:center; gap:6px; padding:0 12px;
    cursor:pointer; white-space:nowrap; border-left:1px solid var(--line); }
  #statusbar .tbtn:first-child { border-left:none; }
  #statusbar .tbtn:hover { background:var(--hover); color:var(--fg-bright); }
  /* The leading glyph of a labelled item (⌘K, the plugin mark) carries the
     accent so the eye lands on it before reading the word beside it. */
  #statusbar .tbtn .tmk { color:var(--accent); }
  #statusbar .tbtn:hover .tmk { color:var(--fg-bright); }

  /* ---- Chat panel (the ACP side panel) ----
     A fourth grid column, not a pane: chat lives beside the terminal grid the
     way the sidebar does, so it stays visible while the agent works and never
     participates in the BSP layout. Closed = display:none + a 0px column, so
     the pane grid math is untouched until the panel actually opens. */
  #chat { background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-width:0; overflow:hidden; }
  body:not(.chat-open) #chat { display:none; }
  #chat-head { flex:none; display:flex; align-items:baseline; gap:8px; padding:9px 10px;
    border-bottom:1px solid var(--line); color:var(--fg-strong); font-size:12px; font-weight:600; }
  #chat-status { margin-left:auto; color:var(--muted); font-weight:400; font-size:10px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #chat-log { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column;
    gap:7px; font-size:12px; line-height:1.45; }
  .crow { white-space:pre-wrap; overflow-wrap:anywhere; }
  .crow.user { color:var(--fg-strong); }
  .crow.user::before { content:"❯ "; color:var(--accent); }
  .crow.tool { color:var(--muted); font-size:11px; }
  .crow.info { color:var(--muted); font-style:italic; }
  .crow .cstat { color:var(--muted); }
  .cbtn { font:inherit; font-size:11px; background:var(--panel2); color:var(--fg-soft);
    border:1px solid var(--line); border-radius:4px; padding:2px 9px; cursor:pointer; }
  .cbtn:hover { color:var(--fg-bright); border-color:var(--accent); }
  .cbtn.allow { border-color:var(--accent); color:var(--accent); }
  .cbtn.allow:hover { background:var(--accent); color:var(--accent-fg); }
  /* Permission prompts are transcript entries, not modals: several can be
     open at once and any connected client may answer. */
  .cperm { border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:5px; padding:6px 9px; }
  .cperm .ctitle { color:var(--fg-strong); margin-bottom:6px; }
  .cperm .copts { display:flex; gap:6px; flex-wrap:wrap; }
  .cperm .verdict { color:var(--muted); font-style:italic; }
  #chat-compose { flex:none; display:flex; gap:6px; padding:9px 10px;
    border-top:1px solid var(--line); align-items:stretch; }
  #chat-input { flex:1; resize:none; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:5px; padding:6px 8px; font:inherit;
    font-size:12px; min-height:36px; }
  #chat-input:focus { outline:none; border-color:var(--accent); }
  #chat-ctl { display:flex; flex-direction:column; gap:4px; justify-content:flex-end; }
  #chat-ctl .cbtn:disabled { opacity:.35; cursor:default; }
  #chat-ctl .cbtn:disabled:hover { color:var(--fg-soft); border-color:var(--line); }
  /* Attention dot, same idea as the gear's update badge: something happened
     (a permission prompt, a dead agent) while the panel was closed. */
  #chatbtn { position:relative; }
  #chatbtn.badge::after { content:""; position:absolute; top:6px; right:5px; width:6px;
    height:6px; border-radius:50%; background:var(--accent); }

  /* ---- Toasts ---- */
  #toasts { position:fixed; right:10px; top:38px; display:flex; flex-direction:column; gap:6px; z-index:6; }
  .toast { background:var(--panel2); color:var(--fg-strong); border:1px solid var(--line); border-left:3px solid var(--accent);
    padding:6px 10px; border-radius:5px; font-size:12px; max-width:340px; box-shadow:0 2px 8px rgba(0,0,0,.4);
    opacity:0; transform:translateX(8px); transition:opacity .2s, transform .2s; }
  .toast.show { opacity:1; transform:none; }
  /* An actionable toast is taller and stays put, so it gets a little more room
     than a four-second status line needs. */
  .toast-actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  .toast-btn { background:var(--panel); color:var(--fg-strong); border:1px solid var(--line);
    border-radius:4px; padding:3px 9px; font-size:11px; font-family:inherit; cursor:pointer; }
  .toast-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .toast-btn:disabled { opacity:.45; cursor:default; }
  .toast-btn.toast-dismiss { margin-left:auto; border-style:dashed; }

  /* ---- Split resize handles (WS8) ---- */
  .split { position:absolute; z-index:4; }
  .split.h { cursor:col-resize; }
  .split.v { cursor:row-resize; }
  .split::after { content:""; position:absolute; inset:0; margin:auto; background:transparent; transition:background .1s; }
  .split.h::after { width:2px; }
  .split.v::after { height:2px; }
  .split:hover::after, .split.dragging::after { background:var(--accent); }

  /* ---- Overlays: dialogs / palette / help (WS8) ---- */
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:8;
    display:flex; align-items:flex-start; justify-content:center; }
  .modal { background:var(--panel2); border:1px solid var(--line); border-radius:8px; margin-top:12vh;
    min-width:360px; max-width:640px; box-shadow:0 8px 30px rgba(0,0,0,.5); font-size:13px; }
  .modal header { padding:10px 14px; font-weight:600; color:var(--fg-strong); border-bottom:1px solid var(--line); font-size:12px; }
  .modal .body { padding:12px 14px; }
  .modal .body p { margin:0 0 10px; color:var(--fg); line-height:1.45; }
  /* A choice field is styled as its text sibling, so a dialog that mixes the two
     (new workspace: name, start path, plugin) reads as one column of fields
     rather than two controls that happen to be stacked. appearance:none drops
     the platform chrome for the same reason; the ▾ is drawn back on by the rule
     below, since a select with no affordance at all reads as a disabled input. */
  .modal input[type=text], .modal select { width:100%; box-sizing:border-box; background:var(--bg); color:var(--fg);
    border:1px solid var(--line); border-radius:5px; padding:6px 8px; font:inherit; outline:none; }
  .modal input[type=text]:focus, .modal select:focus { border-color:var(--accent); }
  .modal select { appearance:none; cursor:pointer; padding-right:24px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-size:5px 5px,5px 5px; background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%;
    background-repeat:no-repeat; }
  .modal .field + .field { margin-top:10px; } /* multi-field dialogs (new workspace) */
  .modal .field label { display:block; color:var(--muted); font-size:11px; margin-bottom:4px; }
  .modal .hint { color:var(--muted); font-size:11px; margin-top:8px; }
  .modal .btns { display:flex; gap:8px; justify-content:flex-end; padding:10px 14px; border-top:1px solid var(--line); }
  .modal .btns button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:5px;
    padding:5px 12px; font:inherit; font-size:12px; cursor:pointer; }
  .modal .btns button:hover { border-color:var(--accent); color:var(--fg-bright); }
  .modal .btns button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:600; }
  .modal .btns button.danger { background:var(--err); border-color:var(--err); color:var(--fg-bright); }

  /* ---- Context menu (WS8) ---- */
  #ctxmenu { position:fixed; z-index:9; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    min-width:190px; padding:4px; box-shadow:0 6px 24px rgba(0,0,0,.5); font-size:12px; }
  #ctxmenu .item { padding:5px 10px; border-radius:4px; cursor:pointer; display:flex; gap:8px;
    align-items:center; white-space:nowrap; }
  #ctxmenu .item:hover { background:var(--chrome-focus); color:var(--fg-bright); }
  #ctxmenu .item.danger:hover { background:var(--err); }
  #ctxmenu .sep { height:1px; background:var(--line); margin:4px 6px; }
  /* A row that opens a submenu (the host pickers, drawn only in a multi-host
     session): the arrow is pushed to the right edge so the row still reads as
     one label, and the child menu is an ordinary #ctxmenu positioned beside it. */
  #ctxmenu .item.sub::after { content:"▸"; margin-left:auto; color:var(--muted); }
  #ctxmenu .item.sub:hover::after { color:var(--fg-bright); }

  /* ---- Pane-list hover tooltip ----
     The sidebar pane rows truncate title/agent to fit their narrow column, so
     the full details are only reachable on hover. This styled popup mirrors the
     ctxmenu look (panel2 surface, drop shadow) but lays its fields out as a
     two-column label/value grid for scannability. It is a single reused element
     (see #panetip in JS), positioned fixed and clamped into the viewport. */
  #panetip { position:fixed; z-index:11; background:var(--panel2); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; box-shadow:0 6px 24px rgba(0,0,0,.5); font-size:12px;
    max-width:340px; pointer-events:none; display:none; }
  #panetip.show { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; align-items:baseline; }
  #panetip .k { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
  #panetip .v { color:var(--fg); word-break:break-word; }
  #panetip .v.pub { color:var(--accent); }
  #panetip .v.mono { font-family:inherit; }
  #panetip .v.exited { color:var(--err); }
  #panetip .v.ok { color:var(--ok); }
  #panetip .v.err { color:var(--err); }

  /* ---- Palette / navigator (WS8) ---- */
  .modal.pal { width:520px; margin-top:9vh; }
  .pal .query { padding:10px 12px; border-bottom:1px solid var(--line); }
  .pal .list { max-height:44vh; overflow-y:auto; padding:4px; }
  .pal .row { display:flex; align-items:baseline; gap:8px; padding:5px 10px; border-radius:4px; cursor:pointer; }
  .pal .row.sel, .pal .row:hover { background:var(--chrome-focus); }
  .pal .row .kind { flex:none; width:52px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  .pal .row .lbl { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .pal .row .meta { margin-left:auto; color:var(--muted); font-size:11px; flex:none; }
  .pal .empty { padding:10px 12px; color:var(--muted); font-style:italic; }

  /* ---- Plugins dialog ----
     Reuses the palette list chrome, but rows are inert info lines whose
     affordances are the per-row action buttons (run / update / uninstall) —
     smaller than the footer .btns so a row stays one compact line. */
  .modal.plugins { width:620px; } /* room for id + version + name before the three buttons */
  .modal.plugins .row { cursor:default; }
  /* The status tag only renders when there is a status (linked/broken), so it
     hugs its text instead of reserving the palette's 52px kind slot — which,
     for the common installed case, was 52px of nothing pushing the label into
     truncation. */
  .modal.plugins .row .kind { width:auto; }
  /* The linked-checkout path. Shrinks before the label does (flex 0 1 auto with
     min-width:0) so a deep path truncates instead of pushing the buttons off. */
  .pal .row .sub { color:var(--muted); font-size:11px; flex:0 1 auto; min-width:0;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .pal .row .acts { margin-left:auto; display:flex; gap:4px; flex:none; }
  .pal .row .acts button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:4px; padding:1px 8px; font:inherit; font-size:11px; cursor:pointer; }
  .pal .row .acts button:hover { border-color:var(--accent); color:var(--fg-bright); }
  .pal .row .acts button.danger:hover { border-color:var(--err); background:var(--err); }

  /* ---- Help modal (WS8) ---- */
  .modal.help { max-width:720px; width:680px; }
  .help .body { max-height:60vh; overflow-y:auto; }
  .helpcols { display:grid; grid-template-columns:1fr 1fr; gap:0 28px; }
  .help h3 { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:12px 0 6px; }
  .help table { border-collapse:collapse; width:100%; }
  .help td { padding:2px 0; font-size:12px; vertical-align:top; }
  .help td:first-child { width:46%; color:var(--muted); }
  .key { background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:0 5px;
    font-size:11px; display:inline-block; margin:1px 2px 1px 0; }

  /* ---- Update banner (WS8) ---- */
  #banner { display:none; position:fixed; top:0; left:var(--sidebar-w); right:0; z-index:7; background:var(--chrome-focus);
    color:var(--fg-strong); font-size:12px; padding:6px 12px; align-items:center; gap:10px;
    border-bottom:1px solid var(--accent); }
  #banner.show { display:flex; }
  #banner .x { margin-left:auto; cursor:pointer; color:var(--muted); }
  #banner .x:hover { color:var(--err); }
  /* Link failures took over the banner when the status bar's conn label went
     away — red border/text so a dropped socket still announces itself. */
  #banner.linkerr { background:var(--err-bg); border-bottom-color:var(--err); color:var(--err-fg); }

  /* ---- Toolbar item extras (WS8) ----
     The gear is the one icon-only item, so it sizes its glyph up and drops the
     label gap; its pending-update dot hangs off the glyph itself (the .g span)
     rather than off the padded hit target, which would float it out in the
     whitespace between the gear and the panel edge. */
  #gear { font-size:16px; padding:0 11px; }
  #gear .g { position:relative; display:inline-block; line-height:1; }
  #gear.badge .g::after { content:""; position:absolute; top:-1px; right:-4px; width:6px; height:6px;
    border-radius:50%; background:var(--accent); }

  /* ---- Drag-reorder (tabs + workspaces) ---- */
  .dropbar { position:absolute; background:var(--accent); z-index:5; pointer-events:none; border-radius:1px; }
  .dropbar.h { top:3px; bottom:3px; width:2px; }
  .dropbar.v { left:4px; right:4px; height:2px; }
  #tabbar .tab.dragging, #ws-list li.ws.dragging { opacity:.4; }
  body.grabbing, body.grabbing * { cursor:grabbing !important; }

  /* ---- Settings modal + worktree dialogs (WS8 chrome) ---- */
  .modal .errline { color:var(--err); font-size:11px; margin-top:8px; min-height:14px; }
  .modal.settings { width:560px; }
  .settings .body { max-height:62vh; overflow-y:auto; }
  .settings h3 { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:14px 0 6px; }
  .settings h3:first-child { margin-top:0; }
  .settings .row { display:flex; align-items:center; gap:8px; margin:3px 0; }
  .settings .row label { flex:none; width:110px; color:var(--muted); font-size:12px; }
  .settings .row input[type=text] { flex:1; }
  .settings .row input[type=color] { flex:none; width:30px; height:22px; padding:0 2px;
    background:var(--bg); border:1px solid var(--line); border-radius:4px; cursor:pointer; }
  .settings .row .ro { font-size:12px; color:var(--fg); overflow:hidden; text-overflow:ellipsis; }
  /* Theme picker + the row-level actions beside it (delete / save theme). */
  .settings .row select { flex:1; background:var(--bg); color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:5px 8px; font:inherit; font-size:12px; outline:none; }
  .settings .row select:focus { border-color:var(--accent); }
  .settings .row button { flex:none; background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:4px; padding:4px 10px; font:inherit; font-size:11px; cursor:pointer; }
  .settings .row button:hover { border-color:var(--accent); color:var(--fg-bright); }

  /* ---- Path picker (the new-workspace start path) ----
     A list that lives inside the field's own block rather than floating over the
     dialog: the dialog is short, and a popup that covers the buttons while you
     are still choosing a directory is worse than one that pushes them down. */
  .picker { display:none; margin-top:4px; border:1px solid var(--line); border-radius:5px;
    background:var(--bg); max-height:336px; overflow-y:auto; padding:3px; }
  .field.pick.focus .picker { display:block; }
  /* The directory being listed. Deliberately not uppercased like the other
     column headings in this UI — it is a path, and a path is not a label. */
  .picker .head { padding:3px 7px; color:var(--muted); font-size:11px;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .picker .row { display:flex; align-items:baseline; gap:8px; padding:3px 7px; border-radius:4px; cursor:pointer; }
  .picker .row.sel, .picker .row:hover { background:var(--chrome-focus); }
  .picker .row .kind { flex:none; width:44px; color:var(--muted); font-size:10px;
    text-transform:uppercase; letter-spacing:.5px; }
  .picker .row .lbl { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .picker .note { padding:3px 7px; color:var(--muted); font-size:11px; font-style:italic; }
  .picker .note.err { color:var(--err); font-style:normal; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="brand"><!--
      Mark 06 of the logo exploration: a big cat's head, front on, drawn as one
      unbroken outline with two eye slits and nothing else. It replaced mark 10,
      which carried a chevron eye, a muzzle and cheek lines that all fell below
      one pixel once the mark was shrunk. Both are the same hairline weight;
      this one simply has less to lose.

      This artwork is TRACED from the reference drawing, not drawn by hand, and
      the path data below is machine-generated: each stroke of the original is a
      closed filled ribbon, which is why this is one even-odd path rather than a
      set of stroked outlines. Do not hand-edit the numbers. Regenerate with

          cd scripts/icon/gen-trace && go run .

      and paste the path from the trace-compact.svg it writes. That file is the
      same trace simplified for small sizes: at the 19px this renders at, a full
      source pixel of deviation is a sixth of a screen pixel, so the reduction
      is invisible here and saves ~25KB in a file that ships whole.

      It fills with currentColor, which the CSS above points at the theme's
      accent, so the mark follows a live theme switch along with everything else
      in the sidebar. The app icon cannot do that and bakes the default theme's
      accent in instead; see scripts/icon/gen-trace.

      Two attributes here are tuning, not trace output, and both are here rather
      than on the <path> so the machine-generated d= stays the only thing a
      regeneration has to replace. Stroke properties are inherited, so hanging
      them on the <svg> reaches the path just the same.

        preserveAspectRatio="none"  breaks the aspect on purpose. The CSS box is
          19x16 against a 130.77x133.93 viewBox, so the glyph is stretched ~2%
          wider and squashed ~16% shorter than it was drawn. Without this it
          would letterbox — scale to the box's height and centre — and the
          shorter box would just make a smaller square mark.

        stroke-width="3.6"  thickens the lines. This artwork has no strokes: the
          "lines" are closed filled ribbons about 3.2 units wide, so a stroke on
          the same path is what widens them — half a stroke-width steps outward
          off the outer contour and half steps inward off the inner one, so the
          ribbon grows by the full 3.6 units, to 6.8. That matters because the
          squash thins the horizontal runs (they scale with the height, which
          shrank at 19x16): unstroked, the ribbon renders 0.44px wide there,
          well under one device pixel on a 2x display, which is why the mark
          read as a faint hairline rather than as accent-colored ink. With this
          stroke the horizontal runs are ~0.93px and the vertical ~1.14px, or
          1.87 and 2.27 device px on a 2x panel — both clear of the one-device-
          pixel floor, which is the whole point of the weight. (Those are css px
          at --sb-scale 1.15, the default; every length here scales with it.)

          Round joins are not cosmetic: the trace is hundreds of near-collinear
          segments and a miter join on any of them throws a spike once there is
          a stroke to miter.

          Two ceilings, both measured on the shipping path rather than guessed
          (rasterise it and sweep the width — the eyes in particular are not
          predictable from the path data):

                   overflow:visible note in the CSS above, which is what keeps
                   the overhang from being clipped flat.
            ~4.8u  the eye slits' counters close and the cat goes blind. Each
                   slit is a ribbon like everything else, so the stroke eats
                   its hole from both sides at once — the counters lose a full
                   stroke-width of width, and at 3.6 they are down to about a
                   third of the open area they have unstroked. That is still
                   legible at 19x16 on a 2x panel, checked by magnifying the
                   real device pixels, but it is the reason this is the last

      The viewBox is cropped tight to the ink; the baseline nudge in the CSS
      above is derived from that crop AND from the stroke above, so all three
      move together.
