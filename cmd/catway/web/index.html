    // No focus marker glyph: li.focused's background says it, and a per-row
    // gutter for a mark only one row ever carries indents the whole list.
    const pub = document.createElement("span"); pub.className = "pub"; pub.textContent = paneRef(row.pub, row.pane);
    li.appendChild(pub);
    if (row.title) { const t = document.createElement("span"); t.className = "ttl"; t.textContent = row.title; li.appendChild(t); }
    if (row.agent) {
      const ag = document.createElement("span"); ag.className = "ag " + stClass(row.state); ag.textContent = agentLabel(row.agent, row.model);
      li.appendChild(ag);
    }
    // A row can name a pane in another workspace or tab, which pane.focus cannot
    // reach (it only moves the focus flag inside the current viewport), so those
    // are revealed the way the agents list reveals its own: agent.focus.
    //
    // Activated on the press rather than on a click, since this list is rebuilt
    // on every rollup and pane_title/pane_agent push (pressActivate). The swap
    // drag below needs no suppressing here: it only begins once the pointer has
    // travelled DRAG_SLOP, which is the same distance that stops this from
    // firing, so a press is a reveal or a drag and never both.
    pressActivate(li, () => {
      if (!row.visible) sendCmd("agent.focus", { pane: row.pane });
      else if (!row.focused) sendCmd("pane.focus", { pane: row.pane });
    });
    // The pane header's affordances, mirrored: double-click renames,
    // right-click opens the pane menu, and dragging a row onto a pane on
    // screen swaps the two (beginPaneSwapDrag hit-tests the live pane
    // rects, so a sidebar origin works the same as a header origin). Swapping
    // slots is an active-tab operation (Session.SwapPanes), so only on-screen
    // rows arm the drag — an off-screen row has no slot to trade.
    li.addEventListener("dblclick", () => renamePane(row.pane));
    li.addEventListener("contextmenu", (e) => { e.preventDefault(); openCtx(e.clientX, e.clientY, paneMenuItems(row.pane)); });
    if (row.visible) li.addEventListener("mousedown", (e) => beginPaneSwapDrag(e, row.pane));
    // Reveal the untruncated pane details on hover. mousemove keeps the popup
    // riding just right of the pointer; mouseleave tears it down. showPaneTip
    // re-reads live pane state by id, so a re-render between enter and move
    // still shows the current title/agent/state.
    li.addEventListener("mouseenter", (e) => showPaneTip(e, row));
    li.addEventListener("mousemove", (e) => showPaneTip(e, row));
    li.addEventListener("mouseleave", hideTip);
    return li;
  }

  // The Panes heading's own controls: fold or unfold every workspace group at
  // once. They act on the groups the last render drew, so a workspace that no
  // longer has panes doesn't linger in the collapsed set.
  //
  // The "more workspaces…" shelf moves with them. ⊞ means "show me everything in
  // this section", and a shelf still holding half the session's workspaces shut
  // would make that a lie; ⊟ means the reverse, and leaving the shelf hanging
  // open over a list of folded headers is the same lie the other way round.
  (function initPaneHeadingCtl() {
    const el = document.getElementById("pane-hctl");
    el.appendChild(mkBtn("⊞", "expand all workspaces", "", () => {
      paneCollapsed.clear(); savePaneCollapsed();
      paneMoreOpen = true; savePaneMoreOpen();
      renderPaneList();
    }));
    el.appendChild(mkBtn("⊟", "collapse all workspaces", "", () => {
      paneCollapsed = new Set(paneGroupIDs); savePaneCollapsed();
      paneMoreOpen = false; savePaneMoreOpen();
      renderPaneList();
    }));
    initSectionFold("sec-panes", "pane-hctl", "panes");
  })();

  // refreshPaneList redraws the section now from what the browser already knows,
  // then re-queries pane.list for the parts only the server has (off-screen
  // titles, panes that appeared or closed elsewhere). Every caller is a push that
  // could have changed the inventory; the query is debounced and single-flight, so
  // a burst of them costs one round trip plus at most one follow-up.
  //
  // The workspace rows ride along: their todo marks read the same inventory, so
  // a manager opening or closing has to reach both sections at once.
  function refreshPaneList() {
    renderInventoryViews();
    if (paneInvBusy) { paneInvAgain = true; return; }
    if (paneInvWait) return;
    paneInvWait = setTimeout(() => {
      paneInvWait = null; paneInvBusy = true;
      sendCmdAwait("pane.list", {}, (res) => {
        paneInvBusy = false;
        if (res.ok && res.data) { paneInv = res.data.panes || []; renderInventoryViews(); }
        if (paneInvAgain) { paneInvAgain = false; refreshPaneList(); }
      });
    }, 120);
  }

  // The two views the pane inventory feeds: the Panes section, and the todo marks
  // on the Workspaces rows above it.
  //
  // Coalesced to one frame, because the callers arrive in bursts. Switching tab
  // lands a layout, an agents rollup, and then pane_title/pane_agent/pane_exited
  // for every pane that just came into view — each of which asks for these views.
  // Both are full wipe-and-rebuilds over the whole session's inventory, so
  // rebuilding per message made a switch cost O(panes in tab × panes in session)
  // to paint the last one anyway. The 120ms query debounce below never covered
  // this; it guards only the round trip.
  let invFrame = 0;
  function renderInventoryViews() {
    if (invFrame) return;
    invFrame = requestAnimationFrame(() => { invFrame = 0; renderInventoryViewsNow(); });
  }
  function renderInventoryViewsNow() {
    renderPaneList();
    if (layoutMsg) renderWorkspaces(layoutMsg);
  }

  // ---- Hover card ----
  // A single reused element (cheaper than per-row popups, and only ever one is
  // visible), shared by every hover target. Callers pass [label, value, valueCls]
  // rows; empty values drop out, so a caller can list optional fields flatly.
  const paneTipEl = document.createElement("div");
  paneTipEl.id = "panetip";
  document.body.appendChild(paneTipEl);

  function showTip(e, items) {
    paneTipEl.innerHTML = "";
    for (const [k, v, vcls] of items) {
      if (v === undefined || v === null || v === "") continue;
      const kk = document.createElement("span"); kk.className = "k"; kk.textContent = k;
      const vv = document.createElement("span"); vv.className = "v" + (vcls ? " " + vcls : ""); vv.textContent = v;
      paneTipEl.appendChild(kk); paneTipEl.appendChild(vv);
    }
    // Position the popup to the right of the cursor, clamped into the viewport
    // (measured after making it visible so its size is known).
    paneTipEl.classList.add("show");
    const r = paneTipEl.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 8;
    if (x + r.width > window.innerWidth - 4) x = e.clientX - r.width - 8;
    if (y + r.height > window.innerHeight - 4) y = window.innerHeight - r.height - 4;
    paneTipEl.style.left = Math.max(4, x) + "px";
    paneTipEl.style.top = Math.max(4, y) + "px";
  }

  function hideTip() { paneTipEl.classList.remove("show"); }

  // Pane-list rows truncate title/agent to fit their narrow column, so the full
  // details are only reachable on hover. Rebuilt on each show since the
  // underlying pane state is live. row is a renderPaneList row — the merged view
  // of one pane, on screen or not; the fields only the viewport has (model, exit
  // code, grid size) come from local pane state and are simply absent for a pane
  // sitting in another tab.
  function showPaneTip(e, row) {
    const p = row.visible ? panes.get(row.pane) : null;
    const items = [["Pane", paneRef(row.pub, row.pane), "pub"]];
    items.push(["Title", row.title]);
    items.push(["Dir", row.cwd, "mono"]);
    if (row.agent) items.push(["Agent", row.agent + " · " + (row.state || "unknown")]);
    // The LLM the agent is running under — with the reasoning effort it last ran
    // at appended, when the transcript named one — read from that transcript
    // server-side (agentmodel.go), already one display string. Only claude
    // reports one, and only once it has answered.
    // Off-screen panes get it from the pane.list snapshot, same as their agent.
    if (row.model) items.push(["Model", row.model]);
    if (p && p.exited !== null && p.exited !== undefined) items.push(["Exited", "code " + p.exited, "exited"]);
    items.push(["Focus", row.visible ? (row.focused ? "focused" : "") : "off screen"]);
    // Geometry + link state, relocated here from the status bar: the pane's own
    // terminal grid (from its last frame, falling back to the layout's inner
    // rect before the first frame lands) and then the window grid it sits in.
    const inner = (p && p.info && p.info.inner) || [0, 0, 0, 0];
    const gw = p ? (p.W || inner[2]) : 0, gh = p ? (p.H || inner[3]) : 0;
    if (gw && gh) items.push(["Size", gw + "×" + gh + " cells"]);
    if (cols && rows) items.push(["Window", cols + "×" + rows + " cells"]);
    items.push(["Link", connState.text, connState.err ? "err" : "ok"]);
    showTip(e, items);
  }

  // ---- Build badge ----
  // The short git hash of the commit this catway was built from, stamped at link
  // time and served as window.__catsBuild (see internal/buildinfo + page.go). It
  // sits beside the brand because the common confusion is a stale install — an
  // app bundle still carrying an older catway — and the hash names the build at a
  // glance; hovering expands it to the commit's subject line.
  (function initBuildBadge() {
    const b = window.__catsBuild;
    if (!b || !b.hash) return; // built outside a checkout — no badge
    const el = document.createElement("small");
    el.className = "hash";
    el.textContent = b.hash + (b.dirty ? "*" : "");
    const items = [
      ["Build", b.hash + (b.dirty ? " · modified tree" : "")],
      ["Commit", b.subject],
    ];
    el.addEventListener("mouseenter", (e) => showTip(e, items));
    el.addEventListener("mousemove", (e) => showTip(e, items));
    el.addEventListener("mouseleave", hideTip);
    document.getElementById("brand").appendChild(el);
  })();

  function renderTabbar(msg) {
    tabbarEl.innerHTML = "";
    const attention = tabAttention();
    for (const t of msg.tabs) {
      const el = document.createElement("div");
      el.className = "tab" + (t.active ? " active" : "");
      const label = document.createElement("span");
      label.className = "tname";
      label.textContent = t.name + (t.zoomed ? " ⤢" : "");
      el.appendChild(label);
      const mark = tabMarker(attention.get(t.num));
      if (mark) el.appendChild(mark);
      el.addEventListener("dblclick", () => renameTab(t));
      el.addEventListener("contextmenu", (e) => { e.preventDefault(); openCtx(e.clientX, e.clientY, tabMenuItems(t, msg.tabs.length)); });
      // Focus rides the drag helper's mouseup for the same reason the workspace
      // rows do — the tab bar is rebuilt on every agents rollup (its attention
      // markers derive from one), so a "click" listener loses the press that a
      // rebuild interrupts. The early return keeps the close button from both
      // dragging and focusing — the tab's focus now hangs off the same guard
      // its drag does, rather than off the button's stopPropagation.
      el.addEventListener("mousedown", (e) => {
        if (e.target.classList.contains("x")) return; // the close button is not a drag handle
        beginReorderDrag(e, {
          el, container: tabbarEl, itemSel: ".tab:not(.add)", horizontal: true,
          onDrop: (gap) => sendCmd("tab.move", { num: t.num, index: gap }),
          onClick: () => { if (!t.active) sendCmd("tab.focus", { num: t.num }); },
        });
      });
      if (msg.tabs.length > 1) {
        const x = document.createElement("span");
        x.className = "x"; x.textContent = "✕"; x.title = "close tab";
        // On the press like everything else in this bar; the mousedown above
        // already keeps a press here from arming the tab's drag, and the tab's
        // own activation now hangs off that same guard rather than off this
        // handler's propagation.
        pressActivate(x, () => sendCmd("tab.close", { num: t.num }));
        el.appendChild(x);
      }
      tabbarEl.appendChild(el);
    }
    const add = document.createElement("div");
    add.className = "tab add"; add.textContent = "+"; add.title = "new tab";
    pressActivate(add, () => sendCmd("tab.create", {})); // rebuilt with the tabs beside it
    tabbarEl.appendChild(add);
    // Overflow: keep the active tab in view when the bar scrolls horizontally.
    const act = tabbarEl.querySelector(".tab.active");
    if (act && act.scrollIntoView) act.scrollIntoView({ inline: "nearest", block: "nearest" });
  }
  // A vertical wheel over the tab bar scrolls it horizontally (overflow).
  tabbarEl.addEventListener("wheel", (e) => {
    if (!e.deltaY) return;
    e.preventDefault();
    tabbarEl.scrollLeft += e.deltaY;
  }, { passive: false });

  // ---- Sidebar activation: presses, not clicks -------------------------------
  //
  // Every list in this sidebar is rebuilt wholesale — renderWorkspaces,
  // renderTabbar, renderPaneList and renderAgents each wipe their container and
  // re-create every child — and all four run off the agents rollup, which the
  // server broadcasts on each agent state transition. A busy session therefore
  // repaints these lists several times a second, while a mouse press is held for
  // ~100ms.
  //
  // That is a lost click. The browser dispatches "click" on the nearest common
  // ancestor of the mousedown and mouseup targets, so when a rebuild lands
  // mid-press the old row takes the mousedown, its replacement takes the mouseup,
  // and the click surfaces on the <ul> — where nothing is listening. The row does
  // nothing and the press looks ignored, most often exactly when the session is
  // busy enough for the user to want to switch away from it.
  //
  //   mousedown ──► row A ──┐
  //                          ├── rebuild ──► click lands on <ul>  (dropped)
  //   mouseup   ──► row A' ─┘
  //
  // So activation hangs off the press itself: mousedown remembers where it began
  // and a window-level mouseup — registered on the window, closing over the row's
  // own identity — decides what it meant. Neither the listener nor the closure
  // cares whether the element still exists, so the rebuild is irrelevant.
  //
  // DRAG_SLOP is what separates the two readings of a press. Under it, the press
  // is an activation; at or over it, the rows that can be dragged read it as the
  // start of a drag instead. One number for both so the two can never both claim
  // the same press — which is what makes a drag's own release safe to ignore here
  // without any suppression flag.
  const DRAG_SLOP = 4;

  // pressActivate: fn runs when a press on el is released without travelling
  // DRAG_SLOP. For rows that also drag, pass onClick to the drag helper instead —
  // it already tracks the same threshold.
  //
  // The mouseup listener unregisters itself, so no press leaves one behind (a
  // window listener outlives the element that armed it — see the pane selection
  // note below for what that leak cost when it was permanent).
  function pressActivate(el, fn) {
    el.addEventListener("mousedown", (ev) => {
      if (ev.button !== 0) return; // right-click belongs to the context menu
      const sx = ev.clientX, sy = ev.clientY;
      const up = (e) => {
        window.removeEventListener("mouseup", up);
        if (Math.abs(e.clientX - sx) >= DRAG_SLOP || Math.abs(e.clientY - sy) >= DRAG_SLOP) return;
        fn(e);
      };
      window.addEventListener("mouseup", up);
    });
  }

  // ---- Drag-reorder (WS8): tabs (horizontal) + workspaces (vertical) ----
  //
  // Same shape as beginBorderDrag: mousedown arms a potential drag with
  // window-level move/up listeners, and only DRAG_SLOP of travel makes it one —
  // a plain press stays an activation (focus). While dragging, the pointer maps
  // to an insertion gap (0..=len, the tab.move / workspace.move convention)
  // shown as a 2px accent bar; drop sends the move and the server's layout
  // rebroadcast re-renders both lists (the server is the source of truth).
  //
  // A press that never became a drag calls cfg.onClick from the same
  // window-level mouseup, for the reason pressActivate exists: these rows are
  // rebuilt under the pointer, and a "click" listener on them loses any press a
  // rebuild interrupts. Rows that can drag take their activation here rather
  // than through pressActivate, so a press is read exactly once.
  //
  // This is also what retired dragConsumedClick, the flag that used to suppress
  // the click trailing a completed drag: with both readings measured against the
  // one threshold, a drag's release can no longer reach an activation to
  // suppress. Drags that end on a foreign target — beginPaneSwapDrag's drop onto
  // a pane — act on that target directly and never went through a click either.
  function beginReorderDrag(ev, cfg) {
    if (ev.button !== 0) return;
    // A press that may become a drag must not also start a text selection: the
    // browser would paint its selection highlight across the tab name (or the
    // workspace row) the whole way, on top of the .dragging + drop-bar cues
    // that are the actual feedback. Nothing in this chrome is prose worth
    // selecting, and the terminal draws its own selection on the canvas, so
    // the default gains nothing here. beginBorderDrag does the same.
    ev.preventDefault();
    const sx = ev.clientX, sy = ev.clientY;
    let dragging = false, bar = null, gap = -1;
    const items = () => Array.from(cfg.container.querySelectorAll(cfg.itemSel));
    const move = (e) => {
      if (!dragging) {
        if (Math.abs(e.clientX - sx) < DRAG_SLOP && Math.abs(e.clientY - sy) < DRAG_SLOP) return;
        dragging = true;
        cfg.el.classList.add("dragging");
        document.body.classList.add("grabbing");
        bar = document.createElement("div");
        bar.className = "dropbar " + (cfg.horizontal ? "h" : "v");
      }
      // A mid-drag re-render replaces the container's children (and drops the
      // bar); re-query and re-attach every move so the drag survives it.
      if (!bar.isConnected) cfg.container.appendChild(bar);
      const els = items();
      gap = els.length;
      for (let i = 0; i < els.length; i++) {
        const r = els[i].getBoundingClientRect();
        const mid = cfg.horizontal ? r.left + r.width / 2 : r.top + r.height / 2;
        if ((cfg.horizontal ? e.clientX : e.clientY) < mid) { gap = i; break; }
      }
      const cr = cfg.container.getBoundingClientRect();
      const edge = gap < els.length
        ? els[gap].getBoundingClientRect()[cfg.horizontal ? "left" : "top"]
        : (els.length ? els[els.length - 1].getBoundingClientRect()[cfg.horizontal ? "right" : "bottom"]
                      : (cfg.horizontal ? cr.left : cr.top));
      if (cfg.horizontal) bar.style.left = (edge - cr.left + cfg.container.scrollLeft - 1) + "px";
      else bar.style.top = (edge - cr.top + cfg.container.scrollTop - 1) + "px";
    };
    const up = () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      cfg.el.classList.remove("dragging");
      document.body.classList.remove("grabbing");
      if (bar) bar.remove();
      if (dragging) {
        if (gap >= 0) cfg.onDrop(gap);
      } else if (cfg.onClick) {
        // Under DRAG_SLOP this was a plain press, so it means what a click
        // means. Released anywhere: the pointer travelled at most DRAG_SLOP, so
        // it is still over the row it started on, whatever the DOM did in
        // between.
        cfg.onClick();
      }
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  }

  // ---- Pane drag-reorder: drag a sidebar pane row onto a pane → pane.swap_with.
  // Same shape as beginReorderDrag: mousedown arms a potential drag with a 4px
  // threshold, so a plain press stays a click (focus). While dragging, the
  // pane under the pointer highlights as the drop target; releasing anywhere
  // else cancels. Layout rebroadcasts mid-drag are safe — the hit test reads
  // live pane rects and the listeners live on window.
  function beginPaneSwapDrag(ev, srcId) {
    if (ev.button !== 0) return;
    ev.preventDefault(); // no text selection under the drag (see beginReorderDrag)
    const sx = ev.clientX, sy = ev.clientY;
    let dragging = false, target = null;
    const clearTarget = () => { if (target) { target.el.classList.remove("droptarget"); target = null; } };
    const paneAt = (x, y) => {
      for (const [id, p] of panes) {
        if (id === srcId || !p.info) continue;
        const r = p.el.getBoundingClientRect();
        if (x >= r.left && x < r.right && y >= r.top && y < r.bottom) return p;
      }
      return null;
    };
    const move = (e) => {
      if (!dragging) {
        if (Math.abs(e.clientX - sx) < DRAG_SLOP && Math.abs(e.clientY - sy) < DRAG_SLOP) return;
        dragging = true;
        const src = panes.get(srcId);
        if (src) src.el.classList.add("dragging");
        document.body.classList.add("grabbing");
      }
      const p = paneAt(e.clientX, e.clientY);
      if (p !== target) { clearTarget(); if (p) { target = p; p.el.classList.add("droptarget"); } }
    };
    const up = () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      const src = panes.get(srcId);
      if (src) src.el.classList.remove("dragging");
      document.body.classList.remove("grabbing");
      const tgt = target;
      clearTarget();
      if (dragging && tgt) {
        // No click to suppress: dragging means the pointer passed DRAG_SLOP,
        // which is exactly what stops the row's pressActivate from firing.
        sendCmd("pane.swap_with", { pane: srcId, target: tgt.id });
      }
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  }

  // ---- Usage: what the agents on this machine have spent, and against what ----

  // The server polls every couple of minutes, so the reset countdowns it
  // stamped would sit frozen in between — same problem the agent-age labels
  // have, and the same fix: keep the absolute instant on the element and
  // re-render the label on a tick of our own.
  let usageMsg = null;

  // The section's heading controls: fold or unfold every group at once, how old
  // the reading is, and a way to take a new one. Built here rather than in the
  // markup so the age label lives beside the code that maintains it — and beside
  // the button whose whole purpose is to reset it.
  //
  // Order across the heading: the reading (how old), then the control that
  // renews it, then the fold pair hard against the right edge. The age and its
  // refresh belong together — the button's whole job is to reset the number
  // beside it — so the pair that has nothing to do with either is what moves
  // outboard rather than splitting them. That also puts the fold pair in the one
  // place it is the same distance from every section's edge, which is what lets
  // Usage, Workspaces and Panes each be folded without re-aiming the pointer.
  // Like Panes', these act on the groups the last draw emitted, so a provider
  // that stops reporting doesn't linger in the collapsed set.
  let usageAgeEl = null, usageBtnEl = null, usageBusyTimer = null;
  (function initUsageHeadingCtl() {
    const el = document.getElementById("usage-hctl");
    usageAgeEl = document.createElement("span");
    usageAgeEl.className = "hage";
    el.appendChild(usageAgeEl);
    usageBtnEl = mkBtn("", "read the account's usage now", "uref", refreshUsage);
    usageBtnEl.appendChild(refreshMark());
    el.appendChild(usageBtnEl);
    el.appendChild(mkBtn("⊞", "expand all usage groups", "", () => {
      usageCollapsed.clear(); saveUsageCollapsed(); drawUsage();
    }));
    el.appendChild(mkBtn("⊟", "collapse all usage groups", "", () => {
      usageCollapsed = new Set(usageGroupIDs); saveUsageCollapsed(); drawUsage();
    }));
    initSectionFold("sec-usage", "usage-hctl", "usage");
  })();

  // refreshMark: the circular arrow on the refresh control — an arc most of the
  // way round with a head on the loose end, the two strokes that survive at
  // 12px. Drawn rather than typed because the ⟳ glyph is rendered small for its
  // point size in a monospace face, which no font-size that also fits the
  // heading can fix.
  function refreshMark() {
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("class", "refresh");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.6");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    for (const d of ["M13.7 10A6 6 0 1 1 12.3 3.8L15.3 6.7", // the arc, opening at the top right
                     "M15.3 2.7V6.7H11.3"]) {                 // the head it opens into
      const path = document.createElementNS(SVGNS, "path");
      path.setAttribute("d", d);
      svg.appendChild(path);
    }
    return svg;
  }

  // refreshUsage asks the server to poll now. The reading is NOT the command's
  // reply — the server acks the ask and broadcasts the numbers to every client
  // when the read lands — so the button stays busy until a usage message
  // arrives. Two backstops clear it otherwise: an explicit failure (a server
  // too old to know the command answers with one), and a timer, for a read that
  // hangs long enough that a spinning icon would be a lie.
  function refreshUsage() {
    if (usageBtnEl.classList.contains("busy")) return; // a read is already out
    usageBtnEl.classList.add("busy");
    clearTimeout(usageBusyTimer);
    usageBusyTimer = setTimeout(usageIdle, 20000);
    sendCmdAwait("usage.refresh", null, (res) => {
      if (res.ok) return;
      usageIdle();
      toast("usage: " + (res.error || "refresh failed"));
    });
  }

  function usageIdle() {
    clearTimeout(usageBusyTimer); usageBusyTimer = null;
    usageBtnEl.classList.remove("busy");
  }

  // The heading's age label: how old the numbers in the section are. It reads
  // the message's own stamp rather than when this browser received it, because
  // a page that connects mid-interval is handed the server's STORED reading —
  // fresh to arrive, minutes old to be true.
  function renderUsageAge() {
    const at = usageMsg && usageMsg.read_at ? Date.parse(usageMsg.read_at) : NaN;
    if (Number.isNaN(at)) { usageAgeEl.textContent = ""; usageAgeEl.title = ""; return; }
    usageAgeEl.textContent = fmtAge(Date.now() - at);
    usageAgeEl.title = "read at " + new Date(at).toLocaleTimeString();
  }

  // Coarse time-to-reset, one unit deep, in the same register as fmtAge.
  function fmtUntil(ms) {
    const s = Math.round(ms / 1000);
    if (s <= 0) return "resetting";
    if (s < 60) return "resets in " + s + "s";
    const m = Math.round(s / 60);
    if (m < 60) return "resets in " + m + "m";
    const h = Math.round(m / 60);
    return h < 24 ? "resets in " + h + "h" : "resets in " + Math.round(h / 24) + "d";
  }

  // The same countdown with no sentence around it, for the folded group's chip —
  // "3% (2hrs)" — where the percentage has already said what is being counted and
  // only the horizon is missing. Hours carry the word because hours are the unit
  // a 5-hour window is actually read in, and "2h" beside "3%" scans as another
  // measurement rather than as a clock; below the hour the terse register the
  // rest of the sidebar uses is unambiguous on its own.
  function fmtLeft(ms) {
    const s = Math.round(ms / 1000);
    if (s <= 0) return "resetting";
    if (s < 60) return s + "s";
    const m = Math.round(s / 60);
    if (m < 60) return m + "m";
    const h = Math.round(m / 60);
    if (h < 24) return h + (h === 1 ? "hr" : "hrs");
    const d = Math.round(h / 24);
    return d + "d";
  }

  // The chip's exact form, named once so the draw and the tick cannot drift into
  // rendering it two different ways.
  function fmtLeftParen(ms) { return " (" + fmtLeft(ms) + ")"; }

  // How close to a rollover counts as close, when the row has not said.
  //
  // A row that knows its own length sends soon_secs (UsageWindow.SoonSecs) and
  // that wins — CLAUDE's 5-hour window asks for half an hour, its weeks for two,
  // which is the same "one working stretch left" measured against very different
  // spans. Half an hour is the fallback because it is the tighter of the two: a
  // row whose length is unknown is likelier to be short, and warning late on a
  // long window is a smaller error than warning through the last day of one.
  //
  // Either way the countdown is keyed off resets_at, like the text it colors, so
  // it lands on exactly the rows that have a rollover to be near. The HOST rows
  // have no such instant and cannot reach it at all.
  const USAGE_SOON_MS = 30 * 60 * 1000;

  function usageSoonMs(w) {
    const secs = Number(w && w.soon_secs);
    return secs > 0 ? secs * 1000 : USAGE_SOON_MS;
  }

  // Write a countdown into its span and color it for how near the rollover is.
  //
  // One function for both the row and the folded chip, and for both the draw and
  // the 10s tick, because the class has to be re-decided every time the text is:
  // a row drawn with 35 minutes left crosses its threshold with no push behind
  // it, and a label that only took its color at draw time would sit muted
  // through the whole stretch it is meant to mark. The threshold rides on the
  // element for that reason — the tick walks the DOM and has no window object to
  // ask a second time.
  function setUsageLeft(el, ms, soonMs, fmt) {
    el.dataset.soon = String(soonMs);
    el.textContent = fmt(ms);
    // <= rather than <: a window at or past its instant (fmtUntil's "resetting")
    // is the extreme of the same state, not a return to calm — and it stays
    // stamped that way until the next reading brings a fresh resets_at.
    el.classList.toggle("soon", ms <= soonMs);
  }

  // renderUsage takes a new reading: it stores the message, settles the refresh
  // control and the age label, then draws. Folding a group re-draws WITHOUT
  // coming through here — a click is not a reading, and running usageIdle() on
  // one would stop the spinner on a refresh still in flight.
  function renderUsage(msg) {
    usageMsg = msg || null;
    // Any reading answers a pending refresh: the poller pushes every reading it
    // takes, so the next one to arrive IS the one the click asked for.
    usageIdle();
    renderUsageAge();
    drawUsage();
  }

  // drawUsage paints the section as one subsection per group: a heading, its
  // rows, and the caption that explains them. The server decides what the groups
  // are, what each row is called and what the caption says, because the set of
  // providers and the meters each one reports is the server's to know — this
  // walks the list rather than naming anything in it.
  //
  // A folded group builds its heading and nothing else, the way renderPaneList
  // skips a collapsed workspace's rows: the rows and the caption below them are
  // one subsection, so the caption folds with the numbers it annotates.
  function drawUsage() {
    usageListEl.innerHTML = "";
    usageGroupIDs = [];
    if (usageMsg) {
      let drew = false;
      for (const g of (usageMsg.groups || [])) {
        const wins = g.windows || [];
        // Never a bare heading: a subsection with nothing under it reads as a
        // broken section rather than as a provider with nothing to report.
        if (!wins.length && !g.note) continue;

        // The host groups are the ones the server measures rather than reads
        // from a provider, and the ones whose percentages mean something else: a
        // machine 70% into its RAM is a couple of test runs from swapping, while
        // a week 70% spent is on track. Their rows do not even share a scale
        // with each other, so they are looked up by name — the only group whose
        // row names this file is entitled to know, because this file's own
        // server chose them. Every other id is opaque here, and its rows take
        // the rate-limit scale.
        //
        // "host" is this machine; "host:<id>" is a cathost reporting its own
        // box. Same rows, same names, same scales — the prefix is what says the
        // numbers describe somewhere else.
        const host = g.id === "host" || (g.id || "").startsWith("host:");
        const levelsFor = (w) => host ? (HOST_LEVELS[w.name] || MEMORY_LEVELS) : USAGE_LEVELS;

        const gid = usageGroupID(g);
        usageGroupIDs.push(gid);
        const collapsed = usageCollapsed.has(gid);
        // The rule tracks what was EMITTED, not the index. A group skipped by
        // the check above would otherwise leave the next one drawing a hairline
        // as the first thing in the section, under the heading's own border.
        usageListEl.appendChild(usageGroupEl(g, gid, wins, levelsFor, collapsed, drew));
        drew = true;
        if (collapsed) continue;

        for (const w of wins) usageListEl.appendChild(usageRow(w.name, w, levelsFor(w)));

        // The caption sits directly under the rows it is about and above the
        // next heading, so it never reads as covering the whole section — only
        // some groups are showing an estimate, and only they explain themselves.
        if (g.note) {
          const li = document.createElement("li");
          li.className = "unote";
          li.textContent = g.note;
          usageListEl.appendChild(li);
        }
      }
      if (drew) return;
      // Nothing at all was drawable — no credential, no other provider, no
      // readable memory. Fall through to the pending state rather than leave an
      // empty section, which would look like a render that failed.
    }
    const li = document.createElement("li");
    li.className = "empty"; li.textContent = "…";
    usageListEl.appendChild(li);
  }

  // What a folded group is remembered by. The id is the server's stable handle
  // ("host", a provider key); the display name is the fallback for a server that
  // sends one without the other, so the fold survives a re-render either way.
  function usageGroupID(g) { return g.id || g.name || "—"; }

  // usageGroupEl builds one provider's header row — the click target that folds
  // and unfolds it, mirroring paneGroupEl.
  //
  // Folded, it stands in for the meters it hid by carrying ONE of them (see
  // usageHeadline), and its hover carries all of them (usageGroupTitle). That
  // split is the point: the fold is a request for one number, not for a digest,
  // and the reading that was folded away is still one hover from being read.
  // Expanded there is no summary — the rows say it better, and repeating a row
  // in the header would only be the same number twice.
  function usageGroupEl(g, gid, wins, levelsFor, collapsed, sep) {
    const li = document.createElement("li");
    li.className = "ugrp" + (sep ? " sep" : "");
    const name = document.createElement("span");
    name.textContent = g.name || g.id || "—";
    li.appendChild(name);

    const head = collapsed ? usageHeadline(wins) : null;
    if (head) {
      // Graded against the headline row's OWN scale: 82% of the disk is calm
      // where 82% of a rate window is not, so the chip's color comes from the
      // scale of the row it is quoting and from nothing else. A row with no
      // denominator (claude's local estimate) has a figure instead of a
      // percentage, and shows it — a token count is still the 5-hour answer.
      const lv = levelsFor(head);
      const pct = typeof head.pct === "number" ? head.pct : -1;
      if (pct >= lv.crit) li.classList.add("crit");
      else if (pct >= lv.high) li.classList.add("high");
      const text = pct >= 0 ? Math.round(pct) + "%" : (head.detail || "");
      if (text) {
        const s = document.createElement("span");
        s.className = "gsum";
        s.textContent = text;
        // A percentage of a window is half an answer: 3% spent means one thing
        // with four hours left in the five and quite another with ten minutes,
        // because what is left is what the rest of the afternoon has to fit
        // into. So when the quoted row is a window with a known rollover, the
        // chip carries both — "3% (2hrs)".
        //
        // Keyed off resets_at rather than off the row's name: a row that rolls
        // over is exactly the row a horizon belongs on, and the HOST rows have
        // no such instant (nothing resets memory but a process exiting), so
        // they keep the bare figure without this needing to know they exist.
        const at = head.resets_at ? Date.parse(head.resets_at) : NaN;
        if (!Number.isNaN(at)) {
          const left = document.createElement("span");
          left.className = "gleft";
          left.dataset.at = String(at); // absolute, so the tick can recompute it
          // The chip quotes one row, so it takes that row's horizon too: folded,
          // CLAUDE is its 5-hour window and warns on the half hour, not on the
          // week's two.
          setUsageLeft(left, at - Date.now(), usageSoonMs(head), fmtLeftParen);
          s.appendChild(left);
        }
        // No title of its own: the chip sits inside the heading, and a tooltip
        // here would shadow the heading's — which is the one that lists every
        // row the fold hid.
        li.appendChild(s);
      }
    }

    const car = document.createElement("span");
    car.className = "car"; car.textContent = collapsed ? "▶" : "▼";
    li.appendChild(car);
    li.title = usageGroupTitle(g, wins, levelsFor, collapsed);
    li.addEventListener("click", () => {
      if (collapsed) usageCollapsed.delete(gid); else usageCollapsed.add(gid);
      saveUsageCollapsed();
      drawUsage();
    });
    return li;
  }

  // The row a folded group speaks for.
  //
  // The server marks it (window.headline), because which of a provider's meters
  // answers the group's question is knowledge about the provider: Claude's
  // 5-hour window is what a long afternoon walks into, where its week is planned
  // around; the host's memory is what stops a session, where its CPU is usually
  // just the work. A front-end that picked for itself would have to enumerate
  // providers, which is the one thing this section is built not to do.
  //
  // Nothing marked falls back to the worst row by percentage — what every group
  // showed before headlines existed, and still the right answer for a provider
  // that has not said which row matters. Rows with no denominator cannot be
  // ranked and are skipped there; a group of only those folds with no chip at
  // all, which is honest.
  function usageHeadline(wins) {
    for (const w of wins) if (w.headline) return w;
    let peak = null;
    for (const w of wins) {
      if (typeof w.pct !== "number" || w.pct < 0) continue;
      if (!peak || w.pct > peak.pct) peak = w;
    }
    return peak;
  }

  // The group heading's hover: every row it holds, on screen or not.
  //
  // Folded this is the only way to read what the fold hid, and it is what lets
  // the chip beside it be a single chosen row rather than a compressed digest of
  // all of them — CLAUDE folds to its 5-hour number and the hover still has the
  // week and the per-model week; HOST folds to memory and the hover still has
  // disk and CPU. Expanded it duplicates the rows below, and is kept anyway: a
  // heading whose tooltip depended on fold state would be a worse thing to
  // learn than a few repeated lines.
  //
  // Built at draw time, so its countdowns age until the next reading lands —
  // two minutes at the poll's cadence, against a tooltip nobody holds open that
  // long. The rows themselves are the ones ticked every 10s.
  function usageGroupTitle(g, wins, levelsFor, collapsed) {
    const lines = [];
    for (const w of wins) {
      const lv = levelsFor(w);
      const pct = typeof w.pct === "number" ? w.pct : -1;
      let line = (w.name || "—") + ": ";
      if (pct >= 0) {
        line += pct.toFixed(1) + "% " + lv.of + (w.detail ? " (" + w.detail + ")" : "");
      } else {
        line += (w.detail || "unknown") + " (counted locally — no allowance on record)";
      }
      const at = w.resets_at ? Date.parse(w.resets_at) : NaN;
      if (!Number.isNaN(at)) line += " · " + fmtUntil(at - Date.now());
      lines.push(line);
    }
    if (!lines.length) lines.push("nothing to report");
    if (g.note) lines.push(g.note);
    lines.push((collapsed ? "click to expand" : "click to collapse"));
    return lines.join("\n");
  }

  // Where a row turns yellow, then red. Each kind of row keeps its own scale
  // because the same percentage does not mean the same thing on each of them:
  //
  //   window  a week 80% spent is on track — it is measured against a clock
  //           that will reset it.
  //   memory  a machine 80% into its RAM is a couple of test runs from
  //           swapping, and nothing resets it but a process exiting.
  //   disk    a volume 80% full is unremarkable and stays that way for weeks;
  //           it is the last few percent that end a build mid-write, so the
  //           warning waits and the alarm sits higher than either of the above.
  //   cpu     a machine at 80% is doing the work it was asked to do, and every
  //           build and test run touches 100% on the way past. The scale is the
  //           loosest of the four for that reason: it warns only where the row
  //           has stopped describing work and started describing a queue, and
  //           the strip under it is what actually carries the story.
  //
  // Several of the numbers happen to coincide today. The scales stay separate
  // so any of them can move without dragging the others with it.
  const USAGE_LEVELS  = { high: 75, crit: 90, of: "of the window used" };
  const MEMORY_LEVELS = { high: 80, crit: 90, of: "of host memory in use" };
  const DISK_LEVELS   = { high: 85, crit: 95, of: "of the disk in use" };
  const CPU_LEVELS    = { high: 90, crit: 98, of: "of the host's CPU busy" };

  // The HOST group's rows, by the name the server gives each one. An unknown
  // name falls back to the memory scale at the call site — a new host row is far
  // likelier to be another "nothing resets this" resource than a rate window.
  const HOST_LEVELS = { Memory: MEMORY_LEVELS, CPU: CPU_LEVELS, Disk: DISK_LEVELS };

  function usageRow(name, w, levels) {
    w = w || {};
    levels = levels || USAGE_LEVELS;
    const li = document.createElement("li");
    // pct < 0 is "no denominator" — a locally counted row (claude's transcript
    // estimate, every copilot row) has a figure but no allowance to measure it
    // against, so the row shows the figure and the CSS drops the meter rather
    // than drawing an empty one.
    const pct = typeof w.pct === "number" ? w.pct : -1;
    const known = pct >= 0;
    if (!known) li.classList.add("unknown");
    else if (pct >= levels.crit) li.classList.add("crit");
    else if (pct >= levels.high) li.classList.add("high");

    const row = document.createElement("div"); row.className = "urow";
    const nm = document.createElement("span"); nm.className = "uname"; nm.textContent = name;
    row.appendChild(nm);

    const at = w.resets_at ? Date.parse(w.resets_at) : NaN;
    if (!Number.isNaN(at)) {
      const r = document.createElement("span"); r.className = "ureset";
      r.dataset.at = String(at); // absolute: the push won't come again until the number moves
      setUsageLeft(r, at - Date.now(), usageSoonMs(w), fmtUntil);
      row.appendChild(r);
    } else if (known && w.detail) {
      // A row with both a percentage and a figure — host memory's "16.7G/24.0G"
      // — puts the figure where a countdown would go. The percentage is what
      // the row is scanned for; the absolute pair is what a worrying percentage
      // gets checked against, and it never needs re-rendering on the tick.
      const d = document.createElement("span"); d.className = "ureset";
      d.textContent = w.detail;
      row.appendChild(d);
    }

    const val = document.createElement("span"); val.className = "uval";
    val.textContent = known ? Math.round(pct) + "%" : (w.detail || "—");
    row.appendChild(val);
    li.appendChild(row);

    const meter = document.createElement("div"); meter.className = "umeter";
    const fill = document.createElement("i");
    fill.style.width = known ? Math.min(100, Math.max(0, pct)) + "%" : "0";
    meter.appendChild(fill);
    li.appendChild(meter);

    // A row the server sent a history for gets it drawn under the meter. Only
    // the rows whose movement between polls IS the information carry one (host
    // CPU today), so this is a capability of the row rather than of the section
    // — nothing here knows or asks which row it is looking at.
    if (Array.isArray(w.spark) && w.spark.length > 1) li.appendChild(usageSpark(w.spark));

    li.title = known
      ? name + ": " + pct.toFixed(1) + "% " + levels.of + (w.detail ? " (" + w.detail + ")" : "")
      : name + ": " + (w.detail || "unknown") + " (counted locally — no allowance on record to measure against)";
    return li;
  }

  // usageSpark draws a row's recent history as a filled line, oldest at the
  // left. The meter above it answers "where is it now"; this answers "where has
  // it been", which for a number that moves in seconds under a poll that fires
  // every couple of minutes is the only honest thing a single sample could not
  // have told you.
  //
  //   100% ┤       ╭─╮
  //        │   ╭───╯ ╰──╮        ← ten minutes, one point per sample
  //     0% ┼───╯        ╰────
  //        oldest          now
  //
  // The geometry is fixed at 100×20 user units and stretched to whatever width
  // the sidebar happens to be (preserveAspectRatio="none"), so no measurement of
  // the DOM is needed and a resized sidebar needs no redraw. That stretch is
  // non-uniform, which would smear a stroke — hence vector-effect, which keeps
  // the line 1px wide however far the box is pulled. The baseline sits at 20 and
  // the top of the plot at 1, so a sample at 100% still shows its stroke inside
  // the box rather than clipped in half by the edge.
  function usageSpark(samples) {
    const n = samples.length;
    const x = (i) => (i / (n - 1)) * 100;
    const y = (v) => 20 - (Math.min(100, Math.max(0, Number(v) || 0)) / 100) * 19;
    let d = "";
    for (let i = 0; i < n; i++) d += (i ? "L" : "M") + x(i).toFixed(2) + " " + y(samples[i]).toFixed(2);

    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("class", "uspark");
    svg.setAttribute("viewBox", "0 0 100 20");
    svg.setAttribute("preserveAspectRatio", "none");
    const fill = document.createElementNS(SVGNS, "path");
    fill.setAttribute("class", "sfill");
    // Closed down to the baseline at both ends: the area is what makes the shape
    // legible at 20px, where a bare 1px line reads as noise.
    fill.setAttribute("d", d + "L100 20L0 20Z");
    const line = document.createElementNS(SVGNS, "path");
    line.setAttribute("class", "sline");
    line.setAttribute("d", d);
    line.setAttribute("vector-effect", "non-scaling-stroke");
    line.setAttribute("stroke-width", "1");
    line.setAttribute("stroke-linejoin", "round");
    svg.appendChild(fill); svg.appendChild(line);
    return svg;
  }

  // The two labels that move on their own between pushes — the reset countdowns
  // and the age of the reading — share one tick, which rewrites them rather than
  // re-rendering the rows. Ten seconds rather than the countdown's old thirty:
  // the age starts at zero after every push, and a "0s ago" that lingers half a
  // minute is the one stale number this section exists to prevent.
  setInterval(() => {
    renderUsageAge();
    // Only the stamped ones: the same slot also carries the HOST rows' absolute
    // figures, which are facts rather than countdowns and have no instant to
    // recompute from. [data-at] is what separates the two.
    for (const el of usageListEl.querySelectorAll(".ureset[data-at]")) {
      // data-soon was stamped at draw from the row's own horizon; re-reading it
      // keeps the tick free of any knowledge of which row it is rewriting.
      setUsageLeft(el, Number(el.dataset.at) - Date.now(), Number(el.dataset.soon), fmtUntil);
    }
    // The folded chip's half of the same countdown. It is only in the DOM while
    // the group is folded, so the query is usually empty — and when it is not,
    // this is the one number on screen for that provider, which makes it the
    // last one that should be allowed to age.
    for (const el of usageListEl.querySelectorAll(".gleft[data-at]")) {
      setUsageLeft(el, Number(el.dataset.at) - Date.now(), Number(el.dataset.soon), fmtLeftParen);
    }
  }, 10000);

  // ---- Agents rollup (WS8): the `agents` message, previously dropped ----

  // Coarse age of a state, one unit deep — the row is a glance, not a stopwatch.
  // Split in two because the agents rows emphasize the figure without the word:
  // fmtAgeNum is the reading, fmtAge the whole phrase everything else wants.
  function fmtAgeNum(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + "s";
    const m = Math.round(s / 60);
    if (m < 60) return m + "m";
    const h = Math.round(m / 60);
    return h < 24 ? h + "h" : Math.round(h / 24) + "d";
  }
  function fmtAge(ms) { return fmtAgeNum(ms) + " ago"; }

  // An agent's prompt cache expires roughly an hour after its last turn, and a
  // state that hasn't moved is a proxy for a turn that hasn't happened. 45
  // minutes is the point where saying so is still actionable: enough of the hour
  // left to go answer the agent, rather than a post-mortem.
  const CACHE_WARN_MIN = 45;

  // paintAge (re)writes one row's age label, in the two pieces the warning needs
  // — the figure, then " ago · " leading into the state text.
  //
  // Only the two *settled* states can warn. Idle and done-unseen are both an
  // agent that stopped and is waiting on the user, so their age is dead time and
  // measures the cache draining. A working agent's identical-looking age is
  // run-time — it is spending the cache, not losing it — and a blocked one is
  // mid-turn as well, so colouring either would say the opposite of the truth.
  //
  // Measured against the *rounded* reading, not the raw age: the label rounds to
  // whole minutes, so a raw-ms threshold would leave a plain "45m" on screen for
  // up to half a minute before it bolted — two rows both reading 45m, one bold,
  // looks like a bug. Any hour- or day-scale reading clears 45 minutes trivially.
  function paintAge(el, ms, st) {
    const warn = Math.round(ms / 60000) >= CACHE_WARN_MIN && (st === "idle" || st === "done");
    el.className = "aage" + (warn ? " stale stale-" + st : "");
    const num = document.createElement("span");
    num.className = "anum";
    num.textContent = fmtAgeNum(ms);
    el.textContent = "";
    el.appendChild(num);
    el.appendChild(document.createTextNode(" ago · "));
  }

  // The rollup only arrives when a state moves, so the ages it stamped would sit
  // frozen in between. One shared tick re-reads each row's absolute instant —
  // every 5s, not every second: the label is a glance at staleness, and it is
  // cheaper to let it lag a few seconds than to touch every row that often.
  //
  // This tick is also the only thing that can raise the 45-minute warning: a row
  // crosses that line precisely because nothing happened, so there is no rollup
  // coming to redraw it. Hence the state travels on the element (data-st) rather
  // than being closed over at render time.
  setInterval(() => {
    for (const el of agentListEl.querySelectorAll(".aage")) {
      paintAge(el, Date.now() - Number(el.dataset.at), el.dataset.st);
    }
  }, 5000);

  // ---- Auto-reveal (pairs with setSidebarHidden) ----
  // Folding the column away is meant as a temporary "get out of my way", not as
  // a way to miss the two agent states that are actually addressed to the user:
  // blocked (it is waiting on an answer and nothing moves until it gets one) and
  // done-unseen (it finished while the eye was elsewhere). Either one arriving
  // brings the sidebar back on its own.
  //
  // Edge-triggered against the previous rollup, per pane: an agent that is
  // merely *still* blocked must not re-open a column the user has deliberately
  // folded away since, so only the transition into the state counts, never the
  // state itself. agentAttn starts null and the first rollup seeds it without
  // firing — otherwise every already-finished-unseen agent would read as a fresh
  // transition on page load and a hidden sidebar could never survive a reload.
  // The map outlives a dropped socket, so a reconnect's rollup doesn't re-fire
  // for states the user has already seen.
  let agentAttn = null;
  function agentAttentionSweep(items) {
    const next = new Map();
    let pop = null;
    for (const it of items) {
      const st = markerState(it);
      next.set(it.pane, st);
      if (!pop && agentAttn && (st === "blocked" || st === "done") && agentAttn.get(it.pane) !== st) {
        pop = { it, st };  // first one wins; the list is already in the server's order
      }
    }
    agentAttn = next;
    if (!pop) { if (sidebarHidden()) paintSplitterAttention(); return; }
    if (!sidebarHidden()) return;
    setSidebarHidden(false);
    // A column that reappears by itself is a surprise unless it says why, and
    // the row that caused it is about to be one of several in AGENTS.
    toast(agentLabel(pop.it.agent, pop.it.model) +
      (pop.st === "blocked" ? " is blocked" : " finished") + " — sidebar reopened");
  }

  // ---- Hosts: the cathost roster ----
  //
  // The server pushes it on connect and again whenever a host connects or drops,
  // so it is both the HOSTS section's data and the answer to the question every
  // host badge asks before drawing itself: is there more than one machine here?
  // With one host — the default, and what a config with no hosts: block gets —
  // every badge is the same word on every row, so nothing is drawn at all and
  // the section stays hidden.
  let hostItems = [];
  const multiHost = () => hostItems.length > 1;

  // hostLabel/hostUp resolve a host id against the roster. Both are deliberately
  // forgiving of an id the roster does not list: a layout can name a host for the
  // moment between its removal and the next roster push, and printing the raw id
  // (or declining to paint it as broken) beats printing nothing or a red herring.
  function hostLabel(id) {
    if (!id) return "";
    const h = hostItems.find((x) => x.id === id);
    return h ? (h.label || h.id) : id;
  }
  function hostUp(id) {
    const h = hostItems.find((x) => x.id === id);
    return !h || !!h.connected;
  }

  // The heading carries one button of its own: attach. Detach is per-row (a
  // right-click on the host it would remove), because it is the destructive
  // half and the row is the only place that says what it holds.
  //
  // Both are hidden with the section when there is a single host — the whole
  // point of that rule is that a session nobody configured hosts for looks
  // exactly as it did before hosts existed — so the gear menu carries "attach
  // host…" as well. That is the entry point out of one-host life; without it
  // the first attach would be a config-file edit and a restart, which is the
  // thing this phase exists to remove.
  (function initHostHeadingCtl() {
    document.getElementById("host-hctl")
      .appendChild(mkBtn("＋", "attach a cathost", "", openAttachHostDialog));
    initSectionFold("sec-hosts", "host-hctl", "hosts");
  })();

  // ---- History (the command ledger) ----
  //
  // The sidebar's only backward-looking section. Rows come from ledger.list, a
  // query rather than a push: commands are recorded by the pane's own cathost
  // and there is no stream of them, so the section refreshes on the events that
  // could have changed it rather than on a timer.
  //
  // A click JUMPS — ledger.jump reveals the pane and scrolls its viewport to
  // that command's output — because that is the verb a history row implies, and
  // the copy is one level down in the context menu where a destructive-feeling
  // read belongs.
  initSectionFold("sec-history", "hist-hctl", "history");

  function renderHistory(entries) {
    // Hidden until there is something in it: a session whose shells have no
    // integration installed should see the sidebar it always had, not an empty
    // section inviting a question it cannot answer.
    histSecEl.hidden = entries.length === 0;
    histListEl.innerHTML = "";
    for (const e of entries) {
      const li = document.createElement("li");
      const failed = e.exit !== undefined && e.exit !== null && e.exit !== 0;
      const unknown = e.exit === undefined || e.exit === null;
      // A block is live terminal state: an entry with none is one whose pane
      // never pinned it, or one that outlived the pane it ran in. It still
      // lists — it is history — but it does not offer a click.
      li.className = (failed ? "failed" : "") + (unknown ? " unknown" : "") + (e.block ? "" : " gone");

      const dot = document.createElement("span");
      dot.className = "cdot";
      dot.textContent = failed ? "✕" : (unknown ? "·" : "✓");
      const cmd = document.createElement("span");
      cmd.className = "ccmd"; cmd.textContent = e.cmd;
      li.appendChild(dot); li.appendChild(cmd);

      if (e.origin && e.origin !== "human") {
        const o = document.createElement("span");
        o.className = "corigin"; o.textContent = e.origin;
        li.appendChild(o);
      }
      const dur = document.createElement("span");
      dur.className = "cdur"; dur.textContent = fmtDuration(e.duration_ms || 0);
      li.appendChild(dur);

      li.title = e.cmd + "\n" + (e.cwd || "") +
        "\n" + (e.handle || ("pane " + e.pane)) + (e.host ? " · " + e.host : "") +
        (unknown ? "\nfinished, status unknown" : "\nexit " + e.exit) +
        (e.block ? "\nclick to jump · right-click to copy the output" : "\nits output has scrolled away");

      if (e.block) {
        li.addEventListener("click", () => sendCmd("ledger.jump", { pane: e.pane, block: e.block }));
        li.addEventListener("contextmenu", (ev) => {
          ev.preventDefault();
          openCtx(ev.clientX, ev.clientY, historyMenuItems(e));
        });
      }
      histListEl.appendChild(li);
    }
  }

  // historyMenuItems: the verbs that need a round trip, kept off the plain click.
  function historyMenuItems(e) {
    return [
      { label: "Jump to output", fn: () => sendCmd("ledger.jump", { pane: e.pane, block: e.block }) },
      { label: "Copy output", fn: () => copyBlockOutput(e) },
      { label: "Copy command", fn: () => clipWrite(e.cmd) },
    ];
  }

  // copyBlockOutput asks the pane's cathost for the block's text and puts it on
  // the clipboard. The "gone" case is a toast rather than a silent no-op: the
  // row looked clickable, so something has to say why nothing happened.
  function copyBlockOutput(e) {
    sendCmdAwait("ledger.output", { pane: e.pane, block: e.block }, (res) => {
      if (!res || !res.ok || !res.data) {
        toast("could not read that command's output");
        return;
      }
      if (!res.data.found) {
        toast("that command's output has scrolled out of the pane's buffer");
        return;
      }
      clipWrite(res.data.text);
      toast("copied " + res.data.text.length + " characters");
    });
  }

  // fmtDuration renders a command's runtime the way a person reads it: a
  // sub-second command is noise, so it says nothing at all rather than "0ms".
  function fmtDuration(ms) {
    if (!ms) return "";
    if (ms < 1000) return ms + "ms";
    if (ms < 60000) return (ms / 1000).toFixed(1) + "s";
    const m = Math.floor(ms / 60000);
    return m + "m" + Math.round((ms % 60000) / 1000) + "s";
  }

  // openAttachHostDialog collects one hosts: entry. The fields are the config
  // file's, in the order an operator fills them: what to call it, how to reach
  // it, then the two credentials only a tls:// host needs. Everything but id and
  // addr is optional, and a unix:// host (including an `ssh -L` forward) needs
  // neither credential.
  function openAttachHostDialog() {
    dialogFields({
      title: "attach cathost",
      submitLabel: "attach",
      hint: "addr: unix:///path/to.sock · tls://box:8422 · tcp://127.0.0.1:8422 (loopback only). " +
        "A tls host needs the token file and fingerprint cathost printed at startup.",
      fields: [
        { label: "id", placeholder: "devbox" },
        { label: "address", placeholder: "tls://devbox:8422" },
        { label: "label", placeholder: "(optional — defaults to the id)" },
        { label: "token file", placeholder: "(optional) /path/to/token" },
        { label: "fingerprint", placeholder: "(optional) pinned SHA-256" },
      ],
      onSubmit: (id, addr, label, tokenFile, fingerprint) => {
        id = (id || "").trim(); addr = (addr || "").trim();
        if (!id || !addr) { toast("a host needs an id and an address"); return; }
        sendCmdAwait("host.attach", {
          id, addr, label: (label || "").trim(),
          token_file: (tokenFile || "").trim(), fingerprint: (fingerprint || "").trim(),
        }, (res) => {
          if (!res.ok) { toast(res.error || "attach failed"); return; }
          // No "connected" claim here: the reply means the roster took it, and
          // the dial is still in flight. The row's dot is the honest report.
          toast("attached " + id + " — dialing");
        });
      },
    });
  }

  // hostMenuItems is the roster row's context menu. Detach is the only verb: a
  // host's address is edited in the config file (or re-attached), and a "make
  // default" that silently moved where new panes land is the kind of one-click
  // change that is only discovered later, from the wrong machine's shell.
  // The local host gets no menu at all (an empty list, which the row's handler
  // declines to open): it is synthesized from server.cathost_socket rather than
  // configured, so there is nothing to detach and nowhere to move its panes to.
  function hostMenuItems(h) {
    if (h.local) return [];
    const detach = (force) => sendCmdAwait("host.detach", { id: h.id, force: !!force }, (res) => {
      if (!res.ok) { toast(res.error || "detach failed"); return; }
      toast("detached " + (h.label || h.id));
    });
    if (!h.panes) {
      return [{ label: "detach host", danger: true, fn: () => detach(false) }];
    }
    return [{
      label: "detach host (" + h.panes + (h.panes === 1 ? " pane" : " panes") + ")…",
      danger: true,
      fn: () => dialogConfirm({
        title: "detach " + (h.label || h.id),
        message: "Detach this cathost? Its " + h.panes + (h.panes === 1 ? " pane" : " panes") +
          " cannot follow — the terminals stay on that machine and the panes respawn as new shells on the default host.",
        warn: "Anything running in them is left behind.",
        confirmLabel: "detach and respawn", danger: true,
        onConfirm: () => detach(true),
      }),
    }];
  }

  // fmtLatency renders a round trip at the precision the number deserves. A
  // local unix socket lands well under a millisecond, where the exact figure is
  // noise and the fact that it is sub-millisecond is the whole answer; a link
  // over 10 ms has nothing useful after the decimal point. The middle band keeps
  // one digit, which is where a busy local daemon and a container on the same
  // box actually differ.
  function fmtLatency(ms) {
    if (ms < 1) return "<1 ms";
    if (ms < 10) return ms.toFixed(1) + " ms";
    return Math.round(ms) + " ms";
  }

  function renderHosts(items) {
    hostItems = items || [];
    hostSecEl.hidden = !multiHost();
    hostListEl.innerHTML = "";
    for (const h of hostItems) {
      const li = document.createElement("li");
      li.className = "host " + (h.connected ? "up" : "down");
      li.dataset.host = h.id;
      const dot = document.createElement("span"); dot.className = "hdot"; dot.textContent = "●";
      const name = document.createElement("span"); name.className = "hname"; name.textContent = h.label || h.id;
      li.appendChild(dot); li.appendChild(name);
      // Which host an unqualified new pane lands on — the one fact about the
      // roster that changes what a click elsewhere in the UI will do.
      if (h.is_default) {
        const d = document.createElement("span"); d.className = "hdef"; d.textContent = "default";
        li.appendChild(d);
      }
      // Round trip to that cathost, when it could be measured. Only shown while
      // connected: a stale number beside a red dot would claim a link that is
      // not there.
      if (h.connected && h.latency_ms) {
        const lat = document.createElement("span"); lat.className = "hlat";
        lat.textContent = fmtLatency(h.latency_ms);
        li.appendChild(lat);
      }
      // Connected: what it is carrying. Disconnected: that it isn't — its panes
      // are still real and still counted in the tooltip, they just aren't moving.
      const meta = document.createElement("span"); meta.className = "hmeta";
      meta.textContent = h.connected ? (h.panes + (h.panes === 1 ? " pane" : " panes")) : "offline";
      li.appendChild(meta);
      li.title = h.id + " · " + (h.addr_kind || "?") +
        " · " + h.panes + (h.panes === 1 ? " pane" : " panes") +
        (h.connected && h.latency_ms ? " · " + h.latency_ms + " ms round trip" : "") +
        (h.connected ? "" : (h.error ? " · " + h.error : " · not connected")) +
        (h.local ? "" : " · right-click to detach");
      li.addEventListener("contextmenu", (e) => {
        const items = hostMenuItems(h);
        if (!items.length) return;
        e.preventDefault(); openCtx(e.clientX, e.clientY, items);
      });
      hostListEl.appendChild(li);
    }
    // Every host badge in the app is gated on this message, so a roster change
    // has to redraw the places that carry one: the pane headers and, through the
    // layout, the workspace rows.
    for (const p of panes.values()) renderChrome(p);
    if (layoutMsg) renderWorkspaces(layoutMsg);
  }

  // Agents has no groups to fold, so its heading carries the section arrow and
  // nothing else — the one control every section now has, in the one position it
  // is the same distance from every heading's right edge.
  initSectionFold("sec-agents", "agent-hctl", "agents");

  function renderAgents(items) {
    agentItems = items || [];
    agentAttentionSweep(agentItems);
    if (layoutMsg) { renderWorkspaces(layoutMsg); renderTabbar(layoutMsg); } // ws badges + tab markers derive from the rollup
    agentListEl.innerHTML = "";
    if (!items || !items.length) {
      const li = document.createElement("li"); li.className = "empty"; li.textContent = "none";
      agentListEl.appendChild(li); return;
    }
    const foc = focusedPaneId();
    for (const it of items) {
      const li = document.createElement("li"); li.className = "agent";
      li.dataset.pane = it.pane; // markFocusedAgent re-marks rows without a re-render
      li.dataset.ws = it.workspace; // ditto markLockedAgents, when a lock flips
      li.dataset.model = it.model || ""; // the untrimmed string the row's tooltip shows
      li.dataset.agent = it.agent || ""; // identity, for CSS/debug reach without re-deriving it
      if (it.pane === foc) li.classList.add("focused");
      setAgentLocked(li, wsLocked(it.workspace));
      const dot = document.createElement("span"); dot.className = "adot " + stClass(markerState(it)); dot.textContent = "●";
      // Named agent-then-model, as the pane rows and pane headers are: this
      // section is the one list that spans every workspace, so it is the most
      // likely to hold two different agents at once, and the pair is what tells
      // those rows apart. The agent's own name stands alone when no model
      // resolved (an agent with no resolver, or one before its first answer).
      //
      // The two halves are separate spans here — everywhere else prints
      // agentLabel()'s single string — because only the agent half takes the
      // identity hue. Tinting the pair would colour "claude opus 5" entire, and
      // the model is the half that changes under a stable identity. They stay
      // nested inside one .aname so the row's flex gap still sees one item.
      const name = document.createElement("span"); name.className = "aname";
      const tool = document.createElement("span");
      tool.className = "atool " + hueClass(it.agent);
      // Agentless rows keep agentLabel's shape: the model alone, and hueClass
      // returns "" for it, so a shell pane is not handed some agent's colour.
      tool.textContent = it.agent || modelLabel(it.model);
      name.appendChild(tool);
      const mdl = it.agent ? modelLabel(it.model) : "";
      if (mdl) {
        const mo = document.createElement("span"); mo.className = "amodel";
        mo.textContent = " " + mdl; // the separator agentLabel used to join with
        name.appendChild(mo);
      }
      const meta = document.createElement("span"); meta.className = "ameta";
      const st = it.seen ? it.state : "done";
      meta.textContent = paneRef(it.pub, it.pane) + " · ";
      // Every state carries its age, working included. For a settled state it
      // answers "is this still true?"; for a working one it reads as "how long
      // has it been at this?" — the same instant (when the state last moved)
      // means run-time there, and a long-running "5m ago · working" is the row
      // most worth a glance. since_ms < 0 is the rollup's "no instant known".
      if (it.since_ms >= 0) {
        const age = document.createElement("span");
        age.dataset.at = String(Date.now() - it.since_ms); // absolute: the rollup won't come again until the state moves
        age.dataset.st = st; // the displayed state, so the 5s tick can warn without one
        paintAge(age, it.since_ms, st);
        meta.appendChild(age);
      }
      meta.appendChild(document.createTextNode(st));
      li.appendChild(dot); li.appendChild(name); li.appendChild(meta);
      // agent.focus, not pane.focus: the agents list is global, so the target
      // may sit in another workspace/tab and has to be revealed into the
      // viewport (pane.focus only moves the focus flag within the current one).
      //
      // Which is exactly why a locked workspace refuses this click as well: the
      // reveal *is* a workspace switch, so leaving it open would have made the
      // dimmed row the way around the refusal in WORKSPACES. Asked at click time
      // rather than read off the row's class, so a lock lifted a moment ago is
      // honoured without waiting for the row to be rebuilt.
      //
      // On the press (pressActivate): this list is the one most often rebuilt
      // under the pointer, since it is rendered directly from the rollup whose
      // arrival used to eat the click.
      pressActivate(li, () => {
        if (wsLocked(it.workspace)) {
          toast(wsName(it.workspace) + " is locked — unlock it to reach this agent");
          return;
        }
        sendCmd("agent.focus", { pane: it.pane });
      });
      agentListEl.appendChild(li);
    }
    refreshPaneList(); // pane rows take agent identity + state from the rollup
  }

  // A focus move arrives in the layout, not in the agents rollup, so the marked
  // row is retargeted in place — re-running renderAgents would rebuild the list
  // (and re-query the pane inventory) for a class change.
  function markFocusedAgent() {
    const foc = focusedPaneId();
    for (const li of agentListEl.children) {
      if (li.dataset.pane) li.classList.toggle("focused", li.dataset.pane === foc);
    }
  }

  // setAgentLocked dims one AGENTS row for its workspace's lock, and says why in
  // the row's tooltip — dimming alone is ambiguous (an idle agent looks much the
  // same), and the padlock that explains it in WORKSPACES is a section away. The
  // tooltip leads with the consequence the user is about to meet (the click does
  // nothing) rather than with the lock's own definition.
  //
  // Unlocked, the row falls back to naming its full model, which is what the
  // trimmed label in the row dropped (the effort suffix, the exact id). The lock
  // displaces it: while a click is refused, saying so matters more.
  function setAgentLocked(li, locked) {
    li.classList.toggle("wslocked", locked);
    if (locked) li.title = "workspace locked — clicking will not reveal this agent";
    else if (li.dataset.model) li.title = li.dataset.model;
    else li.removeAttribute("title");
  }

  // A lock flip arrives as a layout, not as an agents rollup — the same split
  // that makes markFocusedAgent necessary — so the rows are re-marked in place
  // rather than rebuilt. Each row remembers its workspace id for exactly this.
  function markLockedAgents() {
    for (const li of agentListEl.children) {
      if (li.dataset.ws) setAgentLocked(li, wsLocked(li.dataset.ws));
    }
  }

  // ---- Rendering ----
  function scheduleDraw(p) {
    if (p.dirty) return;
    p.dirty = true;
    requestAnimationFrame(() => { p.dirty = false; draw(p); });
  }

  function draw(p) {
    const ctx = p.ctx;
    const defFg = p.defFg || THEME_FG, defBg = p.defBg || THEME_BG;
    // Two passes over the transform: paint the whole canvas (padding included)
    // in the terminal's own background so the inset reads as terminal margin
    // rather than a hole, then switch to the inset grid space everything else
    // draws in. Re-installed every frame because a canvas resize clears it.
    const s = p.gs || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = css(defBg);
    ctx.fillRect(0, 0, p.canvas.width / dpr, p.canvas.height / dpr);
    ctx.setTransform(dpr * s, 0, 0, dpr * s, (p.ox || 0) * dpr, (p.oy || 0) * dpr);
    ctx.textBaseline = "top";
    // The grid is drawn in two passes — every background first, then every
    // glyph — because a glyph is not confined to the cell it is anchored in.
    //
    // A wide grapheme (an emoji, a CJK character) occupies two columns: the VT
    // grid stores it in the first and leaves the second a blank *spacer*, and
    // the canvas draws it at its natural advance, spilling across both. Painted
    // cell by cell, that spacer's background rect lands after the glyph and
    // erases its right half — which is what turned a 🍏 in a highlighted row
    // into a green sliver, and only in a highlighted row, since a spacer at the
    // default background paints nothing at all:
    //
    //   one pass:   [bg][🍏 →][bg over the right half]   ✗
    //   two passes: [bg][bg][🍏 → drawn over both]       ✓
    //
    // Separating the passes fixes it without the grid having to know which
    // cells are spacers, and it covers everything else that overflows a cell
    // for the same reason — italics leaning past their box, a font's ligatures,
    // box-drawing that overshoots by a hairline.
    for (let y = 0; y < p.H; y++) {
      for (let x = 0; x < p.W; x++) {
        const c = p.cells[y * p.W + x];
        if (!c) continue;
        const m = c.m || 0;
        let fg = c.f || defFg, bg = c.b || defBg;
        if (m & M_REVERSED) { const t = fg; fg = bg; bg = t; }
        if (bg !== defBg) { ctx.fillStyle = css(bg); ctx.fillRect(x * cellW, y * cellH, cellW + 0.5, cellH + 0.5); }
      }
    }
    for (let y = 0; y < p.H; y++) {
      for (let x = 0; x < p.W; x++) {
        const c = p.cells[y * p.W + x];
        if (!c) continue;
        const m = c.m || 0;
        let fg = c.f || defFg, bg = c.b || defBg;
        if (m & M_REVERSED) { const t = fg; fg = bg; bg = t; }
        const px = x * cellW, py = y * cellH;
        const ch = c.s;
        if (ch && ch !== " " && !(m & M_HIDDEN)) {
          let font = "";
          if (m & M_BOLD) font += "bold ";
          if (m & M_ITALIC) font += "italic ";
          ctx.font = `${font}${FONT_PX}px ui-monospace, Menlo, monospace`;
          ctx.fillStyle = (m & M_DIM) ? blend(fg, bg, 0.5) : css(fg);
          ctx.fillText(ch, px, py + 1);
          if ((m & M_UNDERLINED) || c.h) ctx.fillRect(px, py + cellH - 2, cellW, 1);
        }
      }
    }
    if (p.cur && p.cur.vis && p.info && p.info.focused) {
      // The filled block belongs to the window that owns the keyboard. When
      // the app itself is in the background it hollows to an outline — the
      // classic terminal idiom for "this is where typing would land, but
      // nothing lands here right now".
      ctx.globalAlpha = 0.7;
      const px = p.cur.x * cellW, py = p.cur.y * cellH;
      if (winFocused) {
        ctx.fillStyle = css(defFg);
        ctx.fillRect(px, py, cellW, cellH);
      } else {
        ctx.strokeStyle = css(defFg); ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, cellW - 1, cellH - 1);
      }
      ctx.globalAlpha = 1;
    }
    if (p.sel) drawSelection(p, ctx);
    if (p.cm) drawCopyCursor(p, ctx);
    if (hasScrollbar(p)) drawScrollbar(p, ctx);
  }

  // ---- Scrollback scrollbar (WS8): drawn on the pane's right edge whenever
  // history exists (alt-screen panes scroll in-app, not in the buffer). The
  // thumb brightens while scrolled up; dragging it is wired in attachMouse.
  const SB_W = 6; // px
  function hasScrollbar(p) {
    return p.scroll && p.scroll.max > 0 && !(p.modes && p.modes.alt);
  }
  function drawScrollbar(p, ctx) {
    const vw = p.W * cellW, vh = p.H * cellH;
    const total = p.scroll.max + p.scroll.rows;
    const h = Math.max(20, vh * p.scroll.rows / total);
    const span = vh - h; // travel available to the thumb
    const top = total > p.scroll.rows ? span * (p.scroll.max - p.scroll.off) / p.scroll.max : 0;
    ctx.fillStyle = "rgba(255,255,255,0.07)";
    ctx.fillRect(vw - SB_W, 0, SB_W, vh);
    ctx.fillStyle = p.scroll.off ? SCROLL_THUMB : SCROLL_THUMB_IDLE;
    ctx.fillRect(vw - SB_W, top, SB_W, h);
  }

  // drawCopyCursor outlines the keyboard copy-mode cursor cell (the wash, if a
  // selection is anchored, is drawn by drawSelection via p.sel).
  function drawCopyCursor(p, ctx) {
    const { x, y } = p.cm.cursor;
    ctx.save();
    ctx.strokeStyle = CM_CURSOR; ctx.lineWidth = 2;
    ctx.strokeRect(x * cellW + 1, y * cellH + 1, cellW - 2, cellH - 2);
    ctx.restore();
  }

  // drawSelection washes the pane-local drag range (viewport cells). Linear mode
  // fills reading-order spans (first row from anchor, full middle rows, last row
  // to cursor); rect mode fills the bounding box. Endpoints are inclusive, matching
  // the server's read extraction.
  function drawSelection(p, ctx) {
    let a = p.sel.anchor, b = p.sel.cursor;
    if (b.y < a.y || (b.y === a.y && b.x < a.x)) { const t = a; a = b; b = t; }
    ctx.fillStyle = SEL_FILL;
    if (p.sel.rect) {
      const x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x);
      ctx.fillRect(x0 * cellW, a.y * cellH, (x1 - x0 + 1) * cellW, (b.y - a.y + 1) * cellH);
      return;
    }
    for (let y = a.y; y <= b.y; y++) {
      const sx = (y === a.y) ? a.x : 0;
