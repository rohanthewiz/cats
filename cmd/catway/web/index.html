<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>cats</title>
<style>
  :root {
    /* GoNotes-style dark green theme: warm gray-green surfaces, green accent.
       --chrome/--chrome-focus paint the pane header strip and double as the
       hover/selection surfaces (pane list, ctx menu, palette rows). */
    --bg:#1f2420; --fg:#d6ddd6; --accent:#4db380; --panel:#242a25; --panel2:#2b322c;
    /* --muted carries every secondary label (sidebar headings, status bar,
       hints); kept near 7:1 on the panel surface so 10–12px labels stay legible. */
    --line:#38403a; --muted:#9db0a2; --chrome:#2b322c; --chrome-focus:#3a4a3f;
    /* Sidebar section titles pull out of --muted into a light yellow so the
       three groups read as dividers rather than as more secondary label text. */
    --heading:#f0dfa0;
    --ok:#6ac47a; --warn:#e0b64e; --err:#e57373; --done:#00ccf5;
    /* Accent desaturated most of the way to gray: the focused pane's outline
       sits right next to terminal text all day, so it reads as a gray-green
       hairline just above --line rather than a green marker. */
    --accent-dim:#3d4a43;
    /* --sb-scale sizes the whole left column as one unit: the column width and
       every type size inside it are expressed against it, so the sidebar grows
       or shrinks without any of its parts drifting out of proportion. */
    --sb-scale:1.15;
    /* Sidebar column width. Anything else that has to clear the sidebar (the
       banner) reads it from here so the two can't drift apart. */
    --sidebar-w:calc(253px * var(--sb-scale));
  }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow:hidden; }
  #app { position:fixed; inset:0; display:grid; grid-template-columns:var(--sidebar-w) 5px 1fr; }

  /* ---- Splitter ----
     A five-pixel gutter between the sidebar and the terminals. It sits in its
     own grid column rather than straddling the border, so dragging it never
     lands on a pane's edge, and it keeps the sidebar's own hairline as the
     visible seam until you actually reach for it. */
  #splitter { cursor:col-resize; background:transparent; }
  #splitter:hover, #splitter.drag { background:var(--accent-dim); }
  /* While dragging, the pointer is captured but the panes below still hand out
     text cursors and selections; this shuts both off for the duration. */
  body.splitting { cursor:col-resize; user-select:none; }

  /* ---- Sidebar ---- */
  #sidebar { background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; overflow-y:auto; min-height:0; }
  #brand { font-size:calc(13px * var(--sb-scale)); font-weight:600; letter-spacing:.5px; color:#e8e8e8;
    padding:12px 14px; border-bottom:1px solid var(--line); }
  #brand small { color:var(--muted); font-weight:400; margin-left:6px; }
  /* Build badge: the short git hash this catway was built from (trailing '*' =
     built from a modified tree). Its hover card carries the commit subject —
     see initBuildBadge in JS. Mostly it answers "is this install stale?". */
  #brand small.hash { cursor:help; }
  #brand small.hash:hover { color:var(--accent); }
  #sidebar section { padding:10px 6px 8px; }
  /* Splitter between Workspaces / Panes / Agents — the headings alone read as
     one long list once a workspace has more than a couple of panes. */
  #sidebar section + section { border-top:1px solid var(--line); }
  #sidebar h2 { font-size:calc(10px * var(--sb-scale)); text-transform:uppercase; letter-spacing:.8px; color:var(--heading);
    font-weight:700; margin:0 0 6px; padding:0 8px; display:flex; align-items:baseline; }
  /* Section-level controls, pinned to the heading's right edge. Muted until
     hovered so the heading still reads as a label, not a toolbar. */
  #sidebar h2 .hctl { margin-left:auto; display:flex; gap:1px; }
  #sidebar h2 .hctl button { background:none; border:0; padding:0 3px; cursor:pointer;
    font:inherit; font-size:calc(11px * var(--sb-scale)); line-height:1; color:var(--muted); }
  #sidebar h2 .hctl button:hover { color:var(--accent); }
  #sidebar ul { list-style:none; margin:0; padding:0; }
  #sidebar li { font-size:calc(12px * var(--sb-scale)); padding:4px 8px; border-radius:4px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; cursor:default; display:flex; align-items:baseline; gap:6px; }
  #ws-list { position:relative; }
  #ws-list li.ws { cursor:pointer; }
  #ws-list li.ws:hover { background:var(--panel2); }
  #ws-list li.active { color:#e8e8e8; }
  #ws-list li .sum { color:var(--muted); font-size:calc(10px * var(--sb-scale)); margin-left:auto; }
  #ws-list li .sum span { margin-left:4px; }
  /* The finger-with-a-string a workspace wears while its cats-todo backlog has
     unfinished items in it.
     It rides the text baseline like the glyphs around it, and takes --heading so
     it reads as a reminder rather than as another agent-state dot. */
  #ws-list li .todo { flex:0 0 auto; color:var(--heading); align-self:center;
    width:calc(14px * var(--sb-scale)); height:calc(14px * var(--sb-scale)); margin-left:-2px; }
  #ws-list li.add { color:var(--muted); font-style:italic; cursor:pointer; }
  #ws-list li.add:hover { color:var(--accent); background:none; }
  #pane-list li, #agent-list li { cursor:pointer; }
  #pane-list li:hover, #agent-list li:hover { background:var(--panel2); }
  #pane-list li.focused { background:var(--chrome-focus); color:#e8e8e8; }
  /* The list spans every workspace now, so it carries its own scroll — otherwise
     a session with a few tabs of panes pushes Agents off the sidebar. */
  #pane-list { max-height:34vh; overflow-y:auto; }
  /* Panes outside the current viewport (another tab or workspace): real, but
     elsewhere — muted handle, and a click reveals rather than focuses. */
  #pane-list li.off .pub { color:var(--muted); }
  #pane-list li.off .ttl { opacity:.65; }
  /* Each workspace's panes sit under their own header row, which doubles as the
     collapse toggle. It replaces the plain hairline the list used to draw at the
     boundary: the same visual break, but it now names the group and can fold it.
     Groups after the first keep the hairline above them, on the header row rather
     than on the first pane, so a focused pane never paints across the divider. */
  #pane-list li.wsgrp { color:var(--muted); font-size:calc(10px * var(--sb-scale)); text-transform:uppercase;
    letter-spacing:.5px; cursor:pointer; }
  #pane-list li.wsgrp.sep { border-top:1px solid var(--line); margin-top:5px; padding-top:7px; }
  #pane-list li.wsgrp:hover { background:var(--panel2); color:#ccc; }
  /* Whichever marker comes first is pushed to the right edge; a collapsed group
     shows its rollup ahead of the caret. */
  #pane-list li.wsgrp .gsum, #pane-list li.wsgrp .car { margin-left:auto; }
  #pane-list li.wsgrp .gsum + .car { margin-left:0; }
  #pane-list li.wsgrp .gsum { text-transform:none; letter-spacing:0; }
  #pane-list li.wsgrp .car { font-size:calc(9px * var(--sb-scale)); }
  #pane-list .pub { color:var(--accent); }
  #pane-list .ttl { color:var(--muted); overflow:hidden; text-overflow:ellipsis; }
  #pane-list .ag, #agent-list .aname { margin-left:auto; }
  .ag, .adot, .aname { font-size:calc(11px * var(--sb-scale)); }
  .st-working { color:var(--warn); } .st-blocked { color:var(--err); }
  .st-idle { color:var(--ok); } .st-unknown { color:var(--muted); }
  .st-done { color:var(--done); } /* finished off-screen, not yet seen */
  /* A working agent's dot breathes: the one state that is mid-change, so it is
     the one marker that moves. Only the dots pulse — the agent-name text in a
     pane row shares .st-working and would be hard to read blinking. */
  .adot.st-working, .tmark.st-working, #ws-list .st-working { animation:dotpulse 1.5s ease-in-out infinite; }
  @keyframes dotpulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  @media (prefers-reduced-motion:reduce) {
    .adot.st-working, .tmark.st-working, #ws-list .st-working { animation:none; }
  }
  #agent-list li { gap:6px; }
  /* The agent sitting in the focused pane, highlighted the same way its pane row
     is — the two sections then read as one selection, not two. */
  #agent-list li.focused { background:var(--chrome-focus); color:#e8e8e8; }
  #agent-list .aname { color:#e8e8e8; margin-left:0; }
  #agent-list .ameta { color:var(--muted); font-size:calc(10px * var(--sb-scale)); margin-left:auto; }
  /* Time since the last state change, dimmer than the state it precedes: the
     state is the fact, the age only qualifies how stale that fact is. */
  #agent-list .aage { opacity:.75; }
  #agent-list li.empty { color:var(--muted); font-style:italic; cursor:default; }
  #agent-list li.empty:hover { background:none; }

  /* ---- Main area ---- */
  #main { display:grid; grid-template-rows:30px 1fr; min-width:0; min-height:0; }
  /* Top chrome is one row: tabs scroll on the left, the status affordances sit
     pinned at the right edge. The panes grid takes everything below it. */
  #topbar { display:flex; align-items:stretch; min-width:0; background:var(--panel);
    border-bottom:1px solid var(--line); }
  #tabbar { display:flex; align-items:stretch; gap:2px; padding:0 6px;
    flex:1 1 auto; min-width:0; overflow-x:auto; position:relative; }
  #tabbar .tab { font-size:12px; color:var(--muted); padding:0 10px; display:flex; align-items:center; gap:6px;
    border-bottom:2px solid transparent; white-space:nowrap; cursor:pointer; }
  #tabbar .tab:hover { color:#ddd; }
  /* Very short names ("1", "12") would otherwise render a sliver of a tab, so the
     label carries a centered floor width. Longer names outgrow it and are unaffected. */
  #tabbar .tab .tname { min-width:2em; text-align:center; }
  #tabbar .tab.active { color:#e8e8e8; border-bottom-color:var(--accent); }
  #tabbar .tab .x { color:var(--muted); font-size:10px; }
  #tabbar .tab .x:hover { color:var(--err); }
  #tabbar .tab .tmark { font-size:8px; }
  #tabbar .tab.add { color:var(--muted); font-weight:600; padding:0 12px; }
  #tabbar .tab.add:hover { color:var(--accent); }

  #panes { position:relative; overflow:hidden; }
  .pane { position:absolute; box-sizing:border-box; }
  .pane.dragging { opacity:.5; }
  .pane.droptarget { outline:2px solid var(--accent); outline-offset:-2px; }
  /* Pane chrome = the per-pane header strip (restored; it left in the green-
     theme facelift and its absence hurt more than the row it costs). Exactly
     one terminal row tall (the server reserves chromeRows in each pane's inner
     rect), so the icon buttons buy glyph size by giving up vertical padding:
     17px symbols with line-height 1 and no top/bottom padding stay clear of
     the strip's overflow:hidden clip at a ~19px row, while synthetic bold
     thickens the hairline box-drawing symbols (⊟ ⊞ ⤢ ⬚ ⧉) that were the
     hardest to read. */
  .pane .chrome { position:absolute; left:0; top:0; right:0; overflow:hidden; display:flex;
    align-items:center; gap:0; font-size:12px; color:var(--muted); background:var(--chrome);
    padding:0 5px 0 9px; box-sizing:border-box; }
  .pane.focused .chrome { color:#e6efe7; background:var(--chrome-focus); }
  .pane .chrome .info { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  /* A pane whose child has exited keeps its header readable but stops competing
     with the live ones: the identity text drops to --muted at normal weight,
     leaving the red "exited (N)" as the only emphasised run in the row. The
     per-span rules below follow this one so they win the specificity tie and
     the handle keeps its accent. */
  .pane.dead .chrome .info { color:var(--muted); font-weight:400; }
  .pane .chrome .info .pub { color:var(--accent); }
  .pane .chrome .info .agent { color:var(--warn); }
  .pane .chrome .info .exited { color:var(--err); font-weight:600; }
  /* Pane-scoped mode chips (copy mode, zoom) ride the header of the pane they
     describe — the tab-row status area only keeps the app-global affordances. */
  .pane .chrome .info .mode { color:var(--warn); font-weight:600; }
  .pane .chrome .zoom { flex:none; color:var(--accent); cursor:pointer; padding:0 6px; }
  .pane .chrome .ctl { display:flex; gap:1px; flex:none; }
  .pane .chrome .ctl button { background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:17px; font-weight:600; line-height:1; padding:0 6px; border-radius:3px;
    font-family:inherit; }
  .pane .chrome .ctl button:hover { background:rgba(255,255,255,.16); color:#fff; }
  .pane.focused .chrome .ctl button { color:#cfe0d3; }
  .pane .chrome .ctl button.close:hover { background:var(--err); color:#fff; }
  .pane canvas { position:absolute; display:block; }
  .pane.focused canvas { outline:1px solid var(--accent-dim); outline-offset:-1px; }

  /* ---- Status affordances ----
     Only the app-global pair lives here now — the ⌘K palette hint and the ⚙
     menu — pinned at the right end of the tab row so the panes keep the full
     height below the tabs. The pane-scoped indicators that used to share the
     row (ZOOM chip, copy-mode bar) ride the header of the pane they describe
     instead: a global bar naming one pane's mode read as the app's. */
  #statusbar { flex:none; display:flex; align-items:center; gap:14px; padding:0 12px;
    font-size:12px; color:var(--muted); border-left:1px solid var(--line); }

  /* ---- Toasts ---- */
  #toasts { position:fixed; right:10px; top:38px; display:flex; flex-direction:column; gap:6px; z-index:6; }
  .toast { background:var(--panel2); color:#eee; border:1px solid var(--line); border-left:3px solid var(--accent);
    padding:6px 10px; border-radius:5px; font-size:12px; max-width:340px; box-shadow:0 2px 8px rgba(0,0,0,.4);
    opacity:0; transform:translateX(8px); transition:opacity .2s, transform .2s; }
  .toast.show { opacity:1; transform:none; }

  /* ---- Split resize handles (WS8) ---- */
  .split { position:absolute; z-index:4; }
  .split.h { cursor:col-resize; }
  .split.v { cursor:row-resize; }
  .split::after { content:""; position:absolute; inset:0; margin:auto; background:transparent; transition:background .1s; }
  .split.h::after { width:2px; }
  .split.v::after { height:2px; }
  .split:hover::after, .split.dragging::after { background:var(--accent); }

  /* ---- Overlays: dialogs / palette / help (WS8) ---- */
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:8;
    display:flex; align-items:flex-start; justify-content:center; }
  .modal { background:var(--panel2); border:1px solid var(--line); border-radius:8px; margin-top:12vh;
    min-width:360px; max-width:640px; box-shadow:0 8px 30px rgba(0,0,0,.5); font-size:13px; }
  .modal header { padding:10px 14px; font-weight:600; color:#e8e8e8; border-bottom:1px solid var(--line); font-size:12px; }
  .modal .body { padding:12px 14px; }
  .modal .body p { margin:0 0 10px; color:var(--fg); line-height:1.45; }
  .modal input[type=text] { width:100%; box-sizing:border-box; background:var(--bg); color:var(--fg);
    border:1px solid var(--line); border-radius:5px; padding:6px 8px; font:inherit; outline:none; }
  .modal input[type=text]:focus { border-color:var(--accent); }
  .modal .field + .field { margin-top:10px; } /* multi-field dialogs (new workspace) */
  .modal .field label { display:block; color:var(--muted); font-size:11px; margin-bottom:4px; }
  .modal .hint { color:var(--muted); font-size:11px; margin-top:8px; }
  .modal .btns { display:flex; gap:8px; justify-content:flex-end; padding:10px 14px; border-top:1px solid var(--line); }
  .modal .btns button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:5px;
    padding:5px 12px; font:inherit; font-size:12px; cursor:pointer; }
  .modal .btns button:hover { border-color:var(--accent); color:#fff; }
  .modal .btns button.primary { background:var(--accent); border-color:var(--accent); color:#0e1a13; font-weight:600; }
  .modal .btns button.danger { background:var(--err); border-color:var(--err); color:#fff; }

  /* ---- Context menu (WS8) ---- */
  #ctxmenu { position:fixed; z-index:9; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    min-width:190px; padding:4px; box-shadow:0 6px 24px rgba(0,0,0,.5); font-size:12px; }
  #ctxmenu .item { padding:5px 10px; border-radius:4px; cursor:pointer; display:flex; gap:8px;
    align-items:center; white-space:nowrap; }
  #ctxmenu .item:hover { background:var(--chrome-focus); color:#fff; }
  #ctxmenu .item.danger:hover { background:var(--err); }
  #ctxmenu .sep { height:1px; background:var(--line); margin:4px 6px; }

  /* ---- Pane-list hover tooltip ----
     The sidebar pane rows truncate title/agent to fit their narrow column, so
     the full details are only reachable on hover. This styled popup mirrors the
     ctxmenu look (panel2 surface, drop shadow) but lays its fields out as a
     two-column label/value grid for scannability. It is a single reused element
     (see #panetip in JS), positioned fixed and clamped into the viewport. */
  #panetip { position:fixed; z-index:11; background:var(--panel2); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; box-shadow:0 6px 24px rgba(0,0,0,.5); font-size:12px;
    max-width:340px; pointer-events:none; display:none; }
  #panetip.show { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; align-items:baseline; }
  #panetip .k { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
  #panetip .v { color:var(--fg); word-break:break-word; }
  #panetip .v.pub { color:var(--accent); }
  #panetip .v.mono { font-family:inherit; }
  #panetip .v.exited { color:var(--err); }
  #panetip .v.ok { color:var(--ok); }
  #panetip .v.err { color:var(--err); }

  /* ---- Palette / navigator (WS8) ---- */
  .modal.pal { width:520px; margin-top:9vh; }
  .pal .query { padding:10px 12px; border-bottom:1px solid var(--line); }
  .pal .list { max-height:44vh; overflow-y:auto; padding:4px; }
  .pal .row { display:flex; align-items:baseline; gap:8px; padding:5px 10px; border-radius:4px; cursor:pointer; }
  .pal .row.sel, .pal .row:hover { background:var(--chrome-focus); }
  .pal .row .kind { flex:none; width:52px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  .pal .row .lbl { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .pal .row .meta { margin-left:auto; color:var(--muted); font-size:11px; flex:none; }
  .pal .empty { padding:10px 12px; color:var(--muted); font-style:italic; }

  /* ---- Plugins dialog ----
     Reuses the palette list chrome, but rows are inert info lines whose
     affordances are the per-row action buttons (run / update / uninstall) —
     smaller than the footer .btns so a row stays one compact line. */
  .modal.plugins { width:620px; } /* room for id + version + name before the three buttons */
  .modal.plugins .row { cursor:default; }
  /* The status tag only renders when there is a status (linked/broken), so it
     hugs its text instead of reserving the palette's 52px kind slot — which,
     for the common installed case, was 52px of nothing pushing the label into
     truncation. */
  .modal.plugins .row .kind { width:auto; }
  /* The linked-checkout path. Shrinks before the label does (flex 0 1 auto with
     min-width:0) so a deep path truncates instead of pushing the buttons off. */
  .pal .row .sub { color:var(--muted); font-size:11px; flex:0 1 auto; min-width:0;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .pal .row .acts { margin-left:auto; display:flex; gap:4px; flex:none; }
  .pal .row .acts button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:4px; padding:1px 8px; font:inherit; font-size:11px; cursor:pointer; }
  .pal .row .acts button:hover { border-color:var(--accent); color:#fff; }
  .pal .row .acts button.danger:hover { border-color:var(--err); background:var(--err); }

  /* ---- Help modal (WS8) ---- */
  .modal.help { max-width:720px; width:680px; }
  .help .body { max-height:60vh; overflow-y:auto; }
  .helpcols { display:grid; grid-template-columns:1fr 1fr; gap:0 28px; }
  .help h3 { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:12px 0 6px; }
  .help table { border-collapse:collapse; width:100%; }
  .help td { padding:2px 0; font-size:12px; vertical-align:top; }
  .help td:first-child { width:46%; color:var(--muted); }
  .key { background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:0 5px;
    font-size:11px; display:inline-block; margin:1px 2px 1px 0; }

  /* ---- Update banner (WS8) ---- */
  #banner { display:none; position:fixed; top:0; left:var(--sidebar-w); right:0; z-index:7; background:var(--chrome-focus);
    color:#e8e8e8; font-size:12px; padding:6px 12px; align-items:center; gap:10px;
    border-bottom:1px solid var(--accent); }
  #banner.show { display:flex; }
  #banner .x { margin-left:auto; cursor:pointer; color:var(--muted); }
  #banner .x:hover { color:var(--err); }
  /* Link failures took over the banner when the status bar's conn label went
     away — red border/text so a dropped socket still announces itself. */
  #banner.linkerr { background:#2a1c1c; border-bottom-color:var(--err); color:#ffd7d7; }

  /* ---- Status bar extras (WS8) ---- */
  #palhint { color:var(--muted); cursor:pointer; white-space:nowrap; }
  #palhint:hover { color:var(--accent); }
  #gear { cursor:pointer; font-size:16px; position:relative; }
  #gear:hover { color:var(--accent); }
  #gear.badge::after { content:""; position:absolute; top:-1px; right:-4px; width:6px; height:6px;
    border-radius:50%; background:var(--accent); }

  /* ---- Drag-reorder (tabs + workspaces) ---- */
  .dropbar { position:absolute; background:var(--accent); z-index:5; pointer-events:none; border-radius:1px; }
  .dropbar.h { top:3px; bottom:3px; width:2px; }
  .dropbar.v { left:4px; right:4px; height:2px; }
  #tabbar .tab.dragging, #ws-list li.ws.dragging { opacity:.4; }
  body.grabbing, body.grabbing * { cursor:grabbing !important; }

  /* ---- Settings modal + worktree dialogs (WS8 chrome) ---- */
  .modal .errline { color:var(--err); font-size:11px; margin-top:8px; min-height:14px; }
  .modal.settings { width:560px; }
  .settings .body { max-height:62vh; overflow-y:auto; }
  .settings h3 { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:14px 0 6px; }
  .settings h3:first-child { margin-top:0; }
  .settings .row { display:flex; align-items:center; gap:8px; margin:3px 0; }
  .settings .row label { flex:none; width:110px; color:var(--muted); font-size:12px; }
  .settings .row input[type=text] { flex:1; }
  .settings .row input[type=color] { flex:none; width:30px; height:22px; padding:0 2px;
    background:var(--bg); border:1px solid var(--line); border-radius:4px; cursor:pointer; }
  .settings .row .ro { font-size:12px; color:var(--fg); overflow:hidden; text-overflow:ellipsis; }

  /* ---- Path picker (the new-workspace start path) ----
     A list that lives inside the field's own block rather than floating over the
     dialog: the dialog is short, and a popup that covers the buttons while you
     are still choosing a directory is worse than one that pushes them down. */
  .picker { display:none; margin-top:4px; border:1px solid var(--line); border-radius:5px;
    background:var(--bg); max-height:336px; overflow-y:auto; padding:3px; }
  .field.pick.focus .picker { display:block; }
  /* The directory being listed. Deliberately not uppercased like the other
     column headings in this UI — it is a path, and a path is not a label. */
  .picker .head { padding:3px 7px; color:var(--muted); font-size:11px;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .picker .row { display:flex; align-items:baseline; gap:8px; padding:3px 7px; border-radius:4px; cursor:pointer; }
  .picker .row.sel, .picker .row:hover { background:var(--chrome-focus); }
  .picker .row .kind { flex:none; width:44px; color:var(--muted); font-size:10px;
    text-transform:uppercase; letter-spacing:.5px; }
  .picker .row .lbl { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .picker .note { padding:3px 7px; color:var(--muted); font-size:11px; font-style:italic; }
  .picker .note.err { color:var(--err); font-style:normal; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="brand">cats</div>
    <section><h2>Workspaces</h2><ul id="ws-list"></ul></section>
    <section><h2>Panes<span class="hctl" id="pane-hctl"></span></h2><ul id="pane-list"></ul></section>
    <section><h2>Agents</h2><ul id="agent-list"><li class="empty">none</li></ul></section>
  </aside>
  <div id="splitter" title="drag to resize the sidebar (double-click to reset)"></div>
  <div id="main">
    <div id="topbar">
      <div id="tabbar"></div>
      <div id="statusbar">
        <span id="palhint" title="command palette (⌘K / Ctrl+Alt+K)">⌘K palette</span>
        <span id="gear" title="menu">⚙</span>
      </div>
    </div>
    <div id="panes"></div>
  </div>
</div>
<div id="banner"></div>
<div id="toasts"></div>
<script>
(() => {
  const PV = 1, LINE = 1.25;
  // Terminal type size. ⌘+/⌘-/⌘0 rescale it (see setFontSize); it is a per-
  // browser display preference, so it lives in localStorage rather than in the
  // session the server persists.
  const FONT_DEFAULT = 14, FONT_MIN = 9, FONT_MAX = 32, FONT_KEY = "cats.font_px";
  let FONT_PX = FONT_DEFAULT;
  try {
    const stored = parseInt(localStorage.getItem(FONT_KEY), 10);
    if (stored >= FONT_MIN && stored <= FONT_MAX) FONT_PX = stored;
  } catch (e) { /* storage disabled (private mode / file://) — keep the default */ }

  const panesEl = document.getElementById("panes");
  const wsListEl = document.getElementById("ws-list");
  const paneListEl = document.getElementById("pane-list");
  const agentListEl = document.getElementById("agent-list");
  const tabbarEl = document.getElementById("tabbar");
  const toastsEl = document.getElementById("toasts");
  const palHintEl = document.getElementById("palhint");
  const gearEl = document.getElementById("gear");
  const bannerEl = document.getElementById("banner");
  const splitterEl = document.getElementById("splitter");
  const dpr = window.devicePixelRatio || 1;
  const measureCtx = document.createElement("canvas").getContext("2d");

  // Theme defaults used when a packed color is 0 (frame defaults unknown).
  // Keep in sync with :root --fg/--bg (and config's defaultColors).
  const THEME_FG = 0xd6ddd6, THEME_BG = 0x1f2420;

  // ratatui Modifier bits (cell.m).
  const M_BOLD = 0x1, M_DIM = 0x2, M_ITALIC = 0x4, M_UNDERLINED = 0x8, M_REVERSED = 0x40, M_HIDDEN = 0x80;

  // Translucent wash for a browser-local drag selection (non-mouse panes, §7 read).
  const SEL_FILL = "rgba(88,204,140,0.30)";
  // Outline for the keyboard copy-mode cursor (hjkl/arrows), distinct from the wash.
  const CM_CURSOR = "rgba(122,220,170,0.95)";

  let ws = null, cellW = 9, cellH = 19, cols = 0, rows = 0;
  let layoutMsg = null;          // last layout message
  let tabZoomed = false;         // active tab zoomed (applyLayout; header ZOOM chip)
  const panes = new Map();       // pane id -> pane state
  let copyModePane = null;       // the pane in keyboard copy-mode, or null
  let agentItems = [];           // last agents rollup (drives sidebar + workspace summaries)
  // Last pane.list snapshot: every pane in the session, across all workspaces and
  // tabs (the Panes sidebar section, see renderPaneList). The layout message can't
  // serve it — it carries the active tab's panes alone — so this is a query result
  // held between refreshes. busy/again/wait coalesce refresh requests so a chatty
  // pane can't queue one round trip per title change (refreshPaneList).
  let paneInv = [], paneInvBusy = false, paneInvAgain = false, paneInvWait = null;
  const SVGNS = "http://www.w3.org/2000/svg"; // createElementNS: SVG isn't HTML
  // Workspace ids whose pane group is folded shut in the sidebar, and the ids the
  // last render actually drew (what collapse-all/expand-all act on). Which groups
  // you keep open is a per-browser display preference like the font size, so it
  // persists in localStorage rather than in the session the server owns.
  const PGRP_KEY = "cats.panes.collapsed";
  let paneCollapsed = new Set(), paneGroupIDs = [];
  try {
    const raw = JSON.parse(localStorage.getItem(PGRP_KEY));
    if (Array.isArray(raw)) paneCollapsed = new Set(raw);
  } catch (e) { /* storage disabled or corrupt — start with everything expanded */ }
  function savePaneCollapsed() {
    try { localStorage.setItem(PGRP_KEY, JSON.stringify([...paneCollapsed])); } catch (e) { /* not persisted */ }
  }

  function measure() {
    measureCtx.font = `${FONT_PX}px ui-monospace, Menlo, monospace`;
    cellW = Math.max(1, Math.round(measureCtx.measureText("M").width * 100) / 100);
    cellH = Math.ceil(FONT_PX * LINE);
  }

  // The grid is the size of the #panes container (chrome is real HTML around
  // it), so the server's layout rects map straight onto it.
  function gridSize() {
    const w = panesEl.clientWidth || window.innerWidth;
    const h = panesEl.clientHeight || window.innerHeight;
    cols = Math.max(20, Math.floor(w / cellW));
    rows = Math.max(6, Math.floor(h / cellH));
  }

  // setFontSize rescales the terminal type. cellW/cellH are read live by both
  // the layout math and draw(), so re-measuring, re-deriving the grid, and
  // telling the server the new cols/rows is the whole job: the last layout is
  // re-applied against the new cell size to keep the frame correct until the
  // server's relayout lands (a bigger font means fewer cells, so its rects
  // change too). Cell pixel metrics reported at init aren't resent — β only
  // consumes them when a pane is created.
  function setFontSize(px) {
    px = Math.min(FONT_MAX, Math.max(FONT_MIN, Math.round(px)));
    if (px === FONT_PX) return;
    FONT_PX = px;
    try { localStorage.setItem(FONT_KEY, String(px)); } catch (e) { /* not persisted */ }
    measure();
    gridSize();
    sendMsg({ t: "resize", cols, rows });
    if (layoutMsg) applyLayout(layoutMsg);
    toast(`font ${px}px`);
  }

  // Hook for the mac app's View menu. In a WKWebView, Cocoa resolves ⌘+/⌘-/⌘0
  // as menu key equivalents before the page's keydown handler runs, so the
  // native menu items call back into Go, which Evals this. delta of 0 resets.
  window.catsAdjustFont = (delta) => setFontSize(delta ? FONT_PX + delta : FONT_DEFAULT);

  // ---- Packed u32 colors (D2): 0x02_RR_GG_BB → CSS ----
  function rgbOf(v) { return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; }
  function css(v) { const [r, g, b] = rgbOf(v); return `rgb(${r},${g},${b})`; }
  function blend(a, b, t) { // mix packed a toward packed b
    const pa = rgbOf(a), pb = rgbOf(b);
    return `rgb(${Math.round(pa[0] + (pb[0] - pa[0]) * t)},${Math.round(pa[1] + (pb[1] - pa[1]) * t)},${Math.round(pa[2] + (pb[2] - pa[2]) * t)})`;
  }

  function newPane(id) {
    const el = document.createElement("div");
    el.className = "pane";
    const chrome = document.createElement("div");
    chrome.className = "chrome";
    const info = document.createElement("div");
    info.className = "info";
    const ctl = document.createElement("div");
    ctl.className = "ctl";
    // Glyphs mirror the resulting layout: ◫ = vertical divider (side by side),
    // ⊟ = horizontal divider (stacked).
    ctl.appendChild(mkBtn("◫", "split left/right", "", () => sendCmd("pane.split", { pane: id, direction: "h" })));
    ctl.appendChild(mkBtn("⊟", "split top/bottom", "", () => sendCmd("pane.split", { pane: id, direction: "v" })));
    ctl.appendChild(mkBtn("⤢", "toggle zoom", "", () => sendCmd("pane.zoom", { pane: id })));
    ctl.appendChild(mkBtn("⬚", "copy mode (keyboard select)", "", () => enterCopyMode(id)));
    ctl.appendChild(mkBtn("⧉", "copy scrollback to clipboard", "", () => copyScrollback(id)));
    ctl.appendChild(mkBtn("✎", "rename pane", "", () => renamePane(id)));
    ctl.appendChild(mkBtn("✕", "close pane", "close", () => sendCmd("pane.close", { pane: id })));
    chrome.appendChild(info); chrome.appendChild(ctl);
    const canvas = document.createElement("canvas");
    el.appendChild(chrome); el.appendChild(canvas);
    panesEl.appendChild(el);
    const p = { id, el, chrome, chromeInfo: info, canvas, ctx: canvas.getContext("2d", { alpha: false }),
      pub: "", info: null, W: 0, H: 0, cells: [], links: [], cur: null,
      gs: 1, ox: 0, oy: 0,   // grid inset: scale + centring offsets (setInset)
      defFg: THEME_FG, defBg: THEME_BG, modes: { mouse: false, alt: false },
      title: "", cwd: "", agent: "", agentState: "", agentModel: "", exited: null,
      pressed: -1, lastCell: "", dirty: false, scroll: null, sel: null, cm: null };
    // Clicking the header (not its buttons) focuses the pane; double-click
    // renames, right-click opens the pane menu (chrome or canvas); holding
    // and moving drags the pane onto another to swap slots. The sidebar pane
    // rows keep the same affordances — the header is also the escape hatch on
    // mouse-capturing apps, where right-clicking the canvas goes to the app.
    chrome.addEventListener("mousedown", (e) => {
      if (p.info && !p.info.focused) sendCmd("pane.focus", { pane: id });
      beginPaneSwapDrag(e, id);
    });
    chrome.addEventListener("dblclick", () => renamePane(id));
    chrome.addEventListener("contextmenu", (e) => { e.preventDefault(); openCtx(e.clientX, e.clientY, paneMenuItems(id)); });
    attachMouse(p);
    panes.set(id, p);
    return p;
  }

  function mkBtn(label, title, cls, fn) {
    const b = document.createElement("button");
    b.textContent = label; b.title = title; if (cls) b.className = cls;
    b.addEventListener("mousedown", (e) => e.stopPropagation());
    b.addEventListener("click", (e) => { e.stopPropagation(); e.preventDefault(); fn(); });
    return b;
  }

  function pane(id) { return panes.get(id) || newPane(id); }

  // ---- Layout (D3): position pane DOM from computed rects + render chrome ----
  function applyLayout(msg) {
    layoutMsg = msg;
    // Zoom is tab state but renders as pane state: a zoomed tab sends only its
    // focused pane, whose header carries the ZOOM chip (see renderChrome).
    tabZoomed = msg.tabs.some((t) => t.active && t.zoomed);
    const seen = new Set();
    for (const pr of msg.panes) {
      const p = pane(pr.pane);
      seen.add(pr.pane);
      p.pub = pr.pub; p.info = pr;
      const [rx, ry, rw, rh] = pr.rect, [ix, iy, iw, ih] = pr.inner;
      p.el.style.left = (rx * cellW) + "px";
      p.el.style.top = (ry * cellH) + "px";
      p.el.style.width = (rw * cellW) + "px";
      p.el.style.height = (rh * cellH) + "px";
      p.el.classList.toggle("focused", !!pr.focused);
      p.chrome.style.height = ((iy - ry) * cellH) + "px";
      p.canvas.style.left = ((ix - rx) * cellW) + "px";
      p.canvas.style.top = ((iy - ry) * cellH) + "px";
      p.canvas.style.width = (iw * cellW) + "px";
      p.canvas.style.height = (ih * cellH) + "px";
      p.canvas.width = Math.floor(iw * cellW * dpr);
      p.canvas.height = Math.floor(ih * cellH * dpr);
      // Sizing the canvas resets its context (transform included), so the
      // padded transform is (re)installed per frame in draw() — see setInset.
      setInset(p, iw * cellW, ih * cellH);
      renderChrome(p);
      scheduleDraw(p);
    }
    for (const [id, p] of panes) {
      if (!seen.has(id)) {
        if (p === copyModePane) exitCopyMode();
        p.el.remove(); panes.delete(id);
      }
    }
    // Structure changed: re-render the inventory-fed sections (Workspaces rows
    // included), then re-query the inventory behind them.
    refreshPaneList();
    markFocusedAgent();
    renderTabbar(msg);
    renderBorders(msg);
  }

  // ---- Pane text inset ------------------------------------------------------
  //
  // Panes tile the cell grid exactly (the server's rects leave no gutter), so a
  // pane's canvas is precisely inner-cols × inner-rows of glyph boxes and text
  // lands flush against the pane edge. Rather than shrink the canvas — which
  // would clip the last column/row — the canvas keeps the full inner rect and
  // the *grid inside it* is drawn a hair smaller and centred, turning the
  // leftover pixels into a margin on all four sides:
  //
  //   ┌─ canvas = iw*cellW × ih*cellH ─────────┐
  //   │  ox                                    │   ox = boxW*(1-s)/2 ≥ PAD_X
  //   │ ┌─ grid, uniformly scaled by s ──────┐ │   oy = boxH*(1-s)/2 ≥ PAD_Y
  //   │ │ $ text no longer touches the edge  │ │
  //   │ └────────────────────────────────────┘ │
  //   └────────────────────────────────────────┘
  //
  // The scale is uniform so glyph aspect ratio — and, critically, the way
  // box-drawing characters butt against their neighbours — is preserved; cells
  // stay contiguous because every coordinate scales together. s lands near 0.98
  // for ordinary panes (a sub-pixel type-size change) and is floored so a very
  // small pane loses padding rather than legibility. Drawing happens at full
  // device resolution, so nothing is resampled: only the glyph em size changes.
  const PAD_X = 6, PAD_Y = 4; // px of breathing room per side, best effort
  const MIN_INSET_SCALE = 0.92;
  function setInset(p, boxW, boxH) {
    const s = Math.max(MIN_INSET_SCALE,
      Math.min(1, boxW > 0 ? 1 - (2 * PAD_X) / boxW : 1, boxH > 0 ? 1 - (2 * PAD_Y) / boxH : 1));
    p.gs = s;
    p.ox = (boxW * (1 - s)) / 2;
    p.oy = (boxH * (1 - s)) / 2;
  }

  // Canvas CSS px → grid user-space px (the coordinate system draw() renders
  // in). Every hit test goes through these so the inset stays invisible to the
  // rest of the code.
  function userX(p, clientX) { return (clientX - p.canvas.getBoundingClientRect().left - (p.ox || 0)) / (p.gs || 1); }
  function userY(p, clientY) { return (clientY - p.canvas.getBoundingClientRect().top - (p.oy || 0)) / (p.gs || 1); }

  // ---- Split resize handles (WS8): draggable borders → pane.resize_border ----
  // Each border div covers a thin halo around the split line; dragging maps the
  // pointer back to the split's first-child ratio. The server rebroadcasts the
  // layout on every resize, recreating these divs — the drag survives because
  // its listeners live on window and the border's id/area are stable.
  function renderBorders(msg) {
    for (const el of panesEl.querySelectorAll(".split")) el.remove();
    const HIT = 5; // px grab halo each side of the line
    for (const b of (msg.borders || [])) {
      const el = document.createElement("div");
      el.className = "split " + (b.dir === 0 ? "h" : "v");
      const [ax, ay, aw, ah] = b.area;
      if (b.dir === 0) { // horizontal split: vertical divider at x = pos
        el.style.left = (b.pos * cellW - HIT) + "px";
        el.style.top = (ay * cellH) + "px";
        el.style.width = (2 * HIT) + "px";
        el.style.height = (ah * cellH) + "px";
      } else {           // vertical split: horizontal divider at y = pos
        el.style.top = (b.pos * cellH - HIT) + "px";
        el.style.left = (ax * cellW) + "px";
        el.style.height = (2 * HIT) + "px";
        el.style.width = (aw * cellW) + "px";
      }
      el.addEventListener("mousedown", (e) => beginBorderDrag(e, b, el));
      panesEl.appendChild(el);
    }
  }

  function beginBorderDrag(e, b, el) {
    if (e.button !== 0) return;
    e.preventDefault();
    el.classList.add("dragging");
    let sent = b.ratio;
    const move = (ev) => {
      const r = panesEl.getBoundingClientRect();
      let ratio;
      if (b.dir === 0) ratio = ((ev.clientX - r.left) / cellW - b.area[0]) / b.area[2];
      else ratio = ((ev.clientY - r.top) / cellH - b.area[1]) / b.area[3];
      ratio = Math.min(0.9, Math.max(0.1, ratio));
      if (Math.abs(ratio - sent) < 0.01) return; // ~one resize per cell of travel
      sent = ratio;
      sendCmd("pane.resize_border", { border: b.id, ratio });
    };
    const up = () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      for (const d of panesEl.querySelectorAll(".split.dragging")) d.classList.remove("dragging");
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  }

  // ---- Chrome: per-pane header (styled HTML, WS8) ----
  // The identity line (pub · title · cwd · agent · exited) plus the pane-scoped
  // mode chips: keyboard copy-mode replaces the identity while active — its
  // hints need the room, and the mode is what you need to know about the pane
  // just then — and a zoomed pane carries a clickable ZOOM chip.
  function renderChrome(p) {
    p.chromeInfo.innerHTML = "";
    p.el.classList.toggle("dead", p.exited !== null && p.exited !== undefined);
    const add = (cls, text) => {
      const s = document.createElement("span");
      if (cls) s.className = cls;
      s.textContent = text;
      p.chromeInfo.appendChild(s);
    };
    add("pub", paneRef(p.pub, p.id));
    if (p.cm) {
      add("mode", "  COPY");
      add("", "  hjkl/arrows move · v select · r rect · y copy · Esc exit");
    } else {
      if (p.title) add("", "  " + p.title);
      if (p.cwd) add("", "  " + p.cwd);
      if (p.agent) add("agent", "  " + p.agent + ":" + p.agentState);
      if (p.exited !== null) add("exited", "  exited (" + p.exited + ")");
    }
    const zoom = p.chrome.querySelector(".zoom");
    if (tabZoomed && p.info && p.info.focused) {
      if (!zoom) {
        const z = document.createElement("span");
        z.className = "zoom"; z.textContent = "ZOOM ⤢"; z.title = "zoomed — click to unzoom";
        z.addEventListener("mousedown", (e) => e.stopPropagation());
        z.addEventListener("click", (e) => { e.stopPropagation(); sendCmd("pane.zoom", { pane: p.id }); });
        p.chrome.insertBefore(z, p.chrome.querySelector(".ctl"));
      }
    } else if (zoom) {
      zoom.remove();
    }
  }

  // ---- Sidebar (WS8) ----
  function stClass(state) {
    return state === "working" ? "st-working" : state === "blocked" ? "st-blocked"
      : state === "done" ? "st-done" : state === "idle" ? "st-idle" : "st-unknown";
  }

  // markerState folds a rollup item's seen flag into the display state:
  // idle+unseen renders as the "done" attention tier (cats's teal dot).
  function markerState(it) { return it.state === "idle" && !it.seen ? "done" : it.state; }

  // paneRef renders a server handle ("w1:p3") for display, swapping the opaque
  // workspace id for the workspace's name ("cats:p3"). Every pane reference the
  // user sees goes through here — the pane header, tooltip, dialog title, agents
  // rollup, palette, copy-mode bar and the sidebar PANES rows — so one form is
  // worth learning. Before the first layout arrives there is no name to resolve;
  // the id stands in, and applyLayout re-renders each header once it does.
  function paneRef(pub, paneID) {
    if (!pub) return "#" + paneID;
    const i = pub.indexOf(":");
    if (i < 0) return pub;
    return wsName(pub.slice(0, i)) + pub.slice(i);
  }

  // The workspace's display name, falling back to its id until a layout arrives.
  function wsName(id) {
    const w = layoutMsg && layoutMsg.workspaces.find((x) => x.id === id);
    return (w && w.name) || id;
  }

  // attentionRank orders marker states for aggregation (cats's
  // workspace_attention_priority): blocked > done(unseen) > working > idle.
  function attentionRank(st) {
    return st === "blocked" ? 4 : st === "done" ? 3 : st === "working" ? 2 : st === "idle" ? 1 : 0;
  }

  // workspaceRollups buckets both of the lists a workspace row reads — the
  // agents rollup and the pane inventory — by workspace, in one pass each.
  // Asking per row instead cost O(workspaces × agents + workspaces × panes) on
  // every render, and these lists are already grouped by workspace.
  function workspaceRollups() {
    const states = new Map(), todos = new Map();
    for (const it of agentItems) {
      let c = states.get(it.workspace);
      if (!c) states.set(it.workspace, c = { blocked: 0, done: 0, working: 0, idle: 0 });
      const st = markerState(it);
      if (c[st] !== undefined) c[st]++;
    }
    for (const pi of paneInv) {
      if (!pi.handle) continue;
      const n = todoOpenCount(pi.title);
      if (!n) continue;
      const i = pi.handle.indexOf(":"); // "w1:p3" → "w1"
      const ws = i < 0 ? pi.handle : pi.handle.slice(0, i);
      todos.set(ws, (todos.get(ws) || 0) + n);
    }
    return { states, todos };
  }

  // workspaceSummary compresses a workspace's detected-agent states into a
  // compact badge ("●1 ●2" colored by state), computed client-side from the
  // agents rollup — the server's per-item workspace field keys the grouping.
  function workspaceSummary(counts) {
    if (!counts) return null;
    const frag = document.createDocumentFragment();
    for (const st of ["blocked", "done", "working", "idle"]) {
      if (!counts[st]) continue;
      const s = document.createElement("span");
      s.className = stClass(st);
      s.textContent = "●" + counts[st];
      s.title = counts[st] + " " + (st === "done" ? "done (unseen)" : st);
      frag.appendChild(s);
    }
    return frag.childNodes.length ? frag : null;
  }

  // todoOpenCount reads the unfinished-item count a cats-todo manager advertises
  // in its terminal title — "todo: cats (3)", "todo: global (1)", or bare "todo
  // (2)" (the plugin's model.paneTitle). A manager whose backlog is empty or all
  // done drops the suffix, so it answers 0 exactly as a pane that is not a
  // manager at all does; only the presence of work is being counted here.
  //
  // The title is the one channel every launch carries. The plugin host's
  // CATS_PLUGIN_ID reaches the process but not the pane record, a manager started
  // by hand from a shell has no plugin id to begin with, and neither would say
  // how much is left in the backlog — which is the whole question.
  function todoOpenCount(t) {
    const m = /^todo(?:: .+?)? \((\d+)\)$/.exec(t || "");
    return m ? Number(m[1]) : 0;
  }

  // todoMark: a finger with a string tied around it, worn by a workspace whose
  // cats-todo backlog still has unfinished items in it — the string is there
  // because something was left to remember. A manager sitting open on a cleared
  // backlog earns nothing: a mark every workspace wears all day is decoration.
  //
  // Counts come from the pane inventory rather than the agents rollup, which
  // never sees a todo pane (the manager is a TUI, not an agent), and from its raw
  // title rather than the pane's live one — the live title is the *effective*
  // title, so a pane.rename would otherwise blank the count.
  function todoMark(n) {
    if (!n) return null;
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("class", "todo");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.3");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    // Three strokes, in the order you'd read them: the raised finger, the string
    // wrapped around it (an ellipse, so it reads as going behind), and the loose
    // end hanging off the knot. Any more detail than this dissolves at 16px.
    for (const d of ["M6 4v8.2a2 2 0 0 0 4 0V4a2 2 0 0 0-4 0z",
                     "M4.6 5.6a3.4 1.5 0 1 0 6.8 0 3.4 1.5 0 1 0-6.8 0",
                     "M11.2 6.5c2 .7 2.4 2.1 1.4 3.1"]) {
      const path = document.createElementNS(SVGNS, "path");
      path.setAttribute("d", d);
      svg.appendChild(path);
    }
    const t = document.createElementNS(SVGNS, "title");
    t.textContent = n === 1 ? "1 unfinished todo" : n + " unfinished todos";
    svg.appendChild(t);
    return svg;
  }

  // tabMarker: the highest-attention agent state among a tab's panes, as a
  // colored dot on the tab (cats's bell/activity markers; the rollup's tab
  // field keys the grouping — tab bar rows are the active workspace's tabs).
  //
  // tabAttention does the grouping once for the whole bar, for the same reason
  // workspaceRollups exists: per-tab scanning is O(tabs × agents) per render.
  function tabAttention() {
    const best = new Map();
    const aw = activeWorkspace();
    if (!aw) return best;
    for (const it of agentItems) {
      if (it.workspace !== aw.id) continue;
      const st = markerState(it);
      const cur = best.get(it.tab);
      if (cur === undefined || attentionRank(st) > attentionRank(cur)) best.set(it.tab, st);
    }
    return best;
  }
  function tabMarker(best) {
    if (!best || best === "idle" || best === "unknown") return null;
    const s = document.createElement("span");
    s.className = "tmark " + stClass(best);
    s.textContent = "●";
    s.title = best === "done" ? "agent done (unseen)" : "agent " + best;
    return s;
  }

  function renderWorkspaces(msg) {
    wsListEl.innerHTML = "";
    const { states, todos } = workspaceRollups();
    for (const w of msg.workspaces) {
      const li = document.createElement("li");
      li.className = "ws" + (w.active ? " active" : "");
      const name = document.createElement("span");
      name.textContent = (w.active ? "● " : "○ ") + w.name;
      li.appendChild(name);
      // The todo mark sits with the name — it says something about the project,
      // not about a pane — while the agent counts stay pinned to the right edge.
      const todo = todoMark(todos.get(w.id) || 0);
      if (todo) li.appendChild(todo);
      const sum = workspaceSummary(states.get(w.id));
      if (sum) {
        const s = document.createElement("span"); s.className = "sum"; s.appendChild(sum);
        li.appendChild(s);
      }
      li.addEventListener("click", () => { if (!dragConsumedClick && !w.active) sendCmd("workspace.focus", { id: w.id }); });
      li.addEventListener("dblclick", () => renameWorkspace(w));
      li.addEventListener("contextmenu", (e) => { e.preventDefault(); openCtx(e.clientX, e.clientY, wsMenuItems(w)); });
      li.addEventListener("mousedown", (e) => beginReorderDrag(e, {
        el: li, container: wsListEl, itemSel: "li.ws", horizontal: false,
        onDrop: (gap) => sendCmd("workspace.move", { id: w.id, index: gap }),
      }));
      wsListEl.appendChild(li);
    }
    const add = document.createElement("li");
    add.className = "add"; add.textContent = "+ workspace"; add.title = "new workspace";
    add.addEventListener("click", () => newWorkspace());
    wsListEl.appendChild(add);
  }

  // The Panes section is the session's whole pane inventory — every workspace and
  // tab, matching the global Agents rollup below it — so its rows come from the
  // cached pane.list snapshot rather than from the layout message, which only ever
  // carries the active tab's panes.
  //
  // Per row, two sources are merged. Viewport state (visible / focused) comes from
  // the layout: it is pushed, so a focus move lands without waiting on a query,
  // and it is what actually decides what is on screen (a zoomed tab hides its
  // other panes). Title/cwd/agent come from local pane state for on-screen panes,
  // where live pushes keep them fresher than any snapshot, and from the snapshot
  // for the rest — pane_title/pane_cwd are broadcast for visible panes only, so
  // off-screen titles exist nowhere else in the browser. The agents rollup wins on
  // agent state when it knows the pane: it carries the seen flag, which is what
  // renders a run that finished off-screen as "done".
  //
  // Rows are gathered per workspace before any DOM is built: the inventory already
  // arrives grouped by workspace then tab (Session.ListPanes), so a run of rows
  // sharing a handle prefix is exactly one group. Each group gets a header row that
  // folds it — a collapsed group's rows are never built, and its header carries the
  // rollup they would have shown.
  function renderPaneList() {
    paneListEl.innerHTML = "";
    const vis = new Map((layoutMsg ? layoutMsg.panes : []).map((pr) => [pr.pane, pr]));
    // Until the first snapshot lands (page load) the layout's own panes stand in,
    // so the section is never briefly blank.
    const inv = paneInv.length ? paneInv
      : Array.from(vis.values()).map((pr) => ({ pane: pr.pane, handle: pr.pub, focused: pr.focused }));
    const byPane = new Map(agentItems.map((a) => [a.pane, a]));
    const groups = [];
    for (const pi of inv) {
      const pr = vis.get(pi.pane), p = panes.get(pi.pane);
      const live = !!(pr && p); // on screen: prefer local state over the snapshot
      const row = {
        pane: pi.pane, pub: pi.handle || (pr && pr.pub) || "",
        visible: !!pr, focused: pr ? !!pr.focused : !!pi.focused,
      };
      if (live) {
        row.title = p.title; row.cwd = p.cwd;
        row.agent = p.agent; row.state = p.agentState; row.model = p.agentModel;
      } else {
        // A custom name overrides the terminal title, as effectiveTitle does
        // server-side for the panes whose titles are pushed.
        row.title = pi.name || pi.title || ""; row.cwd = pi.cwd || "";
        row.agent = pi.agent || ""; row.state = pi.agent_state || ""; row.model = pi.agent_model || "";
      }
      const a = byPane.get(pi.pane);
      if (a) { row.agent = a.agent; row.state = markerState(a); }

      const wsID = row.pub.split(":")[0];
      if (!groups.length || groups[groups.length - 1].ws !== wsID) groups.push({ ws: wsID, rows: [] });
      groups[groups.length - 1].rows.push(row);
    }

    paneGroupIDs = groups.map((g) => g.ws);
    groups.forEach((g, i) => {
      paneListEl.appendChild(paneGroupEl(g, i > 0));
      if (!paneCollapsed.has(g.ws)) for (const row of g.rows) paneListEl.appendChild(paneRowEl(row));
    });
  }

  // paneGroupEl builds one workspace's header row. Collapsed, it stands in for the
  // rows it hides, so it reports what they would have said in aggregate: how many
  // of the group's panes are running an agent, out of how many panes.
  function paneGroupEl(g, sep) {
    const collapsed = paneCollapsed.has(g.ws);
    const li = document.createElement("li");
    li.className = "wsgrp" + (sep ? " sep" : "");
    const name = document.createElement("span");
    name.textContent = wsName(g.ws) || "—";
    li.appendChild(name);
    if (collapsed) {
      const agents = g.rows.filter((r) => r.agent).length;
      const s = document.createElement("span");
      s.className = "gsum";
      const n = (c, w) => c + " " + w + (c === 1 ? "" : "s");
      s.textContent = n(agents, "agent") + " / " + n(g.rows.length, "pane");
      li.appendChild(s);
    }
    const car = document.createElement("span");
    car.className = "car"; car.textContent = collapsed ? "▶" : "▼";
    li.appendChild(car);
    li.title = (collapsed ? "expand " : "collapse ") + (wsName(g.ws) || "workspace");
    li.addEventListener("click", () => {
      if (collapsed) paneCollapsed.delete(g.ws); else paneCollapsed.add(g.ws);
      savePaneCollapsed();
      renderPaneList();
    });
    return li;
  }

  function paneRowEl(row) {
    const li = document.createElement("li");
    li.className = "pn" + (row.visible && row.focused ? " focused" : "") + (row.visible ? "" : " off");
    // No focus marker glyph: li.focused's background says it, and a per-row
    // gutter for a mark only one row ever carries indents the whole list.
    const pub = document.createElement("span"); pub.className = "pub"; pub.textContent = paneRef(row.pub, row.pane);
    li.appendChild(pub);
    if (row.title) { const t = document.createElement("span"); t.className = "ttl"; t.textContent = row.title; li.appendChild(t); }
    if (row.agent) {
      const ag = document.createElement("span"); ag.className = "ag " + stClass(row.state); ag.textContent = row.agent;
      li.appendChild(ag);
    }
    // A row can name a pane in another workspace or tab, which pane.focus cannot
    // reach (it only moves the focus flag inside the current viewport), so those
    // are revealed the way the agents list reveals its own: agent.focus.
    li.addEventListener("click", () => {
      if (dragConsumedClick) return;
      if (!row.visible) sendCmd("agent.focus", { pane: row.pane });
      else if (!row.focused) sendCmd("pane.focus", { pane: row.pane });
    });
    // The pane header's affordances, mirrored: double-click renames,
    // right-click opens the pane menu, and dragging a row onto a pane on
    // screen swaps the two (beginPaneSwapDrag hit-tests the live pane
    // rects, so a sidebar origin works the same as a header origin). Swapping
    // slots is an active-tab operation (Session.SwapPanes), so only on-screen
    // rows arm the drag — an off-screen row has no slot to trade.
    li.addEventListener("dblclick", () => renamePane(row.pane));
    li.addEventListener("contextmenu", (e) => { e.preventDefault(); openCtx(e.clientX, e.clientY, paneMenuItems(row.pane)); });
    if (row.visible) li.addEventListener("mousedown", (e) => beginPaneSwapDrag(e, row.pane));
    // Reveal the untruncated pane details on hover. mousemove keeps the popup
    // riding just right of the pointer; mouseleave tears it down. showPaneTip
    // re-reads live pane state by id, so a re-render between enter and move
    // still shows the current title/agent/state.
    li.addEventListener("mouseenter", (e) => showPaneTip(e, row));
    li.addEventListener("mousemove", (e) => showPaneTip(e, row));
    li.addEventListener("mouseleave", hideTip);
    return li;
  }

  // The Panes heading's own controls: fold or unfold every workspace group at
  // once. They act on the groups the last render drew, so a workspace that no
  // longer has panes doesn't linger in the collapsed set.
  (function initPaneHeadingCtl() {
    const el = document.getElementById("pane-hctl");
    el.appendChild(mkBtn("⊞", "expand all workspaces", "", () => {
      paneCollapsed.clear(); savePaneCollapsed(); renderPaneList();
    }));
    el.appendChild(mkBtn("⊟", "collapse all workspaces", "", () => {
      paneCollapsed = new Set(paneGroupIDs); savePaneCollapsed(); renderPaneList();
    }));
  })();

  // refreshPaneList redraws the section now from what the browser already knows,
  // then re-queries pane.list for the parts only the server has (off-screen
  // titles, panes that appeared or closed elsewhere). Every caller is a push that
  // could have changed the inventory; the query is debounced and single-flight, so
  // a burst of them costs one round trip plus at most one follow-up.
  //
  // The workspace rows ride along: their todo marks read the same inventory, so
  // a manager opening or closing has to reach both sections at once.
  function refreshPaneList() {
    renderInventoryViews();
    if (paneInvBusy) { paneInvAgain = true; return; }
    if (paneInvWait) return;
    paneInvWait = setTimeout(() => {
      paneInvWait = null; paneInvBusy = true;
      sendCmdAwait("pane.list", {}, (res) => {
        paneInvBusy = false;
        if (res.ok && res.data) { paneInv = res.data.panes || []; renderInventoryViews(); }
        if (paneInvAgain) { paneInvAgain = false; refreshPaneList(); }
      });
    }, 120);
  }

  // The two views the pane inventory feeds: the Panes section, and the todo marks
  // on the Workspaces rows above it.
  //
  // Coalesced to one frame, because the callers arrive in bursts. Switching tab
  // lands a layout, an agents rollup, and then pane_title/pane_agent/pane_exited
  // for every pane that just came into view — each of which asks for these views.
  // Both are full wipe-and-rebuilds over the whole session's inventory, so
  // rebuilding per message made a switch cost O(panes in tab × panes in session)
  // to paint the last one anyway. The 120ms query debounce below never covered
  // this; it guards only the round trip.
  let invFrame = 0;
  function renderInventoryViews() {
    if (invFrame) return;
    invFrame = requestAnimationFrame(() => { invFrame = 0; renderInventoryViewsNow(); });
  }
  function renderInventoryViewsNow() {
    renderPaneList();
    if (layoutMsg) renderWorkspaces(layoutMsg);
  }

  // ---- Hover card ----
  // A single reused element (cheaper than per-row popups, and only ever one is
  // visible), shared by every hover target. Callers pass [label, value, valueCls]
  // rows; empty values drop out, so a caller can list optional fields flatly.
  const paneTipEl = document.createElement("div");
  paneTipEl.id = "panetip";
  document.body.appendChild(paneTipEl);

  function showTip(e, items) {
    paneTipEl.innerHTML = "";
    for (const [k, v, vcls] of items) {
      if (v === undefined || v === null || v === "") continue;
      const kk = document.createElement("span"); kk.className = "k"; kk.textContent = k;
      const vv = document.createElement("span"); vv.className = "v" + (vcls ? " " + vcls : ""); vv.textContent = v;
      paneTipEl.appendChild(kk); paneTipEl.appendChild(vv);
    }
    // Position the popup to the right of the cursor, clamped into the viewport
    // (measured after making it visible so its size is known).
    paneTipEl.classList.add("show");
    const r = paneTipEl.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 8;
    if (x + r.width > window.innerWidth - 4) x = e.clientX - r.width - 8;
    if (y + r.height > window.innerHeight - 4) y = window.innerHeight - r.height - 4;
    paneTipEl.style.left = Math.max(4, x) + "px";
    paneTipEl.style.top = Math.max(4, y) + "px";
  }

  function hideTip() { paneTipEl.classList.remove("show"); }

  // Pane-list rows truncate title/agent to fit their narrow column, so the full
  // details are only reachable on hover. Rebuilt on each show since the
  // underlying pane state is live. row is a renderPaneList row — the merged view
  // of one pane, on screen or not; the fields only the viewport has (model, exit
  // code, grid size) come from local pane state and are simply absent for a pane
  // sitting in another tab.
  function showPaneTip(e, row) {
    const p = row.visible ? panes.get(row.pane) : null;
    const items = [["Pane", paneRef(row.pub, row.pane), "pub"]];
    items.push(["Title", row.title]);
    items.push(["Dir", row.cwd, "mono"]);
    if (row.agent) items.push(["Agent", row.agent + " · " + (row.state || "unknown")]);
    // The LLM the agent is running under — with the reasoning effort it last ran
    // at appended, when the transcript named one — read from that transcript
    // server-side (agentmodel.go), already one display string. Only claude
    // reports one, and only once it has answered.
    // Off-screen panes get it from the pane.list snapshot, same as their agent.
    if (row.model) items.push(["Model", row.model]);
    if (p && p.exited !== null && p.exited !== undefined) items.push(["Exited", "code " + p.exited, "exited"]);
    items.push(["Focus", row.visible ? (row.focused ? "focused" : "") : "off screen"]);
    // Geometry + link state, relocated here from the status bar: the pane's own
    // terminal grid (from its last frame, falling back to the layout's inner
    // rect before the first frame lands) and then the window grid it sits in.
    const inner = (p && p.info && p.info.inner) || [0, 0, 0, 0];
    const gw = p ? (p.W || inner[2]) : 0, gh = p ? (p.H || inner[3]) : 0;
    if (gw && gh) items.push(["Size", gw + "×" + gh + " cells"]);
    if (cols && rows) items.push(["Window", cols + "×" + rows + " cells"]);
    items.push(["Link", connState.text, connState.err ? "err" : "ok"]);
    showTip(e, items);
  }

  // ---- Build badge ----
  // The short git hash of the commit this catway was built from, stamped at link
  // time and served as window.__catsBuild (see internal/buildinfo + page.go). It
  // sits beside the brand because the common confusion is a stale install — an
  // app bundle still carrying an older catway — and the hash names the build at a
  // glance; hovering expands it to the commit's subject line.
  (function initBuildBadge() {
    const b = window.__catsBuild;
    if (!b || !b.hash) return; // built outside a checkout — no badge
    const el = document.createElement("small");
    el.className = "hash";
    el.textContent = b.hash + (b.dirty ? "*" : "");
    const items = [
      ["Build", b.hash + (b.dirty ? " · modified tree" : "")],
      ["Commit", b.subject],
    ];
    el.addEventListener("mouseenter", (e) => showTip(e, items));
    el.addEventListener("mousemove", (e) => showTip(e, items));
    el.addEventListener("mouseleave", hideTip);
    document.getElementById("brand").appendChild(el);
  })();

  function renderTabbar(msg) {
    tabbarEl.innerHTML = "";
    const attention = tabAttention();
    for (const t of msg.tabs) {
      const el = document.createElement("div");
      el.className = "tab" + (t.active ? " active" : "");
      const label = document.createElement("span");
      label.className = "tname";
      label.textContent = t.name + (t.zoomed ? " ⤢" : "");
      el.appendChild(label);
      const mark = tabMarker(attention.get(t.num));
      if (mark) el.appendChild(mark);
      el.addEventListener("click", () => { if (!dragConsumedClick && !t.active) sendCmd("tab.focus", { num: t.num }); });
      el.addEventListener("dblclick", () => renameTab(t));
      el.addEventListener("contextmenu", (e) => { e.preventDefault(); openCtx(e.clientX, e.clientY, tabMenuItems(t, msg.tabs.length)); });
      el.addEventListener("mousedown", (e) => {
        if (e.target.classList.contains("x")) return; // the close button is not a drag handle
        beginReorderDrag(e, {
          el, container: tabbarEl, itemSel: ".tab:not(.add)", horizontal: true,
          onDrop: (gap) => sendCmd("tab.move", { num: t.num, index: gap }),
        });
      });
      if (msg.tabs.length > 1) {
        const x = document.createElement("span");
        x.className = "x"; x.textContent = "✕"; x.title = "close tab";
        x.addEventListener("click", (e) => { e.stopPropagation(); sendCmd("tab.close", { num: t.num }); });
        el.appendChild(x);
      }
      tabbarEl.appendChild(el);
    }
    const add = document.createElement("div");
    add.className = "tab add"; add.textContent = "+"; add.title = "new tab";
    add.addEventListener("click", () => sendCmd("tab.create", {}));
    tabbarEl.appendChild(add);
    // Overflow: keep the active tab in view when the bar scrolls horizontally.
    const act = tabbarEl.querySelector(".tab.active");
    if (act && act.scrollIntoView) act.scrollIntoView({ inline: "nearest", block: "nearest" });
  }
  // A vertical wheel over the tab bar scrolls it horizontally (overflow).
  tabbarEl.addEventListener("wheel", (e) => {
    if (!e.deltaY) return;
    e.preventDefault();
    tabbarEl.scrollLeft += e.deltaY;
  }, { passive: false });

  // ---- Drag-reorder (WS8): tabs (horizontal) + workspaces (vertical) ----
  //
  // Same shape as beginBorderDrag: mousedown arms a potential drag with
  // window-level move/up listeners, and only ~4px of travel makes it one — a
  // plain press stays a click (focus). While dragging, the pointer maps to an
  // insertion gap (0..=len, the tab.move / workspace.move convention) shown as
  // a 2px accent bar; drop sends the move and the server's layout rebroadcast
  // re-renders both lists (the server is the source of truth).
  // dragConsumedClick suppresses the click that follows a completed drag so it
  // doesn't also focus; it self-clears on the next tick.
  let dragConsumedClick = false;
  function beginReorderDrag(ev, cfg) {
    if (ev.button !== 0) return;
    const sx = ev.clientX, sy = ev.clientY;
    let dragging = false, bar = null, gap = -1;
    const items = () => Array.from(cfg.container.querySelectorAll(cfg.itemSel));
    const move = (e) => {
      if (!dragging) {
        if (Math.abs(e.clientX - sx) < 4 && Math.abs(e.clientY - sy) < 4) return;
        dragging = true;
        cfg.el.classList.add("dragging");
        document.body.classList.add("grabbing");
        bar = document.createElement("div");
        bar.className = "dropbar " + (cfg.horizontal ? "h" : "v");
      }
      // A mid-drag re-render replaces the container's children (and drops the
      // bar); re-query and re-attach every move so the drag survives it.
      if (!bar.isConnected) cfg.container.appendChild(bar);
      const els = items();
      gap = els.length;
      for (let i = 0; i < els.length; i++) {
        const r = els[i].getBoundingClientRect();
        const mid = cfg.horizontal ? r.left + r.width / 2 : r.top + r.height / 2;
        if ((cfg.horizontal ? e.clientX : e.clientY) < mid) { gap = i; break; }
      }
      const cr = cfg.container.getBoundingClientRect();
      const edge = gap < els.length
        ? els[gap].getBoundingClientRect()[cfg.horizontal ? "left" : "top"]
        : (els.length ? els[els.length - 1].getBoundingClientRect()[cfg.horizontal ? "right" : "bottom"]
                      : (cfg.horizontal ? cr.left : cr.top));
      if (cfg.horizontal) bar.style.left = (edge - cr.left + cfg.container.scrollLeft - 1) + "px";
      else bar.style.top = (edge - cr.top + cfg.container.scrollTop - 1) + "px";
    };
    const up = () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      cfg.el.classList.remove("dragging");
      document.body.classList.remove("grabbing");
      if (bar) bar.remove();
      if (dragging && gap >= 0) {
        dragConsumedClick = true;
        setTimeout(() => { dragConsumedClick = false; }, 0); // the click fires first, synchronously
        cfg.onDrop(gap);
      }
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  }

  // ---- Pane drag-reorder: drag a sidebar pane row onto a pane → pane.swap_with.
  // Same shape as beginReorderDrag: mousedown arms a potential drag with a 4px
  // threshold, so a plain press stays a click (focus). While dragging, the
  // pane under the pointer highlights as the drop target; releasing anywhere
  // else cancels. Layout rebroadcasts mid-drag are safe — the hit test reads
  // live pane rects and the listeners live on window.
  function beginPaneSwapDrag(ev, srcId) {
    if (ev.button !== 0) return;
    const sx = ev.clientX, sy = ev.clientY;
    let dragging = false, target = null;
    const clearTarget = () => { if (target) { target.el.classList.remove("droptarget"); target = null; } };
    const paneAt = (x, y) => {
      for (const [id, p] of panes) {
        if (id === srcId || !p.info) continue;
        const r = p.el.getBoundingClientRect();
        if (x >= r.left && x < r.right && y >= r.top && y < r.bottom) return p;
      }
      return null;
    };
    const move = (e) => {
      if (!dragging) {
        if (Math.abs(e.clientX - sx) < 4 && Math.abs(e.clientY - sy) < 4) return;
        dragging = true;
        const src = panes.get(srcId);
        if (src) src.el.classList.add("dragging");
        document.body.classList.add("grabbing");
      }
      const p = paneAt(e.clientX, e.clientY);
      if (p !== target) { clearTarget(); if (p) { target = p; p.el.classList.add("droptarget"); } }
    };
    const up = () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      const src = panes.get(srcId);
      if (src) src.el.classList.remove("dragging");
      document.body.classList.remove("grabbing");
      const tgt = target;
      clearTarget();
      if (dragging && tgt) {
        dragConsumedClick = true;
        setTimeout(() => { dragConsumedClick = false; }, 0); // the click fires first, synchronously
        sendCmd("pane.swap_with", { pane: srcId, target: tgt.id });
      }
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  }

  // ---- Agents rollup (WS8): the `agents` message, previously dropped ----

  // Coarse age of a state, one unit deep — the row is a glance, not a stopwatch.
  function fmtAge(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + "s ago";
    const m = Math.round(s / 60);
    if (m < 60) return m + "m ago";
    const h = Math.round(m / 60);
    return h < 24 ? h + "h ago" : Math.round(h / 24) + "d ago";
  }

  // The rollup only arrives when a state moves, so the ages it stamped would sit
  // frozen in between. One shared tick re-reads each row's absolute instant —
  // every 5s, not every second: the label is a glance at staleness, and it is
  // cheaper to let it lag a few seconds than to touch every row that often.
  setInterval(() => {
    for (const el of agentListEl.querySelectorAll(".aage")) {
      el.textContent = fmtAge(Date.now() - Number(el.dataset.at)) + " · ";
    }
  }, 5000);

  function renderAgents(items) {
    agentItems = items || [];
    if (layoutMsg) { renderWorkspaces(layoutMsg); renderTabbar(layoutMsg); } // ws badges + tab markers derive from the rollup
    agentListEl.innerHTML = "";
    if (!items || !items.length) {
      const li = document.createElement("li"); li.className = "empty"; li.textContent = "none";
      agentListEl.appendChild(li); return;
    }
    const foc = focusedPaneId();
    for (const it of items) {
      const li = document.createElement("li"); li.className = "agent";
      li.dataset.pane = it.pane; // markFocusedAgent re-marks rows without a re-render
      if (it.pane === foc) li.classList.add("focused");
      const dot = document.createElement("span"); dot.className = "adot " + stClass(markerState(it)); dot.textContent = "●";
      const name = document.createElement("span"); name.className = "aname"; name.textContent = it.agent;
      const meta = document.createElement("span"); meta.className = "ameta";
      const st = it.seen ? it.state : "done";
      meta.textContent = paneRef(it.pub, it.pane) + " · ";
      // A working agent is mid-change, so "how long since it changed" says
      // nothing there (and its dot already pulses). Every settled state carries
      // its age instead — the answer to "is this still true?".
      if (st !== "working" && it.since_ms >= 0) {
        const age = document.createElement("span"); age.className = "aage";
        age.dataset.at = String(Date.now() - it.since_ms); // absolute: the rollup won't come again until the state moves
        age.textContent = fmtAge(it.since_ms) + " · ";
        meta.appendChild(age);
      }
      meta.appendChild(document.createTextNode(st));
      li.appendChild(dot); li.appendChild(name); li.appendChild(meta);
      // agent.focus, not pane.focus: the agents list is global, so the target
      // may sit in another workspace/tab and has to be revealed into the
      // viewport (pane.focus only moves the focus flag within the current one).
      li.addEventListener("click", () => sendCmd("agent.focus", { pane: it.pane }));
      agentListEl.appendChild(li);
    }
    refreshPaneList(); // pane rows take agent identity + state from the rollup
  }

  // A focus move arrives in the layout, not in the agents rollup, so the marked
  // row is retargeted in place — re-running renderAgents would rebuild the list
  // (and re-query the pane inventory) for a class change.
  function markFocusedAgent() {
    const foc = focusedPaneId();
    for (const li of agentListEl.children) {
      if (li.dataset.pane) li.classList.toggle("focused", li.dataset.pane === foc);
    }
  }

  // ---- Rendering ----
  function scheduleDraw(p) {
    if (p.dirty) return;
    p.dirty = true;
    requestAnimationFrame(() => { p.dirty = false; draw(p); });
  }

  function draw(p) {
    const ctx = p.ctx;
    const defFg = p.defFg || THEME_FG, defBg = p.defBg || THEME_BG;
    // Two passes over the transform: paint the whole canvas (padding included)
    // in the terminal's own background so the inset reads as terminal margin
    // rather than a hole, then switch to the inset grid space everything else
    // draws in. Re-installed every frame because a canvas resize clears it.
    const s = p.gs || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = css(defBg);
    ctx.fillRect(0, 0, p.canvas.width / dpr, p.canvas.height / dpr);
    ctx.setTransform(dpr * s, 0, 0, dpr * s, (p.ox || 0) * dpr, (p.oy || 0) * dpr);
    ctx.textBaseline = "top";
    for (let y = 0; y < p.H; y++) {
      for (let x = 0; x < p.W; x++) {
        const c = p.cells[y * p.W + x];
        if (!c) continue;
        const m = c.m || 0;
        let fg = c.f || defFg, bg = c.b || defBg;
        if (m & M_REVERSED) { const t = fg; fg = bg; bg = t; }
        const px = x * cellW, py = y * cellH;
        if (bg !== defBg) { ctx.fillStyle = css(bg); ctx.fillRect(px, py, cellW + 0.5, cellH + 0.5); }
        const ch = c.s;
        if (ch && ch !== " " && !(m & M_HIDDEN)) {
          let font = "";
          if (m & M_BOLD) font += "bold ";
          if (m & M_ITALIC) font += "italic ";
          ctx.font = `${font}${FONT_PX}px ui-monospace, Menlo, monospace`;
          ctx.fillStyle = (m & M_DIM) ? blend(fg, bg, 0.5) : css(fg);
          ctx.fillText(ch, px, py + 1);
          if ((m & M_UNDERLINED) || c.h) ctx.fillRect(px, py + cellH - 2, cellW, 1);
        }
      }
    }
    if (p.cur && p.cur.vis && p.info && p.info.focused) {
      ctx.fillStyle = css(defFg); ctx.globalAlpha = 0.7;
      ctx.fillRect(p.cur.x * cellW, p.cur.y * cellH, cellW, cellH);
      ctx.globalAlpha = 1;
    }
    if (p.sel) drawSelection(p, ctx);
    if (p.cm) drawCopyCursor(p, ctx);
    if (hasScrollbar(p)) drawScrollbar(p, ctx);
  }

  // ---- Scrollback scrollbar (WS8): drawn on the pane's right edge whenever
  // history exists (alt-screen panes scroll in-app, not in the buffer). The
  // thumb brightens while scrolled up; dragging it is wired in attachMouse.
  const SB_W = 6; // px
  function hasScrollbar(p) {
    return p.scroll && p.scroll.max > 0 && !(p.modes && p.modes.alt);
  }
  function drawScrollbar(p, ctx) {
    const vw = p.W * cellW, vh = p.H * cellH;
    const total = p.scroll.max + p.scroll.rows;
    const h = Math.max(20, vh * p.scroll.rows / total);
    const span = vh - h; // travel available to the thumb
    const top = total > p.scroll.rows ? span * (p.scroll.max - p.scroll.off) / p.scroll.max : 0;
    ctx.fillStyle = "rgba(255,255,255,0.07)";
    ctx.fillRect(vw - SB_W, 0, SB_W, vh);
    ctx.fillStyle = p.scroll.off ? "rgba(122,220,170,0.6)" : "rgba(255,255,255,0.25)";
    ctx.fillRect(vw - SB_W, top, SB_W, h);
  }

  // drawCopyCursor outlines the keyboard copy-mode cursor cell (the wash, if a
  // selection is anchored, is drawn by drawSelection via p.sel).
  function drawCopyCursor(p, ctx) {
    const { x, y } = p.cm.cursor;
    ctx.save();
    ctx.strokeStyle = CM_CURSOR; ctx.lineWidth = 2;
    ctx.strokeRect(x * cellW + 1, y * cellH + 1, cellW - 2, cellH - 2);
    ctx.restore();
  }

  // drawSelection washes the pane-local drag range (viewport cells). Linear mode
  // fills reading-order spans (first row from anchor, full middle rows, last row
  // to cursor); rect mode fills the bounding box. Endpoints are inclusive, matching
  // the server's read extraction.
  function drawSelection(p, ctx) {
    let a = p.sel.anchor, b = p.sel.cursor;
    if (b.y < a.y || (b.y === a.y && b.x < a.x)) { const t = a; a = b; b = t; }
    ctx.fillStyle = SEL_FILL;
    if (p.sel.rect) {
      const x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x);
