      const ex = (y === b.y) ? b.x : p.W - 1;
      ctx.fillRect(sx * cellW, y * cellH, (ex - sx + 1) * cellW, cellH);
    }
  }

  // ---- Down messages ----
  function onMessage(msg) {
    switch (msg.t) {
      case "welcome":
        if (msg.error) setStatus("rejected: " + msg.error, true);
        else {
          setStatus("connected");
          // The chip only exists when the server serves chat — without the
          // cap, chat.send would vanish into an unknown-command error.
          chatBtnEl.style.display = (msg.caps || []).includes("chat") ? "" : "none";
        }
        break;
      case "layout": applyLayout(msg); break;
      // The census: how many clients, and what each of them is looking at. Only
      // the sidebar reads it, so a re-render of the workspace list is the whole
      // reaction.
      case "clients":
        clientsMsg = msg;
        if (layoutMsg) renderWorkspaces(layoutMsg);
        break;
      case "pane_frame": {
        const p = pane(msg.pane);
        p.W = msg.w; p.H = msg.h; p.cells = msg.cells; p.links = msg.links || [];
        p.cur = msg.cur || null; p.defFg = msg.def_fg; p.defBg = msg.def_bg;
        p.scroll = msg.scroll || null;
        scheduleDraw(p); break;
      }
      case "pane_diff": {
        const p = pane(msg.pane);
        if (msg.cells) for (const dc of msg.cells) p.cells[dc.i] = dc;
        if (msg.cur) p.cur = msg.cur;
        // Every frame carries current scroll, absent ⇒ no scrollback: reset, don't
        // retain (a stale max misplaces read coords after the buffer shrinks, e.g. clear).
        p.scroll = msg.scroll || null;
        scheduleDraw(p); break;
      }
      case "pane_title": { const p = pane(msg.pane); p.title = msg.title; renderChrome(p); refreshPaneList(); break; }
      case "pane_cwd": { const p = pane(msg.pane); p.cwd = msg.cwd; renderChrome(p); break; }
      // The branch arrives on its own message rather than with the cwd: a
      // checkout changes it without the pane ever moving, so the two are pushed
      // independently (see browserproto's PaneBranch).
      case "pane_branch": { const p = pane(msg.pane); p.branch = msg.branch; renderChrome(p); break; }
      case "pane_agent": {
        const p = pane(msg.pane); p.agent = msg.agent; p.agentState = msg.state;
        // Absent (an agent with no resolvable model) clears it — a stale model
        // must not outlive the agent the server reported it for.
        p.agentModel = msg.model || "";
        renderChrome(p); refreshPaneList(); break;
      }
      case "pane_modes": {
        const p = pane(msg.pane); p.modes = { mouse: !!msg.mouse, alt: !!msg.alt_screen, kitty: msg.kitty | 0 };
        break;
      }
      case "pane_exited": { const p = pane(msg.pane); p.exited = msg.code; renderChrome(p); refreshPaneList(); break; }
      case "agents": renderAgents(msg.items); break;
      case "hosts": renderHosts(msg.items); break;
      case "history": renderHistory(msg.entries || []); break;
      case "usage": renderUsage(msg); break;
      case "clipboard": // OSC 52 write from a pane app — no user activation
        try { clipWrite(b64decode(msg.data)).catch(() => {}); } catch (e) {}
        break;
      case "notify": handleNotify(msg); break;
      case "title": document.title = msg.title ? ("Cats Mux · " + msg.title) : "Cats Mux"; break;
      case "update_ready":
        updateInfo = { version: msg.version || "", command: msg.command || "" };
        gearEl.classList.add("badge");
        showUpdateBanner();
        break;
      case "error": toast("error: " + msg.msg); break;
      // The server pushes the full resolved palette on any theme change
      // (settings save here or elsewhere, catctl theme/reload, theme.save) so
      // every connected client restyles live, not on its next page load.
      case "theme": applyThemeInline(msg.colors || {}, msg.font || ""); break;
      case "shutdown": setStatus("server shut down", true); break;
      case "cmd_result": {
        const cb = cmdCbs.get(msg.id);
        if (cb) { cmdCbs.delete(msg.id); cb(msg); }
        else if (!msg.ok) toast("cmd failed: " + (msg.error || "unknown"));
        break;
      }
      case "chat_state": chatApplyState(msg); break;
      case "chat_snapshot": chatApplySnapshot(msg); break;
      case "chat_row": chatUpsertRow(msg.row); break;
      case "chat_delta": chatAppendDelta(msg.id, msg.text); break;
      case "chat_perm": chatPermUpdate(msg); break;
    }
  }

  function b64decode(s) {
    try { return decodeURIComponent(escape(atob(s))); } catch (e) { return atob(s); }
  }

  // ---- Send helpers ----
  function sendMsg(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
  function sendCmd(name, params) { sendMsg({ t: "cmd", name, params }); }

  // followLink handles a click on an OSC 8 hyperlink. Everything the browser
  // can open, it opens; a file:// URI it hands to the session's editor instead.
  //
  // That second half is the whole point. A file:// link emitted by a compiler,
  // a test runner or a linter names a file on the machine the PANE is on, which
  // in a multi-host session is very often not this one — and even when it is,
  // a browser "opening" a source file means rendering it as text in a tab,
  // which is not what anybody clicking a stack trace wanted. pane.open_file
  // resolves the editor on that pane's own host and asks it.
  function followLink(pane, href) {
    const target = fileLinkTarget(href);
    if (!target) { window.open(href, "_blank", "noopener"); return; }
    sendCmd("pane.open_file", { path: target.path, line: target.line, pane: pane.id });
  }

  // fileLinkTarget picks a path and line out of a file:// URI, or returns null
  // for anything else. The line may be written #L42 (the GitHub spelling, which
  // is what most tools emit) or #42; a URI with neither opens the file wherever
  // the editor last left it.
  function fileLinkTarget(href) {
    if (!/^file:\/\//i.test(href)) return null;
    let u;
    try { u = new URL(href); } catch (_) { return null; }
    // A host component is a file on ANOTHER machine, which this side cannot
    // name — the path would be resolved against the editor's own disk and
    // silently open the wrong file, or none. Better to let the browser refuse
    // it visibly.
    if (u.host && u.host !== "localhost") return null;
    let path;
    try { path = decodeURIComponent(u.pathname); } catch (_) { path = u.pathname; }
    if (!path) return null;
    const m = /^#L?(\d+)$/.exec(u.hash || "");
    return { path, line: m ? parseInt(m[1], 10) : 0 };
  }

  // sendCmdAwait issues a command under a fresh id and resolves cb with its
  // cmd_result (read/capture and the §7 query commands carry result data).
  let cmdSeq = 0;
  const cmdCbs = new Map();
  function sendCmdAwait(name, params, cb) {
    const id = "b" + (++cmdSeq);
    cmdCbs.set(id, cb);
    sendMsg({ t: "cmd", id, name, params });
  }

  // ---- Keyboard (D4: structured, never pre-encoded) ----
  function mods(e) {
    return (e.shiftKey ? 1 : 0) | (e.altKey ? 2 : 0) | (e.ctrlKey ? 4 : 0) | (e.metaKey ? 8 : 0);
  }

  // CMD_TO_PANE is the curated set of ⌘ chords cats hands DOWN to a pane
  // instead of leaving them to the browser — the accelerators a terminal
  // app wants and a browser can spare, matched on e.code so a non-QWERTY
  // layout still gets the physical key (same rule as ⌘K / ⌘B above).
  //
  // Chosen by what the browser loses. ⌘W ⌘T ⌘L ⌘R ⌘N ⌘Q are the window's
  // own and are deliberately absent: swallowing "close the tab" to give a
  // pane a shortcut is a bad trade, and a user who cannot close a tab
  // blames cats, correctly. The set below costs a page that draws its
  // panes into a CANVAS almost nothing — ⌘F's find bar cannot see canvas
  // text, ⌘P would print a screenshot of a terminal, ⌘S would save this
  // page's HTML, ⌘D bookmarks a URL that is already the only one — while
  // on the other side of the wire they are save, find, print-free
  // navigation and duplicate-line in an editor. Note ⌘P also takes ⌘⇧P
  // with it (e.code ignores Shift), which is Firefox's private-window
  // chord; that is the one real cost, and it is paid only while a
  // kitty-protocol pane has focus.
  //
  // Shift is NOT part of the key: the pane receives the modifiers and
  // decides, so ⌘F and ⌘⇧F are one entry here and two chords there.
  //
  // ⌘E was added after the fact, on the same test: Safari and Chrome spend
  // it on "use selection for find", which asks a CANVAS for a text
  // selection it cannot have, so the browser gives up nothing at all —
  // while on the other side it is the editor's recent-files switcher.
  //
  // Confirmed by hand 2026-08-14, and it corrects the test above: in
  // CHROME ⌘E never reaches this page. The chord is a native menu item,
  // resolved before the keydown is dispatched, so there is no event to
  // preventDefault and this set has no say in the matter. The entry stays
  // because the MAC APP — which has no ⌘E menu item, so the chord falls
  // through the responder chain to the WebView — does deliver it, and the
  // mac app is where this is actually used.
  //
  // ⌘E is the ONLY one, and the rest of the set was checked the same day
  // to establish that: ⌘S ⌘P ⌘F ⌘D ⌘G all reach an editor pane in Chrome
  // AND in the mac app. Each of those is a Chrome menu item too (Save
  // Page As, Print, Find, Bookmark, Find Next), so a menu binding is not
  // by itself disqualifying — Chrome dispatches the keydown first and
  // honours preventDefault, which is the same courtesy that lets any web
  // editor claim ⌘S. ⌘E is the exception to that rule, not an example of
  // it. ⌘/ has no menu binding anywhere and was never in doubt.
  //
  // The lesson is narrow, then, but keep it in mind when adding a chord:
  // this set was curated by what the browser LOSES, which is a proxy for
  // the question that actually decides delivery — will the host HAND IT
  // OVER. The proxy holds for every chord here but one. Test a new entry
  // in a real browser rather than reasoning it in; the failure is benign
  // (a chord the host keeps is inert here, never a chord that does the
  // wrong thing) but silent, and silent is how ⌘E sat wrong for a day.
  const CMD_TO_PANE = new Set(["KeyS", "KeyP", "KeyE", "KeyF", "KeyD", "KeyG", "Slash"]);

  // cmdGoesToPane answers "does the focused pane want this ⌘ chord?" —
  // and the answer is no unless that pane ASKED for the kitty keyboard
  // protocol. That gate is what keeps this from being a regression for
  // shells: a legacy pane cannot receive a super chord at all (the input
  // encoder emits no bytes for one, same as Ghostty), so forwarding it
  // there would eat the user's browser shortcut and send nothing in its
  // place. An app that turned the protocol on is an app with its own
  // keymap, which is exactly who this is for.
  function cmdGoesToPane(e) {
    if (!CMD_TO_PANE.has(e.code)) return false;
    const id = focusedPaneId();
    if (id === null) return false;
    const p = panes.get(id);
    return !!(p && p.modes && p.modes.kitty);
  }

  function onKey(e) {
    // The chat panel owns the keyboard while focus is inside it: composed
    // text must never reach a PTY, and terminal shortcuts (⌘V paste-to-pane,
    // font sizing) must not fire mid-composition.
    if (chatEl.contains(document.activeElement)) return;
    // An open dialog/menu/palette owns the keyboard: its own listeners handle
    // Enter/arrows, Escape falls through to here, and nothing reaches the PTY.
    if (uiOpen()) {
      if (e.type === "keydown" && e.key === "Escape") { e.preventDefault(); closeCtx(); closeModal(); }
      return;
    }
    // Copy-mode captures the keyboard entirely — motions/yank, nothing to the PTY.
    if (copyModePane) {
      e.preventDefault();
      if (e.type === "keydown") copyModeKey(copyModePane, e);
      return;
    }
    // ⌘K (mac) / Ctrl+Alt+K opens the command palette / navigator.
    if (e.type === "keydown" && e.code === "KeyK" &&
        ((e.metaKey && !e.ctrlKey) || (e.ctrlKey && e.altKey))) {
      e.preventDefault(); openPalette(); return;
    }
    // ⌘B (mac) / Ctrl+Alt+B folds the left column away and back. Same modifier
    // pair as the palette above, so the window-chrome toggles are learned once;
    // matched on e.code so a non-QWERTY layout still gets the physical key.
    if (e.type === "keydown" && e.code === "KeyB" &&
        ((e.metaKey && !e.ctrlKey) || (e.ctrlKey && e.altKey))) {
      e.preventDefault(); setSidebarHidden(!sidebarHidden()); return;
    }
    // ⌘[ / ⌘] (mac) — Ctrl+Alt+[ / ] elsewhere: cats-level back/forward
    // through this window's focus-location history (nav.back / nav.forward),
    // reaching across panes, tabs and workspaces. The server owns the stack;
    // the page only names the direction. Shift is excluded so ⌘⇧[ / ⌘⇧]
    // (browser tab prev/next) stay with the browser.
    if (e.type === "keydown" && !e.shiftKey &&
        (e.code === "BracketLeft" || e.code === "BracketRight") &&
        ((e.metaKey && !e.ctrlKey) || (e.ctrlKey && e.altKey))) {
      e.preventDefault();
      sendCmd(e.code === "BracketLeft" ? "nav.back" : "nav.forward", {});
      return;
    }
    const isV = e.key === "v" || e.key === "V";
    if (e.type === "keydown" && e.metaKey && !e.ctrlKey && isV) { e.preventDefault(); pasteText(); return; }
    // ⌘+ / ⌘- / ⌘0 size the terminal type instead of zooming the browser (page
    // zoom would blur the canvas and leave the grid math on the old cell size).
    // Matched on e.code so ⌘= and ⌘⇧+ are the same key, numpad included.
    if (e.type === "keydown" && e.metaKey && !e.ctrlKey) {
      switch (e.code) {
        case "Equal": case "NumpadAdd":
          e.preventDefault(); setFontSize(FONT_PX + 1); return;
        case "Minus": case "NumpadSubtract":
          e.preventDefault(); setFontSize(FONT_PX - 1); return;
        case "Digit0": case "Numpad0":
          e.preventDefault(); setFontSize(FONT_DEFAULT); return;
      }
    }
    // ⌘← / ⌘→ — the macOS line-start / line-end convention — delivered to
    // the pane as Home / End. The chord itself cannot be forwarded: on a
    // legacy pane the encoder emits no bytes for a super chord (see
    // CMD_TO_PANE below), so the pane would receive nothing — while
    // Home/End is something every pane can act on: readline and zsh bind
    // them to beginning/end-of-line out of the box, and full-screen apps
    // read them as the motions they already are. The preventDefault
    // matters as much as the translation: without it the browser spends
    // ⌘←/⌘→ on history navigation, which tears down the WebSocket.
    // Shift is excluded so ⌘⇧←/→ stay whatever the host means by them,
    // rather than a phantom ⇧Home selection the pane never asked for.
    if (!e.shiftKey && e.metaKey && !e.ctrlKey && !e.altKey &&
        (e.code === "ArrowLeft" || e.code === "ArrowRight")) {
      e.preventDefault();
      if (e.type === "keydown") clearStaleSelections();
      const code = e.code === "ArrowLeft" ? "Home" : "End";
      // mods 0, not mods(e): the pane must see a bare Home/End, not
      // super+Home (which a kitty-protocol app would treat as a different,
      // unbound chord).
      sendMsg({ t: "key", code, key: code, mods: 0,
                kind: e.type === "keyup" ? "u" : (e.repeat ? "r" : "d") });
      return;
    }
    // ⌘C and ⌘Z/⌘⇧Z fall through to the pane below: apps speaking the kitty
    // keyboard protocol (editors like rd) receive super+c / super+z and run
    // their own copy/undo; for legacy panes the server's encoder emits
    // nothing, same as Ghostty. cats' own copy paths (drag, copy-mode)
    // already copied by the time ⌘C could be pressed, so nothing here
    // competes with them.
    //
    // Everything else with Meta is decided by CMD_TO_PANE + the focused
    // pane's keyboard mode (see the table above): an editor that asked for
    // the kitty protocol gets its accelerator, a shell does not and keeps
    // the browser's.
    if (e.metaKey && !e.ctrlKey && e.code !== "KeyC" && e.code !== "KeyZ" && !cmdGoesToPane(e)) return;
    if (e.code === "F12") return;         // devtools
    e.preventDefault();
    // Typing to the terminal dismisses a lingering (stale) copy wash.
    if (e.type === "keydown") clearStaleSelections();
    const kind = e.type === "keyup" ? "u" : (e.repeat ? "r" : "d");
    sendMsg({ t: "key", code: e.code, key: e.key, mods: mods(e), kind });
  }
  window.addEventListener("keydown", onKey);
  window.addEventListener("keyup", onKey);

  // The mouse's back/forward buttons (4/5, ev.button 3/4) mirror ⌘[ / ⌘]:
  // cats-level navigation, wherever on the page they are pressed. Capture
  // phase + preventDefault on mousedown is what stops the browser from
  // driving its own history instead (which would tear down the WebSocket);
  // the auxclick suppressor covers browsers that navigate on that event.
  // The pane mouse path never sees these buttons (attachMouse drops >2).
  window.addEventListener("mousedown", (ev) => {
    if (ev.button !== 3 && ev.button !== 4) return;
    ev.preventDefault(); ev.stopPropagation();
    sendCmd(ev.button === 3 ? "nav.back" : "nav.forward", {});
  }, true);
  window.addEventListener("auxclick", (ev) => {
    if (ev.button === 3 || ev.button === 4) ev.preventDefault();
  }, true);

  // ---- Clipboard ----
  // The mac app binds catsClipWrite/catsClipRead (native pasteboard) into the
  // page, because WKWebView cripples navigator.clipboard: reads resolve empty
  // and writes demand a user activation that WebSocket-driven copies (OSC 52
  // from a pane, §7 read results) never have. Prefer the bridge when present;
  // browsers keep using navigator.clipboard.
  function clipWrite(text) {
    if (window.catsClipWrite) return window.catsClipWrite(text);
    return navigator.clipboard.writeText(text);
  }
  function clipRead() {
    if (window.catsClipRead) return window.catsClipRead();
    if (!navigator.clipboard || !navigator.clipboard.readText)
      return Promise.reject(new Error("clipboard read unavailable"));
    return navigator.clipboard.readText();
  }

  // ---- Paste ----
  function pasteText() {
    clipRead()
      .then((t) => { if (t) sendMsg({ t: "paste", data: t }); else toast("clipboard has no text"); })
      .catch((err) => toast("paste blocked: " + ((err && err.name) || err)));
  }
  document.addEventListener("paste", (e) => {
    if (chatEl.contains(e.target)) return; // a paste into the composer stays local
    const text = (e.clipboardData || window.clipboardData).getData("text");
    if (text) { e.preventDefault(); sendMsg({ t: "paste", data: text }); }
  });

  // ---- Mouse (structured cell coords; server applies the pane's encoding) ----
  function cellOf(p, ev) {
    // userX/userY undo the pane's text inset first, so a click in the margin
    // clamps to the nearest edge cell (what the user visually intends).
    const x = Math.min(Math.max(0, Math.floor(userX(p, ev.clientX) / cellW)), Math.max(0, p.W - 1));
    const y = Math.min(Math.max(0, Math.floor(userY(p, ev.clientY) / cellH)), Math.max(0, p.H - 1));
    return [x, y];
  }

  function sendMouse(p, kind, btn, ev, dx, dy) {
    const [x, y] = cellOf(p, ev);
    const m = { t: "mouse", pane: p.id, x, y, btn, kind, mods: mods(ev) };
    if (dx) m.dx = dx;
    if (dy) m.dy = dy;
    sendMsg(m);
  }

  // absPoint maps a viewport cell {x,y} to the [row, col] the server's read wants:
  // absolute screen-buffer coordinates from the top of scrollback. The frame's
  // scroll gives the history above the viewport (max) and how far it is scrolled up
  // (off), so the top visible row is (max - off). No scroll info ⇒ no scrollback.
  function absPoint(p, cell) {
    const off = p.scroll ? p.scroll.off : 0;
    const max = p.scroll ? p.scroll.max : 0;
    return [max - off + cell.y, cell.x];
  }

  // readAndCopy issues a §7 read over a viewport cell range and writes the
  // extracted text to the clipboard. Endpoints are inclusive viewport cells,
  // mapped to absolute buffer coords; rect selects a block. Shared by the mouse
  // drag path and keyboard copy-mode.
  function readAndCopy(p, aCell, bCell, rect) {
    sendCmdAwait("read", {
      pane: p.id, anchor: absPoint(p, aCell), cursor: absPoint(p, bCell), rect,
    }, (res) => {
      if (!res.ok) { toast("read failed: " + (res.error || "unknown")); return; }
      const text = res.data && res.data.text;
      if (!text) { toast("selection is empty"); return; }
      clipWrite(text).then(
        () => toast("copied " + text.length + " char" + (text.length === 1 ? "" : "s")),
        () => toast("clipboard write blocked"));
    });
  }

  // finishSelection copies the pane's completed drag range, marking the wash done
  // so a later keystroke (clearStaleSelections) dismisses the now-stale highlight.
  function finishSelection(p) {
    readAndCopy(p, p.sel.anchor, p.sel.cursor, p.sel.rect);
    p.sel.done = true;
  }

  // copyScrollback captures the pane's whole buffer (§7 capture, soft-wraps
  // rejoined) and copies it — the pane menu's "copy scrollback", distinct from
  // a range read.
  function copyScrollback(id) {
    const p = panes.get(id);
    if (!p) return;
    sendCmdAwait("capture", { pane: id, scope: 1, lines: 0, unwrap: true }, (res) => {
      if (!res.ok) { toast("capture failed: " + (res.error || "unknown")); return; }
      const text = res.data && res.data.text;
      if (!text) { toast("nothing to copy"); return; }
      clipWrite(text).then(
        () => toast("copied " + text.length + " chars (scrollback)"),
        () => toast("clipboard write blocked"));
    });
  }

  // clearStaleSelections drops any completed drag wash (p.sel.done) — a fixed
  // viewport highlight goes stale once new output or the cursor moves, so the
  // next keystroke to the terminal dismisses it. Active drags are left alone.
  function clearStaleSelections() {
    for (const p of panes.values()) {
      if (p.sel && p.sel.done) { p.sel = null; scheduleDraw(p); }
    }
  }

  // ---- Keyboard copy-mode (§7 read via hjkl/arrows, no mouse needed) ----
  //
  // A tmux-style selection driven from the keyboard: enter on a pane, move the
  // cursor, press v to begin selecting, y/Enter to yank into the clipboard, Esc
  // to leave. Motions operate on viewport cells; k/j past the top/bottom scroll
  // the pane so the selection can reach into scrollback.

  function enterCopyMode(id) {
    const p = panes.get(id);
    if (!p) return;
    sendCmd("pane.focus", { pane: id });
    exitCopyMode(); // only one pane at a time
    const start = (p.cur && p.cur.vis) ? { x: p.cur.x, y: p.cur.y } : { x: 0, y: 0 };
    p.cm = { cursor: start, anchor: null, rect: false };
    copyModePane = p;
    p.sel = null;
    renderChrome(p); // the pane's header shows the COPY chip + key hints
    scheduleDraw(p);
  }

  function exitCopyMode() {
    const p = copyModePane;
    copyModePane = null;
    if (!p) return;
    p.cm = null; p.sel = null;
    renderChrome(p);
    scheduleDraw(p);
  }

  // cmSyncSel mirrors the copy-mode range onto p.sel so drawSelection washes it
  // (only once an anchor is set with v).
  function cmSyncSel(p) {
    const cm = p.cm;
    p.sel = cm.anchor ? { anchor: cm.anchor, cursor: cm.cursor, rect: cm.rect, moved: true } : null;
  }

  // Copy-mode keybindings. catway injects window.__catsKeys.copyMode
  // (action → [keys]) from the YAML config; this built-in table is the fallback
  // when the page is served standalone or the config omits copy_mode. We index it
  // as key → action so copyModeKey is a switch on the action, not the raw key.
  const COPY_MODE_DEFAULT = {
    "move-left": ["ArrowLeft", "h"], "move-right": ["ArrowRight", "l"],
    "move-up": ["ArrowUp", "k"], "move-down": ["ArrowDown", "j"],
    "line-start": ["0", "Home"], "line-end": ["$", "End"],
    "top": ["g"], "bottom": ["G"], "select": ["v"], "rect": ["r"],
    "yank": ["y", "Enter"], "exit": ["Escape", "q"],
  };
  const COPY_KEY = (() => {
    const table = (window.__catsKeys && window.__catsKeys.copyMode) || COPY_MODE_DEFAULT;
    const map = {};
    for (const action in table) for (const k of (table[action] || [])) map[k] = action;
    return map;
  })();

  // copyModeKey handles one keydown while in copy-mode; returns without touching
  // the terminal (onKey has already swallowed the event).
  function copyModeKey(p, e) {
    const cm = p.cm;
    if (!cm) return;
    const clampX = (x) => Math.min(Math.max(0, x), Math.max(0, p.W - 1));
    const clampY = (y) => Math.min(Math.max(0, y), Math.max(0, p.H - 1));
    const move = (dx, dy) => {
      let ny = cm.cursor.y + dy;
      if (ny < 0) { sendCmd("scroll", { pane: p.id, delta: -1 }); ny = 0; }
      else if (ny > p.H - 1) { sendCmd("scroll", { pane: p.id, delta: 1 }); ny = p.H - 1; }
      cm.cursor = { x: clampX(cm.cursor.x + dx), y: clampY(ny) };
    };
    switch (COPY_KEY[e.key]) {
      case "move-left": move(-1, 0); break;
      case "move-right": move(1, 0); break;
      case "move-up": move(0, -1); break;
      case "move-down": move(0, 1); break;
      case "line-start": cm.cursor = { x: 0, y: cm.cursor.y }; break;
      case "line-end": cm.cursor = { x: Math.max(0, p.W - 1), y: cm.cursor.y }; break;
      case "top": cm.cursor = { x: cm.cursor.x, y: 0 }; break;
      case "bottom": cm.cursor = { x: cm.cursor.x, y: Math.max(0, p.H - 1) }; break;
      case "select": cm.anchor = cm.anchor ? null : { x: cm.cursor.x, y: cm.cursor.y }; break;
      case "rect": cm.rect = !cm.rect; break;
      case "yank": copyModeYank(p); return;
      case "exit": exitCopyMode(); return;
      default: return; // unbound key: stay in copy-mode, do nothing
    }
    cmSyncSel(p);
    scheduleDraw(p);
  }

  // copyModeYank reads the current copy-mode range (anchor→cursor, or just the
  // cursor cell if nothing is anchored yet) into the clipboard, then exits.
  function copyModeYank(p) {
    const cm = p.cm;
    readAndCopy(p, cm.anchor || cm.cursor, cm.cursor, cm.rect);
    exitCopyMode();
  }

  // beginScrollDrag drags the pane's scrollbar thumb: each pointer move maps to
  // a target history offset and sends the delta (§7 scroll is relative). The
  // server's next frame updates p.scroll, keeping successive deltas honest.
  function beginScrollDrag(p, ev0) {
    let queued = false;
    const move = (ev) => {
      if (!hasScrollbar(p) || queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        if (!hasScrollbar(p)) return;
        const vh = p.H * cellH;
        const total = p.scroll.max + p.scroll.rows;
        const h = Math.max(20, vh * p.scroll.rows / total);
        const span = vh - h;
        if (span <= 0) return;
        const frac = Math.min(1, Math.max(0, (userY(p, ev.clientY) - h / 2) / span));
        const target = Math.round(p.scroll.max * (1 - frac));
        const delta = p.scroll.off - target; // positive = toward the live bottom
        if (delta) sendCmd("scroll", { pane: p.id, delta });
      });
    };
    const up = () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    move(ev0);
  }

  // ---- Drag-and-drop upload ----
  //
  // Dropping a file on a pane writes it into that pane's working directory, on
  // that pane's machine. The destination is named by NOT naming it: file.put
  // resolves a relative path against the anchor pane's live cwd on the host the
  // pane runs on, so the browser sends a bare filename and never learns either.
  // A cwd read here would also be the cwd as of the last pane_cwd event, which
  // is a different directory from the one the pane is in now if somebody just
  // cd'd — and the file would land in the wrong place with no way to tell.
  //
  // The chunking is the same loop `catctl cp` runs, for the same reason (see
  // internal/filexfer): every hop to the destination disk is a whole-message
  // transport with a ceiling.
  const UPLOAD_CHUNK = 1 << 20;   // filexfer.MaxChunk; a larger chunk is refused
  const UPLOAD_TIMEOUT_MS = 60000; // one chunk, not one transfer

  // hasFiles distinguishes a file dragged in from the desktop from every
  // in-app drag (pane swaps, sidebar reordering), which carry no Files type and
  // must not light up a drop target that would try to upload them.
  function hasFiles(ev) {
    const dt = ev.dataTransfer;
    return !!dt && Array.prototype.indexOf.call(dt.types || [], "Files") >= 0;
  }

  function attachDrop(p) {
    // dragenter/dragleave fire for every child element the pointer crosses, so
    // a plain add/remove pair would flicker the highlight off the moment the
    // cursor moved from the canvas onto the chrome. Counting depth is the
    // standard fix and the only reliable one.
    let depth = 0;
    const clear = () => { depth = 0; p.el.classList.remove("filedrop"); };
    p.el.addEventListener("dragenter", (ev) => {
      if (!hasFiles(ev)) return;
      ev.preventDefault();
      if (depth++ === 0) p.el.classList.add("filedrop");
    });
    p.el.addEventListener("dragover", (ev) => {
      if (!hasFiles(ev)) return;
      ev.preventDefault();                  // without this the drop never fires
      ev.dataTransfer.dropEffect = "copy";
    });
    p.el.addEventListener("dragleave", () => { if (depth > 0 && --depth === 0) clear(); });
    p.el.addEventListener("drop", (ev) => {
      if (!hasFiles(ev)) return;
      ev.preventDefault();                  // else the browser navigates to the file
      clear();
      for (const f of ev.dataTransfer.files) uploadFile(p, f);
    });
  }

  // uploadFile sends one dropped file to the pane's cwd, a chunk at a time.
  //
  // Nothing is overwritten. A name already taken on the far side comes back as
  // a refusal from file.put and is shown as one — the alternative is a silent
  // replacement of somebody's file on a machine the person dropping may not
  // even be looking at.
  async function uploadFile(p, file) {
    // A basename, never a path. Browsers hand over the leaf name for a plain
    // file but a RELATIVE path for a directory drop, and a path here would
    // write outside the pane's cwd — including upward, given "..". Dotfiles
    // keep their dot: ".bashrc" is a name, while "." and ".." are not.
    let name = (file.name || "file").split(/[\\/]/).pop();
    if (!name || name === "." || name === "..") name = "file";
    const total = file.size;
    let offset = 0;
    try {
      do {
        const buf = new Uint8Array(await file.slice(offset, offset + UPLOAD_CHUNK).arrayBuffer());
        const more = offset + buf.length < total;
        await putChunk(p.id, name, buf, offset, more);
        offset += buf.length;
      } while (offset < total);
      toast(name + " → " + (p.pub || "pane " + p.id) + " (" + fmtBytes(total) + ")");
    } catch (err) {
      // The offset is in the message because a failed transfer leaves a
      // .name.cats-part fragment on the far side, and knowing how far it got is
      // the difference between "retry" and "go and look".
      toast("upload of " + name + " failed at " + fmtBytes(offset) + ": " + err.message);
    }
  }

  // putChunk is one file.put as a promise. The timeout is per chunk rather than
  // per transfer, and it exists because a dropped WebSocket resolves no
  // callback at all: without it a broken link would leave the upload hanging
  // with no toast either way.
  function putChunk(pane, path, bytes, offset, more) {
    return new Promise((resolve, reject) => {
      let done = false;
      const timer = setTimeout(() => {
        if (done) return;
        done = true;
        reject(new Error("timed out"));
      }, UPLOAD_TIMEOUT_MS);
      sendCmdAwait("file.put", { pane, path, offset, more, data: b64encodeBytes(bytes) }, (msg) => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (msg.ok) resolve(msg.data);
        else reject(new Error(msg.error || "refused"));
      });
    });
  }

  // b64encodeBytes renders a byte array as base64, which is how Go decodes a
  // []byte field. Chunked through String.fromCharCode because spreading a
  // megabyte of bytes into one call overflows the argument stack.
  function b64encodeBytes(bytes) {
    let s = "";
    const step = 0x8000;
    for (let i = 0; i < bytes.length; i += step) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    }
    return btoa(s);
  }

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }

  function attachMouse(p) {
    p.canvas.addEventListener("mousedown", (ev) => {
      if (copyModePane) exitCopyMode(); // a mouse drag supersedes keyboard copy-mode
      if (p.info && !p.info.focused) sendCmd("pane.focus", { pane: p.id });
      // The scrollbar strip owns left-drags whenever it is drawn.
      if (ev.button === 0 && hasScrollbar(p)) {
        // The strip is drawn in grid space (drawScrollbar), so compare there.
        if (userX(p, ev.clientX) >= p.W * cellW - SB_W - 2) {
          ev.preventDefault();
          beginScrollDrag(p, ev);
          return;
        }
      }
      if (!p.modes.mouse) {
        // No capture: left-drag originates a browser-local selection (§7 read);
        // Alt makes it a rectangular block. A plain click (no drag) is resolved on
        // mouseup — hyperlink follow, per α.
        if (ev.button !== 0) return;
        ev.preventDefault();
        const [x, y] = cellOf(p, ev);
        p.sel = { anchor: { x, y }, cursor: { x, y }, rect: ev.altKey, moved: false };
        scheduleDraw(p);
        return;
      }
      if (ev.button > 2) return;
      ev.preventDefault();
      p.pressed = ev.button;
      sendMouse(p, "d", ev.button, ev);
    });
    p.canvas.addEventListener("mousemove", (ev) => {
      // A copied drag keeps its wash on screen (p.sel.done) until a keystroke
      // clears it — but it is finished, so the pointer must not go on extending
      // it. Requiring the button still be held also covers a mouseup we missed.
      if (p.sel && !p.sel.done && (ev.buttons & 1)) {
        const [x, y] = cellOf(p, ev);
        if (x === p.sel.cursor.x && y === p.sel.cursor.y) return; // one update per cell
        p.sel.cursor = { x, y };
        if (x !== p.sel.anchor.x || y !== p.sel.anchor.y) p.sel.moved = true;
        scheduleDraw(p);
        return;
      }
      if (!p.modes.mouse) return;
      const key = cellOf(p, ev).join(":");
      if (key === p.lastCell) return; // one report per cell
      p.lastCell = key;
      sendMouse(p, "m", p.pressed >= 0 ? p.pressed : 3, ev);
    });
    p.canvas.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const lines = ev.deltaMode === 1 ? Math.round(ev.deltaY)
        : Math.sign(ev.deltaY) * Math.max(1, Math.round(Math.abs(ev.deltaY) / (cellH * (p.gs || 1))));
      if (!lines) return;
      if (p.modes.mouse || p.modes.alt) sendMouse(p, "w", 3, ev, 0, lines);
      else {
        if (p.sel) { p.sel = null; scheduleDraw(p); } // scrolling invalidates the fixed-viewport wash
        sendCmd("scroll", { pane: p.id, delta: lines });
      }
    }, { passive: false });
    // Right-click: mouse-capturing apps get the encoded button; otherwise the
    // pane menu (with paste on top) replaces the browser's default menu.
    p.canvas.addEventListener("contextmenu", (ev) => {
      ev.preventDefault();
      if (!p.modes.mouse) openCtx(ev.clientX, ev.clientY, paneMenuItems(p.id, true));
    });
  }

  // Release is watched on the window, not the canvas: a drag that ends outside
  // the pane still has to finish its selection, and a mouse-capturing app still
  // has to see the button go up.
  //
  // One listener for all panes, iterating the live map. Per-pane registration
  // leaked: applyLayout tears every pane down on each tab switch (the layout
  // carries the active tab only) and an element removal does not unregister a
  // window listener, so dead panes kept firing here — and kept their cell grids
  // alive — for the life of the page.
  window.addEventListener("mouseup", (ev) => {
    for (const p of panes.values()) {
      // Without !done, a lingering copied wash would re-read and re-copy itself
      // on the next click made anywhere.
      if (p.sel && !p.sel.done) {
        const sel = p.sel;
        if (sel.moved) {
          finishSelection(p);            // a real drag → read + copy, keep the wash
        } else {
          p.sel = null;                  // a click → follow a hyperlink under it
          scheduleDraw(p);
          const c = p.cells[sel.anchor.y * p.W + sel.anchor.x];
          if (c && c.h && p.links[c.h - 1]) followLink(p, p.links[c.h - 1]);
        }
        continue;
      }
      if (p.pressed < 0 || ev.button !== p.pressed) continue;
      const btn = p.pressed;
      p.pressed = -1;
      if (p.modes.mouse) sendMouse(p, "u", btn, ev);
    }
  });

  // ---- Overlay + modal infrastructure (WS8) ----
  //
  // One overlay at a time (dialog, palette, or help) plus an independent
  // context menu. While any is open the keyboard belongs to the UI: onKey
  // returns early (no preventDefault, so modal inputs type normally) and a
  // capture-phase Escape closes whatever is up.

  let modalEl = null; // current #overlay root, or null
  let ctxEl = null;   // current #ctxmenu, or null
  let modalCleanup = null; // runs on any close path (settings preview rollback)
  function uiOpen() { return !!(modalEl || ctxEl); }

  function closeModal() {
    if (modalEl) { modalEl.remove(); modalEl = null; }
    if (modalCleanup) { const fn = modalCleanup; modalCleanup = null; fn(); }
  }
  // Menus form a chain (a menu's open submenu hangs off _sub), so closing means
  // walking it: a submenu is a sibling in the DOM, not a descendant, and would
  // otherwise be orphaned on screen when its parent goes.
  function closeCtx() { if (ctxEl) { closeCtxChain(ctxEl); ctxEl = null; } }
  function closeCtxChain(m) { if (m._sub) closeCtxChain(m._sub); m.remove(); }
  function ctxChainHas(m, node) {
    for (; m; m = m._sub) if (m.contains(node)) return true;
    return false;
  }

  // openOverlay mounts a fresh overlay; build receives the overlay element and
  // appends its .modal. A mousedown on the backdrop dismisses.
  function openOverlay(build) {
    closeModal(); closeCtx();
    const ov = document.createElement("div");
    ov.id = "overlay";
    ov.addEventListener("mousedown", (e) => { if (e.target === ov) closeModal(); });
    build(ov);
    document.body.appendChild(ov);
    modalEl = ov;
    return ov;
  }

  // focusField hands a freshly-mounted dialog its caret — and then checks that
  // it kept it.
  //
  // One requestAnimationFrame is enough whenever the dialog is the first thing
  // to open: by the time the frame runs, the overlay is mounted and laid out,
  // so focus() lands. It is NOT enough when a dialog REPLACES another overlay
  // in the same tick — openOverlay's closeModal() removes the old #overlay
  // subtree, and the engine's "the focused element just left the document"
  // reset is not guaranteed to have run by the time our frame does. Chrome
  // clears it synchronously while the node is being removed and so never
  // showed this; the mac app's WKWebView (window_darwin.m) can clear it out of
  // band, landing AFTER our focus() and handing the document back to <body>.
  // That hand-back is invisible: the pane underneath is a canvas, never a focus
  // target, and it keeps drawing its own blinking cursor — so the dialog looks
  // and behaves as though the terminal still owns the keyboard. "add plugin"
  // (the plugins dialog's add… button) is the one dialog in the UI opened from
  // inside another overlay, which is why it was the one that showed it.
  //
  // So: take the focus, then re-assert it one frame later if something took it
  // away. Re-asserting is a no-op in the common case (we still hold it), and
  // two frames is ~33ms — far too short for the user to have deliberately
  // clicked elsewhere, so this can never fight a real intent.
  //
  // select re-selects the prefill on the first take only; a re-assert must not
  // wipe a selection the user has since narrowed by hand.
  function focusField(el, select) {
    const take = () => {
      if (document.activeElement === el) return;
      el.focus();
      // A <select> field (dialogFields' choice fields) has no select() method.
      if (select && el.select) el.select();
    };
    requestAnimationFrame(() => {
      take();
      requestAnimationFrame(() => take());
    });
  }

  function mkModalBtn(label, cls, fn) {
    const b = document.createElement("button");
    b.textContent = label; if (cls) b.className = cls;
    b.addEventListener("click", fn);
    return b;
  }

  // ---- Path picker (a directory field, cdx-style) ----
  //
  // A start path is where a workspace lives for the rest of its life, so typing
  // one blind — with no view of what is actually on the server's disk — was the
  // weakest part of the new-workspace dialog. attachPathPicker turns a text
  // field into a directory picker over the same two sources cdx (the user's TUI
  // cd assistant) offers: the directories they visit most, frecency-ranked, and
  // the subdirectories of wherever the path currently points.
  //
  // Filtering runs here, not on the server. path.list answers with one
  // directory's entire listing, which we cache and fuzzy-match per keystroke, so
  // a round trip happens only when the directory being completed *inside*
  // changes — worth caring about when the browser is a WAN away from the server.
  //
  // Three modes. An untouched prefill (see pristine) is not a fragment at all:
  // the field already names a directory, so the drop-down opens on the recents
  // plus that directory's own children — the history is one arrow key away, with
  // nothing to type and nothing to backspace. Once the user takes the field over,
  // it follows cdx: with no "/" typed yet the fragment matches recents and the
  // anchor directory's children together; once a path is under way it completes
  // inside the named directory, prefix matches first. The selection starts on the
  // best match while a fragment is being completed, and on *nothing* when the
  // text already names a directory (a trailing "/", or that untouched prefill) —
  // there, what the field already says is the answer.
  function attachPathPicker(input, wrap) {
    const listEl = document.createElement("div");
    listEl.className = "picker";
    wrap.appendChild(listEl);

    let recents = [];        // absolute dirs, best-first; asked for once per dialog
    let recentsAsked = false;
    let home = "";           // resolved server-side, so "~" means the same thing on both ends
    const cache = new Map(); // typed base ("" | "~/projs/" | "/usr/") -> path.list result
    const inflight = new Set();
    let rows = [], sel = -1;
    // enabled is the picker's own on/off switch (see setEnabled): a field whose
    // directory lives on a machine that cannot list it keeps the input and
    // loses the picker.
    let enabled = true;
    // host is the machine the listing is taken on ("" = the anchor pane's own).
    // It is carried on the request rather than inferred server-side because the
    // new-workspace dialog chooses a host BEFORE anything exists there: with
    // only a pane to go by, a path being typed for devbox would be completed
    // against the local disk and every suggestion would be a directory that
    // does not exist where the workspace is about to be created.
    let host = "";
    // A prefilled field arrives naming a directory the user never typed, so its
    // text is not a fragment being completed — it is where they already are.
    // While it stays untouched the picker lists *inside* it and offers the
    // recents alongside, which is the whole point of a drop-down: somewhere else
    // to go, visible the moment the dialog opens, with nothing to type and
    // nothing to backspace first.
    let pristine = !!input.value.trim();

    const shortHome = (p) => (home && (p === home ? "~" : (p.startsWith(home + "/") ? "~" + p.slice(home.length) : p))) || p;
    const joinPath = (dir, name) => (dir.endsWith("/") ? dir + name : dir + "/" + name);

    // splitBase divides the typed text into the directory part (as typed, with
    // its trailing slash) and the fragment being completed. A "" base is "no
    // separator yet" — the anchor directory, matched fuzzily.
    function splitBase(text) {
      if (pristine) return [text.replace(/\/+$/, "") + "/", ""]; // all base, no fragment
      if (text === "~" || text === "." || text === "..") return [text + "/", ""];
      const i = text.lastIndexOf("/");
      return i < 0 ? ["", text] : [text.slice(0, i + 1), text.slice(i + 1)];
    }

    // listing returns the cached path.list answer for a typed base, firing the
    // request (once) and re-rendering on arrival when it is not cached yet.
    function listing(base) {
      if (cache.has(base)) return cache.get(base);
      if (!inflight.has(base)) {
        inflight.add(base);
        const wantRecents = !recentsAsked;
        recentsAsked = true;
        sendCmdAwait("path.list", { dir: base, recents: wantRecents, host }, (res) => {
          inflight.delete(base);
          if (!res.ok) { if (wantRecents) recentsAsked = false; return; }
          const d = res.data || {};
          cache.set(base, d);
          if (d.home) home = d.home;
          if (wantRecents) recents = d.recents || [];
          if (input.isConnected) render();
        });
      }
      return null;
    }

    // rowsFor is the candidate list for the current text: {kind, label, path}.
    // null means the directory it needs has not been listed yet.
    function rowsFor(text) {
      const [base, frag] = splitBase(text);
      const d = listing(base);
      if (!d) return null;
      // A dot-fragment is the only thing that asks for dotfiles, the way it is
      // the only thing that does in a shell.
      const dirs = (d.dirs || []).filter((n) => frag.startsWith(".") || !n.startsWith("."));
      const dirRow = (n) => ({ kind: "dir", label: n + "/", path: joinPath(d.dir, n) });

      if (base && !pristine) { // completing inside a named directory
        const lf = frag.toLowerCase();
        let names = dirs.filter((n) => n.toLowerCase().startsWith(lf));
        if (!names.length && frag) names = fuzzyRank(frag, dirs, (n) => n);
        return names.map(dirRow);
      }
      const cands = [];
      for (const p of recents) {
        if (p === d.dir) continue; // "here" is not somewhere to go
        cands.push({ kind: "recent", label: shortHome(p), path: p });
      }
      for (const n of dirs) cands.push(dirRow(n));
      return frag ? fuzzyRank(frag, cands, (c) => c.label) : cands;
    }

    // fuzzyRank keeps the palette's scorer as the one fuzzy behaviour in the UI.
    function fuzzyRank(q, items, labelOf) {
      return items
        .map((it) => ({ it, s: fuzzyScore(q, labelOf(it)) }))
        .filter((x) => x.s >= 0)
        .sort((a, b) => b.s - a.s)
        .map((x) => x.it);
    }

    function note(text, cls) {
      const n = document.createElement("div");
      n.className = "note" + (cls ? " " + cls : "");
      n.textContent = text;
      listEl.appendChild(n);
    }

    function render(keepSel) {
      if (!enabled) return; // switched off for a remote path — nothing to list
      const text = input.value;
      const [base, frag] = splitBase(text);
      const next = rowsFor(text);
      const loading = next === null;
      rows = next || [];
      if (!keepSel) sel = frag && rows.length ? 0 : -1;
      if (sel >= rows.length) sel = rows.length - 1;

      listEl.innerHTML = "";
      const d = cache.get(base);
      if (d) {
        const head = document.createElement("div"); head.className = "head";
        head.textContent = "in " + shortHome(d.dir);
        listEl.appendChild(head);
      }
      // A path that is not on disk yet is not a dead end: submitting the
      // dialog offers to create it (see createWorkspace), so the error note
      // carries the way forward alongside the problem.
      if (d && !d.exists) {
        note(d.error || "not a directory", "err");
        if (!d.error || d.error.startsWith("no such directory")) note("enter offers to create this folder");
      }
      rows.slice(0, 60).forEach((r, i) => {
        const row = document.createElement("div");
        row.className = "row" + (i === sel ? " sel" : "");
        const kind = document.createElement("span"); kind.className = "kind"; kind.textContent = r.kind;
        const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = r.label;
        row.appendChild(kind); row.appendChild(lbl);
        // mousedown, not click: acting before the field can lose focus keeps the
        // caret (and the picker) alive for the next keystroke.
        row.addEventListener("mousedown", (e) => { e.preventDefault(); sel = i; drill(r); });
        listEl.appendChild(row);
      });
      if (loading && !rows.length) note("listing…");
      // A fragment with no match is the other spelling of "folder that does
      // not exist yet" — same forward path as the missing-base note above.
      else if (!rows.length && d && d.exists) note(frag ? "no match — enter offers to create this folder" : "no subdirectories");
      if (d && d.truncated) note("first " + (d.dirs || []).length + " entries only — this directory is very large");
      const cur = listEl.querySelector(".row.sel");
      if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
    }

    // drill completes the field to a candidate and lists inside it — cdx's Tab.
    // The value it writes is always an absolute (~-shortened) path, so what the
    // dialog finally submits can never depend on which directory a relative path
    // would have been resolved against.
    function drill(r) {
      pristine = false; // the field is theirs now, not the prefill's
      input.value = shortHome(r.path) + "/";
      render();
    }

    function move(delta) {
      if (!rows.length) return;
      sel = Math.max(-1, Math.min(rows.length - 1, sel + delta));
      render(true);
    }

    input.addEventListener("input", () => { pristine = false; render(); });
    input.addEventListener("focus", () => { wrap.classList.add("focus"); render(); });
    input.addEventListener("blur", () => wrap.classList.remove("focus"));

    return {
      // setEnabled turns the picker off for a field whose path nobody here can
      // complete — a host whose cathost is too old to list its own directories,
      // or one that is offline. Off means: no listing requests, no drop-down, no
      // key capture, and no commit rewriting what was typed, so the field
      // becomes a plain text box carrying the path verbatim to the host that
      // will interpret it.
      setEnabled(on) {
        enabled = on;
        if (!on) { listEl.innerHTML = ""; rows = []; sel = -1; }
        else render();
      },
      // setHost points the picker at another machine. Everything cached
      // describes the previous one — its directories, its home, its recents —
      // so all of it is dropped rather than filtered: a listing of /home/me on
      // this laptop says nothing about /home/me on devbox, and the two are
      // indistinguishable once they are in the same map.
      setHost(id) {
        if (host === id) return;
        host = id;
        cache.clear(); inflight.clear();
        recents = []; recentsAsked = false; home = "";
        rows = []; sel = -1;
        if (enabled) render();
      },
      // key handles the picker's own keys and reports whether it consumed the
      // event; Enter stays with the dialog (see commit).
      key(e) {
        if (!enabled) return false;
        if (e.key === "ArrowDown" || (e.ctrlKey && e.key === "n")) { move(1); return true; }
        if (e.key === "ArrowUp" || (e.ctrlKey && e.key === "p")) { move(-1); return true; }
        if (e.key === "Tab" && !e.shiftKey && rows[sel]) { drill(rows[sel]); return true; }
        return false;
      },
      // commit resolves the field to the directory the user actually chose,
      // just before the dialog reads it: the highlighted candidate, or else the
      // absolute form of what they typed. An empty field stays empty — clearing
      // it is how a caller asks for its own default.
      commit() {
        const text = input.value;
        if (!enabled || !text.trim()) return;
        if (rows[sel]) { input.value = rows[sel].path; return; }
        const [base, frag] = splitBase(text);
        const d = cache.get(base);
        if (d) input.value = frag ? joinPath(d.dir, frag) : d.dir;
      },
    };
  }

  // dialogFields: a prompt over one or more text fields (opts.fields:
  // [{label?, value?, placeholder?, pick?}]). Enter submits from any field and
  // Esc cancels, so a multi-field dialog still costs one keystroke for anyone who
  // only cares about the first; Tab walks the fields natively. onSubmit gets the
  // values in field order. Labels are shown only when a dialog has more than the
  // one obvious field. pick makes a field a directory picker (attachPathPicker),
  // which takes over the arrows and Tab while it is focused and normalizes the
  // field's value on submit.
  function dialogFields(opts) {
    openOverlay((ov) => {
      const m = document.createElement("div"); m.className = "modal";
      const h = document.createElement("header"); h.textContent = opts.title; m.appendChild(h);
      const body = document.createElement("div"); body.className = "body";
      const pickers = new Map(); // input -> picker api
      // A field is a text input unless it carries `choices`, in which case it is
      // a <select> over [{value,label}]. Both expose .value, so submit still
      // reads the row uniformly and callers stay unaware of which kind they got
      // — the point of putting the choice here rather than hand-rolling a
      // second dialog for the one prompt that needs a list (new workspace's
      // plugin). A choice field takes no path picker and no placeholder: the
      // first option is the empty/default one and says what "nothing" means.
      const inputs = opts.fields.map((f) => {
        const wrap = document.createElement("div"); wrap.className = "field" + (f.pick ? " pick" : "");
        if (f.label) { const l = document.createElement("label"); l.textContent = f.label; wrap.appendChild(l); }
        let input;
        if (f.choices) {
          input = document.createElement("select");
          for (const c of f.choices) {
            const o = document.createElement("option");
            o.value = c.value; o.textContent = c.label;
            input.appendChild(o);
          }
          input.value = f.value || "";
        } else {
          input = document.createElement("input");
          input.type = "text"; input.value = f.value || ""; input.spellcheck = false;
          if (f.placeholder) input.placeholder = f.placeholder;
        }
        wrap.appendChild(input); body.appendChild(wrap);
        if (f.pick && !f.choices) pickers.set(input, attachPathPicker(input, wrap));
        return input;
      });
      // onChange lets one field reshape another — the new-workspace dialog's
      // host choice switching the start-path picker off, which it can only do
      // once both fields exist. The callback gets the field's value and the
      // dialog's rows ({input, picker}), and runs once up front so the initial
      // selection is applied rather than only the first change.
      opts.fields.forEach((f, i) => {
        if (!f.onChange) return;
        const rows = inputs.map((inp) => ({ input: inp, picker: pickers.get(inp) || null }));
        const fire = () => f.onChange(inputs[i].value, rows);
        inputs[i].addEventListener("change", fire);
        inputs[i].addEventListener("input", fire);
        fire();
      });
      if (opts.hint) { const t = document.createElement("div"); t.className = "hint"; t.textContent = opts.hint; body.appendChild(t); }
      m.appendChild(body);
      const submit = () => {
        for (const pk of pickers.values()) pk.commit();
        const vs = inputs.map((i) => i.value); closeModal(); opts.onSubmit(...vs);
      };
      const btns = document.createElement("div"); btns.className = "btns";
      btns.appendChild(mkModalBtn("cancel", "", closeModal));
      btns.appendChild(mkModalBtn(opts.submitLabel || "save", "primary", submit));
      m.appendChild(btns);
      for (const input of inputs) {
        input.addEventListener("keydown", (e) => {
          e.stopPropagation();
          const pk = pickers.get(input);
          if (pk && pk.key(e)) { e.preventDefault(); return; }
          if (e.key === "Enter") { e.preventDefault(); submit(); }
          else if (e.key === "Escape") { e.preventDefault(); closeModal(); }
        });
      }
      ov.appendChild(m);
      // The prefill starts selected so the first keystroke replaces it; the
      // select() guard lives in focusField, since a choice field in slot 0 is
      // a <select> and has no such method.
      focusField(inputs[0], true);
    });
  }

  // dialogInput: a rename-style prompt. Enter saves, Esc cancels; an empty
  // value is passed through (cats semantics: empty clears the custom name).
  function dialogInput(opts) {
    dialogFields({ ...opts, fields: [{ value: opts.value }] });
  }

  // dialogConfirm: an explicit yes/no gate for destructive commands. Enter
  // confirms (the confirm button holds focus), Esc cancels.
  function dialogConfirm(opts) {
    openOverlay((ov) => {
      const m = document.createElement("div"); m.className = "modal";
      const h = document.createElement("header"); h.textContent = opts.title; m.appendChild(h);
      const body = document.createElement("div"); body.className = "body";
      const p = document.createElement("p"); p.textContent = opts.message; body.appendChild(p);
      if (opts.warn) { // red emphasis line (e.g. the dirty-worktree escalation)
        const wp = document.createElement("p"); wp.className = "errline"; wp.textContent = opts.warn;
        body.appendChild(wp);
      }
      m.appendChild(body);
      const go = () => { closeModal(); opts.onConfirm(); };
      const btns = document.createElement("div"); btns.className = "btns";
      btns.appendChild(mkModalBtn("cancel", "", closeModal));
      const ok = mkModalBtn(opts.confirmLabel || "confirm", opts.danger ? "danger" : "primary", go);
      btns.appendChild(ok);
      m.appendChild(btns);
      m.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Enter") { e.preventDefault(); go(); }
        else if (e.key === "Escape") { e.preventDefault(); closeModal(); }
      });
      ov.appendChild(m);
      focusField(ok);
    });
  }

  // ---- Rename dialogs + close confirms (WS8): tab/workspace finally wired ----
  // Reachable from a sidebar row for any pane in the session, so the handle and
  // the prefilled name fall back to the pane.list snapshot when the pane is not on
  // screen and has no local state.
  function renamePane(id) {
    const p = panes.get(id), pi = paneInv.find((x) => x.pane === id);
    dialogInput({
      title: "rename pane " + paneRef((p && p.pub) || (pi && pi.handle), id),
      value: (p && p.info ? p.title : (pi && (pi.name || pi.title))) || "",
      hint: "enter saves · empty clears the custom name · esc cancels",
      onSubmit: (name) => sendCmd("pane.rename", { pane: id, name }),
    });
  }
  function renameTab(t) {
    dialogInput({
      title: "rename tab " + t.num,
      value: t.name === String(t.num) ? "" : t.name,
      hint: "enter saves · empty reverts to the tab number · esc cancels",
      onSubmit: (name) => sendCmd("tab.rename", { num: t.num, name }),
    });
  }
  // newWorkspace: name the workspace and pick where it starts up front, instead
  // of making the user create it and then fix both. Either field may be left
  // empty: no name keeps auto-naming (the label follows the workspace's cwd),
  // and a cleared start path starts the workspace in the user's home directory —
  // the escape hatch for a session whose default cwd is somewhere useless. The
  // path is prefilled with the focused pane's live cwd, the same neighbour
  // inheritance new tabs and splits use, so the common case is still one Enter,
  // and the field is a picker (attachPathPicker) for every case that is not:
  // recent directories and real subdirectory completion, so choosing where a
  // workspace lives never means typing a path from memory.
  //
  // The third field starts a plugin in the workspace as it opens. A workspace is
  // usually opened *to do something* — the same reflex that has the user reach
  // for the plugins dialog immediately after — and the plugin's own scoping makes
  // the pairing more than a keystroke saved: a plugin like cats-todo keys its
  // state off the directory it wakes up in, so starting it from here (with the
  // workspace's start path already chosen above) is the only way to launch it
  // against the new project without first switching to the workspace and waiting
  // for a pane cwd to report.
  //
  // The roster comes from plugin.list, one round trip before the dialog opens,
  // for the same reason openPluginsDialog takes one: the browser holds no plugin
  // state, and a stale list would offer actions that no longer resolve. A failed
  // or empty list drops the field rather than the dialog — plugins are an extra
  // here, and creating a workspace must not depend on the plugin host being
  // healthy.
  function newWorkspace() {
    sendCmdAwait("plugin.list", {}, (res) => {
      const runners = res.ok ? pluginRunners((res.data || {}).plugins || []) : [];
      openNewWorkspaceDialog(runners);
    });
  }

  // pluginRunners flattens the plugin list into the one-line choices a picker
  // offers: every action of every working plugin, labelled by plugin when that
  // is the whole story and by plugin + action when a plugin ships more than one.
  // Broken plugins are left out — their argv did not resolve, so offering them
  // is offering a tab that fails on spawn.
  function pluginRunners(plugins) {
    const runners = [];
    for (const p of plugins) {
      if (p.broken) continue;
      const actions = p.actions || [];
      for (const a of actions) {
        const label = actions.length === 1 ? p.id : p.id + " — " + (a.title || a.id);
        runners.push({ label, plugin: p, action: a });
      }
    }
    return runners;
  }

  function openNewWorkspaceDialog(runners) {
    const fields = [
      { label: "name", value: "", placeholder: "optional — auto-named after the start directory" },
      { label: "start path", value: focusedPaneCwd(), placeholder: "empty starts in your home directory", pick: true },
    ];
    // The host a workspace is pinned to is where every pane created in it runs,
    // so it belongs in the dialog that creates it rather than being re-chosen at
    // each split. Offered only when there is a choice to make.
    //
    // Choosing another host changes what the start path means: it is a path on
    // that machine. A host whose cathost can list its own directories completes
    // it there — the picker keeps working, against the right filesystem — and
    // one that cannot loses the picker and says whose disk the text will be read
    // against. Either way a prefilled local cwd is a wrong path there, so it is
    // cleared on the way out.
    let hostIdx = -1; // -1 = no host field, so its slot is never read below
    if (multiHost()) {
      hostIdx = fields.length;
      fields.push({
        label: "host",
        value: (hostItems.find((h) => h.is_default) || hostItems[0] || {}).id || "",
        choices: hostItems.map((h) => ({
          value: h.id,
          label: (h.label || h.id) + (h.connected ? "" : " (offline)"),
        })),
        onChange: (id, rows) => {
          const h = hostItems.find((x) => x.id === id);
          const local = !h || !!h.local;
          const lists = !h || !!h.lists_dirs;
          const path = rows[1];
          if (path.picker) {
            // Point it first, switch it on second: enabling re-renders, and a
            // render against the old machine's cache would flash the wrong
            // directories before the first reply for the new one lands.
            path.picker.setHost(local ? "" : id);
            path.picker.setEnabled(lists);
          }
          path.input.placeholder = local
            ? "empty starts in your home directory"
            : (lists
              ? "path on " + (h.label || h.id) + " — empty starts in that host's home directory"
              : "path on " + (h.label || h.id) + " — empty starts where that host starts panes");
          if (!local && path.input.value === focusedPaneCwd()) path.input.value = "";
        },
      });
    }
    // The runner is passed by index, dialogFields carrying strings only. "" is
    // the default option, so an untouched dialog behaves exactly as before.
    const plugIdx = fields.length;
    if (runners.length) {
      fields.push({
        label: "start plugin",
        value: "",
        choices: [{ value: "", label: "none" }].concat(
          runners.map((r, i) => ({ value: String(i), label: r.label })),
        ),
      });
    }
    dialogFields({
      title: "new workspace",
      fields,
      hint: "↑↓ picks a directory · tab drills in · enter creates · esc cancels",
      submitLabel: "create",
      // Read by index rather than by positional parameters: two of the fields
      // are conditional (host, plugin), so their slots move. sel is "" for
      // "none" and undefined when the field was dropped; the truthiness test
      // covers both, and "0" — a real index — is a truthy string, so the first
      // plugin in the list is not swallowed by it.
      onSubmit: (...vs) => {
        const sel = vs[plugIdx];
        createWorkspace(vs[0], vs[1], sel ? runners[Number(sel)] : null, hostIdx < 0 ? "" : vs[hostIdx]);
      },
    });
  }

  // createWorkspace sends workspace.create, turning its one recoverable failure
  // into an offer: a start path that does not exist re-opens as a confirm that
  // retries with mkdir set, so pointing a new workspace at a folder that is not
  // there yet costs one extra Enter instead of a trip to a shell. Same two-step
  // escalation shape as confirmRemoveWorktree — the first attempt never carries
  // the side effect, and the server keys the offer by its "no such directory"
  // error rather than the UI guessing at the disk from a stale picker cache.
  // runner (optional) is a {plugin, action} from the dialog's plugin field,
  // started in the workspace once it exists — see startPluginInWorkspace. It
  // rides both attempts because the mkdir retry is the *same* create: a user who
  // asked for a plugin and then confirmed the folder still asked for the plugin.
  // host (optional) pins the workspace to a cathost — every pane created in it
  // then runs there. It rides the mkdir retry for the same reason the runner
  // does: it is the same create, and the server reads the path against the host
  // it was given (a remote path is never stat'ed here, so the mkdir escalation
  // simply never fires for one).
  function createWorkspace(name, path, runner, host) {
    const created = (res) => {
      if (!runner) return;
      startPluginInWorkspace(runner, (res.data || {}).id);
    };
    sendCmdAwait("workspace.create", { name, path, host }, (res) => {
      if (res.ok) { created(res); return; }
      const err = res.error || "";
      if (err.startsWith("no such directory: ")) {
        dialogConfirm({
          title: "create folder?",
          message: err.slice("no such directory: ".length) +
            " does not exist — create it and start the workspace there?",
          confirmLabel: "create folder",
          onConfirm: () => sendCmdAwait("workspace.create", { name, path, host, mkdir: true }, (r2) => {
            if (!r2.ok) { toast("new workspace: " + (r2.error || "unknown")); return; }
            created(r2);
          }),
        });
      } else {
        toast("new workspace: " + (err || "unknown"));
      }
    });
  }

  // startPluginInWorkspace launches an action in a workspace named by id — the
  // one workspace.create just returned, which is why the result's id is read
  // here at all (the browser otherwise ignores it and follows the layout
  // broadcast). Sending the id rather than relying on "the new workspace is now
  // active" keeps the launch correct if anything focuses elsewhere in between.
  //
  // Deliberately no cwd, where pluginRunAction sends the focused pane's: the
  // point of this launch is the workspace that was just created, so the tab
  // should inherit *that* workspace's directory. tab.create does exactly that on
  // its own — the new workspace's root pane is the neighbor it inherits from —
  // and the focused pane's cwd would be the old workspace's, the one directory
  // this must not use.
  function startPluginInWorkspace(runner, wsID) {
    const params = { command: runner.action.argv, env: runner.plugin.env || {} };
    if (wsID) params.workspace = wsID;
    sendCmdAwait("tab.create", params, (res) => {
      if (!res.ok) toast("plugin run failed: " + (res.error || "unknown"));
    });
  }
  function renameWorkspace(w) {
    dialogInput({
      title: "rename workspace " + (w.name || w.id),
      value: w.name,
      hint: "enter saves · empty reverts to auto-naming · esc cancels",
      onSubmit: (name) => sendCmd("workspace.rename", { id: w.id, name }),
    });
  }
  // toggleWorkspaceLock flips a workspace between open and closed to plugins and
  // agents. No confirm either way: nothing is destroyed, the sidebar row shows
  // the result immediately (the server rebroadcasts the layout), and the toast
  // says which state was just entered — locking is a thing you do *to be able to
  // work*, so it should cost one click.
  function toggleWorkspaceLock(w) {
    const locked = !w.locked;
    sendCmdAwait("workspace.lock", { id: w.id, locked }, (res) => {
      if (!res.ok) { toast("workspace lock: " + (res.error || "unknown")); return; }
      toast((w.name || w.id) + (locked ? " locked — no plugins or agents" : " unlocked"));
    });
  }
  function confirmCloseWorkspace(w) {
    dialogConfirm({
      title: "close workspace",
      message: "Close workspace “" + w.name + "” (" + w.id + ")? All of its tabs and panes will be closed.",
      confirmLabel: "close workspace", danger: true,
      onConfirm: () => sendCmd("workspace.close", { id: w.id }),
    });
  }
  function confirmStopServer() {
    dialogConfirm({
      title: "stop server",
      message: "Stop the cats server? Session state is saved and the persistent cathost daemon keeps your shells alive, but every browser disconnects.",
      confirmLabel: "stop server", danger: true,
      onConfirm: () => sendCmd("server.stop", {}),
    });
  }

  // ---- Context menus (WS8): pane / tab / workspace ----
  //
  // An item is {label, fn, danger?} or {label, sub:[items]} for a submenu — the
  // shape the host pickers need, where one row would otherwise become one row
  // per host and bury the ordinary actions. A submenu is a second menu element
  // built by the same function, so nesting costs nothing and every item type
  // (separators, danger rows) works at any depth.
  function openCtx(x, y, items) {
    closeCtx();
    ctxEl = buildCtx(x, y, items);
  }

  // buildCtx mounts one menu and returns it. Its child submenu, when one is
  // open, hangs off el._sub so closeCtx can tear the whole chain down — a
  // detached submenu left behind after the parent closes is the one failure
  // mode of hover-opened menus.
  function buildCtx(x, y, items) {
    const m = document.createElement("div");
    m.id = "ctxmenu";
    const closeSub = () => { if (m._sub) { m._sub.remove(); m._sub = null; } };
    for (const it of items) {
      if (it === "-") {
        const s = document.createElement("div"); s.className = "sep"; m.appendChild(s);
        continue;
      }
      const el = document.createElement("div");
      el.className = "item" + (it.danger ? " danger" : "") + (it.sub ? " sub" : "");
      el.textContent = it.label;
      if (it.sub) {
        // Hover opens it (and closes any sibling's), which is what a pointer
        // expects; click does the same so a tap reaches it too. The child is
        // placed at the row's right edge and clamped by buildCtx itself.
        const open = () => {
          closeSub();
          const r = el.getBoundingClientRect();
          m._sub = buildCtx(r.right - 2, r.top - 4, it.sub);
        };
        el.addEventListener("mouseenter", open);
        el.addEventListener("click", open);
      } else {
        el.addEventListener("mouseenter", closeSub);
        el.addEventListener("click", () => { closeCtx(); it.fn(); });
      }
      m.appendChild(el);
    }
    document.body.appendChild(m);
    // Clamp into the viewport after measuring.
    const r = m.getBoundingClientRect();
    m.style.left = Math.min(x, window.innerWidth - r.width - 4) + "px";
    m.style.top = Math.min(y, window.innerHeight - r.height - 4) + "px";
    return m;
  }
  window.addEventListener("mousedown", (e) => {
    if (ctxEl && !ctxChainHas(ctxEl, e.target)) closeCtx();
  }, true);
  window.addEventListener("blur", () => closeCtx());

  // The sidebar lists panes from every workspace, so this menu also opens on panes
  // that are not on screen. Those get the workspace-resolved actions — split,
  // capture, rename, close — plus a reveal; zoom and copy mode are left out, being
  // scoped to the active tab and to a rendered pane respectively.
  function paneMenuItems(id, onCanvas) {
    const p = panes.get(id);
    const onScreen = !!(p && p.info);
    const items = [];
    if (onCanvas) items.push({ label: "paste", fn: pasteText }, "-");
    if (!onScreen) items.push({ label: "reveal pane", fn: () => sendCmd("agent.focus", { pane: id }) }, "-");
    items.push(
      { label: "split left/right", fn: () => sendCmd("pane.split", { pane: id, direction: "h" }) },
      { label: "split top/bottom", fn: () => sendCmd("pane.split", { pane: id, direction: "v" }) },
    );
    // Where the pane lands is a second question, and only worth asking when the
    // session actually spans machines — so it is a submenu rather than two more
    // top-level rows, and it is absent entirely in the single-host case.
    if (multiHost()) {
      items.push(
        { label: "split left/right on…", sub: hostChoices((h) => sendCmd("pane.split", { pane: id, direction: "h", host: h })) },
        { label: "split top/bottom on…", sub: hostChoices((h) => sendCmd("pane.split", { pane: id, direction: "v", host: h })) },
      );
    }
    if (onScreen) items.push({ label: "toggle zoom", fn: () => sendCmd("pane.zoom", { pane: id }) });
    items.push("-");
    if (onScreen) items.push({ label: "copy mode", fn: () => enterCopyMode(id) });
    items.push(
      { label: "copy scrollback", fn: () => copyScrollback(id) },
      "-",
      { label: "rename pane…", fn: () => renamePane(id) },
      { label: "close pane", danger: true, fn: () => sendCmd("pane.close", { pane: id }) },
    );
    return items;
  }
  function tabMenuItems(t, count) {
    const items = [
      { label: "new tab", fn: () => sendCmd("tab.create", {}) },
    ];
    if (multiHost()) {
      items.push({ label: "new tab on…", sub: hostChoices((h) => sendCmd("tab.create", { host: h })) });
    }
    items.push({ label: "rename tab…", fn: () => renameTab(t) });
    // Move the tab, with its panes and their live terminals, to another
    // workspace — which is how a tab travels between WINDOWS, a window being a
    // view on one workspace. Offered only when there is somewhere to send it.
    const elsewhere = otherWorkspaces();
    if (elsewhere.length) {
      items.push({ label: "move tab to…", sub: elsewhere.map((w) => ({
        label: w.name + (windowsOnWorkspace(w.id) ? " (open in another window)" : ""),
        fn: () => sendCmd("tab.move_to_workspace", { workspace: w.id, num: t.num }),
      })) });
    }
    if (count > 1) items.push({ label: "close tab", danger: true, fn: () => sendCmd("tab.close", { num: t.num }) });
    return items;
  }

  // otherWorkspaces is every workspace except the one this window is showing —
  // the destinations a tab can be moved to.
  function otherWorkspaces() {
    if (!layoutMsg) return [];
    return layoutMsg.workspaces.filter((w) => !w.active);
  }

  // hostChoices turns the roster into submenu rows, one per host, calling fn
  // with the host id. A host that is down is still offered — the pane is created
  // in the model either way and the daemon's reconnect reconciles it, which is
  // the same contract a pane already has when its host drops mid-session — but
  // it is marked, so choosing one is a decision rather than a surprise.
  function hostChoices(fn) {
    return hostItems.map((h) => ({
      label: (h.label || h.id) + (h.connected ? "" : " (offline)"),
      fn: () => fn(h.id),
    }));
  }
  function wsMenuItems(w) {
    return [
      { label: "new workspace…", fn: newWorkspace },
      // A second window on this workspace, leaving the current one where it is.
      // Two windows on ONE workspace mirror each other; the useful shape is one
      // window per project, which is why this sits on the row rather than on
      // the section heading.
      { label: "open in new window", fn: () => openWindow(w.id) },
      { label: "rename workspace…", fn: () => renameWorkspace(w) },
      { label: w.locked ? "unlock workspace" : "lock workspace", fn: () => toggleWorkspaceLock(w) },
      "-",
      { label: "new worktree…", fn: openNewWorktreeDialog },
      { label: "open worktree…", fn: openWorktreeOpenDialog },
      { label: "delete worktree checkout…", danger: true, fn: () => removeWorktreeFor(w) },
      "-",
      { label: "close workspace…", danger: true, fn: () => confirmCloseWorkspace(w) },
    ];
  }

  // ---- Worktree dialogs (WS8): new / open / remove git-worktree checkouts ----
  //
  // Web adaptation of cats's prefix+w dialogs over the §7 worktree.* commands.
  // Everything anchors on the focused pane's repo (the server resolves it from
  // the pane's live cwd); worktree.list also reports which checkouts already
  // have an open workspace.

  // branchPathSlug mirrors the server's BranchToPathSlug so the new-worktree
  // dialog can preview the derived checkout path per keystroke.
  function branchPathSlug(branch) {
    let out = "", dash = false;
    for (const ch of branch) {
      if (/[a-zA-Z0-9]/.test(ch)) { out += ch.toLowerCase(); dash = false; }
      else if (!dash) { out += "-"; dash = true; }
    }
    out = out.replace(/^-+|-+$/g, "");
    return out || "worktree";
  }

  // generatedBranchSlug mirrors the server's GeneratedBranchSlug (same word
  // lists) for the dialog's prefill; the server would generate one too if the
  // branch were omitted.
  function generatedBranchSlug(seed) {
    const adj = ["brave", "calm", "clear", "green", "lucky", "quiet", "rapid", "silver"];
    const nouns = ["river", "cloud", "field", "forest", "harbor", "meadow", "stone", "valley"];
