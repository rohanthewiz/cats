      ctx.fillRect(x0 * cellW, a.y * cellH, (x1 - x0 + 1) * cellW, (b.y - a.y + 1) * cellH);
      return;
    }
    for (let y = a.y; y <= b.y; y++) {
      const sx = (y === a.y) ? a.x : 0;
      const ex = (y === b.y) ? b.x : p.W - 1;
      ctx.fillRect(sx * cellW, y * cellH, (ex - sx + 1) * cellW, cellH);
    }
  }

  // ---- Down messages ----
  function onMessage(msg) {
    switch (msg.t) {
      case "welcome":
        if (msg.error) setStatus("rejected: " + msg.error, true);
        else setStatus("connected");
        break;
      case "layout": applyLayout(msg); break;
      case "pane_frame": {
        const p = pane(msg.pane);
        p.W = msg.w; p.H = msg.h; p.cells = msg.cells; p.links = msg.links || [];
        p.cur = msg.cur || null; p.defFg = msg.def_fg; p.defBg = msg.def_bg;
        p.scroll = msg.scroll || null;
        scheduleDraw(p); break;
      }
      case "pane_diff": {
        const p = pane(msg.pane);
        if (msg.cells) for (const dc of msg.cells) p.cells[dc.i] = dc;
        if (msg.cur) p.cur = msg.cur;
        // Every frame carries current scroll, absent ⇒ no scrollback: reset, don't
        // retain (a stale max misplaces read coords after the buffer shrinks, e.g. clear).
        p.scroll = msg.scroll || null;
        scheduleDraw(p); break;
      }
      case "pane_title": { const p = pane(msg.pane); p.title = msg.title; renderChrome(p); refreshPaneList(); break; }
      case "pane_cwd": { const p = pane(msg.pane); p.cwd = msg.cwd; renderChrome(p); break; }
      case "pane_agent": {
        const p = pane(msg.pane); p.agent = msg.agent; p.agentState = msg.state;
        // Absent (an agent with no resolvable model) clears it — a stale model
        // must not outlive the agent the server reported it for.
        p.agentModel = msg.model || "";
        renderChrome(p); refreshPaneList(); break;
      }
      case "pane_modes": {
        const p = pane(msg.pane); p.modes = { mouse: !!msg.mouse, alt: !!msg.alt_screen };
        break;
      }
      case "pane_exited": { const p = pane(msg.pane); p.exited = msg.code; renderChrome(p); refreshPaneList(); break; }
      case "agents": renderAgents(msg.items); break;
      case "clipboard": // OSC 52 write from a pane app — no user activation
        try { clipWrite(b64decode(msg.data)).catch(() => {}); } catch (e) {}
        break;
      case "notify": handleNotify(msg); break;
      case "title": document.title = msg.title ? ("cats · " + msg.title) : "cats"; break;
      case "update_ready":
        updateInfo = { version: msg.version || "", command: msg.command || "" };
        gearEl.classList.add("badge");
        showUpdateBanner();
        break;
      case "error": toast("error: " + msg.msg); break;
      case "shutdown": setStatus("server shut down", true); break;
      case "cmd_result": {
        const cb = cmdCbs.get(msg.id);
        if (cb) { cmdCbs.delete(msg.id); cb(msg); }
        else if (!msg.ok) toast("cmd failed: " + (msg.error || "unknown"));
        break;
      }
    }
  }

  function b64decode(s) {
    try { return decodeURIComponent(escape(atob(s))); } catch (e) { return atob(s); }
  }

  // ---- Send helpers ----
  function sendMsg(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
  function sendCmd(name, params) { sendMsg({ t: "cmd", name, params }); }

  // sendCmdAwait issues a command under a fresh id and resolves cb with its
  // cmd_result (read/capture and the §7 query commands carry result data).
  let cmdSeq = 0;
  const cmdCbs = new Map();
  function sendCmdAwait(name, params, cb) {
    const id = "b" + (++cmdSeq);
    cmdCbs.set(id, cb);
    sendMsg({ t: "cmd", id, name, params });
  }

  // ---- Keyboard (D4: structured, never pre-encoded) ----
  function mods(e) {
    return (e.shiftKey ? 1 : 0) | (e.altKey ? 2 : 0) | (e.ctrlKey ? 4 : 0) | (e.metaKey ? 8 : 0);
  }

  function onKey(e) {
    // An open dialog/menu/palette owns the keyboard: its own listeners handle
    // Enter/arrows, Escape falls through to here, and nothing reaches the PTY.
    if (uiOpen()) {
      if (e.type === "keydown" && e.key === "Escape") { e.preventDefault(); closeCtx(); closeModal(); }
      return;
    }
    // Copy-mode captures the keyboard entirely — motions/yank, nothing to the PTY.
    if (copyModePane) {
      e.preventDefault();
      if (e.type === "keydown") copyModeKey(copyModePane, e);
      return;
    }
    // ⌘K (mac) / Ctrl+Alt+K opens the command palette / navigator.
    if (e.type === "keydown" && e.code === "KeyK" &&
        ((e.metaKey && !e.ctrlKey) || (e.ctrlKey && e.altKey))) {
      e.preventDefault(); openPalette(); return;
    }
    const isV = e.key === "v" || e.key === "V";
    if (e.type === "keydown" && e.metaKey && !e.ctrlKey && isV) { e.preventDefault(); pasteText(); return; }
    // ⌘+ / ⌘- / ⌘0 size the terminal type instead of zooming the browser (page
    // zoom would blur the canvas and leave the grid math on the old cell size).
    // Matched on e.code so ⌘= and ⌘⇧+ are the same key, numpad included.
    if (e.type === "keydown" && e.metaKey && !e.ctrlKey) {
      switch (e.code) {
        case "Equal": case "NumpadAdd":
          e.preventDefault(); setFontSize(FONT_PX + 1); return;
        case "Minus": case "NumpadSubtract":
          e.preventDefault(); setFontSize(FONT_PX - 1); return;
        case "Digit0": case "Numpad0":
          e.preventDefault(); setFontSize(FONT_DEFAULT); return;
      }
    }
    // ⌘C and ⌘Z/⌘⇧Z fall through to the pane below: apps speaking the kitty
    // keyboard protocol (editors like rd) receive super+c / super+z and run
    // their own copy/undo; for legacy panes the server's encoder emits
    // nothing, same as Ghostty. cats' own copy paths (drag, copy-mode)
    // already copied by the time ⌘C could be pressed, so nothing here
    // competes with them.
    if (e.metaKey && !e.ctrlKey && e.code !== "KeyC" && e.code !== "KeyZ") return;  // leave other Cmd shortcuts to the browser
    if (e.code === "F12") return;         // devtools
    e.preventDefault();
    // Typing to the terminal dismisses a lingering (stale) copy wash.
    if (e.type === "keydown") clearStaleSelections();
    const kind = e.type === "keyup" ? "u" : (e.repeat ? "r" : "d");
    sendMsg({ t: "key", code: e.code, key: e.key, mods: mods(e), kind });
  }
  window.addEventListener("keydown", onKey);
  window.addEventListener("keyup", onKey);

  // ---- Clipboard ----
  // The mac app binds catsClipWrite/catsClipRead (native pasteboard) into the
  // page, because WKWebView cripples navigator.clipboard: reads resolve empty
  // and writes demand a user activation that WebSocket-driven copies (OSC 52
  // from a pane, §7 read results) never have. Prefer the bridge when present;
  // browsers keep using navigator.clipboard.
  function clipWrite(text) {
    if (window.catsClipWrite) return window.catsClipWrite(text);
    return navigator.clipboard.writeText(text);
  }
  function clipRead() {
    if (window.catsClipRead) return window.catsClipRead();
    if (!navigator.clipboard || !navigator.clipboard.readText)
      return Promise.reject(new Error("clipboard read unavailable"));
    return navigator.clipboard.readText();
  }

  // ---- Paste ----
  function pasteText() {
    clipRead()
      .then((t) => { if (t) sendMsg({ t: "paste", data: t }); else toast("clipboard has no text"); })
      .catch((err) => toast("paste blocked: " + ((err && err.name) || err)));
  }
  document.addEventListener("paste", (e) => {
    const text = (e.clipboardData || window.clipboardData).getData("text");
    if (text) { e.preventDefault(); sendMsg({ t: "paste", data: text }); }
  });

  // ---- Mouse (structured cell coords; server applies the pane's encoding) ----
  function cellOf(p, ev) {
    // userX/userY undo the pane's text inset first, so a click in the margin
    // clamps to the nearest edge cell (what the user visually intends).
    const x = Math.min(Math.max(0, Math.floor(userX(p, ev.clientX) / cellW)), Math.max(0, p.W - 1));
    const y = Math.min(Math.max(0, Math.floor(userY(p, ev.clientY) / cellH)), Math.max(0, p.H - 1));
    return [x, y];
  }

  function sendMouse(p, kind, btn, ev, dx, dy) {
    const [x, y] = cellOf(p, ev);
    const m = { t: "mouse", pane: p.id, x, y, btn, kind, mods: mods(ev) };
    if (dx) m.dx = dx;
    if (dy) m.dy = dy;
    sendMsg(m);
  }

  // absPoint maps a viewport cell {x,y} to the [row, col] the server's read wants:
  // absolute screen-buffer coordinates from the top of scrollback. The frame's
  // scroll gives the history above the viewport (max) and how far it is scrolled up
  // (off), so the top visible row is (max - off). No scroll info ⇒ no scrollback.
  function absPoint(p, cell) {
    const off = p.scroll ? p.scroll.off : 0;
    const max = p.scroll ? p.scroll.max : 0;
    return [max - off + cell.y, cell.x];
  }

  // readAndCopy issues a §7 read over a viewport cell range and writes the
  // extracted text to the clipboard. Endpoints are inclusive viewport cells,
  // mapped to absolute buffer coords; rect selects a block. Shared by the mouse
  // drag path and keyboard copy-mode.
  function readAndCopy(p, aCell, bCell, rect) {
    sendCmdAwait("read", {
      pane: p.id, anchor: absPoint(p, aCell), cursor: absPoint(p, bCell), rect,
    }, (res) => {
      if (!res.ok) { toast("read failed: " + (res.error || "unknown")); return; }
      const text = res.data && res.data.text;
      if (!text) { toast("selection is empty"); return; }
      clipWrite(text).then(
        () => toast("copied " + text.length + " char" + (text.length === 1 ? "" : "s")),
        () => toast("clipboard write blocked"));
    });
  }

  // finishSelection copies the pane's completed drag range, marking the wash done
  // so a later keystroke (clearStaleSelections) dismisses the now-stale highlight.
  function finishSelection(p) {
    readAndCopy(p, p.sel.anchor, p.sel.cursor, p.sel.rect);
    p.sel.done = true;
  }

  // copyScrollback captures the pane's whole buffer (§7 capture, soft-wraps
  // rejoined) and copies it — the pane menu's "copy scrollback", distinct from
  // a range read.
  function copyScrollback(id) {
    const p = panes.get(id);
    if (!p) return;
    sendCmdAwait("capture", { pane: id, scope: 1, lines: 0, unwrap: true }, (res) => {
      if (!res.ok) { toast("capture failed: " + (res.error || "unknown")); return; }
      const text = res.data && res.data.text;
      if (!text) { toast("nothing to copy"); return; }
      clipWrite(text).then(
        () => toast("copied " + text.length + " chars (scrollback)"),
        () => toast("clipboard write blocked"));
    });
  }

  // clearStaleSelections drops any completed drag wash (p.sel.done) — a fixed
  // viewport highlight goes stale once new output or the cursor moves, so the
  // next keystroke to the terminal dismisses it. Active drags are left alone.
  function clearStaleSelections() {
    for (const p of panes.values()) {
      if (p.sel && p.sel.done) { p.sel = null; scheduleDraw(p); }
    }
  }

  // ---- Keyboard copy-mode (§7 read via hjkl/arrows, no mouse needed) ----
  //
  // A tmux-style selection driven from the keyboard: enter on a pane, move the
  // cursor, press v to begin selecting, y/Enter to yank into the clipboard, Esc
  // to leave. Motions operate on viewport cells; k/j past the top/bottom scroll
  // the pane so the selection can reach into scrollback.

  function enterCopyMode(id) {
    const p = panes.get(id);
    if (!p) return;
    sendCmd("pane.focus", { pane: id });
    exitCopyMode(); // only one pane at a time
    const start = (p.cur && p.cur.vis) ? { x: p.cur.x, y: p.cur.y } : { x: 0, y: 0 };
    p.cm = { cursor: start, anchor: null, rect: false };
    copyModePane = p;
    p.sel = null;
    renderChrome(p); // the pane's header shows the COPY chip + key hints
    scheduleDraw(p);
  }

  function exitCopyMode() {
    const p = copyModePane;
    copyModePane = null;
    if (!p) return;
    p.cm = null; p.sel = null;
    renderChrome(p);
    scheduleDraw(p);
  }

  // cmSyncSel mirrors the copy-mode range onto p.sel so drawSelection washes it
  // (only once an anchor is set with v).
  function cmSyncSel(p) {
    const cm = p.cm;
    p.sel = cm.anchor ? { anchor: cm.anchor, cursor: cm.cursor, rect: cm.rect, moved: true } : null;
  }

  // Copy-mode keybindings. catway injects window.__catsKeys.copyMode
  // (action → [keys]) from the YAML config; this built-in table is the fallback
  // when the page is served standalone or the config omits copy_mode. We index it
  // as key → action so copyModeKey is a switch on the action, not the raw key.
  const COPY_MODE_DEFAULT = {
    "move-left": ["ArrowLeft", "h"], "move-right": ["ArrowRight", "l"],
    "move-up": ["ArrowUp", "k"], "move-down": ["ArrowDown", "j"],
    "line-start": ["0", "Home"], "line-end": ["$", "End"],
    "top": ["g"], "bottom": ["G"], "select": ["v"], "rect": ["r"],
    "yank": ["y", "Enter"], "exit": ["Escape", "q"],
  };
  const COPY_KEY = (() => {
    const table = (window.__catsKeys && window.__catsKeys.copyMode) || COPY_MODE_DEFAULT;
    const map = {};
    for (const action in table) for (const k of (table[action] || [])) map[k] = action;
    return map;
  })();

  // copyModeKey handles one keydown while in copy-mode; returns without touching
  // the terminal (onKey has already swallowed the event).
  function copyModeKey(p, e) {
    const cm = p.cm;
    if (!cm) return;
    const clampX = (x) => Math.min(Math.max(0, x), Math.max(0, p.W - 1));
    const clampY = (y) => Math.min(Math.max(0, y), Math.max(0, p.H - 1));
    const move = (dx, dy) => {
      let ny = cm.cursor.y + dy;
      if (ny < 0) { sendCmd("scroll", { pane: p.id, delta: -1 }); ny = 0; }
      else if (ny > p.H - 1) { sendCmd("scroll", { pane: p.id, delta: 1 }); ny = p.H - 1; }
      cm.cursor = { x: clampX(cm.cursor.x + dx), y: clampY(ny) };
    };
    switch (COPY_KEY[e.key]) {
      case "move-left": move(-1, 0); break;
      case "move-right": move(1, 0); break;
      case "move-up": move(0, -1); break;
      case "move-down": move(0, 1); break;
      case "line-start": cm.cursor = { x: 0, y: cm.cursor.y }; break;
      case "line-end": cm.cursor = { x: Math.max(0, p.W - 1), y: cm.cursor.y }; break;
      case "top": cm.cursor = { x: cm.cursor.x, y: 0 }; break;
      case "bottom": cm.cursor = { x: cm.cursor.x, y: Math.max(0, p.H - 1) }; break;
      case "select": cm.anchor = cm.anchor ? null : { x: cm.cursor.x, y: cm.cursor.y }; break;
      case "rect": cm.rect = !cm.rect; break;
      case "yank": copyModeYank(p); return;
      case "exit": exitCopyMode(); return;
      default: return; // unbound key: stay in copy-mode, do nothing
    }
    cmSyncSel(p);
    scheduleDraw(p);
  }

  // copyModeYank reads the current copy-mode range (anchor→cursor, or just the
  // cursor cell if nothing is anchored yet) into the clipboard, then exits.
  function copyModeYank(p) {
    const cm = p.cm;
    readAndCopy(p, cm.anchor || cm.cursor, cm.cursor, cm.rect);
    exitCopyMode();
  }

  // beginScrollDrag drags the pane's scrollbar thumb: each pointer move maps to
  // a target history offset and sends the delta (§7 scroll is relative). The
  // server's next frame updates p.scroll, keeping successive deltas honest.
  function beginScrollDrag(p, ev0) {
    let queued = false;
    const move = (ev) => {
      if (!hasScrollbar(p) || queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        if (!hasScrollbar(p)) return;
        const vh = p.H * cellH;
        const total = p.scroll.max + p.scroll.rows;
        const h = Math.max(20, vh * p.scroll.rows / total);
        const span = vh - h;
        if (span <= 0) return;
        const frac = Math.min(1, Math.max(0, (userY(p, ev.clientY) - h / 2) / span));
        const target = Math.round(p.scroll.max * (1 - frac));
        const delta = p.scroll.off - target; // positive = toward the live bottom
        if (delta) sendCmd("scroll", { pane: p.id, delta });
      });
    };
    const up = () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    move(ev0);
  }

  function attachMouse(p) {
    p.canvas.addEventListener("mousedown", (ev) => {
      if (copyModePane) exitCopyMode(); // a mouse drag supersedes keyboard copy-mode
      if (p.info && !p.info.focused) sendCmd("pane.focus", { pane: p.id });
      // The scrollbar strip owns left-drags whenever it is drawn.
      if (ev.button === 0 && hasScrollbar(p)) {
        // The strip is drawn in grid space (drawScrollbar), so compare there.
        if (userX(p, ev.clientX) >= p.W * cellW - SB_W - 2) {
          ev.preventDefault();
          beginScrollDrag(p, ev);
          return;
        }
      }
      if (!p.modes.mouse) {
        // No capture: left-drag originates a browser-local selection (§7 read);
        // Alt makes it a rectangular block. A plain click (no drag) is resolved on
        // mouseup — hyperlink follow, per α.
        if (ev.button !== 0) return;
        ev.preventDefault();
        const [x, y] = cellOf(p, ev);
        p.sel = { anchor: { x, y }, cursor: { x, y }, rect: ev.altKey, moved: false };
        scheduleDraw(p);
        return;
      }
      if (ev.button > 2) return;
      ev.preventDefault();
      p.pressed = ev.button;
      sendMouse(p, "d", ev.button, ev);
    });
    p.canvas.addEventListener("mousemove", (ev) => {
      // A copied drag keeps its wash on screen (p.sel.done) until a keystroke
      // clears it — but it is finished, so the pointer must not go on extending
      // it. Requiring the button still be held also covers a mouseup we missed.
      if (p.sel && !p.sel.done && (ev.buttons & 1)) {
        const [x, y] = cellOf(p, ev);
        if (x === p.sel.cursor.x && y === p.sel.cursor.y) return; // one update per cell
        p.sel.cursor = { x, y };
        if (x !== p.sel.anchor.x || y !== p.sel.anchor.y) p.sel.moved = true;
        scheduleDraw(p);
        return;
      }
      if (!p.modes.mouse) return;
      const key = cellOf(p, ev).join(":");
      if (key === p.lastCell) return; // one report per cell
      p.lastCell = key;
      sendMouse(p, "m", p.pressed >= 0 ? p.pressed : 3, ev);
    });
    p.canvas.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const lines = ev.deltaMode === 1 ? Math.round(ev.deltaY)
        : Math.sign(ev.deltaY) * Math.max(1, Math.round(Math.abs(ev.deltaY) / (cellH * (p.gs || 1))));
      if (!lines) return;
      if (p.modes.mouse || p.modes.alt) sendMouse(p, "w", 3, ev, 0, lines);
      else {
        if (p.sel) { p.sel = null; scheduleDraw(p); } // scrolling invalidates the fixed-viewport wash
        sendCmd("scroll", { pane: p.id, delta: lines });
      }
    }, { passive: false });
    // Right-click: mouse-capturing apps get the encoded button; otherwise the
    // pane menu (with paste on top) replaces the browser's default menu.
    p.canvas.addEventListener("contextmenu", (ev) => {
      ev.preventDefault();
      if (!p.modes.mouse) openCtx(ev.clientX, ev.clientY, paneMenuItems(p.id, true));
    });
  }

  // Release is watched on the window, not the canvas: a drag that ends outside
  // the pane still has to finish its selection, and a mouse-capturing app still
  // has to see the button go up.
  //
  // One listener for all panes, iterating the live map. Per-pane registration
  // leaked: applyLayout tears every pane down on each tab switch (the layout
  // carries the active tab only) and an element removal does not unregister a
  // window listener, so dead panes kept firing here — and kept their cell grids
  // alive — for the life of the page.
  window.addEventListener("mouseup", (ev) => {
    for (const p of panes.values()) {
      // Without !done, a lingering copied wash would re-read and re-copy itself
      // on the next click made anywhere.
      if (p.sel && !p.sel.done) {
        const sel = p.sel;
        if (sel.moved) {
          finishSelection(p);            // a real drag → read + copy, keep the wash
        } else {
          p.sel = null;                  // a click → follow a hyperlink under it
          scheduleDraw(p);
          const c = p.cells[sel.anchor.y * p.W + sel.anchor.x];
          if (c && c.h && p.links[c.h - 1]) window.open(p.links[c.h - 1], "_blank", "noopener");
        }
        continue;
      }
      if (p.pressed < 0 || ev.button !== p.pressed) continue;
      const btn = p.pressed;
      p.pressed = -1;
      if (p.modes.mouse) sendMouse(p, "u", btn, ev);
    }
  });

  // ---- Overlay + modal infrastructure (WS8) ----
  //
  // One overlay at a time (dialog, palette, or help) plus an independent
  // context menu. While any is open the keyboard belongs to the UI: onKey
  // returns early (no preventDefault, so modal inputs type normally) and a
  // capture-phase Escape closes whatever is up.

  let modalEl = null; // current #overlay root, or null
  let ctxEl = null;   // current #ctxmenu, or null
  let modalCleanup = null; // runs on any close path (settings preview rollback)
  function uiOpen() { return !!(modalEl || ctxEl); }

  function closeModal() {
    if (modalEl) { modalEl.remove(); modalEl = null; }
    if (modalCleanup) { const fn = modalCleanup; modalCleanup = null; fn(); }
  }
  function closeCtx() { if (ctxEl) { ctxEl.remove(); ctxEl = null; } }

  // openOverlay mounts a fresh overlay; build receives the overlay element and
  // appends its .modal. A mousedown on the backdrop dismisses.
  function openOverlay(build) {
    closeModal(); closeCtx();
    const ov = document.createElement("div");
    ov.id = "overlay";
    ov.addEventListener("mousedown", (e) => { if (e.target === ov) closeModal(); });
    build(ov);
    document.body.appendChild(ov);
    modalEl = ov;
    return ov;
  }

  function mkModalBtn(label, cls, fn) {
    const b = document.createElement("button");
    b.textContent = label; if (cls) b.className = cls;
    b.addEventListener("click", fn);
    return b;
  }

  // ---- Path picker (a directory field, cdx-style) ----
  //
  // A start path is where a workspace lives for the rest of its life, so typing
  // one blind — with no view of what is actually on the server's disk — was the
  // weakest part of the new-workspace dialog. attachPathPicker turns a text
  // field into a directory picker over the same two sources cdx (the user's TUI
  // cd assistant) offers: the directories they visit most, frecency-ranked, and
  // the subdirectories of wherever the path currently points.
  //
  // Filtering runs here, not on the server. path.list answers with one
  // directory's entire listing, which we cache and fuzzy-match per keystroke, so
  // a round trip happens only when the directory being completed *inside*
  // changes — worth caring about when the browser is a WAN away from the server.
  //
  // Two modes, following cdx: with no "/" typed yet the fragment matches recents
  // and the anchor directory's children together; once a path is under way it
  // completes inside the named directory, prefix matches first. The selection
  // starts on the best match while a fragment is being completed, and on
  // *nothing* when the text already names a directory (a trailing "/", or an
  // untouched prefill) — there, what the user typed is the answer.
  function attachPathPicker(input, wrap) {
    const listEl = document.createElement("div");
    listEl.className = "picker";
    wrap.appendChild(listEl);

    let recents = [];        // absolute dirs, best-first; asked for once per dialog
    let recentsAsked = false;
    let home = "";           // resolved server-side, so "~" means the same thing on both ends
    const cache = new Map(); // typed base ("" | "~/projs/" | "/usr/") -> path.list result
    const inflight = new Set();
    let rows = [], sel = -1;

    const shortHome = (p) => (home && (p === home ? "~" : (p.startsWith(home + "/") ? "~" + p.slice(home.length) : p))) || p;
    const joinPath = (dir, name) => (dir.endsWith("/") ? dir + name : dir + "/" + name);

    // splitBase divides the typed text into the directory part (as typed, with
    // its trailing slash) and the fragment being completed. A "" base is "no
    // separator yet" — the anchor directory, matched fuzzily.
    function splitBase(text) {
      if (text === "~" || text === "." || text === "..") return [text + "/", ""];
      const i = text.lastIndexOf("/");
      return i < 0 ? ["", text] : [text.slice(0, i + 1), text.slice(i + 1)];
    }

    // listing returns the cached path.list answer for a typed base, firing the
    // request (once) and re-rendering on arrival when it is not cached yet.
    function listing(base) {
      if (cache.has(base)) return cache.get(base);
      if (!inflight.has(base)) {
        inflight.add(base);
        const wantRecents = !recentsAsked;
        recentsAsked = true;
        sendCmdAwait("path.list", { dir: base, recents: wantRecents }, (res) => {
          inflight.delete(base);
          if (!res.ok) { if (wantRecents) recentsAsked = false; return; }
          const d = res.data || {};
          cache.set(base, d);
          if (d.home) home = d.home;
          if (wantRecents) recents = d.recents || [];
          if (input.isConnected) render();
        });
      }
      return null;
    }

    // rowsFor is the candidate list for the current text: {kind, label, path}.
    // null means the directory it needs has not been listed yet.
    function rowsFor(text) {
      const [base, frag] = splitBase(text);
      const d = listing(base);
      if (!d) return null;
      // A dot-fragment is the only thing that asks for dotfiles, the way it is
      // the only thing that does in a shell.
      const dirs = (d.dirs || []).filter((n) => frag.startsWith(".") || !n.startsWith("."));
      const dirRow = (n) => ({ kind: "dir", label: n + "/", path: joinPath(d.dir, n) });

      if (base) { // completing inside a named directory
        const lf = frag.toLowerCase();
        let names = dirs.filter((n) => n.toLowerCase().startsWith(lf));
        if (!names.length && frag) names = fuzzyRank(frag, dirs, (n) => n);
        return names.map(dirRow);
      }
      const cands = [];
      for (const p of recents) {
        if (p === d.dir) continue; // "here" is not somewhere to go
        cands.push({ kind: "recent", label: shortHome(p), path: p });
      }
      for (const n of dirs) cands.push(dirRow(n));
      return frag ? fuzzyRank(frag, cands, (c) => c.label) : cands;
    }

    // fuzzyRank keeps the palette's scorer as the one fuzzy behaviour in the UI.
    function fuzzyRank(q, items, labelOf) {
      return items
        .map((it) => ({ it, s: fuzzyScore(q, labelOf(it)) }))
        .filter((x) => x.s >= 0)
        .sort((a, b) => b.s - a.s)
        .map((x) => x.it);
    }

    function note(text, cls) {
      const n = document.createElement("div");
      n.className = "note" + (cls ? " " + cls : "");
      n.textContent = text;
      listEl.appendChild(n);
    }

    function render(keepSel) {
      const text = input.value;
      const [base, frag] = splitBase(text);
      const next = rowsFor(text);
      const loading = next === null;
      rows = next || [];
      if (!keepSel) sel = frag && rows.length ? 0 : -1;
      if (sel >= rows.length) sel = rows.length - 1;

      listEl.innerHTML = "";
      const d = cache.get(base);
      if (d) {
        const head = document.createElement("div"); head.className = "head";
        head.textContent = "in " + shortHome(d.dir);
        listEl.appendChild(head);
      }
      if (d && !d.exists) note(d.error || "not a directory", "err");
      rows.slice(0, 60).forEach((r, i) => {
        const row = document.createElement("div");
        row.className = "row" + (i === sel ? " sel" : "");
        const kind = document.createElement("span"); kind.className = "kind"; kind.textContent = r.kind;
        const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = r.label;
        row.appendChild(kind); row.appendChild(lbl);
        // mousedown, not click: acting before the field can lose focus keeps the
        // caret (and the picker) alive for the next keystroke.
        row.addEventListener("mousedown", (e) => { e.preventDefault(); sel = i; drill(r); });
        listEl.appendChild(row);
      });
      if (loading && !rows.length) note("listing…");
      else if (!rows.length && d && d.exists) note(frag ? "no match" : "no subdirectories");
      if (d && d.truncated) note("first " + (d.dirs || []).length + " entries only — this directory is very large");
      const cur = listEl.querySelector(".row.sel");
      if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
    }

    // drill completes the field to a candidate and lists inside it — cdx's Tab.
    // The value it writes is always an absolute (~-shortened) path, so what the
    // dialog finally submits can never depend on which directory a relative path
    // would have been resolved against.
    function drill(r) {
      input.value = shortHome(r.path) + "/";
      render();
    }

    function move(delta) {
      if (!rows.length) return;
      sel = Math.max(-1, Math.min(rows.length - 1, sel + delta));
      render(true);
    }

    input.addEventListener("input", () => render());
    input.addEventListener("focus", () => { wrap.classList.add("focus"); render(); });
    input.addEventListener("blur", () => wrap.classList.remove("focus"));

    return {
      // key handles the picker's own keys and reports whether it consumed the
      // event; Enter stays with the dialog (see commit).
      key(e) {
        if (e.key === "ArrowDown" || (e.ctrlKey && e.key === "n")) { move(1); return true; }
        if (e.key === "ArrowUp" || (e.ctrlKey && e.key === "p")) { move(-1); return true; }
        if (e.key === "Tab" && !e.shiftKey && rows[sel]) { drill(rows[sel]); return true; }
        return false;
      },
      // commit resolves the field to the directory the user actually chose,
      // just before the dialog reads it: the highlighted candidate, or else the
      // absolute form of what they typed. An empty field stays empty — clearing
      // it is how a caller asks for its own default.
      commit() {
        const text = input.value;
        if (!text.trim()) return;
        if (rows[sel]) { input.value = rows[sel].path; return; }
        const [base, frag] = splitBase(text);
        const d = cache.get(base);
        if (d) input.value = frag ? joinPath(d.dir, frag) : d.dir;
      },
    };
  }

  // dialogFields: a prompt over one or more text fields (opts.fields:
  // [{label?, value?, placeholder?, pick?}]). Enter submits from any field and
  // Esc cancels, so a multi-field dialog still costs one keystroke for anyone who
  // only cares about the first; Tab walks the fields natively. onSubmit gets the
  // values in field order. Labels are shown only when a dialog has more than the
  // one obvious field. pick makes a field a directory picker (attachPathPicker),
  // which takes over the arrows and Tab while it is focused and normalizes the
  // field's value on submit.
  function dialogFields(opts) {
    openOverlay((ov) => {
      const m = document.createElement("div"); m.className = "modal";
      const h = document.createElement("header"); h.textContent = opts.title; m.appendChild(h);
      const body = document.createElement("div"); body.className = "body";
      const pickers = new Map(); // input -> picker api
      const inputs = opts.fields.map((f) => {
        const wrap = document.createElement("div"); wrap.className = "field" + (f.pick ? " pick" : "");
        if (f.label) { const l = document.createElement("label"); l.textContent = f.label; wrap.appendChild(l); }
        const input = document.createElement("input");
        input.type = "text"; input.value = f.value || ""; input.spellcheck = false;
        if (f.placeholder) input.placeholder = f.placeholder;
        wrap.appendChild(input); body.appendChild(wrap);
        if (f.pick) pickers.set(input, attachPathPicker(input, wrap));
        return input;
      });
      if (opts.hint) { const t = document.createElement("div"); t.className = "hint"; t.textContent = opts.hint; body.appendChild(t); }
      m.appendChild(body);
      const submit = () => {
        for (const pk of pickers.values()) pk.commit();
        const vs = inputs.map((i) => i.value); closeModal(); opts.onSubmit(...vs);
      };
      const btns = document.createElement("div"); btns.className = "btns";
      btns.appendChild(mkModalBtn("cancel", "", closeModal));
      btns.appendChild(mkModalBtn(opts.submitLabel || "save", "primary", submit));
      m.appendChild(btns);
      for (const input of inputs) {
        input.addEventListener("keydown", (e) => {
          e.stopPropagation();
          const pk = pickers.get(input);
          if (pk && pk.key(e)) { e.preventDefault(); return; }
          if (e.key === "Enter") { e.preventDefault(); submit(); }
          else if (e.key === "Escape") { e.preventDefault(); closeModal(); }
        });
      }
      ov.appendChild(m);
      requestAnimationFrame(() => { inputs[0].focus(); inputs[0].select(); });
    });
  }

  // dialogInput: a rename-style prompt. Enter saves, Esc cancels; an empty
  // value is passed through (cats semantics: empty clears the custom name).
  function dialogInput(opts) {
    dialogFields({ ...opts, fields: [{ value: opts.value }] });
  }

  // dialogConfirm: an explicit yes/no gate for destructive commands. Enter
  // confirms (the confirm button holds focus), Esc cancels.
  function dialogConfirm(opts) {
    openOverlay((ov) => {
      const m = document.createElement("div"); m.className = "modal";
      const h = document.createElement("header"); h.textContent = opts.title; m.appendChild(h);
      const body = document.createElement("div"); body.className = "body";
      const p = document.createElement("p"); p.textContent = opts.message; body.appendChild(p);
      if (opts.warn) { // red emphasis line (e.g. the dirty-worktree escalation)
        const wp = document.createElement("p"); wp.className = "errline"; wp.textContent = opts.warn;
        body.appendChild(wp);
      }
      m.appendChild(body);
      const go = () => { closeModal(); opts.onConfirm(); };
      const btns = document.createElement("div"); btns.className = "btns";
      btns.appendChild(mkModalBtn("cancel", "", closeModal));
      const ok = mkModalBtn(opts.confirmLabel || "confirm", opts.danger ? "danger" : "primary", go);
      btns.appendChild(ok);
      m.appendChild(btns);
      m.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Enter") { e.preventDefault(); go(); }
        else if (e.key === "Escape") { e.preventDefault(); closeModal(); }
      });
      ov.appendChild(m);
      requestAnimationFrame(() => ok.focus());
    });
  }

  // ---- Rename dialogs + close confirms (WS8): tab/workspace finally wired ----
  // Reachable from a sidebar row for any pane in the session, so the handle and
  // the prefilled name fall back to the pane.list snapshot when the pane is not on
  // screen and has no local state.
  function renamePane(id) {
    const p = panes.get(id), pi = paneInv.find((x) => x.pane === id);
    dialogInput({
      title: "rename pane " + paneRef((p && p.pub) || (pi && pi.handle), id),
      value: (p && p.info ? p.title : (pi && (pi.name || pi.title))) || "",
      hint: "enter saves · empty clears the custom name · esc cancels",
      onSubmit: (name) => sendCmd("pane.rename", { pane: id, name }),
    });
  }
  function renameTab(t) {
    dialogInput({
      title: "rename tab " + t.num,
      value: t.name === String(t.num) ? "" : t.name,
      hint: "enter saves · empty reverts to the tab number · esc cancels",
      onSubmit: (name) => sendCmd("tab.rename", { num: t.num, name }),
    });
  }
  // newWorkspace: name the workspace and pick where it starts up front, instead
  // of making the user create it and then fix both. Either field may be left
  // empty: no name keeps auto-naming (the label follows the workspace's cwd),
  // and a cleared start path starts the workspace in the user's home directory —
  // the escape hatch for a session whose default cwd is somewhere useless. The
  // path is prefilled with the focused pane's live cwd, the same neighbour
  // inheritance new tabs and splits use, so the common case is still one Enter,
  // and the field is a picker (attachPathPicker) for every case that is not:
  // recent directories and real subdirectory completion, so choosing where a
  // workspace lives never means typing a path from memory.
  function newWorkspace() {
    dialogFields({
      title: "new workspace",
      fields: [
        { label: "name", value: "", placeholder: "optional — auto-named after the start directory" },
        { label: "start path", value: focusedPaneCwd(), placeholder: "empty starts in your home directory", pick: true },
      ],
      hint: "↑↓ picks a directory · tab drills in · enter creates · esc cancels",
      submitLabel: "create",
      onSubmit: (name, path) => sendCmd("workspace.create", { name, path }),
    });
  }
  function renameWorkspace(w) {
    dialogInput({
      title: "rename workspace " + (w.name || w.id),
      value: w.name,
      hint: "enter saves · empty reverts to auto-naming · esc cancels",
      onSubmit: (name) => sendCmd("workspace.rename", { id: w.id, name }),
    });
  }
  function confirmCloseWorkspace(w) {
    dialogConfirm({
      title: "close workspace",
      message: "Close workspace “" + w.name + "” (" + w.id + ")? All of its tabs and panes will be closed.",
      confirmLabel: "close workspace", danger: true,
      onConfirm: () => sendCmd("workspace.close", { id: w.id }),
    });
  }
  function confirmStopServer() {
    dialogConfirm({
      title: "stop server",
      message: "Stop the cats server? Session state is saved and the persistent cathost daemon keeps your shells alive, but every browser disconnects.",
      confirmLabel: "stop server", danger: true,
      onConfirm: () => sendCmd("server.stop", {}),
    });
  }

  // ---- Context menus (WS8): pane / tab / workspace ----
  function openCtx(x, y, items) {
    closeCtx();
    const m = document.createElement("div");
    m.id = "ctxmenu";
    for (const it of items) {
      if (it === "-") {
        const s = document.createElement("div"); s.className = "sep"; m.appendChild(s);
        continue;
      }
      const el = document.createElement("div");
      el.className = "item" + (it.danger ? " danger" : "");
      el.textContent = it.label;
      el.addEventListener("click", () => { closeCtx(); it.fn(); });
      m.appendChild(el);
    }
    document.body.appendChild(m);
    // Clamp into the viewport after measuring.
    const r = m.getBoundingClientRect();
    m.style.left = Math.min(x, window.innerWidth - r.width - 4) + "px";
    m.style.top = Math.min(y, window.innerHeight - r.height - 4) + "px";
    ctxEl = m;
  }
  window.addEventListener("mousedown", (e) => {
    if (ctxEl && !ctxEl.contains(e.target)) closeCtx();
  }, true);
  window.addEventListener("blur", () => closeCtx());

  // The sidebar lists panes from every workspace, so this menu also opens on panes
  // that are not on screen. Those get the workspace-resolved actions — split,
  // capture, rename, close — plus a reveal; zoom and copy mode are left out, being
  // scoped to the active tab and to a rendered pane respectively.
  function paneMenuItems(id, onCanvas) {
    const p = panes.get(id);
    const onScreen = !!(p && p.info);
    const items = [];
    if (onCanvas) items.push({ label: "paste", fn: pasteText }, "-");
    if (!onScreen) items.push({ label: "reveal pane", fn: () => sendCmd("agent.focus", { pane: id }) }, "-");
    items.push(
      { label: "split left/right", fn: () => sendCmd("pane.split", { pane: id, direction: "h" }) },
      { label: "split top/bottom", fn: () => sendCmd("pane.split", { pane: id, direction: "v" }) },
    );
    if (onScreen) items.push({ label: "toggle zoom", fn: () => sendCmd("pane.zoom", { pane: id }) });
    items.push("-");
    if (onScreen) items.push({ label: "copy mode", fn: () => enterCopyMode(id) });
    items.push(
      { label: "copy scrollback", fn: () => copyScrollback(id) },
      "-",
      { label: "rename pane…", fn: () => renamePane(id) },
      { label: "close pane", danger: true, fn: () => sendCmd("pane.close", { pane: id }) },
    );
    return items;
  }
  function tabMenuItems(t, count) {
    const items = [
      { label: "new tab", fn: () => sendCmd("tab.create", {}) },
      { label: "rename tab…", fn: () => renameTab(t) },
    ];
    if (count > 1) items.push({ label: "close tab", danger: true, fn: () => sendCmd("tab.close", { num: t.num }) });
    return items;
  }
  function wsMenuItems(w) {
    return [
      { label: "new workspace…", fn: newWorkspace },
      { label: "rename workspace…", fn: () => renameWorkspace(w) },
      "-",
      { label: "new worktree…", fn: openNewWorktreeDialog },
      { label: "open worktree…", fn: openWorktreeOpenDialog },
      { label: "delete worktree checkout…", danger: true, fn: () => removeWorktreeFor(w) },
      "-",
      { label: "close workspace…", danger: true, fn: () => confirmCloseWorkspace(w) },
    ];
  }

  // ---- Worktree dialogs (WS8): new / open / remove git-worktree checkouts ----
  //
  // Web adaptation of cats's prefix+w dialogs over the §7 worktree.* commands.
  // Everything anchors on the focused pane's repo (the server resolves it from
  // the pane's live cwd); worktree.list also reports which checkouts already
  // have an open workspace.

  // branchPathSlug mirrors the server's BranchToPathSlug so the new-worktree
  // dialog can preview the derived checkout path per keystroke.
  function branchPathSlug(branch) {
    let out = "", dash = false;
    for (const ch of branch) {
      if (/[a-zA-Z0-9]/.test(ch)) { out += ch.toLowerCase(); dash = false; }
      else if (!dash) { out += "-"; dash = true; }
    }
    out = out.replace(/^-+|-+$/g, "");
    return out || "worktree";
  }

  // generatedBranchSlug mirrors the server's GeneratedBranchSlug (same word
  // lists) for the dialog's prefill; the server would generate one too if the
  // branch were omitted.
  function generatedBranchSlug(seed) {
    const adj = ["brave", "calm", "clear", "green", "lucky", "quiet", "rapid", "silver"];
    const nouns = ["river", "cloud", "field", "forest", "harbor", "meadow", "stone", "valley"];
    const suffix = (seed & 0xffff).toString(16).padStart(4, "0");
    return "worktree/" + adj[seed % 8] + "-" + nouns[Math.floor(seed / 8) % 8] + "-" + suffix;
  }

  function worktreeStatus(e, repoRoot) {
    if (e.open_workspace) return "open";
    if (e.detached) return "detached";
    if (e.path === repoRoot) return "root";
    return "";
  }

  // withWorktreeList runs fn with the focused pane's worktree.list result,
  // toasting (not dialoging) when the pane isn't in a git repo.
  function withWorktreeList(fn) {
    sendCmdAwait("worktree.list", {}, (res) => {
      if (!res.ok) { toast("worktree: " + (res.error || "unknown")); return; }
      fn(res.data || {});
    });
  }

  function openNewWorktreeDialog() {
    withWorktreeList((info) => {
      openOverlay((ov) => {
        const m = document.createElement("div"); m.className = "modal";
        const h = document.createElement("header"); h.textContent = "new worktree — " + info.repo_name; m.appendChild(h);
        const body = document.createElement("div"); body.className = "body";
        const input = document.createElement("input");
        input.type = "text"; input.spellcheck = false;
        input.value = generatedBranchSlug(Date.now());
        body.appendChild(input);
        const pathEl = document.createElement("div"); pathEl.className = "hint"; body.appendChild(pathEl);
        const errEl = document.createElement("div"); errEl.className = "errline"; body.appendChild(errEl);
        m.appendChild(body);
        const syncPath = () => {
          pathEl.textContent = "checkout: " + info.worktree_root + "/" + info.repo_name + "/" +
            branchPathSlug(input.value.trim());
          errEl.textContent = "";
        };
        syncPath();
        let creating = false; // re-entry guard while git runs
        const create = () => {
          const branch = input.value.trim();
          if (!branch) { errEl.textContent = "branch is required"; return; }
          if (creating) return;
          creating = true;
          goBtn.disabled = true;
          sendCmdAwait("worktree.create", { branch }, (res) => {
            creating = false; goBtn.disabled = false;
            if (!res.ok) { errEl.textContent = res.error || "worktree add failed"; return; }
            closeModal();
            toast("worktree " + branch + " created");
          });
        };
        const btns = document.createElement("div"); btns.className = "btns";
        btns.appendChild(mkModalBtn("cancel", "", closeModal));
        const goBtn = mkModalBtn("create and open", "primary", create);
        btns.appendChild(goBtn);
        m.appendChild(btns);
        input.addEventListener("input", syncPath);
        input.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "Enter") { e.preventDefault(); create(); }
          else if (e.key === "Escape") { e.preventDefault(); closeModal(); }
        });
        ov.appendChild(m);
        // Selected prefill: the first keystroke replaces the generated slug.
        requestAnimationFrame(() => { input.focus(); input.select(); });
      });
    });
  }

  function openWorktreeOpenDialog() {
    withWorktreeList((info) => {
      const entries = (info.worktrees || []).filter((e) => !e.prunable);
      if (!entries.length) { toast("no git worktrees found for this repo"); return; }
      let sel = 0, query = "";
      let listEl, inputEl;

      // Filter: case-insensitive AND of whitespace tokens over branch+path+status.
      const rows = () => {
        const toks = query.toLowerCase().split(/\s+/).filter(Boolean);
        return entries.filter((e) => {
          const hay = ((e.branch || "") + " " + e.path + " " + worktreeStatus(e, info.repo_root)).toLowerCase();
          return toks.every((t) => hay.includes(t));
        });
      };
      const choose = (e) => {
        closeModal();
        sendCmdAwait("worktree.open", { path: e.path }, (res) => {
          if (!res.ok) { toast("open worktree failed: " + (res.error || "unknown")); return; }
          if (res.data && res.data.already_open) toast("switched to open worktree");
        });
      };
      const render = () => {
        const rs = rows();
        if (sel >= rs.length) sel = Math.max(0, rs.length - 1);
        listEl.innerHTML = "";
        if (!rs.length) {
          const el = document.createElement("div"); el.className = "empty"; el.textContent = "no matches";
          listEl.appendChild(el); return;
        }
        rs.forEach((e, i) => {
          const row = document.createElement("div");
          row.className = "row" + (i === sel ? " sel" : "");
          const kind = document.createElement("span"); kind.className = "kind";
          kind.textContent = worktreeStatus(e, info.repo_root);
          const lbl = document.createElement("span"); lbl.className = "lbl";
          lbl.textContent = e.branch || e.path.split("/").pop();
          const meta = document.createElement("span"); meta.className = "meta"; meta.textContent = e.path;
          row.appendChild(kind); row.appendChild(lbl); row.appendChild(meta);
          row.addEventListener("click", () => choose(e));
          row.addEventListener("mousemove", () => { if (sel !== i) { sel = i; render(); } });
          listEl.appendChild(row);
        });
        const cur = listEl.children[sel];
        if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
      };

      openOverlay((ov) => {
        const m = document.createElement("div"); m.className = "modal pal";
        const h = document.createElement("header"); h.textContent = "open worktree — " + info.repo_name; m.appendChild(h);
        const q = document.createElement("div"); q.className = "query";
        inputEl = document.createElement("input");
        inputEl.type = "text"; inputEl.placeholder = "filter by branch, path, or status"; inputEl.spellcheck = false;
        q.appendChild(inputEl); m.appendChild(q);
        listEl = document.createElement("div"); listEl.className = "list"; m.appendChild(listEl);
        inputEl.addEventListener("input", () => { query = inputEl.value; sel = 0; render(); });
        inputEl.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "ArrowDown") { e.preventDefault(); sel++; render(); }
          else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); render(); }
          else if (e.key === "Enter") { e.preventDefault(); const rs = rows(); if (rs[sel]) choose(rs[sel]); }
          else if (e.key === "Escape") { e.preventDefault(); closeModal(); }
        });
        ov.appendChild(m);
        requestAnimationFrame(() => inputEl.focus());
        render();
      });
    });
  }

  // removeWorktreeFor gates the menu action on membership: the workspace must be
  // an open linked checkout of the focused pane's repo (worktree.list says so).
  function removeWorktreeFor(w) {
    withWorktreeList((info) => {
      const entry = (info.worktrees || []).find((e) => e.open_workspace === w.id && e.path !== info.repo_root);
      if (!entry) { toast(w.name + " is not an open worktree checkout of this repo"); return; }
      confirmRemoveWorktree(w, entry.path, false);
    });
  }

  // Two-step force escalation: a plain remove that fails on dirty/untracked
  // files re-opens the confirm with the red delete-anyway warning.
  function confirmRemoveWorktree(w, path, force) {
    dialogConfirm({
      title: "delete worktree checkout",
      message: "This removes the checkout folder: " + path +
        " — the branch is not deleted. The workspace will close.",
      warn: force ? "Dirty or untracked files will be permanently deleted." : "",
      confirmLabel: force ? "delete anyway" : "delete checkout", danger: true,
      onConfirm: () => sendCmdAwait("worktree.remove", { workspace: w.id, force }, (res) => {
        if (res.ok) { toast("worktree checkout removed"); return; }
        const err = res.error || "";
        if (!force && err.startsWith("dirty_worktree_requires_force")) {
          confirmRemoveWorktree(w, path, true);
        } else {
          toast("remove worktree failed: " + err);
        }
      }),
    });
  }

  // ---- Plugins dialog ----
  //
  // One list over plugin.list with per-row actions. The instant verbs
  // (uninstall/unlink) resolve over §7 commands; install/link/rebuild spawn a
  // `catctl plugin …` tab instead — they run git plus a build whose live
  // output the user wants to watch, and cmd_result is one-shot, so a pane is
  // the streaming surface (the server resolves the catctl path for us).

  // pluginSourceIsPath mirrors the host's resolveSourceURL heuristic
  // (internal/plugin/install.go): a source shaped like a filesystem path is a
  // local checkout, which means `plugin link` — register it in place, edits
  // stay live — rather than `plugin install`, which clones into the plugins
  // root. Keeping the two heuristics identical means what the dialog decides
  // to do matches what catctl would have done with the same string.
  //
  // The leading marker is what makes it a path: "./x", "../x", "~/x", "/x".
  // A bare "cmd/cats-todo" is deliberately NOT one — two segments is the
  // "owner/repo" GitHub shorthand, and that ambiguity is why the prefix is
  // required rather than inferred from whether the directory happens to exist
  // (which the browser could not check anyway).
  function pluginSourceIsPath(s) {
    return /^[.~/]/.test(s);
  }

  // focusedPaneCwd is "the directory the user is looking at": the focused
  // pane's live cwd (tracked from pane_cwd events), rather than whatever
  // directory the server happened to start in. It anchors a *relative* link
  // path ("./cmd/cats-todo" means relative to the pane on screen) and roots
  // plugin action tabs in the current project (pluginRunAction). "" — no
  // focused pane, or its cwd not yet reported — leaves tab.create's default
  // cwd alone.
  function focusedPaneCwd() {
    const id = focusedPaneId();
    if (id == null) return "";
    const p = panes.get(id);
    return (p && p.cwd) || "";
  }

  function pluginStatus(p) {
    if (p.broken) return "broken";
    if (p.linked) return "linked";
    return ""; // installed is the default case; "" renders no status tag at all
  }

  // pluginRunAction launches one manifest action in a fresh tab: resolved argv
  // and identity env come straight from plugin.list (same shape catctl plugin
  // run sends). The tab is anchored to the focused pane's cwd for the same
  // reason `catctl plugin run` sends the invoker's cwd: plugins scope
  // per-project state (cats-todo's .cats-todo backlog) off the directory they
  // wake up in, and "the project I'm looking at" is what a user means by
  // "here". Without it, tab.create falls back to the server's start directory
  // and the action lands in a project the user never chose. "" (no focused
  // pane / cwd not yet reported) omits the field and keeps that default.
  // Deliberately no title: pinning the manifest label would block tab
  // auto-naming forever; the plugin's own OSC title names the tab live.
  function pluginRunAction(p, a) {
    closeModal();
    const params = { command: a.argv, env: p.env || {} };
    const cwd = focusedPaneCwd();
    if (cwd) params.cwd = cwd;
    sendCmdAwait("tab.create", params, (res) => {
      if (!res.ok) toast("plugin run failed: " + (res.error || "unknown"));
    });
  }

  // pluginCatctlTab spawns `catctl plugin <args…>` in a fresh tab. The pane
  // stays on screen after exit (exited chrome), so the git/build output — or
  // the failure — remains readable until the user closes it. cwd is optional
  // and only matters for the link path (see focusedPaneCwd).
  function pluginCatctlTab(catctl, title, args, cwd) {
    closeModal();
    const params = { title, command: [catctl, "plugin"].concat(args) };
    if (cwd) params.cwd = cwd;
    sendCmdAwait("tab.create", params, (res) => {
      if (!res.ok) toast("plugin: " + (res.error || "unknown"));
    });
  }

  // One prompt covers both ways in, dispatching on the shape of the source:
  // a path links a local checkout, anything else installs from git. Two
  // buttons would have made the user classify their own input; the host
  // already draws that line, so the dialog just follows it.
  function pluginInstallDialog(catctl) {
    dialogInput({
      title: "add plugin",
      hint: "owner/repo or git URL to install · --ref <branch|tag> to pin · " +
        "or a local path (./dir, ../dir, ~/dir, /dir) to link a checkout in place · runs in a new tab",
      submitLabel: "add",
      onSubmit: (v) => {
        const args = v.trim().split(/\s+/).filter(Boolean);
        if (!args.length) { toast("plugin: a source is required"); return; }
        if (pluginSourceIsPath(args[0])) {
          // --ref has no meaning for a link: there is nothing to check out,
          // the checkout is whatever the developer has on disk.
          if (args.length > 1) { toast("plugin link: takes a single directory"); return; }
          pluginCatctlTab(catctl, "plugin link", ["link", args[0]], focusedPaneCwd());
          return;
        }
        pluginCatctlTab(catctl, "plugin install", ["install"].concat(args));
      },
    });
  }

  function confirmUninstallPlugin(p) {
    dialogConfirm({
      title: "uninstall plugin",
      message: p.linked
        ? "Unlink “" + p.id + "”? Only the link is removed — your checkout at " + p.dir + " is untouched."
        : "Uninstall “" + p.id + "”? Its directory (" + p.dir + ") is deleted.",
      confirmLabel: p.linked ? "unlink" : "uninstall", danger: !p.linked,
      onConfirm: () => sendCmdAwait("plugin.uninstall", { id: p.id }, (res) => {
        if (!res.ok) { toast("uninstall failed: " + (res.error || "unknown")); return; }
        toast((res.data && res.data.message) || (p.id + " uninstalled"));
        openPluginsDialog(); // refresh the list in place
      }),
    });
  }

  function openPluginsDialog() {
    sendCmdAwait("plugin.list", {}, (res) => {
      if (!res.ok) { toast("plugins: " + (res.error || "unknown")); return; }
      const info = res.data || {};
      const plugins = info.plugins || [];
      openOverlay((ov) => {
        const m = document.createElement("div"); m.className = "modal pal plugins";
        const h = document.createElement("header"); h.textContent = "plugins"; m.appendChild(h);
        const listEl = document.createElement("div"); listEl.className = "list"; m.appendChild(listEl);
        if (!plugins.length) {
          const e = document.createElement("div"); e.className = "empty";
          e.textContent = "no plugins installed";
          listEl.appendChild(e);
        }
        for (const p of plugins) {
          const row = document.createElement("div"); row.className = "row";
          row.title = [p.broken || p.description, p.dir].filter(Boolean).join("\n");
          // The status tag exists only when there is a status: the default
          // installed case appends nothing, so the label starts at the row's
          // left edge instead of after an empty reserved column (see the
          // .modal.plugins .kind rule).
          const status = pluginStatus(p);
          if (status) {
            const kind = document.createElement("span"); kind.className = "kind";
            kind.textContent = status;
            row.appendChild(kind);
          }
          const lbl = document.createElement("span"); lbl.className = "lbl";
          lbl.textContent = p.broken ? p.id : p.id + " v" + (p.version || "?") +
            (p.name && p.name !== p.id ? " — " + p.name : "");
          row.appendChild(lbl);
          // A linked row shows its checkout inline: for a local plugin *where*
          // it lives is the identifying fact (which worktree am I linked to?),
          // whereas an installed plugin's dir is always the plugins root and
          // says nothing — that one stays in the tooltip.
          if (p.linked && p.dir) {
            const sub = document.createElement("span"); sub.className = "sub";
            sub.textContent = p.dir;
            row.appendChild(sub);
          }
          const acts = document.createElement("div"); acts.className = "acts";
          const actBtn = (label, cls, fn) => {
            const b = document.createElement("button");
            b.textContent = label; if (cls) b.className = cls;
            b.addEventListener("click", fn);
            acts.appendChild(b);
          };
          if (!p.broken && (p.actions || []).length) {
            actBtn("run", "", (e) => {
              // One action launches directly (the catctl default); more open a
              // picker at the button — the ctx menu coexists with the modal.
              if (p.actions.length === 1) { pluginRunAction(p, p.actions[0]); return; }
              const r = e.target.getBoundingClientRect();
              openCtx(r.left, r.bottom + 4, p.actions.map((a) => (
                { label: a.title || a.id, fn: () => pluginRunAction(p, a) }
              )));
              e.stopPropagation();
            });
          }
          if (!p.broken && !p.linked) {
            actBtn("update", "", () => pluginCatctlTab(info.catctl, "update " + p.id, ["update", p.id]));
          }
          if (!p.broken && p.linked && p.dir) {
            // The linked analogue of update. `plugin link` on the same checkout
            // is idempotent and re-runs the manifest's build steps, which is
            // exactly how a developer picks up their edits — update refuses on
            // linked plugins by design, there being no remote to pull from.
            // p.dir is the resolved symlink target, so no cwd is needed.
            actBtn("rebuild", "", () => pluginCatctlTab(info.catctl, "rebuild " + p.id, ["link", p.dir]));
          }
          actBtn(p.linked ? "unlink" : "uninstall", "danger", () => confirmUninstallPlugin(p));
          row.appendChild(acts);
          listEl.appendChild(row);
        }
        const btns = document.createElement("div"); btns.className = "btns";
        btns.appendChild(mkModalBtn("close", "", closeModal));
        btns.appendChild(mkModalBtn("add…", "primary", () => pluginInstallDialog(info.catctl)));
        m.appendChild(btns);
        m.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "Escape") { e.preventDefault(); closeModal(); }
        });
        ov.appendChild(m);
      });
    });
  }

  // ---- Command palette / navigator (WS8) ----
  //
  // One fuzzy list over both surfaces cats splits in two: the Navigator
  // (jump to any pane/tab/workspace, with agent-state context) and a command
  // list built on the §7 vocabulary. Panes come from a live pane.list query so
  // the palette reaches across workspaces, not just the viewport.

  function focusedPaneId() {
    if (!layoutMsg) return null;
    const pr = layoutMsg.panes.find((p) => p.focused);
    return pr ? pr.pane : null;
  }
  function activeTab() { return layoutMsg ? layoutMsg.tabs.find((t) => t.active) : null; }
  function activeWorkspace() { return layoutMsg ? layoutMsg.workspaces.find((w) => w.active) : null; }

  function paletteCommands() {
    const f = focusedPaneId(), at = activeTab(), aw = activeWorkspace();
    const items = [
      { label: "new tab", fn: () => sendCmd("tab.create", {}) },
      { label: "new workspace", fn: newWorkspace },
      { label: "split left/right", fn: () => sendCmd("pane.split", { direction: "h" }) },
      { label: "split top/bottom", fn: () => sendCmd("pane.split", { direction: "v" }) },
      { label: "toggle zoom", fn: () => sendCmd("pane.zoom", {}) },
      { label: "close pane", fn: () => sendCmd("pane.close", {}) },
      { label: "new worktree", fn: openNewWorktreeDialog },
      { label: "open worktree", fn: openWorktreeOpenDialog },
      { label: "plugins", fn: openPluginsDialog },
      { label: "settings", fn: openSettings },
      { label: "reload config", fn: () => sendCmd("server.reload_config", {}) },
      { label: "keyboard shortcuts", fn: openHelp },
      { label: "stop server…", fn: confirmStopServer },
    ];
    if (f !== null) {
      items.push(
        { label: "rename pane…", fn: () => renamePane(f) },
        { label: "copy mode", fn: () => enterCopyMode(f) },
        { label: "copy scrollback", fn: () => copyScrollback(f) },
      );
    }
    if (at) {
      items.push({ label: "rename tab…", fn: () => renameTab(at) });
      if (layoutMsg.tabs.length > 1) items.push({ label: "close tab", fn: () => sendCmd("tab.close", { num: at.num }) });
    }
    if (aw) {
      items.push(
        { label: "rename workspace…", fn: () => renameWorkspace(aw) },
        { label: "close workspace…", fn: () => confirmCloseWorkspace(aw) },
      );
    }
    return items.map((it) => ({ kind: "cmd", label: it.label, meta: "", fn: it.fn }));
  }

  // fuzzyScore: subsequence match with a run bonus and a word-start bonus;
  // -1 = no match, higher = better.
  function fuzzyScore(q, s) {
    q = q.toLowerCase(); s = s.toLowerCase();
    if (!q) return 0;
    let qi = 0, score = 0, run = 0;
    for (let i = 0; i < s.length && qi < q.length; i++) {
      if (s[i] === q[qi]) {
        qi++; run++;
        score += run + (i === 0 || " :·.-_/".includes(s[i - 1]) ? 3 : 0);
      } else run = 0;
    }
    return qi === q.length ? score : -1;
  }

  function openPalette() {
    let items = [];   // static part: workspaces, tabs, commands
    let paneItems = []; // async part: pane.list across all workspaces
    let sel = 0, query = "";
    let listEl, inputEl;

    if (layoutMsg) {
      for (const w of layoutMsg.workspaces) {
        items.push({ kind: "ws", label: w.name + " (" + w.id + ")", meta: w.active ? "active" : "",
          fn: () => { if (!w.active) sendCmd("workspace.focus", { id: w.id }); } });
      }
      for (const t of layoutMsg.tabs) {
        items.push({ kind: "tab", label: t.name, meta: t.active ? "active" : "",
          fn: () => { if (!t.active) sendCmd("tab.focus", { num: t.num }); } });
      }
    }
    items = items.concat(paletteCommands());

    const filtered = () => {
      const all = paneItems.concat(items);
      if (!query) return all;
      return all
        .map((it) => ({ it, s: fuzzyScore(query, it.label + " " + it.meta + " " + it.kind) }))
        .filter((x) => x.s >= 0)
        .sort((a, b) => b.s - a.s)
        .map((x) => x.it);
    };

    const render = () => {
      const rows = filtered();
      if (sel >= rows.length) sel = Math.max(0, rows.length - 1);
      listEl.innerHTML = "";
      if (!rows.length) {
        const e = document.createElement("div"); e.className = "empty"; e.textContent = "no matches";
        listEl.appendChild(e); return;
      }
      rows.slice(0, 60).forEach((it, i) => {
        const row = document.createElement("div");
        row.className = "row" + (i === sel ? " sel" : "");
        const kind = document.createElement("span"); kind.className = "kind"; kind.textContent = it.kind;
        const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = it.label;
        row.appendChild(kind); row.appendChild(lbl);
        if (it.meta) {
          const meta = document.createElement("span");
          meta.className = "meta" + (it.stateClass ? " " + it.stateClass : "");
          meta.textContent = it.meta;
          row.appendChild(meta);
        }
        row.addEventListener("click", () => { closeModal(); it.fn(); });
        row.addEventListener("mousemove", () => { if (sel !== i) { sel = i; render(); } });
        listEl.appendChild(row);
      });
      const cur = listEl.children[sel];
      if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
    };

    openOverlay((ov) => {
      const m = document.createElement("div"); m.className = "modal pal";
      const q = document.createElement("div"); q.className = "query";
      inputEl = document.createElement("input");
      inputEl.type = "text"; inputEl.placeholder = "jump to a pane, tab, workspace — or run a command"; inputEl.spellcheck = false;
      q.appendChild(inputEl); m.appendChild(q);
      listEl = document.createElement("div"); listEl.className = "list"; m.appendChild(listEl);
      inputEl.addEventListener("input", () => { query = inputEl.value; sel = 0; render(); });
      inputEl.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "ArrowDown") { e.preventDefault(); sel++; render(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); render(); }
        else if (e.key === "Enter") {
          e.preventDefault();
          const rows = filtered();
          if (rows[sel]) { closeModal(); rows[sel].fn(); }
        } else if (e.key === "Escape") { e.preventDefault(); closeModal(); }
      });
      ov.appendChild(m);
      requestAnimationFrame(() => inputEl.focus());
      render();
    });

    // Panes across all workspaces (agent.focus crosses workspace + tab).
    sendCmdAwait("pane.list", {}, (res) => {
      if (!res.ok || !modalEl) return;
      const byPane = new Map(agentItems.map((a) => [a.pane, a]));
      paneItems = (res.data && res.data.panes ? res.data.panes : []).map((pi) => {
        const a = byPane.get(pi.pane);
        return {
          kind: "pane",
          label: paneRef(pi.handle, pi.pane) + (pi.name ? " · " + pi.name : ""),
          meta: a ? a.agent + ":" + a.state : (pi.focused ? "focused" : ""),
          stateClass: a ? stClass(a.state) : "",
          fn: () => sendCmd("agent.focus", { pane: pi.pane }),
        };
      });
      render();
    });
  }

  // ---- Keyboard help (WS8) ----
  function helpSection(title, rows) {
    const wrap = document.createElement("div");
    const h = document.createElement("h3"); h.textContent = title; wrap.appendChild(h);
    const tbl = document.createElement("table");
    for (const [what, keys] of rows) {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td"); td1.textContent = what;
      const td2 = document.createElement("td");
      for (const k of keys) { const kb = document.createElement("span"); kb.className = "key"; kb.textContent = k; td2.appendChild(kb); }
      tr.appendChild(td1); tr.appendChild(td2); tbl.appendChild(tr);
    }
    wrap.appendChild(tbl);
    return wrap;
  }

  function openHelp() {
    openOverlay((ov) => {
      const m = document.createElement("div"); m.className = "modal help";
      const h = document.createElement("header"); h.textContent = "keyboard & mouse reference"; m.appendChild(h);
      const body = document.createElement("div"); body.className = "body";
      const cols = document.createElement("div"); cols.className = "helpcols";

      const left = document.createElement("div");
      left.appendChild(helpSection("global", [
        ["command palette", ["⌘K", "Ctrl+Alt+K"]],
        ["paste", ["⌘V", "Ctrl+Shift+V*"]],
        ["bigger / smaller font", ["⌘+", "⌘-"]],
        ["reset font size", ["⌘0"]],
        ["this help", ["⌘K → keyboard shortcuts"]],
      ]));
      left.appendChild(helpSection("start-path picker (new workspace)", [
        ["move through directories", ["↑", "↓", "Ctrl+n", "Ctrl+p"]],
        ["complete, then list inside it", ["Tab", "click"]],
        ["create in the highlighted one", ["Enter"]],
        ["include dotted directories", ["type a leading ."]],
      ]));
      left.appendChild(helpSection("mouse", [
        ["focus pane", ["click"]],
        ["select + copy text", ["drag"]],
        ["rectangular selection", ["Alt+drag"]],
        ["pane / tab / workspace menu", ["right-click"]],
        ["resize splits", ["drag the border"]],
        ["swap panes", ["drag a pane header or sidebar row onto a pane"]],
        ["reorder tabs / workspaces", ["drag"]],
        ["rename pane / tab / workspace", ["double-click its title"]],
        ["scrollback", ["wheel", "drag the scrollbar"]],
        ["launcher menu", ["⚙ at the right of the tab row"]],
      ]));
      cols.appendChild(left);

      // Copy-mode bindings reflect the active table (config-injected or default).
      const actions = [
        ["move", ["move-left", "move-down", "move-up", "move-right"]],
        ["line start / end", ["line-start", "line-end"]],
        ["top / bottom", ["top", "bottom"]],
        ["begin selection", ["select"]],
        ["rectangle toggle", ["rect"]],
        ["yank to clipboard", ["yank"]],
        ["exit copy mode", ["exit"]],
      ];
      const table = (window.__catsKeys && window.__catsKeys.copyMode) || COPY_MODE_DEFAULT;
      const right = document.createElement("div");
      right.appendChild(helpSection("copy mode (⬚ on a pane header)",
        actions.map(([what, acts]) => [what, acts.flatMap((a) => table[a] || [])])));
      right.appendChild(helpSection("pane header buttons", [
        ["split left/right · top/bottom", ["◫", "⊟"]],
        ["zoom", ["⤢"]],
        ["copy mode · copy scrollback", ["⬚", "⧉"]],
        ["rename · close", ["✎", "✕"]],
      ]));
      cols.appendChild(right);

      body.appendChild(cols);
      const note = document.createElement("p");
      note.className = "hint";
      note.textContent = "* browser paste shortcuts vary; the ⌘V path asks for clipboard permission once. Everything else is typed straight into the focused terminal.";
      body.appendChild(note);
      m.appendChild(body);
      const btns = document.createElement("div"); btns.className = "btns";
      btns.appendChild(mkModalBtn("close", "primary", closeModal));
      m.appendChild(btns);
      m.addEventListener("keydown", (e) => { e.stopPropagation(); if (e.key === "Escape") { e.preventDefault(); closeModal(); } });
      ov.appendChild(m);
    });
  }

  // ---- Settings modal (WS8): theme + copy-mode keys over config.get/set ----
  //
  // Theme edits live-preview immediately (inline :root custom-property
  // overrides); cancel/Escape rolls the preview back to the config.get values,
  // save persists via config.set and keeps it. Copy-mode rebinds and other
  // clients' theme apply on their next page load (the server re-renders the
  // served page); server settings are shown read-only — they need a restart.

  function openSettings() {
    sendCmdAwait("config.get", {}, (res) => {
      if (!res.ok) { toast("config.get failed: " + (res.error || "unknown")); return; }
      buildSettingsModal(res.data || {});
    });
  }

  function buildSettingsModal(cfg) {
    const colors = (cfg.theme && cfg.theme.colors) || {};
    const copyMode = cfg.copy_mode || {};
    const server = cfg.server || {};
    const root = document.documentElement;

    const prevFont = root.style.fontFamily;
    let saved = false;
    const applyColor = (k, v) => root.style.setProperty("--" + k, v);
    const applyFont = (f) => { root.style.fontFamily = f; document.body.style.fontFamily = f; };
    const rollback = () => {
      for (const k in colors) root.style.removeProperty("--" + k);
      root.style.fontFamily = prevFont;
      document.body.style.fontFamily = "";
    };

    openOverlay((ov) => {
      const m = document.createElement("div"); m.className = "modal settings";
      const h = document.createElement("header"); h.textContent = "settings — " + (cfg.path || "config"); m.appendChild(h);
      const body = document.createElement("div"); body.className = "body";
      const section = (title) => { const t = document.createElement("h3"); t.textContent = title; body.appendChild(t); };
      const row = (labelText) => {
        const r = document.createElement("div"); r.className = "row";
        const l = document.createElement("label"); l.textContent = labelText; r.appendChild(l);
        body.appendChild(r);
        return r;
      };
      const isHex = (v) => /^#[0-9a-fA-F]{6}$/.test(v);

      section("theme");
      const colorInputs = {};
      for (const key of Object.keys(colors).sort()) {
        const r = row(key);
        const swatch = document.createElement("input"); swatch.type = "color";
        const hex = document.createElement("input"); hex.type = "text"; hex.spellcheck = false;
        hex.value = colors[key];
        if (isHex(colors[key])) swatch.value = colors[key];
        swatch.addEventListener("input", () => { hex.value = swatch.value; applyColor(key, swatch.value); });
        hex.addEventListener("input", () => {
          const v = hex.value.trim();
          if (isHex(v)) swatch.value = v;
          if (v) applyColor(key, v);
        });
        r.appendChild(swatch); r.appendChild(hex);
        colorInputs[key] = hex;
      }
      const fr = row("font");
      const fontInput = document.createElement("input"); fontInput.type = "text"; fontInput.spellcheck = false;
      fontInput.value = (cfg.theme && cfg.theme.font) || "";
      fontInput.addEventListener("input", () => { if (fontInput.value.trim()) applyFont(fontInput.value.trim()); });
      fr.appendChild(fontInput);

      // The action set comes from config.get, so every row is a known action.
      section("copy-mode keys");
      const keyInputs = {};
      for (const action of Object.keys(copyMode).sort()) {
        const r = row(action);
        const inp = document.createElement("input"); inp.type = "text"; inp.spellcheck = false;
        inp.title = "comma-separated KeyboardEvent.key values";
        inp.value = (copyMode[action] || []).join(", ");
        r.appendChild(inp);
        keyInputs[action] = inp;
      }

      section("server (read-only)");
      const ro = (label, val) => {
        const r = row(label);
        const s = document.createElement("span"); s.className = "ro"; s.textContent = val;
        r.appendChild(s);
      };
      ro("addr", server.addr || "");
      ro("auth", server.auth || "");
      ro("tls", server.tls ? "on" : "off");
      ro("cathost socket", server.cathost_socket || "");
      ro("control socket", server.control_socket || "(default)");
      ro("hook socket", server.hook_socket || "(disabled)");
      ro("session ttl", server.session_ttl || "");
      const note = document.createElement("div"); note.className = "hint";
      note.textContent = "server settings come from flags/config file and take effect on restart";
      body.appendChild(note);

      const errEl = document.createElement("div"); errEl.className = "errline"; body.appendChild(errEl);
      m.appendChild(body);

      const save = () => {
        const outColors = {};
        for (const k in colorInputs) {
          const v = colorInputs[k].value.trim();
          if (v) outColors[k] = v;
        }
        const outKeys = {};
        for (const a in keyInputs) {
          const keys = keyInputs[a].value.split(",").map((s) => s.trim()).filter(Boolean);
          if (!keys.length) { errEl.textContent = "copy-mode " + a + ": needs at least one key"; return; }
          outKeys[a] = keys;
        }
        const font = fontInput.value.trim();
        sendCmdAwait("config.set", { theme: { colors: outColors, font }, copy_mode: outKeys }, (res) => {
          if (!res.ok) { errEl.textContent = res.error || "save failed"; return; }
          saved = true;
          // Apply the saved theme to this page right away; other clients get it
          // on their next load from the re-rendered served page.
          for (const k in outColors) applyColor(k, outColors[k]);
          if (font) applyFont(font);
          closeModal();
          toast("settings saved");
          if (Object.keys(outKeys).some((a) => outKeys[a].join(",") !== (copyMode[a] || []).join(","))) {
            toast("copy-mode rebinds apply after a page reload");
          }
        });
      };

      const btns = document.createElement("div"); btns.className = "btns";
      btns.appendChild(mkModalBtn("cancel", "", closeModal));
      btns.appendChild(mkModalBtn("save", "primary", save));
      m.appendChild(btns);
      m.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Enter") { e.preventDefault(); save(); }
        else if (e.key === "Escape") { e.preventDefault(); closeModal(); }
      });
      ov.appendChild(m);
      // Any close path (cancel, Escape, backdrop) rolls the preview back unless
      // it was saved.
      modalCleanup = () => { if (!saved) rollback(); };
    });
  }

  // ---- Update banner (WS8): the update_ready message ----
  // updateInfo persists past a dismissed banner so the launcher menu can
  // re-surface it ("update ready" item + gear badge, cats's launcher badge).
  let updateInfo = null;
  function showUpdateBanner() {
    showBanner("cats update ready" + (updateInfo.version ? " — " + updateInfo.version : "") +
      (updateInfo.command ? " · run: " + updateInfo.command : ""));
  }
  // showBanner(text, kind): kind is an optional extra class ("linkerr") that
  // recolors the strip; dismissing always clears both so the next banner starts
  // from the default look.
  function showBanner(text, kind) {
    bannerEl.innerHTML = "";
    const t = document.createElement("span"); t.textContent = text;
