    const suffix = (seed & 0xffff).toString(16).padStart(4, "0");
    return "worktree/" + adj[seed % 8] + "-" + nouns[Math.floor(seed / 8) % 8] + "-" + suffix;
  }

  function worktreeStatus(e, repoRoot) {
    if (e.open_workspace) return "open";
    if (e.detached) return "detached";
    if (e.path === repoRoot) return "root";
    return "";
  }

  // worktreeTitle names the dialog: the repository, and — only when the session
  // has more than one host — the machine whose disk it is on. Every path in a
  // worktree.list answer belongs to that machine, including the checkout path
  // previewed below the branch field, so leaving the host out of a multi-host
  // session would put a remote path under a title that reads as local.
  function worktreeTitle(verb, info) {
    const name = verb + " worktree — " + info.repo_name;
    return multiHost() && info.host ? name + " @ " + hostLabel(info.host) : name;
  }

  // withWorktreeList runs fn with the focused pane's worktree.list result,
  // toasting (not dialoging) when the pane isn't in a git repo.
  function withWorktreeList(fn) {
    sendCmdAwait("worktree.list", {}, (res) => {
      if (!res.ok) { toast("worktree: " + (res.error || "unknown")); return; }
      fn(res.data || {});
    });
  }

  function openNewWorktreeDialog() {
    withWorktreeList((info) => {
      openOverlay((ov) => {
        const m = document.createElement("div"); m.className = "modal";
        const h = document.createElement("header"); h.textContent = worktreeTitle("new", info); m.appendChild(h);
        const body = document.createElement("div"); body.className = "body";
        const input = document.createElement("input");
        input.type = "text"; input.spellcheck = false;
        input.value = generatedBranchSlug(Date.now());
        body.appendChild(input);
        const pathEl = document.createElement("div"); pathEl.className = "hint"; body.appendChild(pathEl);
        const errEl = document.createElement("div"); errEl.className = "errline"; body.appendChild(errEl);
        m.appendChild(body);
        const syncPath = () => {
          pathEl.textContent = "checkout: " + info.worktree_root + "/" + info.repo_name + "/" +
            branchPathSlug(input.value.trim());
          errEl.textContent = "";
        };
        syncPath();
        let creating = false; // re-entry guard while git runs
        const create = () => {
          const branch = input.value.trim();
          if (!branch) { errEl.textContent = "branch is required"; return; }
          if (creating) return;
          creating = true;
          goBtn.disabled = true;
          sendCmdAwait("worktree.create", { branch }, (res) => {
            creating = false; goBtn.disabled = false;
            if (!res.ok) { errEl.textContent = res.error || "worktree add failed"; return; }
            closeModal();
            toast("worktree " + branch + " created");
          });
        };
        const btns = document.createElement("div"); btns.className = "btns";
        btns.appendChild(mkModalBtn("cancel", "", closeModal));
        const goBtn = mkModalBtn("create and open", "primary", create);
        btns.appendChild(goBtn);
        m.appendChild(btns);
        input.addEventListener("input", syncPath);
        input.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "Enter") { e.preventDefault(); create(); }
          else if (e.key === "Escape") { e.preventDefault(); closeModal(); }
        });
        ov.appendChild(m);
        // Selected prefill: the first keystroke replaces the generated slug.
        focusField(input, true);
      });
    });
  }

  function openWorktreeOpenDialog() {
    withWorktreeList((info) => {
      const entries = (info.worktrees || []).filter((e) => !e.prunable);
      if (!entries.length) { toast("no git worktrees found for this repo"); return; }
      let sel = 0, query = "";
      let listEl, inputEl;

      // Filter: case-insensitive AND of whitespace tokens over branch+path+status.
      const rows = () => {
        const toks = query.toLowerCase().split(/\s+/).filter(Boolean);
        return entries.filter((e) => {
          const hay = ((e.branch || "") + " " + e.path + " " + worktreeStatus(e, info.repo_root)).toLowerCase();
          return toks.every((t) => hay.includes(t));
        });
      };
      const choose = (e) => {
        closeModal();
        sendCmdAwait("worktree.open", { path: e.path }, (res) => {
          if (!res.ok) { toast("open worktree failed: " + (res.error || "unknown")); return; }
          if (res.data && res.data.already_open) toast("switched to open worktree");
        });
      };
      const render = () => {
        const rs = rows();
        if (sel >= rs.length) sel = Math.max(0, rs.length - 1);
        listEl.innerHTML = "";
        if (!rs.length) {
          const el = document.createElement("div"); el.className = "empty"; el.textContent = "no matches";
          listEl.appendChild(el); return;
        }
        rs.forEach((e, i) => {
          const row = document.createElement("div");
          row.className = "row" + (i === sel ? " sel" : "");
          const kind = document.createElement("span"); kind.className = "kind";
          kind.textContent = worktreeStatus(e, info.repo_root);
          const lbl = document.createElement("span"); lbl.className = "lbl";
          lbl.textContent = e.branch || e.path.split("/").pop();
          const meta = document.createElement("span"); meta.className = "meta"; meta.textContent = e.path;
          row.appendChild(kind); row.appendChild(lbl); row.appendChild(meta);
          row.addEventListener("click", () => choose(e));
          row.addEventListener("mousemove", () => { if (sel !== i) { sel = i; render(); } });
          listEl.appendChild(row);
        });
        const cur = listEl.children[sel];
        if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
      };

      openOverlay((ov) => {
        const m = document.createElement("div"); m.className = "modal pal";
        const h = document.createElement("header"); h.textContent = worktreeTitle("open", info); m.appendChild(h);
        const q = document.createElement("div"); q.className = "query";
        inputEl = document.createElement("input");
        inputEl.type = "text"; inputEl.placeholder = "filter by branch, path, or status"; inputEl.spellcheck = false;
        q.appendChild(inputEl); m.appendChild(q);
        listEl = document.createElement("div"); listEl.className = "list"; m.appendChild(listEl);
        inputEl.addEventListener("input", () => { query = inputEl.value; sel = 0; render(); });
        inputEl.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "ArrowDown") { e.preventDefault(); sel++; render(); }
          else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); render(); }
          else if (e.key === "Enter") { e.preventDefault(); const rs = rows(); if (rs[sel]) choose(rs[sel]); }
          else if (e.key === "Escape") { e.preventDefault(); closeModal(); }
        });
        ov.appendChild(m);
        focusField(inputEl);
        render();
      });
    });
  }

  // removeWorktreeFor gates the menu action on membership: the workspace must be
  // an open linked checkout of the focused pane's repo (worktree.list says so).
  function removeWorktreeFor(w) {
    withWorktreeList((info) => {
      const entry = (info.worktrees || []).find((e) => e.open_workspace === w.id && e.path !== info.repo_root);
      if (!entry) { toast(w.name + " is not an open worktree checkout of this repo"); return; }
      confirmRemoveWorktree(w, entry.path, false);
    });
  }

  // Two-step force escalation: a plain remove that fails on dirty/untracked
  // files re-opens the confirm with the red delete-anyway warning.
  function confirmRemoveWorktree(w, path, force) {
    dialogConfirm({
      title: "delete worktree checkout",
      message: "This removes the checkout folder: " + path +
        " — the branch is not deleted. The workspace will close.",
      warn: force ? "Dirty or untracked files will be permanently deleted." : "",
      confirmLabel: force ? "delete anyway" : "delete checkout", danger: true,
      onConfirm: () => sendCmdAwait("worktree.remove", { workspace: w.id, force }, (res) => {
        if (res.ok) { toast("worktree checkout removed"); return; }
        const err = res.error || "";
        if (!force && err.startsWith("dirty_worktree_requires_force")) {
          confirmRemoveWorktree(w, path, true);
        } else {
          toast("remove worktree failed: " + err);
        }
      }),
    });
  }

  // ---- Plugins dialog ----
  //
  // One list over plugin.list with per-row actions. The instant verbs
  // (uninstall/unlink) resolve over §7 commands; install/link/rebuild spawn a
  // `catctl plugin …` tab instead — they run git plus a build whose live
  // output the user wants to watch, and cmd_result is one-shot, so a pane is
  // the streaming surface (the server resolves the catctl path for us).

  // pluginSourceIsPath mirrors the host's resolveSourceURL heuristic
  // (internal/plugin/install.go): a source shaped like a filesystem path is a
  // local checkout, which means `plugin link` — register it in place, edits
  // stay live — rather than `plugin install`, which clones into the plugins
  // root. Keeping the two heuristics identical means what the dialog decides
  // to do matches what catctl would have done with the same string.
  //
  // The leading marker is what makes it a path: "./x", "../x", "~/x", "/x".
  // A bare "cmd/cats-todo" is deliberately NOT one — two segments is the
  // "owner/repo" GitHub shorthand, and that ambiguity is why the prefix is
  // required rather than inferred from whether the directory happens to exist
  // (which the browser could not check anyway).
  function pluginSourceIsPath(s) {
    return /^[.~/]/.test(s);
  }

  // focusedPaneCwd is "the directory the user is looking at": the focused
  // pane's live cwd (tracked from pane_cwd events), rather than whatever
  // directory the server happened to start in. It anchors a *relative* link
  // path ("./cmd/cats-todo" means relative to the pane on screen) and roots
  // plugin action tabs in the current project (pluginRunAction). "" — no
  // focused pane, or its cwd not yet reported — leaves tab.create's default
  // cwd alone.
  function focusedPaneCwd() {
    const id = focusedPaneId();
    if (id == null) return "";
    const p = panes.get(id);
    return (p && p.cwd) || "";
  }

  function pluginStatus(p) {
    if (p.broken) return "broken";
    if (p.linked) return "linked";
    return ""; // installed is the default case; "" renders no status tag at all
  }

  // pluginRunAction launches one manifest action in a fresh tab: resolved argv
  // and identity env come straight from plugin.list (same shape catctl plugin
  // run sends). The tab is anchored to the focused pane's cwd for the same
  // reason `catctl plugin run` sends the invoker's cwd: plugins scope
  // per-project state (cats-todo's .cats-todo backlog) off the directory they
  // wake up in, and "the project I'm looking at" is what a user means by
  // "here". Without it, tab.create falls back to the server's start directory
  // and the action lands in a project the user never chose. "" (no focused
  // pane / cwd not yet reported) omits the field and keeps that default.
  // Deliberately no title: pinning the manifest label would block tab
  // auto-naming forever; the plugin's own OSC title names the tab live.
  function pluginRunAction(p, a) {
    closeModal();
    const params = { command: a.argv, env: p.env || {} };
    const cwd = focusedPaneCwd();
    if (cwd) params.cwd = cwd;
    sendCmdAwait("tab.create", params, (res) => {
      if (!res.ok) toast("plugin run failed: " + (res.error || "unknown"));
    });
  }

  // pluginRunActionAll starts one action in every workspace at once — the
  // "open my todo list / my dev server / my log tail everywhere" case, which
  // otherwise costs a switch and a menu per workspace and leaves the viewport
  // wherever the last one landed. Nothing is focused and nothing is switched to:
  // each launch names its workspace (tab.create's workspace param), so the user
  // stays exactly where they were and finds the tabs already open when they
  // arrive.
  //
  // Locked workspaces are filtered out here rather than left to be refused by
  // the server. The lock means "no automation lands in this one", and a fan-out
  // is the automation it was written for — so a skip is the *expected* outcome,
  // not a failure, and reporting six launches and one error would read as
  // something having gone wrong. The count says so instead.
  //
  // No cwd, for the same reason as startPluginInWorkspace: each tab inherits its
  // own workspace's directory, so a per-project plugin scopes to the project it
  // landed in. Sending the focused pane's cwd would start every copy against the
  // one project the user happens to be looking at, which is the opposite of what
  // "in all workspaces" asks for.
  function pluginRunActionAll(p, a) {
    closeModal();
    const wss = (layoutMsg && layoutMsg.workspaces) || [];
    const targets = wss.filter((w) => !w.locked);
    const label = a.title || a.id;
    if (!targets.length) {
      toast(label + ": every workspace is locked");
      return;
    }
    // One reply per launch, summarised once at the end: N in-flight commands
    // would otherwise raise N toasts, and the useful fact is the tally.
    let ok = 0, failed = 0;
    const locked = wss.length - targets.length;
    const settle = () => {
      if (ok + failed < targets.length) return;
      const parts = [label + " started in " + ok + (ok === 1 ? " workspace" : " workspaces")];
      if (locked) parts.push(locked + " locked, skipped");
      if (failed) parts.push(failed + " failed");
      toast(parts.join(" · "));
    };
    for (const w of targets) {
      sendCmdAwait("tab.create", { workspace: w.id, command: a.argv, env: p.env || {} }, (res) => {
        if (res.ok) ok++; else failed++;
        settle();
      });
    }
  }

  // pluginPickAction is the run buttons' shared "which action?" step: one action
  // launches straight away (the catctl default), several open a picker at the
  // button — the ctx menu coexists with the modal. run and run-all differ only
  // in what they do with the answer, so the choosing lives here once and the two
  // buttons cannot drift into asking it differently.
  function pluginPickAction(p, e, launch) {
    if (p.actions.length === 1) { launch(p.actions[0]); return; }
    const r = e.target.getBoundingClientRect();
    openCtx(r.left, r.bottom + 4, p.actions.map((a) => (
      { label: a.title || a.id, fn: () => launch(a) }
    )));
    e.stopPropagation();
  }

  // pluginCatctlTab spawns `catctl plugin <args…>` in a fresh tab. The pane
  // stays on screen after exit (exited chrome), so the git/build output — or
  // the failure — remains readable until the user closes it. cwd is optional
  // and only matters for the link path (see focusedPaneCwd).
  function pluginCatctlTab(catctl, title, args, cwd) {
    closeModal();
    const params = { title, command: [catctl, "plugin"].concat(args) };
    if (cwd) params.cwd = cwd;
    sendCmdAwait("tab.create", params, (res) => {
      if (!res.ok) toast("plugin: " + (res.error || "unknown"));
    });
  }

  // One prompt covers both ways in, dispatching on the shape of the source:
  // a path links a local checkout, anything else installs from git. Two
  // buttons would have made the user classify their own input; the host
  // already draws that line, so the dialog just follows it.
  function pluginInstallDialog(catctl) {
    dialogInput({
      title: "add plugin",
      hint: "owner/repo or git URL to install · --ref <branch|tag> to pin · " +
        "or a local path (./dir, ../dir, ~/dir, /dir) to link a checkout in place · runs in a new tab",
      submitLabel: "add",
      onSubmit: (v) => {
        const args = v.trim().split(/\s+/).filter(Boolean);
        if (!args.length) { toast("plugin: a source is required"); return; }
        if (pluginSourceIsPath(args[0])) {
          // --ref has no meaning for a link: there is nothing to check out,
          // the checkout is whatever the developer has on disk.
          if (args.length > 1) { toast("plugin link: takes a single directory"); return; }
          pluginCatctlTab(catctl, "plugin link", ["link", args[0]], focusedPaneCwd());
          return;
        }
        pluginCatctlTab(catctl, "plugin install", ["install"].concat(args));
      },
    });
  }

  function confirmUninstallPlugin(p) {
    dialogConfirm({
      title: "uninstall plugin",
      message: p.linked
        ? "Unlink “" + p.id + "”? Only the link is removed — your checkout at " + p.dir + " is untouched."
        : "Uninstall “" + p.id + "”? Its directory (" + p.dir + ") is deleted.",
      confirmLabel: p.linked ? "unlink" : "uninstall", danger: !p.linked,
      onConfirm: () => sendCmdAwait("plugin.uninstall", { id: p.id }, (res) => {
        if (!res.ok) { toast("uninstall failed: " + (res.error || "unknown")); return; }
        toast((res.data && res.data.message) || (p.id + " uninstalled"));
        openPluginsDialog(); // refresh the list in place
      }),
    });
  }

  function openPluginsDialog() {
    sendCmdAwait("plugin.list", {}, (res) => {
      if (!res.ok) { toast("plugins: " + (res.error || "unknown")); return; }
      const info = res.data || {};
      const plugins = info.plugins || [];
      openOverlay((ov) => {
        const m = document.createElement("div"); m.className = "modal pal plugins";
        const h = document.createElement("header"); h.textContent = "plugins"; m.appendChild(h);
        const listEl = document.createElement("div"); listEl.className = "list"; m.appendChild(listEl);
        if (!plugins.length) {
          const e = document.createElement("div"); e.className = "empty";
          e.textContent = "no plugins installed";
          listEl.appendChild(e);
        }
        for (const p of plugins) {
          const row = document.createElement("div"); row.className = "row";
          row.title = [p.broken || p.description, p.dir].filter(Boolean).join("\n");
          // The status tag exists only when there is a status: the default
          // installed case appends nothing, so the label starts at the row's
          // left edge instead of after an empty reserved column (see the
          // .modal.plugins .kind rule).
          const status = pluginStatus(p);
          if (status) {
            const kind = document.createElement("span"); kind.className = "kind";
            kind.textContent = status;
            row.appendChild(kind);
          }
          const lbl = document.createElement("span"); lbl.className = "lbl";
          lbl.textContent = p.broken ? p.id : p.id + " v" + (p.version || "?") +
            (p.name && p.name !== p.id ? " — " + p.name : "");
          row.appendChild(lbl);
          // A linked row shows its checkout inline: for a local plugin *where*
          // it lives is the identifying fact (which worktree am I linked to?),
          // whereas an installed plugin's dir is always the plugins root and
          // says nothing — that one stays in the tooltip.
          if (p.linked && p.dir) {
            const sub = document.createElement("span"); sub.className = "sub";
            sub.textContent = p.dir;
            row.appendChild(sub);
          }
          const acts = document.createElement("div"); acts.className = "acts";
          const actBtn = (label, cls, fn, tip) => {
            const b = document.createElement("button");
            b.textContent = label; if (cls) b.className = cls;
            if (tip) b.title = tip;
            b.addEventListener("click", fn);
            acts.appendChild(b);
          };
          if (!p.broken && (p.actions || []).length) {
            actBtn("run", "", (e) => pluginPickAction(p, e, (a) => pluginRunAction(p, a)));
            // The fan-out is its own button rather than a row in run's menu:
            // launching here is by far the common case, and folding both targets
            // into one menu would charge every multi-workspace session an extra
            // click for it. It appears only when there is more than one
            // workspace — with a single workspace it is the same launch under a
            // longer name, and offering it would be inventing a decision.
            if (((layoutMsg && layoutMsg.workspaces) || []).length > 1) {
              actBtn("run all", "", (e) => pluginPickAction(p, e, (a) => pluginRunActionAll(p, a)),
                "start in all workspaces (locked ones are skipped)");
            }
          }
          if (!p.broken && !p.linked) {
            actBtn("update", "", () => pluginCatctlTab(info.catctl, "update " + p.id, ["update", p.id]));
          }
          if (!p.broken && p.linked && p.dir) {
            // The linked analogue of update. `plugin link` on the same checkout
            // is idempotent and re-runs the manifest's build steps, which is
            // exactly how a developer picks up their edits — update refuses on
            // linked plugins by design, there being no remote to pull from.
            // p.dir is the resolved symlink target, so no cwd is needed.
            actBtn("rebuild", "", () => pluginCatctlTab(info.catctl, "rebuild " + p.id, ["link", p.dir]));
          }
          actBtn(p.linked ? "unlink" : "uninstall", "danger", () => confirmUninstallPlugin(p));
          row.appendChild(acts);
          listEl.appendChild(row);
        }
        const btns = document.createElement("div"); btns.className = "btns";
        btns.appendChild(mkModalBtn("close", "", closeModal));
        btns.appendChild(mkModalBtn("add…", "primary", () => pluginInstallDialog(info.catctl)));
        m.appendChild(btns);
        m.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "Escape") { e.preventDefault(); closeModal(); }
        });
        ov.appendChild(m);
      });
    });
  }

  // ---- Command palette / navigator (WS8) ----
  //
  // One fuzzy list over both surfaces cats splits in two: the Navigator
  // (jump to any pane/tab/workspace, with agent-state context) and a command
  // list built on the §7 vocabulary. Panes come from a live pane.list query so
  // the palette reaches across workspaces, not just the viewport.

  function focusedPaneId() {
    if (!layoutMsg) return null;
    const pr = layoutMsg.panes.find((p) => p.focused);
    return pr ? pr.pane : null;
  }
  function activeTab() { return layoutMsg ? layoutMsg.tabs.find((t) => t.active) : null; }
  function activeWorkspace() { return layoutMsg ? layoutMsg.workspaces.find((w) => w.active) : null; }

  function paletteCommands() {
    const f = focusedPaneId(), at = activeTab(), aw = activeWorkspace();
    const items = [
      { label: "new tab", fn: () => sendCmd("tab.create", {}) },
      { label: "new workspace", fn: newWorkspace },
      { label: "split left/right", fn: () => sendCmd("pane.split", { direction: "h" }) },
      { label: "split top/bottom", fn: () => sendCmd("pane.split", { direction: "v" }) },
      { label: "toggle zoom", fn: () => sendCmd("pane.zoom", {}) },
      { label: "close pane", fn: () => sendCmd("pane.close", {}) },
      { label: "new worktree", fn: openNewWorktreeDialog },
      { label: "open worktree", fn: openWorktreeOpenDialog },
      { label: "plugins", fn: openPluginsDialog },
      { label: sidebarHidden() ? "show sidebar" : "hide sidebar", fn: () => setSidebarHidden(!sidebarHidden()) },
      { label: "settings", fn: openSettings },
      { label: "reload config", fn: () => sendCmd("server.reload_config", {}) },
      { label: "keyboard shortcuts", fn: openHelp },
      { label: "stop server…", fn: confirmStopServer },
    ];
    if (f !== null) {
      items.push(
        { label: "rename pane…", fn: () => renamePane(f) },
        { label: "copy mode", fn: () => enterCopyMode(f) },
        { label: "copy scrollback", fn: () => copyScrollback(f) },
      );
    }
    if (at) {
      items.push({ label: "rename tab…", fn: () => renameTab(at) });
      if (layoutMsg.tabs.length > 1) items.push({ label: "close tab", fn: () => sendCmd("tab.close", { num: at.num }) });
    }
    if (aw) {
      items.push(
        { label: "rename workspace…", fn: () => renameWorkspace(aw) },
        { label: aw.locked ? "unlock workspace" : "lock workspace (no plugins or agents)", fn: () => toggleWorkspaceLock(aw) },
        { label: "close workspace…", fn: () => confirmCloseWorkspace(aw) },
      );
    }
    return items.map((it) => ({ kind: "cmd", label: it.label, meta: "", fn: it.fn }));
  }

  // fuzzyScore: subsequence match with a run bonus and a word-start bonus;
  // -1 = no match, higher = better.
  function fuzzyScore(q, s) {
    q = q.toLowerCase(); s = s.toLowerCase();
    if (!q) return 0;
    let qi = 0, score = 0, run = 0;
    for (let i = 0; i < s.length && qi < q.length; i++) {
      if (s[i] === q[qi]) {
        qi++; run++;
        score += run + (i === 0 || " :·.-_/".includes(s[i - 1]) ? 3 : 0);
      } else run = 0;
    }
    return qi === q.length ? score : -1;
  }

  function openPalette() {
    let items = [];   // static part: workspaces, tabs, commands
    let paneItems = []; // async part: pane.list across all workspaces
    let sel = 0, query = "";
    let listEl, inputEl;

    if (layoutMsg) {
      for (const w of layoutMsg.workspaces) {
        items.push({ kind: "ws", label: w.name + " (" + w.id + ")", meta: w.active ? "active" : "",
          fn: () => { if (!w.active) sendCmd("workspace.focus", { id: w.id }); } });
        items.push({ kind: "ws", label: "open " + w.name + " in new window", meta: w.id,
          fn: () => openWindow(w.id) });
      }
      for (const t of layoutMsg.tabs) {
        items.push({ kind: "tab", label: t.name, meta: t.active ? "active" : "",
          fn: () => { if (!t.active) sendCmd("tab.focus", { num: t.num }); } });
      }
    }
    items = items.concat(paletteCommands());

    const filtered = () => {
      const all = paneItems.concat(items);
      if (!query) return all;
      return all
        .map((it) => ({ it, s: fuzzyScore(query, it.label + " " + it.meta + " " + it.kind) }))
        .filter((x) => x.s >= 0)
        .sort((a, b) => b.s - a.s)
        .map((x) => x.it);
    };

    const render = () => {
      const rows = filtered();
      if (sel >= rows.length) sel = Math.max(0, rows.length - 1);
      listEl.innerHTML = "";
      if (!rows.length) {
        const e = document.createElement("div"); e.className = "empty"; e.textContent = "no matches";
        listEl.appendChild(e); return;
      }
      rows.slice(0, 60).forEach((it, i) => {
        const row = document.createElement("div");
        row.className = "row" + (i === sel ? " sel" : "");
        const kind = document.createElement("span"); kind.className = "kind"; kind.textContent = it.kind;
        const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = it.label;
        row.appendChild(kind); row.appendChild(lbl);
        if (it.meta) {
          const meta = document.createElement("span");
          meta.className = "meta" + (it.stateClass ? " " + it.stateClass : "");
          meta.textContent = it.meta;
          row.appendChild(meta);
        }
        row.addEventListener("click", () => { closeModal(); it.fn(); });
        row.addEventListener("mousemove", () => { if (sel !== i) { sel = i; render(); } });
        listEl.appendChild(row);
      });
      const cur = listEl.children[sel];
      if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
    };

    openOverlay((ov) => {
      const m = document.createElement("div"); m.className = "modal pal";
      const q = document.createElement("div"); q.className = "query";
      inputEl = document.createElement("input");
      inputEl.type = "text"; inputEl.placeholder = "jump to a pane, tab, workspace — or run a command"; inputEl.spellcheck = false;
      q.appendChild(inputEl); m.appendChild(q);
      listEl = document.createElement("div"); listEl.className = "list"; m.appendChild(listEl);
      inputEl.addEventListener("input", () => { query = inputEl.value; sel = 0; render(); });
      inputEl.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "ArrowDown") { e.preventDefault(); sel++; render(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); render(); }
        else if (e.key === "Enter") {
          e.preventDefault();
          const rows = filtered();
          if (rows[sel]) { closeModal(); rows[sel].fn(); }
        } else if (e.key === "Escape") { e.preventDefault(); closeModal(); }
      });
      ov.appendChild(m);
      focusField(inputEl);
      render();
    });

    // Panes across all workspaces (agent.focus crosses workspace + tab).
    sendCmdAwait("pane.list", {}, (res) => {
      if (!res.ok || !modalEl) return;
      const byPane = new Map(agentItems.map((a) => [a.pane, a]));
      paneItems = (res.data && res.data.panes ? res.data.panes : []).map((pi) => {
        const a = byPane.get(pi.pane);
        return {
          kind: "pane",
          label: paneRef(pi.handle, pi.pane) + (pi.name ? " · " + pi.name : ""),
          meta: a ? a.agent + ":" + a.state : (pi.focused ? "focused" : ""),
          stateClass: a ? stClass(a.state) : "",
          fn: () => sendCmd("agent.focus", { pane: pi.pane }),
        };
      });
      render();
    });
  }

  // ---- Keyboard help (WS8) ----
  function helpSection(title, rows) {
    const wrap = document.createElement("div");
    const h = document.createElement("h3"); h.textContent = title; wrap.appendChild(h);
    const tbl = document.createElement("table");
    for (const [what, keys] of rows) {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td"); td1.textContent = what;
      const td2 = document.createElement("td");
      for (const k of keys) { const kb = document.createElement("span"); kb.className = "key"; kb.textContent = k; td2.appendChild(kb); }
      tr.appendChild(td1); tr.appendChild(td2); tbl.appendChild(tr);
    }
    wrap.appendChild(tbl);
    return wrap;
  }

  function openHelp() {
    openOverlay((ov) => {
      const m = document.createElement("div"); m.className = "modal help";
      const h = document.createElement("header"); h.textContent = "keyboard & mouse reference"; m.appendChild(h);
      const body = document.createElement("div"); body.className = "body";
      const cols = document.createElement("div"); cols.className = "helpcols";

      const left = document.createElement("div");
      left.appendChild(helpSection("global", [
        ["command palette", ["⌘K", "Ctrl+Alt+K"]],
        ["hide / show the sidebar", ["⌘B", "Ctrl+Alt+B"]],
        ["back / forward (pane & workspace history)", ["⌘[", "⌘]", "Ctrl+Alt+[ / ]"]],
        ["paste", ["⌘V", "Ctrl+Shift+V*"]],
        ["bigger / smaller font", ["⌘+", "⌘-"]],
        ["reset font size", ["⌘0"]],
        ["this help", ["⌘K → keyboard shortcuts"]],
        // Not a cats shortcut — a statement about who gets the key, and
        // the only place a user can find out why ⌘S stopped opening the
        // browser's save dialog over an editor pane.
        ["sent to an editor pane, not the browser", ["⌘C", "⌘Z", "⌘S", "⌘P", "⌘E†", "⌘F", "⌘D", "⌘G", "⌘/"]],
      ]));
      left.appendChild(helpSection("start-path picker (new workspace)", [
        ["move through directories", ["↑", "↓", "Ctrl+n", "Ctrl+p"]],
        ["complete, then list inside it", ["Tab", "click"]],
        ["create in the highlighted one", ["Enter"]],
        ["make a folder that doesn't exist yet", ["type its path, Enter, confirm"]],
        ["include dotted directories", ["type a leading ."]],
      ]));
      left.appendChild(helpSection("mouse", [
        ["focus pane", ["click"]],
        ["select + copy text", ["drag"]],
        ["rectangular selection", ["Alt+drag"]],
        ["pane / tab / workspace menu", ["right-click"]],
        ["resize splits", ["drag the border"]],
        ["hide the sidebar", ["drag its gutter to the left edge"]],
        ["show it again", ["click the handle at the left edge"]],
        ["swap panes", ["drag a pane header or sidebar row onto a pane"]],
        ["reorder tabs / workspaces", ["drag"]],
        ["rename pane / tab / workspace", ["double-click its title"]],
        ["scrollback", ["wheel", "drag the scrollbar"]],
        ["back / forward (pane & workspace history)", ["back / forward buttons"]],
        ["launcher menu", ["⚙ at the right of the tab row"]],
      ]));
      cols.appendChild(left);

      // Copy-mode bindings reflect the active table (config-injected or default).
      const actions = [
        ["move", ["move-left", "move-down", "move-up", "move-right"]],
        ["line start / end", ["line-start", "line-end"]],
        ["top / bottom", ["top", "bottom"]],
        ["begin selection", ["select"]],
        ["rectangle toggle", ["rect"]],
        ["yank to clipboard", ["yank"]],
        ["exit copy mode", ["exit"]],
      ];
      const table = (window.__catsKeys && window.__catsKeys.copyMode) || COPY_MODE_DEFAULT;
      const right = document.createElement("div");
      right.appendChild(helpSection("copy mode (⬚ on a pane header)",
        actions.map(([what, acts]) => [what, acts.flatMap((a) => table[a] || [])])));
      right.appendChild(helpSection("pane header buttons", [
        ["split left/right · top/bottom", ["◫", "⊟"]],
        ["zoom", ["⤢"]],
        ["copy mode · copy scrollback", ["⬚", "⧉"]],
        ["rename · close", ["✎", "✕"]],
      ]));
      cols.appendChild(right);

      body.appendChild(cols);
      const note = document.createElement("p");
      note.className = "hint";
      // The † caveat is the honest half of the row above it: a chord on the
      // allowlist still only arrives if the HOST hands it over, and Chrome
      // resolves ⌘E for a menu of its own before this page is offered the
      // keydown at all — so the row would otherwise promise something the
      // browser never lets cats deliver. The mac app has no ⌘E menu item
      // and does deliver it, which is why the entry stays. ⌘E is the only
      // row needing the mark: every other forwarded chord was hand-checked
      // in Chrome and the mac app and arrives in both.
      note.textContent = "* browser paste shortcuts vary; the ⌘V path asks for clipboard permission once. Everything else is typed straight into the focused terminal. † ⌘E reaches a pane in the mac app, but Chrome keeps it for a menu of its own and never offers it to this page.";
      body.appendChild(note);
      m.appendChild(body);
      const btns = document.createElement("div"); btns.className = "btns";
      btns.appendChild(mkModalBtn("close", "primary", closeModal));
      m.appendChild(btns);
      m.addEventListener("keydown", (e) => { e.stopPropagation(); if (e.key === "Escape") { e.preventDefault(); closeModal(); } });
      ov.appendChild(m);
    });
  }

  // ---- Settings modal (WS8): theme + copy-mode keys over config.get/set ----
  //
  // The theme section is a picker over the server's theme registry (built-ins,
  // user themes, plugin themes — config.get's themes list carries each one's
  // full palette) plus per-color override rows. Picking a theme or editing a
  // color live-previews immediately (inline :root custom properties);
  // cancel/Escape rolls the preview back to the config.get state, save
  // persists via config.set — the server then broadcasts the theme so every
  // client restyles live. Only colors that differ from the picked theme's own
  // palette are sent (they become the config's sparse overrides), and "save as
  // theme" turns the current look into a named user theme file instead.
  // Copy-mode rebinds still apply on the next page load; server settings are
  // shown read-only — they need a restart.

  function openSettings() {
    sendCmdAwait("config.get", {}, (res) => {
      if (!res.ok) { toast("config.get failed: " + (res.error || "unknown")); return; }
      buildSettingsModal(res.data || {});
    });
  }

  function buildSettingsModal(cfg) {
    const effective = (cfg.theme && cfg.theme.colors) || {};
    const effectiveFont = (cfg.theme && cfg.theme.font) || "";
    const themes = cfg.themes || [];
    const themeByName = {};
    for (const t of themes) themeByName[t.name] = t;
    const copyMode = cfg.copy_mode || {};
    const server = cfg.server || {};

    let saved = false;
    // Cancel restores the config.get snapshot (not removeProperty: an earlier
    // live theme push may already be sitting in the inline properties, and the
    // page's baked style underneath could predate it).
    const rollback = () => applyThemeInline(effective, effectiveFont);

    openOverlay((ov) => {
      const m = document.createElement("div"); m.className = "modal settings";
      const h = document.createElement("header"); h.textContent = "settings — " + (cfg.path || "config"); m.appendChild(h);
      const body = document.createElement("div"); body.className = "body";
      const section = (title) => { const t = document.createElement("h3"); t.textContent = title; body.appendChild(t); };
      const row = (labelText) => {
        const r = document.createElement("div"); r.className = "row";
        const l = document.createElement("label"); l.textContent = labelText; r.appendChild(l);
        body.appendChild(r);
        return r;
      };
      const isHex = (v) => /^#[0-9a-fA-F]{6}$/.test(v);

      // -- theme picker ----------------------------------------------------
      section("theme");
      let selName = (cfg.theme && cfg.theme.name) || "";
      const selTheme = () => themeByName[selName] || { colors: {}, font: "" };

      const pr = row("theme");
      const picker = document.createElement("select");
      const groups = [["builtin", "built-in"], ["user", "custom"], ["plugin", "plugins"]];
      for (const [src, glabel] of groups) {
        const members = themes.filter((t) =>
          src === "plugin" ? t.source.startsWith("plugin:") : t.source === src);
        if (!members.length) continue;
        const og = document.createElement("optgroup"); og.label = glabel;
        for (const t of members) {
          const o = document.createElement("option");
          o.value = t.name;
          o.textContent = t.label + (t.dark ? "" : " (light)") +
            (t.source.startsWith("plugin:") ? " — " + t.source.slice(7) : "");
          og.appendChild(o);
        }
        picker.appendChild(og);
      }
      picker.value = selName;
      pr.appendChild(picker);
      const delBtn = document.createElement("button");
      delBtn.textContent = "delete";
      delBtn.title = "delete this custom theme";
      pr.appendChild(delBtn);

      // -- color override rows ----------------------------------------------
      // Rows carry the full canonical palette; edits preview live. Values that
      // match the picked theme's own palette are just "the theme" — only the
      // ones that differ are saved, as the config's sparse overrides.
      const colorInputs = {};
      const swatches = {};
      for (const key of Object.keys(effective).sort()) {
        const r = row(key);
        const swatch = document.createElement("input"); swatch.type = "color";
        const hex = document.createElement("input"); hex.type = "text"; hex.spellcheck = false;
        swatch.addEventListener("input", () => { hex.value = swatch.value; applyThemeInline({ [key]: swatch.value }, ""); });
        hex.addEventListener("input", () => {
          const v = hex.value.trim();
          if (isHex(v)) swatch.value = v;
          if (v) applyThemeInline({ [key]: v }, "");
        });
        r.appendChild(swatch); r.appendChild(hex);
        colorInputs[key] = hex;
        swatches[key] = swatch;
      }
      const fr = row("font");
      const fontInput = document.createElement("input"); fontInput.type = "text"; fontInput.spellcheck = false;
      fontInput.addEventListener("input", () => { if (fontInput.value.trim()) applyThemeInline({}, fontInput.value.trim()); });
      fr.appendChild(fontInput);

      const setRows = (colors, font) => {
        for (const key in colorInputs) {
          const v = colors[key] || "";
          colorInputs[key].value = v;
          if (isHex(v)) swatches[key].value = v;
        }
        fontInput.value = font;
      };
      setRows(effective, effectiveFont); // start from the live effective look

      const syncDelBtn = () => {
        const t = themeByName[selName];
        delBtn.style.display = t && t.source === "user" ? "" : "none";
      };
      syncDelBtn();

      picker.addEventListener("change", () => {
        selName = picker.value;
        const t = selTheme();
        setRows(t.colors, t.font); // a switch shows the theme clean, no overrides
        applyThemeInline(t.colors, t.font);
        syncDelBtn();
      });

      delBtn.addEventListener("click", () => {
        sendCmdAwait("theme.delete", { name: selName }, (res) => {
          if (!res.ok) { errEl.textContent = res.error || "delete failed"; return; }
          saved = true; // the server re-resolved; don't roll back over it
          closeModal();
          toast("theme deleted");
          openSettings(); // rebuild against the refreshed registry
        });
      });

      // -- save as a named user theme ---------------------------------------
      // Turns the current rows into a theme file and activates it (the rows
      // become the theme's own palette, so the config's overrides clear).
      const sr = row("save as");
      const saveAsInput = document.createElement("input");
      saveAsInput.type = "text"; saveAsInput.spellcheck = false;
      saveAsInput.placeholder = "my-theme (lowercase, digits, hyphens)";
      const saveAsBtn = document.createElement("button"); saveAsBtn.textContent = "save theme";
      sr.appendChild(saveAsInput); sr.appendChild(saveAsBtn);
      saveAsBtn.addEventListener("click", () => {
        const name = saveAsInput.value.trim();
        if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(name)) {
          errEl.textContent = "theme name: lowercase letters, digits, hyphens";
          return;
        }
        const colors = {};
        for (const k in colorInputs) {
          const v = colorInputs[k].value.trim();
          if (v) colors[k] = v;
        }
        sendCmdAwait("theme.save", { name, colors, font: fontInput.value.trim(), activate: true }, (res) => {
          if (!res.ok) { errEl.textContent = res.error || "save failed"; return; }
          saved = true;
          closeModal();
          toast("theme “" + name + "” saved");
        });
      });

      // The action set comes from config.get, so every row is a known action.
      section("copy-mode keys");
      const keyInputs = {};
      for (const action of Object.keys(copyMode).sort()) {
        const r = row(action);
        const inp = document.createElement("input"); inp.type = "text"; inp.spellcheck = false;
        inp.title = "comma-separated KeyboardEvent.key values";
        inp.value = (copyMode[action] || []).join(", ");
        r.appendChild(inp);
        keyInputs[action] = inp;
      }

      section("server (read-only)");
      const ro = (label, val) => {
        const r = row(label);
        const s = document.createElement("span"); s.className = "ro"; s.textContent = val;
        r.appendChild(s);
      };
      ro("addr", server.addr || "");
      ro("auth", server.auth || "");
      ro("tls", server.tls ? "on" : "off");
      ro("cathost socket", server.cathost_socket || "");
      ro("control socket", server.control_socket || "(default)");
      ro("hook socket", server.hook_socket || "(disabled)");
      ro("session ttl", server.session_ttl || "");
      // The roster, one row per host — but only once there is a roster to speak
      // of. With a single host the line above already names its socket, and a
      // row reading "local (connected)" would be the modal restating it.
      if ((server.hosts || []).length > 1) {
        for (const h of server.hosts) {
          ro("host " + h.id, (h.label || h.id) + " · " + (h.addr_kind || "?") +
            (h.is_default ? " · default" : "") + (h.connected ? "" : " · not connected"));
        }
      }
      const note = document.createElement("div"); note.className = "hint";
      note.textContent = "server settings come from flags/config file and take effect on restart";
      body.appendChild(note);

      const errEl = document.createElement("div"); errEl.className = "errline"; body.appendChild(errEl);
      m.appendChild(body);

      const save = () => {
        // Only the rows that differ from the picked theme's own palette are
        // overrides; the rest ride on the theme name. Sending the name makes
        // this a switch server-side, replacing any previous overrides.
        const base = selTheme();
        const outColors = {};
        for (const k in colorInputs) {
          const v = colorInputs[k].value.trim();
          if (v && v !== (base.colors[k] || "")) outColors[k] = v;
        }
        const font = fontInput.value.trim();
        const outFont = font && font !== base.font ? font : "";
        const outKeys = {};
        for (const a in keyInputs) {
          const keys = keyInputs[a].value.split(",").map((s) => s.trim()).filter(Boolean);
          if (!keys.length) { errEl.textContent = "copy-mode " + a + ": needs at least one key"; return; }
          outKeys[a] = keys;
        }
        sendCmdAwait("config.set", { theme: { name: selName, colors: outColors, font: outFont }, copy_mode: outKeys }, (res) => {
          if (!res.ok) { errEl.textContent = res.error || "save failed"; return; }
          saved = true;
          // This page already wears the previewed look; the server's theme
          // broadcast re-applies the authoritative resolution everywhere.
          closeModal();
          toast("settings saved");
          if (Object.keys(outKeys).some((a) => outKeys[a].join(",") !== (copyMode[a] || []).join(","))) {
            toast("copy-mode rebinds apply after a page reload");
          }
        });
      };

      const btns = document.createElement("div"); btns.className = "btns";
      btns.appendChild(mkModalBtn("cancel", "", closeModal));
      btns.appendChild(mkModalBtn("save", "primary", save));
      m.appendChild(btns);
      m.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Enter") { e.preventDefault(); save(); }
        else if (e.key === "Escape") { e.preventDefault(); closeModal(); }
      });
      ov.appendChild(m);
      // Any close path (cancel, Escape, backdrop) rolls the preview back unless
      // it was saved.
      modalCleanup = () => { if (!saved) rollback(); };
    });
  }

  // ---- Update banner (WS8): the update_ready message ----
  // updateInfo persists past a dismissed banner so the launcher menu can
  // re-surface it ("update ready" item + gear badge, cats's launcher badge).
  let updateInfo = null;
  function showUpdateBanner() {
    showBanner("cats update ready" + (updateInfo.version ? " — " + updateInfo.version : "") +
      (updateInfo.command ? " · run: " + updateInfo.command : ""));
  }
  // showBanner(text, kind): kind is an optional extra class ("linkerr") that
  // recolors the strip; dismissing always clears both so the next banner starts
  // from the default look.
  function showBanner(text, kind) {
    bannerEl.innerHTML = "";
    const t = document.createElement("span"); t.textContent = text;
    const x = document.createElement("span"); x.className = "x"; x.textContent = "✕"; x.title = "dismiss";
    x.addEventListener("click", () => bannerEl.classList.remove("show", "linkerr"));
    bannerEl.appendChild(t); bannerEl.appendChild(x);
    bannerEl.classList.toggle("linkerr", kind === "linkerr");
    bannerEl.classList.add("show");
  }

  // ---- Status & toasts ----
  // The status bar no longer carries a connection label: link state is a field
  // on the pane hover card (showPaneTip) — read only when you go looking — and
  // failures escalate to the banner, which is unmissable. connState is the
  // single source both read, so a hover card opened mid-outage is accurate.
  let connState = { text: "connecting…", err: false };
  function setStatus(t, err) {
    connState = { text: t, err: !!err };
    if (err) {
      showBanner(t, "linkerr");
    } else if (bannerEl.classList.contains("linkerr")) {
      bannerEl.classList.remove("show", "linkerr"); // link recovered → drop the alarm
    }
  }
  // toast(text) is the four-second status line. toast(text, {id, actions}) is
  // the answerable one: it carries a notification's buttons (ui.notify) and
  // does NOT auto-dismiss, because a button that disappears after four seconds
  // is a button nobody can press. It leaves when it is answered or dismissed.
  function toast(text, opts) {
    opts = opts || {};
    const actions = opts.actions || [];
    const el = document.createElement("div");
    el.className = "toast";
    const line = document.createElement("div");
    line.textContent = text;
    el.appendChild(line);

    let timer = null;
    const dismiss = () => {
      if (timer) { clearTimeout(timer); timer = null; }
      el.classList.remove("show");
      setTimeout(() => el.remove(), 250);
    };

    if (actions.length) {
      const row = document.createElement("div");
      row.className = "toast-actions";
      for (const a of actions) {
        const b = document.createElement("button");
        b.className = "toast-btn";
        b.textContent = a.label || a.id;
        b.onclick = () => {
          // The whole row goes dead on the first click. A notification is
          // answered once server-side, so a second click could only earn a
          // refusal — and the click that earns it would look, to the user,
          // exactly like the one that worked.
          for (const other of row.querySelectorAll("button")) other.disabled = true;
          sendCmd("ui.action", { id: opts.id, action: a.id });
          dismiss();
        };
        row.appendChild(b);
      }
      const x = document.createElement("button");
      x.className = "toast-btn toast-dismiss";
      x.textContent = "Dismiss";
      x.onclick = dismiss;
      row.appendChild(x);
      el.appendChild(row);
    }

    toastsEl.appendChild(el);
    requestAnimationFrame(() => el.classList.add("show"));
    if (!actions.length) timer = setTimeout(dismiss, 4000);
    return el;
  }

  // ---- Notifications (WS6): agent needs-attention / finished ----
  // cats parity: suppressed entirely when the pane is on screen and the window
  // is focused (the user is already looking at it). Otherwise a toast; and when
  // the page is unfocused/hidden, additionally a native Notification (if the
  // user granted permission) whose click reveals the pane — agent.focus crosses
  // workspaces and tabs.
  function handleNotify(msg) {
    const opts = msg.id && msg.actions && msg.actions.length
      ? { id: msg.id, actions: msg.actions } : null;
    // Non-agent kinds (e.g. an update notice, or anything raised through
    // ui.notify) always toast — there is no pane whose visibility could make
    // them redundant.
    if (msg.kind !== "attention" && msg.kind !== "finished") {
      toast(msg.message + (msg.body ? " — " + msg.body : ""), opts);
      return;
    }
    const visible = msg.pane ? panes.has(msg.pane) : false;
    const focused = document.hasFocus();
    // Suppression exists because a toast is redundant with a pane the user is
    // already looking at. A BUTTON is not redundant with anything, so an
    // answerable notification is never suppressed.
    if (focused && visible && !opts) return;
    toast(msg.message + (msg.body ? " — " + msg.body : ""), opts);
    if (focused || !("Notification" in window) || Notification.permission !== "granted") return;
    const n = new Notification(msg.message, { body: msg.body || "", tag: "cats-pane-" + (msg.pane || 0) });
    n.onclick = () => {
      window.focus();
      if (msg.pane) sendCmd("agent.focus", { pane: msg.pane });
      n.close();
    };
  }

  // The Notification API only grants permission from a user gesture, so ask
  // once on the first click/keypress.
  (function armNotificationPermission() {
    if (!("Notification" in window) || Notification.permission !== "default") return;
    const req = () => {
      window.removeEventListener("pointerdown", req);
      window.removeEventListener("keydown", req);
      Notification.requestPermission();
    };
    window.addEventListener("pointerdown", req);
    window.addEventListener("keydown", req);
  })();

  // ---- Windows ----
  //
  // A window is a connection with a view. The server holds one session; each
  // connection says which workspace it is showing, and gets that workspace's
  // layout, frames and chrome. Nothing here is persisted — the URL IS the
  // window's state, which is what makes a bookmarked "?ws=w2" reopenable.

  // urlWorkspace is the workspace this window opens on, "" for the default. A
  // stale id (the workspace was closed since the bookmark was made) is not an
  // error: the server falls back to the primary view.
  function urlWorkspace() {
    return new URLSearchParams(location.search).get("ws") || "";
  }

  // openWindow opens a new browser window on a workspace. In a browser this is
  // a tab or a window per the user's own settings; in the Mac app the shell
  // intercepts window.open and makes it a native NSWindow.
  function openWindow(wsID) {
    const url = location.pathname + (wsID ? "?ws=" + encodeURIComponent(wsID) : "");
    const w = window.open(url, "_blank");
    if (!w) toast("your browser blocked the new window — allow popups for this site");
  }

  // syncWindowURL keeps this window's address in step with the workspace it is
  // showing. Two things depend on it and neither is cosmetic:
  //
  //   * a reload (⌘R, a reconnect after sleep) lands back on the same
  //     workspace instead of following the primary window somewhere else;
  //   * the Mac app reads ?ws= off each window's live URL to remember the
  //     window layout across launches — a workspace switch inside a window is
  //     recorded with no extra protocol at all.
  //
  // replaceState, not pushState: switching workspaces inside a window is not a
  // browser navigation, and filling the browser's back button with them would
  // tear down the WebSocket on every step back. ⌘[ / ⌘] mean something better
  // instead: cats-level navigation over the focus-location history (see the
  // nav.back/forward handler in onKey), which walks panes and workspaces
  // without ever reloading the page.
  function syncWindowURL(msg) {
    let active = "";
    for (const w of msg.workspaces) if (w.active) active = w.id;
    if (!active) return;
    const want = location.pathname + "?ws=" + encodeURIComponent(active) + location.hash;
    if (location.pathname + location.search + location.hash === want) return;
    try { history.replaceState(null, "", want); } catch (_) { /* file:// and the like */ }
  }

  // clientsMsg is the last census (the `clients` down-message): who else is
  // connected and, per connection, which workspace they are showing. It is what
  // lets a row say "already open in another window" instead of quietly opening
  // a duplicate.
  let clientsMsg = null;

  // windowsOnWorkspace counts the OTHER windows showing a workspace. Our own
  // view is excluded by dropping one entry for the workspace this window is
  // showing — the census does not name connections, and it does not need to:
  // exactly one of its entries is us, and it is on our workspace.
  function windowsOnWorkspace(wsID) {
    if (!clientsMsg || !clientsMsg.views) return 0;
    let n = 0;
    for (const v of clientsMsg.views) if (v.workspace === wsID && !v.viewer) n++;
    if (wsID === activeWorkspaceID()) n -= 1; // that one is this window
    return Math.max(0, n);
  }

  // activeWorkspaceID is the workspace THIS window is showing, per the layout
  // the server built for this connection.
  function activeWorkspaceID() {
    if (!layoutMsg) return "";
    for (const w of layoutMsg.workspaces) if (w.active) return w.id;
    return "";
  }

  // otherWindowMark is the "also open in another window" badge on a workspace
  // row. Deliberately quiet — it is information, not a warning: two windows on
  // one workspace mirror each other, which is legal and occasionally what you
  // want.
  function otherWindowMark(n) {
    if (n < 1) return null;
    const el = document.createElement("span");
    el.className = "wswin";
    el.textContent = n > 1 ? "\u29c9" + n : "\u29c9";
    el.title = n === 1 ? "also open in another window"
                       : "also open in " + n + " other windows";
    return el;
  }

  // ---- Session ----
  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => {
      // A pane.list still in flight when the socket died never gets its callback,
      // which would leave the single-flight guard latched and freeze the Panes
      // section for the rest of the session. The reconnect's layout re-queries.
      clearTimeout(paneInvWait); paneInvWait = null;
      paneInvBusy = false; paneInvAgain = false;
      // ?ws=<id> is what makes this window a window: the server treats each
      // connection as a view on one workspace, so a second tab opened on
      // "?ws=w2" shows w2 with its own tab, focus and size while this one stays
      // where it is. Omitted (the plain URL) means "whatever the primary window
      // is showing", which is the single-window behaviour. Re-read per connect
      // so a reconnect lands back on the same workspace.
      sendMsg({ t: "init", v: PV, cols, rows, dpr,
        cell_w_px: Math.round(cellW * dpr), cell_h_px: Math.round(cellH * dpr),
        workspace: urlWorkspace() });
      // The server assumes a fresh connection is in front; correct it straight
      // away if this window actually reconnected while in the background.
      if (!winFocused) sendMsg({ t: "focus", focused: false });
    };
    ws.onmessage = (ev) => onMessage(JSON.parse(ev.data));
    ws.onclose = () => { setStatus("disconnected — retrying…", true); setTimeout(connect, 1500); };
    ws.onerror = () => ws.close();
  }

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      // A window narrowed since the last drag can leave the stored sidebar
      // width past its 60% ceiling; re-clamp before deriving the grid.
      const sbw = parseInt(document.documentElement.style.getPropertyValue("--sidebar-w"), 10);
      if (sbw > 0) setSidebarWidth(sbw);
      gridSize();
      // Same reason as the fold: the window has already been repainted at its
      // new size, and the panes are still wearing the old one until the server
      // answers. Dragging a window edge is the case where that lasts longest.
      refitLayout();
      sendMsg({ t: "resize", cols, rows });
      // (No status refresh here any more — the window grid size is reported by
      // the pane hover card, which reads cols/rows live when it opens.)
    }, 120);
  });

  // ---- Window focus ----
  // The window's own focus (app-level, not pane-level), tracked for two jobs:
  // the focused pane's cursor hollows out so the eye can tell at a glance the
  // app is in the background (draw), and the state is reported up so pane
  // programs that enabled focus reporting — Claude Code, bubbletea TUIs — stop
  // blinking their own carets while nobody is watching. Without the report,
  // the app-drawn blink keeps arriving as cell updates and no amount of
  // client-side cursor styling can still it.
  function onWinFocus(f) {
    if (f === winFocused) return;
    winFocused = f;
    sendMsg({ t: "focus", focused: f });
    // Restyle the drawn cursor now rather than on the next frame diff — a
    // backgrounded app may not produce one for minutes.
    for (const p of panes.values()) {
      if (p.info && p.info.focused) scheduleDraw(p);
    }
  }
  window.addEventListener("focus", () => onWinFocus(true));
  window.addEventListener("blur", () => onWinFocus(false));

  // ---- Sidebar splitter ----
  // The width is a per-browser display preference like the terminal font size,
  // so it lives in localStorage rather than in the server-persisted session.
  // Setting --sidebar-w on the root overrides the stylesheet's scale-derived
  // default, and everything that has to clear the sidebar (the banner) follows
  // for free because it reads the same variable.
  const SBW_KEY = "cats.sidebar_w", SBW_MIN = 150;
  const sbwMax = () => Math.max(SBW_MIN, Math.round(window.innerWidth * 0.6));
  function setSidebarWidth(px) {
    px = Math.min(sbwMax(), Math.max(SBW_MIN, Math.round(px)));
    document.documentElement.style.setProperty("--sidebar-w", px + "px");
    try { localStorage.setItem(SBW_KEY, String(px)); } catch (e) { /* not persisted */ }
  }
  try {
    const storedW = parseInt(localStorage.getItem(SBW_KEY), 10);
    if (storedW >= SBW_MIN) document.documentElement.style.setProperty("--sidebar-w", storedW + "px");
  } catch (e) { /* storage disabled — keep the stylesheet default */ }

  // Panes are laid out from cols/rows, so a drag has to re-derive the grid and
  // tell the server. That is debounced while the pointer moves (the same 120ms
  // the window resize uses) and flushed once on release.
  // refitLayout runs on the same beat as gridSize, not only on the flush: the
  // panes have to follow the gutter live while it is being dragged, exactly as
  // they follow the fold. It reads the layout the server last sent, so it is
  // cheap enough to run per debounce tick.
  let sbwTimer = null;
  function sidebarResized(now) {
    clearTimeout(sbwTimer);
    const fire = () => { gridSize(); refitLayout(); sendMsg({ t: "resize", cols, rows }); };
    if (now) fire(); else sbwTimer = setTimeout(fire, 120);
  }
  // ---- Folding the sidebar away ----
  // Hidden/shown is a per-browser display preference like the width above and
  // the chat panel below, so it lives in localStorage, not in the
  // server-persisted session. The stored *width* is deliberately left alone
  // while folded: revealing has to land back on the column the user last sized,
  // not on the stylesheet default.
  const SBH_KEY = "cats.sidebar_hidden";
  // Dragging the gutter this far left of the column's 150px floor folds it
  // outright — the fold happens live, under the pointer, and dragging back past
  // the same mark brings the column straight back. Done as a preview rather than
  // as a decision taken on release, the gesture explains itself: the column you
  // dragged into nothing is the column that stays gone.
  const SBW_FOLD = Math.round(SBW_MIN * 0.55);
  function sidebarHidden() { return document.body.classList.contains("sb-hidden"); }
  function setSidebarHidden(hide) {
    if (hide === sidebarHidden()) return;
    document.body.classList.toggle("sb-hidden", hide);
    try {
      if (hide) localStorage.setItem(SBH_KEY, "1"); else localStorage.removeItem(SBH_KEY);
    } catch (e) { /* not persisted */ }
    if (hide) paintSplitterAttention();
    else splitterEl.classList.remove("attn-blocked", "attn-done");
    syncSplitterTitle();
    // Folding changes #main's width exactly as a drag does, so the pane grid has
    // to be re-derived and the server told. At once, not debounced: this is one
    // discrete step, not a stream of pointer moves.
    sidebarResized(true);
  }
  function syncSplitterTitle() {
    splitterEl.title = sidebarHidden()
      ? "click to show the sidebar (⌘B / Ctrl+Alt+B)"
      : "drag to resize the sidebar (double-click to reset, ⌘B to hide)";
  }
  // The strongest attention state among the agents, painted onto the folded
  // gutter. Only the top two tiers of attentionRank earn a mark: "working" is
  // the ordinary case and would leave the gutter permanently lit, which would
  // make the two states that are actually addressed to the user invisible again.
  function paintSplitterAttention() {
    let best = "";
    for (const it of agentItems) {
      const st = markerState(it);
      if (st === "blocked") { best = "blocked"; break; }
      if (st === "done") best = "done";
    }
    splitterEl.classList.toggle("attn-blocked", best === "blocked");
    splitterEl.classList.toggle("attn-done", best === "done");
  }
  try { if (localStorage.getItem(SBH_KEY)) document.body.classList.add("sb-hidden"); } catch (e) { /* shown */ }
  syncSplitterTitle();

  // The fold button in the brand row. One direction only — it lives *in* the
  // column, so it is gone the moment it has acted, and the reveal handle in the
  // gutter is what comes back. mousedown is swallowed so the press cannot also
  // read as the start of a gesture on anything behind it, the same guard the
  // pane-chrome buttons use (mkBtn).
  const sbFoldEl = document.getElementById("sb-fold");
  sbFoldEl.addEventListener("mousedown", (e) => e.stopPropagation());
  sbFoldEl.addEventListener("click", (e) => {
    e.stopPropagation(); e.preventDefault();
    setSidebarHidden(true);
  });

  // A click that only revealed the column must not have its second half land on
  // the width-reset below: the pair would read as one gesture that both restored
  // and re-defaulted the sidebar.
  let revealedAt = 0;
  splitterEl.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    splitterEl.setPointerCapture(e.pointerId);
    splitterEl.classList.add("drag");
    document.body.classList.add("splitting");
    // Where in the gutter it was grabbed, so the splitter stays under the
    // cursor instead of jumping its own width on the first move.
    const grabDx = e.clientX - splitterEl.getBoundingClientRect().left;
    const startHidden = sidebarHidden(), startX = e.clientX;
    let moved = false;
    const move = (ev) => {
      if (Math.abs(ev.clientX - startX) > 3) moved = true;
      const want = ev.clientX - grabDx;
      if (want < SBW_FOLD) { setSidebarHidden(true); return; }
      setSidebarHidden(false);      // dragged back out of the fold zone
      setSidebarWidth(want);
      sidebarResized(false);
    };
    const up = () => {
      splitterEl.removeEventListener("pointermove", move);
      splitterEl.classList.remove("drag");
      document.body.classList.remove("splitting");
      // A press on the folded gutter that never became a drag is a click, and
      // the only thing a click there can mean is "show it again".
      if (startHidden && !moved) { setSidebarHidden(false); revealedAt = Date.now(); }
      sidebarResized(true);
    };
    splitterEl.addEventListener("pointermove", move);
    splitterEl.addEventListener("pointerup", up, { once: true });
    splitterEl.addEventListener("pointercancel", up, { once: true });
  });
  // Double-click hands the column back to the stylesheet's --sb-scale default.
  splitterEl.addEventListener("dblclick", () => {
    if (Date.now() - revealedAt < 600) return;   // this was the reveal click, twice
    document.documentElement.style.removeProperty("--sidebar-w");
    try { localStorage.removeItem(SBW_KEY); } catch (e) { /* nothing to clear */ }
    sidebarResized(true);
  });

  // ---- Chat panel (the ACP side panel) ----
  // The server broadcasts the whole conversation to every client (chat_row /
  // chat_delta appends, chat_snapshot replaces), so this code only renders —
  // it never owns conversation state beyond what is on screen. Open/closed is
  // a per-browser display preference like the sidebar width.
  const CHAT_KEY = "cats.chat_open";
  function chatIsOpen() { return document.body.classList.contains("chat-open"); }
  function setChatOpen(open) {
    document.body.classList.toggle("chat-open", open);
    try {
      if (open) localStorage.setItem(CHAT_KEY, "1"); else localStorage.removeItem(CHAT_KEY);
    } catch (e) { /* not persisted */ }
    // The chat column changes #main's width exactly like a sidebar drag does:
    // the pane grid must re-derive cols/rows and tell the server.
    sidebarResized(true);
    if (open) {
      chatBtnEl.classList.remove("badge");
      chatLogEl.scrollTop = chatLogEl.scrollHeight;
      chatInputEl.focus();
    }
  }
  chatBtnEl.addEventListener("click", () => setChatOpen(!chatIsOpen()));
  try { if (localStorage.getItem(CHAT_KEY)) document.body.classList.add("chat-open"); } catch (e) { /* closed */ }

  // chatNudge marks the chip when something worth seeing (a permission
  // prompt, a dead agent) happens while the panel is closed.
  function chatNudge() { if (!chatIsOpen()) chatBtnEl.classList.add("badge"); }

  // chatMutate keeps the transcript pinned to the bottom across a mutation —
  // but only when it already was: a user scrolled up reading history must not
  // be yanked down by every streamed token.
  function chatMutate(f) {
    const pinned = chatLogEl.scrollTop + chatLogEl.clientHeight >= chatLogEl.scrollHeight - 8;
    f();
    if (pinned) chatLogEl.scrollTop = chatLogEl.scrollHeight;
  }

  function chatFillRow(el, row) {
    el.textContent = "";
    if (row.role === "tool") {
      el.appendChild(document.createTextNode("⚙ " + (row.text || "")));
      if (row.status) {
        const st = document.createElement("span");
        st.className = "cstat";
        st.textContent = " — " + (row.status === "failed" ? "✗ failed" : row.status);
        el.appendChild(st);
      }
      return;
    }
    const t = document.createElement("span");
    t.className = "ctext";
    t.textContent = row.text || "";
    el.appendChild(t);
    if (row.action && row.action.argv && row.action.argv.length) {
      el.appendChild(document.createTextNode(" "));
      const b = document.createElement("button");
      b.className = "cbtn allow";
      b.textContent = row.action.label || "run";
      // The remedy opens as a real pane: the server named an argv (e.g.
      // `copilot login`), and tab.create's Command is the existing seam for
      // running one in a fresh tab.
      b.addEventListener("click", () => sendCmd("tab.create", { command: row.action.argv }));
      el.appendChild(b);
    }
  }

  function chatRowEl(row) {
    const el = document.createElement("div");
    el.className = "crow " + (row.role || "info");
    el.id = "chat-row-" + row.id;
    chatFillRow(el, row);
    return el;
  }

  // chat_row is an upsert: a known id re-renders in place (tool rows change
  // status this way), an unknown one appends.
  function chatUpsertRow(row) {
    if (!row) return;
    chatMutate(() => {
      const el = document.getElementById("chat-row-" + row.id);
      if (el) chatFillRow(el, row);
      else chatLogEl.appendChild(chatRowEl(row));
    });
  }

  // chat_delta appends streamed text to an existing row — a text-node append,
  // not a re-render, so a long answer costs O(1) per flush.
  function chatAppendDelta(id, text) {
    const el = document.getElementById("chat-row-" + id);
    const t = el && el.querySelector(".ctext");
    if (!t) return;
    chatMutate(() => t.appendChild(document.createTextNode(text)));
  }

  function chatPermEl(msg) {
    const el = document.createElement("div");
    el.className = "cperm";
    el.id = "chat-perm-" + msg.req_id;
    const title = document.createElement("div");
    title.className = "ctitle";
    title.textContent = msg.title || "permission request";
    el.appendChild(title);
    const opts = document.createElement("div");
    opts.className = "copts";
    for (const o of (msg.options || [])) {
      const b = document.createElement("button");
      b.className = "cbtn" + (String(o.kind || "").startsWith("allow") ? " allow" : "");
      b.textContent = o.name || o.id;
      b.addEventListener("click", () => sendCmd("chat.permission", { req_id: msg.req_id, option_id: o.id }));
      opts.appendChild(b);
    }
    el.appendChild(opts);
    return el;
  }

  // chat_perm opens a prompt or, with resolved, collapses it into its verdict
  // everywhere — any client may have answered, so buttons must not outlive
  // the question.
  function chatPermUpdate(msg) {
    if (msg.resolved) {
      const el = document.getElementById("chat-perm-" + msg.req_id);
      if (el) chatMutate(() => {
        el.textContent = "";
        const v = document.createElement("span");
        v.className = "verdict";
        v.textContent = msg.outcome === "allowed" ? "✓ allowed"
          : msg.outcome === "rejected" ? "⊘ rejected" : "— cancelled";
        el.appendChild(v);
      });
      return;
    }
    chatMutate(() => chatLogEl.appendChild(chatPermEl(msg)));
    chatNudge();
  }

  function chatApplyState(st) {
    chatTitleEl.textContent = st.backend || "Chat";
    const model = st.model ? modelLabel(st.model) : "";
    let s = st.status || "idle";
    if (st.detail) s += " · " + st.detail;
    chatStatusEl.textContent = (model ? model + " · " : "") + s;
    chatStatusEl.title = (st.cwd ? "cwd: " + st.cwd : "") + (st.detail ? "\n" + st.detail : "");
    chatStopEl.disabled = st.status !== "turn";
    if (st.status === "dead") chatNudge();
  }

  // chat_snapshot replaces the whole panel: sent on connect (joining
  // mid-conversation) and on chat.clear (empty).
  function chatApplySnapshot(msg) {
    chatApplyState(msg.state || {});
    chatLogEl.textContent = "";
    for (const r of (msg.rows || [])) chatLogEl.appendChild(chatRowEl(r));
    for (const p of (msg.perms || [])) chatLogEl.appendChild(chatPermEl(p));
    chatLogEl.scrollTop = chatLogEl.scrollHeight;
    if ((msg.perms || []).length) chatNudge();
  }

  function chatSend() {
    const text = chatInputEl.value.trim();
    if (!text) return;
    chatInputEl.value = "";
    sendCmd("chat.send", { text });
  }
  chatInputEl.addEventListener("keydown", (e) => {
    e.stopPropagation(); // belt to onKey's braces: nothing composed reaches a PTY
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatSend(); }
    else if (e.key === "Escape") { e.preventDefault(); chatInputEl.blur(); }
  });
  chatInputEl.addEventListener("keyup", (e) => e.stopPropagation());
  chatStopEl.addEventListener("click", () => sendCmd("chat.cancel"));
  chatClearEl.addEventListener("click", () => sendCmd("chat.clear"));

  // Toolbar affordances: the palette hint opens it, plugins opens its manager
  // directly (it earns the top-level slot — installing and running plugins is
  // routine work, not a settings excursion), and the gear opens the global
  // launcher menu (cats's bottom-corner menu: settings / keybinds / reload
  // config / update line when one is pending / stop server standing in for
  // detach — the web has no client to detach). The zoom chip moved into the
  // zoomed pane's own header (renderChrome).
  palHintEl.addEventListener("click", () => openPalette());
  pluginsBtnEl.addEventListener("click", () => openPluginsDialog());
  gearEl.addEventListener("click", (e) => {
    const items = [
      { label: "settings", fn: openSettings },
      { label: "keybinds", fn: openHelp },
      { label: "reload config", fn: () => sendCmd("server.reload_config", {}) },
      { label: "attach host…", fn: openAttachHostDialog },
    ];
    if (updateInfo) items.push({ label: "update ready" + (updateInfo.version ? " — " + updateInfo.version : ""), fn: showUpdateBanner });
    items.push("-", { label: "stop server…", danger: true, fn: confirmStopServer });
    // The gear rides at the top of the window now, so the menu drops below it
    // (openCtx only clamps against the far edges, it will not flip upward).
    const r = gearEl.getBoundingClientRect();
    openCtx(r.right, r.bottom + 4, items);
    e.stopPropagation();
  });

  measure();
  gridSize();
  connect();
})();
</script>
</body>
</html>
