    const x = document.createElement("span"); x.className = "x"; x.textContent = "✕"; x.title = "dismiss";
    x.addEventListener("click", () => bannerEl.classList.remove("show", "linkerr"));
    bannerEl.appendChild(t); bannerEl.appendChild(x);
    bannerEl.classList.toggle("linkerr", kind === "linkerr");
    bannerEl.classList.add("show");
  }

  // ---- Status & toasts ----
  // The status bar no longer carries a connection label: link state is a field
  // on the pane hover card (showPaneTip) — read only when you go looking — and
  // failures escalate to the banner, which is unmissable. connState is the
  // single source both read, so a hover card opened mid-outage is accurate.
  let connState = { text: "connecting…", err: false };
  function setStatus(t, err) {
    connState = { text: t, err: !!err };
    if (err) {
      showBanner(t, "linkerr");
    } else if (bannerEl.classList.contains("linkerr")) {
      bannerEl.classList.remove("show", "linkerr"); // link recovered → drop the alarm
    }
  }
  function toast(text) {
    const el = document.createElement("div");
    el.className = "toast"; el.textContent = text;
    toastsEl.appendChild(el);
    requestAnimationFrame(() => el.classList.add("show"));
    setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 250); }, 4000);
  }

  // ---- Notifications (WS6): agent needs-attention / finished ----
  // cats parity: suppressed entirely when the pane is on screen and the window
  // is focused (the user is already looking at it). Otherwise a toast; and when
  // the page is unfocused/hidden, additionally a native Notification (if the
  // user granted permission) whose click reveals the pane — agent.focus crosses
  // workspaces and tabs.
  function handleNotify(msg) {
    // Non-agent kinds (e.g. an update notice) always toast — there is no pane
    // whose visibility could make them redundant.
    if (msg.kind !== "attention" && msg.kind !== "finished") {
      toast(msg.message + (msg.body ? " — " + msg.body : ""));
      return;
    }
    const visible = msg.pane ? panes.has(msg.pane) : false;
    const focused = document.hasFocus();
    if (focused && visible) return;
    toast(msg.message + (msg.body ? " — " + msg.body : ""));
    if (focused || !("Notification" in window) || Notification.permission !== "granted") return;
    const n = new Notification(msg.message, { body: msg.body || "", tag: "cats-pane-" + (msg.pane || 0) });
    n.onclick = () => {
      window.focus();
      if (msg.pane) sendCmd("agent.focus", { pane: msg.pane });
      n.close();
    };
  }

  // The Notification API only grants permission from a user gesture, so ask
  // once on the first click/keypress.
  (function armNotificationPermission() {
    if (!("Notification" in window) || Notification.permission !== "default") return;
    const req = () => {
      window.removeEventListener("pointerdown", req);
      window.removeEventListener("keydown", req);
      Notification.requestPermission();
    };
    window.addEventListener("pointerdown", req);
    window.addEventListener("keydown", req);
  })();

  // ---- Session ----
  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => {
      // A pane.list still in flight when the socket died never gets its callback,
      // which would leave the single-flight guard latched and freeze the Panes
      // section for the rest of the session. The reconnect's layout re-queries.
      clearTimeout(paneInvWait); paneInvWait = null;
      paneInvBusy = false; paneInvAgain = false;
      sendMsg({ t: "init", v: PV, cols, rows, dpr,
        cell_w_px: Math.round(cellW * dpr), cell_h_px: Math.round(cellH * dpr) });
    };
    ws.onmessage = (ev) => onMessage(JSON.parse(ev.data));
    ws.onclose = () => { setStatus("disconnected — retrying…", true); setTimeout(connect, 1500); };
    ws.onerror = () => ws.close();
  }

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      // A window narrowed since the last drag can leave the stored sidebar
      // width past its 60% ceiling; re-clamp before deriving the grid.
      const sbw = parseInt(document.documentElement.style.getPropertyValue("--sidebar-w"), 10);
      if (sbw > 0) setSidebarWidth(sbw);
      gridSize();
      sendMsg({ t: "resize", cols, rows });
      // (No status refresh here any more — the window grid size is reported by
      // the pane hover card, which reads cols/rows live when it opens.)
    }, 120);
  });

  // ---- Sidebar splitter ----
  // The width is a per-browser display preference like the terminal font size,
  // so it lives in localStorage rather than in the server-persisted session.
  // Setting --sidebar-w on the root overrides the stylesheet's scale-derived
  // default, and everything that has to clear the sidebar (the banner) follows
  // for free because it reads the same variable.
  const SBW_KEY = "cats.sidebar_w", SBW_MIN = 150;
  const sbwMax = () => Math.max(SBW_MIN, Math.round(window.innerWidth * 0.6));
  function setSidebarWidth(px) {
    px = Math.min(sbwMax(), Math.max(SBW_MIN, Math.round(px)));
    document.documentElement.style.setProperty("--sidebar-w", px + "px");
    try { localStorage.setItem(SBW_KEY, String(px)); } catch (e) { /* not persisted */ }
  }
  try {
    const storedW = parseInt(localStorage.getItem(SBW_KEY), 10);
    if (storedW >= SBW_MIN) document.documentElement.style.setProperty("--sidebar-w", storedW + "px");
  } catch (e) { /* storage disabled — keep the stylesheet default */ }

  // Panes are laid out from cols/rows, so a drag has to re-derive the grid and
  // tell the server. That is debounced while the pointer moves (the same 120ms
  // the window resize uses) and flushed once on release.
  let sbwTimer = null;
  function sidebarResized(now) {
    clearTimeout(sbwTimer);
    const fire = () => { gridSize(); sendMsg({ t: "resize", cols, rows }); };
    if (now) fire(); else sbwTimer = setTimeout(fire, 120);
  }
  splitterEl.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    splitterEl.setPointerCapture(e.pointerId);
    splitterEl.classList.add("drag");
    document.body.classList.add("splitting");
    // Where in the gutter it was grabbed, so the splitter stays under the
    // cursor instead of jumping its own width on the first move.
    const grabDx = e.clientX - splitterEl.getBoundingClientRect().left;
    const move = (ev) => { setSidebarWidth(ev.clientX - grabDx); sidebarResized(false); };
    const up = () => {
      splitterEl.removeEventListener("pointermove", move);
      splitterEl.classList.remove("drag");
      document.body.classList.remove("splitting");
      sidebarResized(true);
    };
    splitterEl.addEventListener("pointermove", move);
    splitterEl.addEventListener("pointerup", up, { once: true });
    splitterEl.addEventListener("pointercancel", up, { once: true });
  });
  // Double-click hands the column back to the stylesheet's --sb-scale default.
  splitterEl.addEventListener("dblclick", () => {
    document.documentElement.style.removeProperty("--sidebar-w");
    try { localStorage.removeItem(SBW_KEY); } catch (e) { /* nothing to clear */ }
    sidebarResized(true);
  });

  // Status-bar affordances: the palette hint opens it, the gear opens the
  // global launcher menu (cats's bottom-corner menu: settings / keybinds /
  // plugins / reload config / update line when one is pending / stop server
  // standing in for detach — the web has no client to detach). The zoom chip
  // moved into the zoomed pane's own header (renderChrome).
  palHintEl.addEventListener("click", () => openPalette());
  gearEl.addEventListener("click", (e) => {
    const items = [
      { label: "settings", fn: openSettings },
      { label: "keybinds", fn: openHelp },
      { label: "plugins…", fn: openPluginsDialog },
      { label: "reload config", fn: () => sendCmd("server.reload_config", {}) },
    ];
    if (updateInfo) items.push({ label: "update ready" + (updateInfo.version ? " — " + updateInfo.version : ""), fn: showUpdateBanner });
    items.push("-", { label: "stop server…", danger: true, fn: confirmStopServer });
    // The gear rides at the top of the window now, so the menu drops below it
    // (openCtx only clamps against the far edges, it will not flip upward).
    const r = gearEl.getBoundingClientRect();
    openCtx(r.right, r.bottom + 4, items);
    e.stopPropagation();
  });

  measure();
  gridSize();
  connect();
})();
</script>
</body>
</html>
