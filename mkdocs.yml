site_name: cats
site_description: >-
  A terminal workspace manager for herding AI coding agents — workspaces, tabs
  and BSP panes, served to the browser or a native macOS window.

docs_dir: docs

repo_url: https://github.com/rohanthewiz/cats
repo_name: rohanthewiz/cats
edit_uri: edit/main/docs/

# The site is normally served by gkdocs (github.com/rohanthewiz/gkdocs), which
# reads site_name/site_description/docs_dir/nav and brings its own theme. The
# theme, plugins and markdown_extensions blocks below are for the `mkdocs build`
# path, which is otherwise unusable here: without pymdownx.superfences every
# ```mermaid fence on 24 of these 26 pages renders as a raw code block, and
# without admonition a `!!! note` renders as literal text.
#
# gkdocs ignores keys it does not know and strips !!python/ tags before parsing,
# so everything below is inert there. Anything added here must stay that way —
# content must render correctly under both renderers, never one or the other.
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # The mermaid custom fence is the whole reason superfences is here: it hands
  # ```mermaid blocks to Material's bundled mermaid.js instead of the syntax
  # highlighter. gkdocs renders mermaid natively and needs no equivalent.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Architecture:
      - Overview: architecture/index.md
      - "Mode 1 — Standalone Mac": architecture/standalone-mac.md
      - "Mode 2 — Mac client / Linux server": architecture/mac-client-linux-server.md
      - "Mode 3 — Web client / Mac server": architecture/web-client-mac-server.md
      - Choosing a topology: architecture/choosing-a-topology.md
      - Keystroke to pixel: architecture/request-lifecycle.md
  - Protocols:
      - Overview: protocols/index.md
      - Orchestration seam: protocols/orchestration-seam.md
      - Browser protocol: protocols/browser-protocol.md
      - Control API: protocols/control-api.md
      - Hook API: protocols/hook-api.md
      - Dart client generation: protocols/dart-client.md
  - Subsystems:
      - Session model: subsystems/session-model.md
      - Terminal and input: subsystems/terminal.md
      - Agent detection: subsystems/agent-detection.md
      - Persistence and restore: subsystems/persistence.md
      - Auth and TLS: subsystems/auth-and-tls.md
      - Plugins: subsystems/plugins.md
      - Git worktrees: subsystems/worktrees.md
  - Reference:
      - Configuration: reference/configuration.md
      - CLI: reference/cli.md
      - Build and packaging: reference/build-and-packaging.md
      - Troubleshooting: reference/troubleshooting.md
